[package]
name = "agni-client-example"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
# A member of the client crate's workspace, so the two share one Cargo.lock and one target directory.
workspace = "../../rust"

[dependencies]
agni-client = { path = "../../rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
