[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
# PyPI's `agni` is an unrelated project, so the distribution is `agni-eda` and the import stays
# `agni`. The version here is a placeholder: `make python-dist V=vX.Y.Z` stamps the release tag into
# the copy it builds, since the tag is the only place a version is recorded (RELEASING.md).
name = "agni-eda"
version = "0.0.0"
description = "Typed Python client for the agni EDA engine, over its CLI or its Connect API"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
# The floor is the version buf.gen.py.yaml's plugins stamp into the generated modules, which refuse
# to import under an older runtime. Bump the two together.
dependencies = ["protobuf>=7.36.2,<8"]

[project.urls]
Homepage = "https://github.com/panyam/agni"
Documentation = "https://panyam.github.io/agni/build/other-languages/"
Issues = "https://github.com/panyam/agni/issues"

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
# The examples read a query set from YAML, the file `agni query --set` takes.
examples = ["openpyxl>=3.1", "pyyaml>=6"]
test = ["pytest>=8", "openpyxl>=3.1", "pyyaml>=6"]

[tool.setuptools.packages.find]
where = ["src"]
# The generated agni.v1.* directories carry no __init__.py, so they are namespace packages.
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.pyi", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
