<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="680" height="250" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="rail-nominal-out-of-recommended rule: a rail above the datasheet recommended maximum is flagged; a rail inside the recommended range is fine">
  <rect x="1" y="1" width="678" height="248" rx="10" fill="#f8f9fb" stroke="#e3e6eb"/>
  <line x1="340" y1="24" x2="340" y2="226" stroke="#e3e6eb" stroke-dasharray="4 4"/>

  <!-- ============ LEFT: flagged (rail outside recommended range) ============ -->
  <text x="30" y="42" font-size="15" font-weight="600" fill="#d64545">Flagged: outside recommended</text>
  <line x1="60" y1="110" x2="150" y2="110" stroke="#d64545" stroke-width="2.5"/>
  <text x="100" y="100" font-size="12" fill="#d64545" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">+5 V</text>
  <rect x="150" y="86" width="86" height="48" rx="3" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="193" y="107" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">U1</text>
  <text x="193" y="124" font-size="10" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">VDD</text>
  <text x="150" y="176" font-size="12" fill="#d64545" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">5 V  &gt;  3.6 V max</text>
  <text x="150" y="204" font-size="11" fill="#6b7280" text-anchor="middle">recommended 3.0 - 3.6 V (datasheet)</text>

  <!-- ============ RIGHT: fine (rail inside recommended range) ============ -->
  <text x="370" y="42" font-size="15" font-weight="600" fill="#2f9e57">Fine: inside range</text>
  <line x1="400" y1="110" x2="490" y2="110" stroke="#394049" stroke-width="2"/>
  <text x="440" y="100" font-size="12" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">+3.3 V</text>
  <rect x="490" y="86" width="86" height="48" rx="3" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="533" y="107" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">U1</text>
  <text x="533" y="124" font-size="10" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">VDD</text>
  <text x="490" y="176" font-size="12" fill="#2f9e57" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">3.0 &#8804; 3.3 V &#8804; 3.6 V</text>
  <text x="490" y="204" font-size="11" fill="#6b7280" text-anchor="middle">recommended 3.0 - 3.6 V (datasheet)</text>
</svg>
