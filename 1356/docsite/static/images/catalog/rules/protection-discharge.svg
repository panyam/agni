<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" width="700" height="290" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="protection-discharge rule: an intent-declared rail with no bleeder resistor to ground is flagged; the same rail with a resistor to ground is fine">
  <!-- card -->
  <rect x="1" y="1" width="698" height="288" rx="10" fill="#f8f9fb" stroke="#e3e6eb"/>
  <line x1="350" y1="24" x2="350" y2="252" stroke="#e3e6eb" stroke-dasharray="4 4"/>
  <text x="350" y="278" font-size="12" fill="#6b7280" text-anchor="middle">the rail is named by the human in intent.yaml (protections: rail HV_BULK, kind discharge)</text>

  <!-- ================= LEFT: flagged ================= -->
  <text x="30" y="42" font-size="15" font-weight="600" fill="#d64545">Flagged: no discharge path</text>

  <!-- bulk cap on the rail -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <rect x="34" y="100" width="60" height="40" rx="4" fill="#ffffff"/>
  </g>
  <text x="64" y="124" font-size="12" fill="#394049" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">BULK</text>

  <!-- load -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <rect x="246" y="96" width="66" height="48" rx="4" fill="#ffffff"/>
  </g>
  <text x="279" y="88" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">LOAD</text>

  <!-- flagged rail: no resistor to ground -->
  <g stroke="#d64545" stroke-width="2.5" fill="none">
    <line x1="94" y1="120" x2="246" y2="120"/>
  </g>
  <circle cx="94" cy="120" r="4" fill="#d64545"/>
  <circle cx="246" cy="120" r="4" fill="#d64545"/>
  <text x="170" y="108" font-size="12" fill="#d64545" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">HV_BULK</text>

  <text x="188" y="234" font-size="13" fill="#d64545" text-anchor="middle">no resistor to ground &#8594; flagged</text>

  <!-- ================= RIGHT: fine ================= -->
  <text x="378" y="42" font-size="15" font-weight="600" fill="#2f9e57">Fine: bleeder resistor to ground</text>

  <!-- bulk cap on the rail -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <rect x="384" y="100" width="60" height="40" rx="4" fill="#ffffff"/>
  </g>
  <text x="414" y="124" font-size="12" fill="#394049" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">BULK</text>

  <!-- load -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <rect x="600" y="96" width="66" height="48" rx="4" fill="#ffffff"/>
  </g>
  <text x="633" y="88" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">LOAD</text>

  <!-- rail with a resistor branch to ground -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="444" y1="120" x2="600" y2="120"/>
  </g>
  <text x="475" y="108" font-size="12" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">HV_BULK</text>

  <!-- junction where the resistor taps the rail -->
  <circle cx="522" cy="120" r="4" fill="#394049"/>

  <!-- bleeder resistor R1 from rail to ground (zig-zag body) -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="522" y1="120" x2="522" y2="134"/>
    <polyline points="522,134 514,139 530,146 514,153 530,160 522,165"/>
    <line x1="522" y1="165" x2="522" y2="188"/>
  </g>
  <text x="552" y="150" font-size="13" font-weight="600" fill="#2f9e57" text-anchor="middle">R1</text>

  <!-- ground symbol -->
  <g stroke="#394049" stroke-width="2">
    <line x1="506" y1="188" x2="538" y2="188"/>
    <line x1="511" y1="194" x2="533" y2="194"/>
    <line x1="516" y1="200" x2="528" y2="200"/>
  </g>

  <text x="540" y="234" font-size="13" fill="#2f9e57" text-anchor="middle">resistor bleeds to ground &#8594; fine</text>
</svg>
