<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" width="680" height="240" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="esd-protection IC credit: an IC with no ESD rating is still flagged; an IC carrying a datasheet ESD rating credits the net as fine">
  <rect x="1" y="1" width="678" height="238" rx="10" fill="#f8f9fb" stroke="#e3e6eb"/>
  <line x1="340" y1="24" x2="340" y2="216" stroke="#e3e6eb" stroke-dasharray="4 4"/>

  <!-- ============ LEFT: flagged (IC has no ESD rating) ============ -->
  <text x="30" y="42" font-size="15" font-weight="600" fill="#d64545">Flagged: unrated IC</text>
  <rect x="40" y="102" width="32" height="44" rx="3" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="56" y="94" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">J1</text>
  <line x1="72" y1="124" x2="238" y2="124" stroke="#d64545" stroke-width="2.5"/>
  <text x="155" y="112" font-size="12" fill="#d64545" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">USB_D+</text>
  <rect x="238" y="100" width="52" height="48" rx="3" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="264" y="129" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">U2</text>
  <text x="165" y="208" font-size="13" fill="#d64545" text-anchor="middle">IC carries no ESD rating &#8594; flagged</text>

  <!-- ============ RIGHT: fine (IC carries a datasheet ESD rating) ============ -->
  <text x="370" y="42" font-size="15" font-weight="600" fill="#2f9e57">Fine: ESD-rated IC</text>
  <rect x="400" y="102" width="32" height="44" rx="3" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="416" y="94" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">J1</text>
  <line x1="432" y1="124" x2="598" y2="124" stroke="#394049" stroke-width="2"/>
  <text x="515" y="112" font-size="12" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">USB_D+</text>
  <rect x="598" y="100" width="52" height="48" rx="3" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="624" y="129" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">U2</text>
  <!-- datasheet ESD-rating badge on the IC -->
  <line x1="624" y1="148" x2="624" y2="160" stroke="#2f9e57" stroke-width="2"/>
  <rect x="588" y="160" width="72" height="22" rx="4" fill="#eaf6ee" stroke="#2f9e57" stroke-width="1.5"/>
  <text x="624" y="175" font-size="11" fill="#2f9e57" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">ESD 8 kV</text>
  <text x="500" y="208" font-size="13" fill="#2f9e57" text-anchor="middle">datasheet ESD rating credits it &#8594; fine</text>
</svg>
