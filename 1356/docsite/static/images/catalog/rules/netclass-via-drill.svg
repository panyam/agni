<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" width="680" height="270" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="netclass-via-drill rule: a via drilled smaller than the drill its net class declares is flagged; one that meets the declared drill is fine">
  <rect x="1" y="1" width="678" height="268" rx="10" fill="#f8f9fb" stroke="#e3e6eb"/>

  <text x="30" y="34" font-size="14" font-weight="600" fill="#394049">The Power class declares a 0.4 mm drill; the limit is the class's, not a fab floor</text>
  <line x1="30" y1="48" x2="650" y2="48" stroke="#e3e6eb"/>
  <line x1="340" y1="62" x2="340" y2="252" stroke="#e3e6eb" stroke-dasharray="4 4"/>

  <!-- ============ LEFT: flagged (under-drilled via) ============ -->
  <text x="30" y="84" font-size="15" font-weight="600" fill="#d64545">Flagged: under-drilled</text>
  <!-- via: annulus (copper pad) with the drill as the inner hole -->
  <circle cx="160" cy="150" r="42" fill="#cf9b57" stroke="#394049" stroke-width="1.5"/>
  <circle cx="160" cy="150" r="17" fill="#f8f9fb" stroke="#394049" stroke-width="1.5"/>
  <!-- drill dimension across the hole -->
  <g stroke="#d64545" stroke-width="2">
    <line x1="143" y1="150" x2="177" y2="150"/>
    <line x1="143" y1="146" x2="143" y2="154"/>
    <line x1="177" y1="146" x2="177" y2="154"/>
  </g>
  <text x="160" y="216" font-size="12" fill="#d64545" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">drill 0.3 mm</text>
  <text x="160" y="240" font-size="13" fill="#d64545" text-anchor="middle">under the class's 0.4 mm &#8594; flagged</text>

  <!-- ============ RIGHT: fine ============ -->
  <text x="370" y="84" font-size="15" font-weight="600" fill="#2f9e57">Fine: meets the declared drill</text>
  <circle cx="500" cy="150" r="42" fill="#cf9b57" stroke="#394049" stroke-width="1.5"/>
  <circle cx="500" cy="150" r="26" fill="#f8f9fb" stroke="#394049" stroke-width="1.5"/>
  <g stroke="#2f9e57" stroke-width="2">
    <line x1="474" y1="150" x2="526" y2="150"/>
    <line x1="474" y1="146" x2="474" y2="154"/>
    <line x1="526" y1="146" x2="526" y2="154"/>
  </g>
  <text x="500" y="216" font-size="12" fill="#2f9e57" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">drill 0.4 mm</text>
  <text x="500" y="240" font-size="13" fill="#2f9e57" text-anchor="middle">&#8805; 0.4 mm &#8594; fine</text>
</svg>
