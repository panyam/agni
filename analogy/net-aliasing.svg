<svg xmlns="http://www.w3.org/2000/svg" width="620" height="200" font-family="system-ui,sans-serif" font-size="12">
  <text x="310" y="18" text-anchor="middle" fill="#808080">a Net is symmetric aliasing: everyone on "+5V" shares one node</text>
  <!-- the rail -->
  <line x1="80" y1="90" x2="540" y2="90" stroke="#d98a4a" stroke-width="2"/>
  <text x="60" y="94" text-anchor="end" fill="#d98a4a">+5V</text>
  <!-- taps -->
  <line x1="140" y1="90" x2="140" y2="130" stroke="#808080"/>
  <rect x="105" y="130" width="70" height="30" fill="none" stroke="#4a90d9"/>
  <text x="140" y="149" text-anchor="middle" fill="#4a90d9" font-size="11">REG1.OUT</text>
  <text x="140" y="175" text-anchor="middle" fill="#5aa06a" font-size="10">power_out (writer)</text>

  <line x1="310" y1="90" x2="310" y2="130" stroke="#808080"/>
  <rect x="275" y="130" width="70" height="30" fill="none" stroke="#4a90d9"/>
  <text x="310" y="149" text-anchor="middle" fill="#4a90d9" font-size="11">U1.VDD</text>
  <text x="310" y="175" text-anchor="middle" fill="#5aa06a" font-size="10">power_in (reader)</text>

  <line x1="470" y1="90" x2="470" y2="130" stroke="#808080"/>
  <rect x="435" y="130" width="70" height="30" fill="none" stroke="#4a90d9"/>
  <text x="470" y="149" text-anchor="middle" fill="#4a90d9" font-size="11">C1.1</text>
  <text x="470" y="175" text-anchor="middle" fill="#5aa06a" font-size="10">passive</text>

  <text x="310" y="55" text-anchor="middle" fill="#808080" font-size="10">pin directions are the type annotations; the net itself has no direction</text>
</svg>
