# Every failing or inconclusive verdict the full catalog makes on this seeded design, each with
# a judgement (agni issue 857). TestSeedTriage fails on any difference from what the engine finds,
# and `make seed-triage` drafts new findings as untriaged. Classes: defect, design-choice,
# needs-intent (a fact about the board is undeclared) and false-positive (with its ticket).
design: tools/samples/boards/jetson-agx-thor-baseboard
findings:
  bulk-cap:
    - class: design-choice
      why: N$54 is the module's PMIC backup-battery input through D1 and R6, which the module decouples on its own side.
      subjects:
        - net:N$54
  bus-not-modeled:
    - class: false-positive
      why: Each bus names a member under a sheet the bus may not be drawn on (/M.2/TX0+ for PCIe, DP and RGMII), which reads as a resolution error in the read, not as a gap in the design.
      ticket: 939
      subjects:
        - bus:CAM_CTRL
        - bus:CAN
        - bus:CSI
        - bus:DP
        - bus:GPIO
        - bus:HDMI
        - bus:I2C
        - bus:I2S
        - bus:M2_E
        - bus:PCIe
        - bus:RGMII
        - bus:SFI
        - bus:SPI
        - bus:UART
        - bus:USB
        - bus:USBSS
  copper-clearance:
    - class: false-positive
