  decoupling-present:
    - class: false-positive
      why: An exposed thermal pad left unconnected, which its datasheet allows; the symbol types the pad power_in, so it reads as a rail.
      ticket: 935
      subjects:
        - net:unconnected-(U29-PadEP)
        - net:unconnected-(U43-Pad25)
        - net:unconnected-(U71-Pad17)
    - class: false-positive
      why: VBUS_MON_UP is the USB hub's VBUS-sense input behind a divider, not a rail.
      ticket: 935
      subjects:
        - net:/USB Hub/VBUS_MON_UP
    - class: design-choice
      why: N$54 is the module's PMIC backup-battery input (J1 D37, PMIC_BBATT) through D1 and R6, which the module decouples on its own side.
      subjects:
        - net:N$54
  esd-protection:
    - class: design-choice
      why: The SFP cage's 10G lines are AC-coupled pairs where a TVS's capacitance would cost signal integrity, its low-speed control pins (TX_FAULT, TX_DISABLE, rate select) go through 1 kOhm or 0 Ohm series parts, and SH is the cage shield returned to ground through an RC network; the module protects its own end.
      subjects:
        - net:/SFP/SFI_CONN_RX_N
        - net:/SFP/SFI_CONN_RX_P
        - net:/SFP/SFI_CONN_TX_N
        - net:/SFP/SFI_CONN_TX_P
        - net:/SFP/SH
        - net:N$131
        - net:N$133
        - net:N$135
        - net:N$136
        - net:N$137
    - class: false-positive
      why: Each of these lines has a pin of one of the board's TPD4E05U06 arrays or PESD5Z5.0F/ESDA25P35 TVS diodes on it, which classify as ic and diode, so the rule sees no TVS.
      ticket: 934
