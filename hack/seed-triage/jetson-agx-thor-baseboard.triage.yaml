  i2c-pull-up:
    - class: needs-intent
      why: These lines pass through an NTS0102 level translator, which carries its own 10 kOhm pull-ups on both sides; that is a datasheet fact this run has no parameter set for.
      subjects:
        - net:/USB Debug, PD/FTDI_CBUS0/SDA
        - net:/USB Debug, PD/FTDI_CBUS3/SCL
    - class: design-choice
      why: The TPS65988's third I2C port is unused and brought to a test point only.
      subjects:
        - net:/USB Debug, PD/PDC_I2C3_SCL
        - net:/USB Debug, PD/PDC_I2C3_SDA
    - class: design-choice
      why: The mux's downstream camera channels are pulled up on the camera modules at the far end of the FFCs.
      subjects:
        - net:/CSI/MUX_I2C_4_SCL
        - net:/CSI/MUX_I2C_4_SDA
        - net:/CSI/MUX_I2C_5_SCL
        - net:/CSI/MUX_I2C_5_SDA
        - net:/CSI/MUX_I2C_6_SCL
        - net:/CSI/MUX_I2C_6_SDA
        - net:/CSI/MUX_I2C_7_SCL
        - net:/CSI/MUX_I2C_7_SDA
    - class: design-choice
      why: These buses come straight from the module connector (the camera bus through the 0 Ohm R163 into the mux), and the carrier relies on pull-ups inside the module. Not checked against the module's pinout, so this rests on the carrier having no footprint for them.
      subjects:
        - net:/CSI/I2C_MUX_SCL
        - net:/CSI/I2C_MUX_SDA
        - net:/SoM_IO/I2C1_SCL_1V8
        - net:/SoM_IO/I2C1_SDA_1V8
        - net:I2C7.SCL
        - net:I2C7.SDA
        - net:I2C8.SCL
        - net:I2C8.SDA
        - net:I2C_{CAM}.SCL
        - net:I2C_{CAM}.SDA
  i2c-pull-up-split-rail:
    - class: false-positive
      why: The second pull-up on each line (R161, R170) is marked do-not-populate, an assembly option between 1.8 V and 3.3 V cameras; only one is fitted.
      ticket: 938
      subjects:
        - net:/CSI/SCL_CAM0
        - net:/CSI/SCL_CAM1
        - net:/CSI/SCL_CAM2
        - net:/CSI/SCL_CAM3
        - net:/CSI/SDA_CAM0
        - net:/CSI/SDA_CAM1
        - net:/CSI/SDA_CAM2
        - net:/CSI/SDA_CAM3
  i2c-redundant-pull-up:
    - class: design-choice
      why: Three sheets each bring their own pull-up onto the shared system I2C bus (4.7 k, 2.2 k and 200 k), about 1.5 kOhm together, which keeps the sink current near 2.2 mA at 3.3 V, inside the bus's 3 mA limit.
      subjects:
        - net:/Recovery USB/USBC2_I2C_SCL
        - net:/Recovery USB/USBC2_I2C_SDA
        - net:/USB Debug, PD/DEBUG_SCL
        - net:/USB Debug, PD/DEBUG_SDA
        - net:I2C_{SYS}.SCL
        - net:I2C_{SYS}.SDA
  input-protection:
    - class: false-positive
      why: 'These USB-C ports are sources: an AP22615 load switch drives VBUS out to the cable, and the power input the rule reaches is the connector''s own VBUS pin, which its symbol types power_in. A PESD5Z5.0F or ESDA25P35 clamp sits on each.'
      ticket: 935
      subjects:
        - net:/Recovery USB/USBC2_VBUS
        - net:/USB DP Alt mode/USBC1_VBUS
        - net:/USB Debug, PD/USBC0_VBUS
        - net:/USB Hub/USBC3_VBUS
        - net:/USB Hub/USBC4_VBUS
  power-input-not-driven:
    - class: false-positive
      why: An exposed thermal pad left unconnected, which its datasheet allows; the symbol types the pad power_in.
      ticket: 935
      subjects:
        - net:unconnected-(U29-PadEP)
        - net:unconnected-(U43-Pad25)
        - net:unconnected-(U71-Pad17)
    - class: false-positive
      why: VBUS_MON_UP is the USB hub's VBUS-sense input, driven through a divider from VBUS, which the symbol types power_in.
      ticket: 935
      subjects:
        - net:/USB Hub/VBUS_MON_UP
  rail-not-classified:
    - class: needs-intent
      why: FTDI_3V3 is the FT230X's 3.3 V regulator output, a real rail whose name the built-in vocabulary does not match; a project would declare it in its conventions lexicon.
      subjects:
        - net:/USB Debug, PD/FTDI_3V3
  reverse-blocking-absent:
    - class: false-positive
      why: These USB-C ports are sources driven by an AP22615 load switch, and the power input the rule reaches is the connector's own VBUS pin, so there is no inbound path to block.
      ticket: 935
      subjects:
        - net:/Recovery USB/USBC2_VBUS
        - net:/USB DP Alt mode/USBC1_VBUS
        - net:/USB Debug, PD/USBC0_VBUS
        - net:/USB Hub/USBC3_VBUS
        - net:/USB Hub/USBC4_VBUS
  single-pin-net:
    - class: defect
      why: Two unused FMC pins (J18 B24, B25) lack the no-connect flag every other unused pin on the connector carries; KiCad's own netlist also leaves them unconnected. Harmless electrically.
      subjects:
        - net:N$202
        - net:N$203
  test-point-coverage:
    - class: false-positive
      why: VBUS_MON_UP is the USB hub's VBUS-sense input behind a divider, not a rail; it reads as one because the symbol types the pin power_in.
      ticket: 935
      subjects:
        - net:/USB Hub/VBUS_MON_UP
    - class: design-choice
      why: The board puts test points on its main rails, not on each converter's internal supply and output nodes, the FMC rails or the debug bridge's 3.3 V.
      subjects:
        - net:/DCDC/12V_OUT
        - net:/DCDC/12V_VDD
