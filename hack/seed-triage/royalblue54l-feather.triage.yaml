# Every failing or inconclusive verdict the full catalog makes on this seeded design, each with
# a judgement (agni issue 857). TestSeedTriage fails on any difference from what the engine finds,
# and `make seed-triage` drafts new findings as untriaged. Classes: defect, design-choice,
# needs-intent (a fact about the board is undeclared) and false-positive (with its ticket).
design: tools/samples/boards/royalblue54L-feather
findings:
  crystal-load-caps:
    - class: design-choice
      why: The nRF54L15 provides configurable internal load capacitance for its crystal, so Y1 needs none on the board.
      subjects:
        - pin:Y1.1
        - pin:Y1.2
  esd-protection:
    - class: design-choice
      why: CC1 and CC2 of the debug USB-C port carry no clamp, which is common on a USB 2.0 port whose CC lines only see the cable's pull-down.
      subjects:
        - net:USB.CC1
        - net:USB.CC2
    - class: design-choice
      why: A Feather's header pins go straight to the MCU with no ESD protection, as is usual for a development board whose pins are meant to be wired by hand.
      subjects:
        - net:/Connectors/ENABLE
        - net:/Connectors/SHPHLD
        - net:ANALOG.A0
        - net:ANALOG.A1
        - net:ANALOG.A2
        - net:ANALOG.A3
        - net:ANALOG.A4
        - net:ANALOG.A5
        - net:DIG.D10
        - net:DIG.D11
        - net:DIG.D12
        - net:DIG.D13
        - net:DIG.D5
        - net:DIG.D6
        - net:DIG.D9
        - net:I2C_54.SCL
        - net:I2C_54.SDA
        - net:SPI.MISO
        - net:SPI.MOSI
        - net:SPI.SCK
        - net:SWD_TRG.~{RESET}
        - net:UART_TRG.RX
        - net:UART_TRG.TX
  i2c-pull-up:
    - class: design-choice
      why: Both pull-ups on the main I2C bus, R2 and R3, are marked do-not-populate, so the board ships relying on the device plugged into the STEMMA QT port or the nRF54L15's internal pull-ups. Surfaced once DNP parts stopped counting as pull-ups (agni issue 938).
      subjects:
        - net:I2C_54.SCL
        - net:I2C_54.SDA
  input-protection:
    - class: design-choice
      why: These are the Feather header's power pins, BAT (J2.1) on the cell from J4, USB (J2.3) on the nPM1300's VSYS output and 3V (J1.2, and the STEMMA QT J5.2) on its BUCK2 output through JP1. A Feather exports them unfused by convention and relies on the cell's own protection circuit.
      subjects:
        - net:+BATT
        - net:VDD
        - net:VSYS
  power-input-not-driven:
    - class: needs-intent
      why: The debugger's nRF52833 runs from VDDH, and in that mode its internal regulator drives these VDD pins, which the symbol types power_in. That is the part's pin function, a datasheet fact the run has no parameter set for (agni issue 935).
      subjects:
        - net:/Debugger/nRF52_VDD
    - class: defect
      why: VBUS arrives through the USB-C connector, whose pins are passive, and no power flag marks the net as fed, so the nPM1300's VBUS input has no driver on the schematic. KiCad's ERC reports the same. Harmless electrically; the net was split by agni issue 936 until it was read whole.
      subjects:
        - net:USB.VBUS
    - class: defect
      why: The cell arrives through J4 and the BAT header pin J2.1, both passive, and the nPM1300's VBAT (U2.19) is typed power_in, so with no power flag on +BATT nothing drives it on the schematic. Harmless electrically.
      subjects:
        - net:+BATT
    - class: defect
      why: VDD is fed by the nPM1300's VOUT2 (U2.32) through the bridged solder jumper JP1, which splits it into its own net N$1, and no power flag marks VDD as fed, so its power-input pins have no driver on the schematic. Harmless electrically.
      subjects:
        - net:VDD
  reverse-blocking-absent:
    - class: design-choice
      why: VBUS from the USB-C port feeds the nPM1300's VBUS input directly, and the design relies on the PMIC's own input stage and power path to keep the battery from back-feeding the port. Not checked against the nPM1300 datasheet.
      subjects:
        - net:USB.VBUS
    - class: design-choice
      why: The cell plugs into J4, a keyed JST-PH, and reaches the nPM1300's VBAT (U2.19) with no reverse-polarity element, as on other Feathers. A cell wired to the opposite JST polarity would be applied backwards, and the BAT header pin J2.1 shares the net.
      subjects:
        - net:+BATT
    - class: design-choice
      why: VSYS and VDD are outputs of the nPM1300 (U2.20 VSYS, and U2.32 VOUT2 through JP1) that the header's USB and 3V pins export, so a series diode there would only drop the rail. A Feather's USB and 3V pins may also be back-fed by a user, which is why this is not filed under agni issue 1016.
      subjects:
        - net:VDD
        - net:VSYS
  test-point-coverage:
    - class: design-choice
      why: +BATT, VSYS and VDD land on the Feather header's BAT, USB and 3V through-holes (J2.1, J2.3, J1.2), which a probe reaches without a dedicated pad. VBUS is the nPM1300's VBUSOUT (U2.22) feeding only the debugger's nRF52833, and the board puts its USB test point TP5 on USB.VBUS upstream instead.
      subjects:
        - net:+BATT
        - net:VBUS
        - net:VDD
        - net:VSYS
  unspecified-pin-with-driver:
    - class: defect
      why: The nRF52833 symbol leaves pin 20 (SWDIO side of the debug header) with no electrical type, a symbol-library gap that is harmless electrically and hides the pin from direction checks.
      subjects:
        - net:N$18
    - class: defect
      why: The nRF52833 symbol leaves its ground pins VSS_PA (U5.25) and VSS (U5.37) with no electrical type, the same symbol-library gap as pin 20, harmless electrically.
      subjects:
        - net:GND
