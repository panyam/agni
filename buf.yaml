version: v2
# The buf workspace: the engine's protos and the datasheet producer's (agni issue 744). The
# producer's protos import param.proto and webapi/workspace.proto from the engine's module, and the
# workspace is what resolves those imports; no engine proto imports a producer one (C34).
modules:
  - path: protos
  - path: datasheet/protos
lint:
  use:
    - STANDARD
  except:
    - FIELD_NOT_REQUIRED
breaking:
  use:
    - FILE
  # agni 1660 removed ir.Design.stackup and its two messages without a deprecation release, since
  # agni has no public clients yet. Remove this ignore once a release tag after v0.7.0 exists.
  # agni 1692 removed webapi.Design.revisions and DesignRevision the same way. Remove its entries at
  # the first release tag after v0.8.0.
  # agni 1705 renamed design.proto's DesignService to design_view.proto's DesignViewService, freeing
  # DesignService for stored designs. Remove its entry at the first release tag after v0.8.0.
  # agni 1694 moved a design's name to designs/{design} and removed ProjectService's GetDesign and
  # ListDesigns, which DesignService replaces. buf matches a service and a message by full name, so
  # designs.proto's DesignService and GetDesignRequest read as changes to v0.8.0's view service and its
  # request. Remove its entries at the first release tag after v0.8.0.
  # agni 1734 removed DatasheetService's ListMounts and ListDir, since agnids now serves the
  # engine's WorkspaceService. Remove its entry at the first release tag after v0.8.0.
  ignore_only:
    FILE_NO_DELETE:
      - protos/agni/v1/webapi/design.proto
    FIELD_NO_DELETE:
      - protos/agni/v1/ir/ir.proto
      - protos/agni/v1/webapi/project.proto
      - protos/agni/v1/webapi/designs.proto
    MESSAGE_NO_DELETE:
      - protos/agni/v1/ir/ir.proto
      - protos/agni/v1/webapi/project.proto
    RPC_NO_DELETE:
      - protos/agni/v1/webapi/project.proto
      - protos/agni/v1/webapi/designs.proto
      - datasheet/protos/agni/v1/dsapi/datasheet.proto
    RPC_SAME_RESPONSE_TYPE:
      - protos/agni/v1/webapi/designs.proto
    FIELD_SAME_NAME:
      - protos/agni/v1/webapi/designs.proto
    FIELD_SAME_JSON_NAME:
      - protos/agni/v1/webapi/designs.proto
    RESERVED_MESSAGE_NO_DELETE:
      - protos/agni/v1/webapi/designs.proto
