version: v2
# The buf workspace: the engine's protos and the datasheet producer's (agni issue 744). The
# producer's protos import param.proto and webapi/workspace.proto from the engine's module, and the
# workspace is what resolves those imports; no engine proto imports a producer one (C34).
modules:
  - path: protos
  - path: datasheet/protos
lint:
  use:
    - STANDARD
  except:
    - FIELD_NOT_REQUIRED
breaking:
  use:
    - FILE
  # agni 1660 removed ir.Design.stackup and its two messages without a deprecation release, since
  # agni has no public clients yet. Remove this ignore once a release tag after v0.7.0 exists.
  # agni 1692 removed webapi.Design.revisions and DesignRevision the same way. Remove its entries at
  # the first release tag after v0.8.0.
  ignore_only:
    FIELD_NO_DELETE:
      - protos/agni/v1/ir/ir.proto
      - protos/agni/v1/webapi/project.proto
    MESSAGE_NO_DELETE:
      - protos/agni/v1/ir/ir.proto
      - protos/agni/v1/webapi/project.proto
