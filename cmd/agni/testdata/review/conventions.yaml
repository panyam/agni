# An operator naming-convention config, as a project supplies it to `agni review --conventions`.
# It carries BOTH halves on purpose, because they are wired differently:
#   lexicon: teaches the engine this project's rail names, applied to the design READ
#   rules:   adds catalog rules, namespaced house/<rule name>
name: house
lexicon:
  net:
    rail:
      # Rails here are named function-first ("PMIC_VDD_LPM_1V8"), so the built-in vocabulary — which is
      # start-anchored on VCC/VDD/+3V3 and friends — matches none of them.
      patterns: ["_[0-9]V[0-9]$"]
  pin:
    # Supply PINS are named PWRIN_*, a different name space from net names (WS3-072), which is what
    # the net/pin grouping makes structural rather than a warning in a comment.
    supply:
      patterns: ["^PWRIN"]
rules:
  - name: signal-net-naming
    severity: warning
    why: "signal nets are UPPER_SNAKE"
    allow: ["^[A-Z][A-Z0-9_]*$"]
