fires:
  reverse-blocking-absent:
    subjects: ["+24V"]
    why: "incidental: J1 feeds the LDO with no reverse-blocking element in the path"
  supply-exceeds-abs-max:
    subjects: [U1]
    why: "U1 (MPN LM1117, the REAL TI part seeded in params/) has its power-in VIN on the +24V rail; the seeded abs-max VIN is 20V from datasheets/ti/LM1117.pdf page 4, '7.1 Absolute Maximum Ratings', so the vendor stress limit is exceeded and the finding cites that real page/table. Unlike the DEMO-MCU33 beat, this datasheet has an actual PDF to open."
  decoupling-present:
    subjects: ["+24V"]
    why: "incidental: the 24V rail feeds a power-in pin with no decoupling capacitor"
  input-protection:
    subjects: ["+24V"]
    why: "incidental: J1 (a connector) feeds the LDO power input with no fuse or TVS in the path"
  power-input-not-driven:
    subjects: [GND]
    why: "incidental: the single-pin GND stub has no driver (no PWR_FLAG in this minimal sheet)"
  single-pin-net:
    subjects: [GND]
    why: "incidental: the GND label binds only U1's GND pin"
