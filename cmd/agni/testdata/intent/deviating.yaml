# A scaffold declaration whose expectations DEVIATE from ecu.edn, so the items fail: the design has
# two ics (U1/U2) but the intent expects one and declares no soc, and it carries 3V3 but not the
# declared 1V8 rail. The count:1 on MCU makes module-count fail (expects 1, found 2).
name: ECU intent (deviating scaffold)
modules:
  - {name: MCU, class: ic, count: 1}
  - {name: SoC, class: soc}
voltage_domains:
  - {name: io_3v3, nominal: 3.3, rails: [3V3]}
  - {name: core, nominal: 1.8, rails: [1V8]}
subsystems:
  - {name: power tree, nets: [3V3, 1V8]}
protections:
  - {rail: 3V3, kind: discharge}
