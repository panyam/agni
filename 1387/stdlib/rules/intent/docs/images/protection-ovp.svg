<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" width="700" height="290" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="protection-ovp rule: an intent-declared power-input rail with no clamp is flagged; the same rail with a TVS to ground is fine">
  <!-- card -->
  <rect x="1" y="1" width="698" height="288" rx="10" fill="#f8f9fb" stroke="#e3e6eb"/>
  <line x1="350" y1="24" x2="350" y2="252" stroke="#e3e6eb" stroke-dasharray="4 4"/>
  <text x="350" y="278" font-size="12" fill="#6b7280" text-anchor="middle">the rail is named by the human in intent.yaml (protections: rail 12V_IN, kind ovp)</text>

  <!-- ================= LEFT: flagged ================= -->
  <text x="30" y="42" font-size="15" font-weight="600" fill="#d64545">Flagged: no clamp on the declared input</text>

  <!-- battery input source -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <rect x="34" y="100" width="60" height="40" rx="4" fill="#ffffff"/>
  </g>
  <text x="64" y="124" font-size="12" fill="#394049" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">VBAT</text>

  <!-- downstream converter -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <rect x="246" y="96" width="66" height="48" rx="4" fill="#ffffff"/>
  </g>
  <text x="279" y="88" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">PMIC</text>
  <text x="279" y="124" font-size="11" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">vin</text>

  <!-- flagged rail: VBAT to PMIC vin, no clamp -->
  <g stroke="#d64545" stroke-width="2.5" fill="none">
    <line x1="94" y1="120" x2="246" y2="120"/>
  </g>
  <circle cx="94" cy="120" r="4" fill="#d64545"/>
  <circle cx="246" cy="120" r="4" fill="#d64545"/>
  <text x="170" y="108" font-size="12" fill="#d64545" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">12V_IN</text>

  <text x="188" y="234" font-size="13" fill="#d64545" text-anchor="middle">no TVS/zener to ground &#8594; flagged</text>

  <!-- ================= RIGHT: fine ================= -->
  <text x="378" y="42" font-size="15" font-weight="600" fill="#2f9e57">Fine: TVS clamps the input</text>

  <!-- battery input source -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <rect x="384" y="100" width="60" height="40" rx="4" fill="#ffffff"/>
  </g>
  <text x="414" y="124" font-size="12" fill="#394049" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">VBAT</text>

  <!-- downstream converter -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <rect x="600" y="96" width="66" height="48" rx="4" fill="#ffffff"/>
  </g>
  <text x="633" y="88" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">PMIC</text>
  <text x="633" y="124" font-size="11" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">vin</text>

  <!-- rail: VBAT to PMIC vin, with a TVS branch to ground -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="444" y1="120" x2="600" y2="120"/>
  </g>
  <text x="475" y="108" font-size="12" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">12V_IN</text>

  <!-- junction where the TVS taps the rail -->
  <circle cx="522" cy="120" r="4" fill="#394049"/>

  <!-- TVS D1: bidirectional (two triangles apex-to-apex) from rail to ground -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="522" y1="120" x2="522" y2="140"/>
    <polygon points="509,140 535,140 522,153" fill="#ffffff"/>
    <polygon points="522,153 509,166 535,166" fill="#ffffff"/>
    <line x1="522" y1="166" x2="522" y2="188"/>
  </g>
  <text x="556" y="160" font-size="13" font-weight="600" fill="#2f9e57" text-anchor="middle">D1</text>

  <!-- ground symbol -->
  <g stroke="#394049" stroke-width="2">
    <line x1="506" y1="188" x2="538" y2="188"/>
    <line x1="511" y1="194" x2="533" y2="194"/>
    <line x1="516" y1="200" x2="528" y2="200"/>
  </g>

  <text x="540" y="234" font-size="13" fill="#2f9e57" text-anchor="middle">TVS clamps to ground &#8594; fine</text>
</svg>
