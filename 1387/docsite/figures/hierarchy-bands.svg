<svg viewBox="0 0 640 264" role="img" aria-labelledby="hierarchy-bands-title" style="width:100%;height:auto;font-family:inherit">
  <title id="hierarchy-bands-title">A number line in nanometres. Three sheet instances, the root and two placements of the same child, sit at 0, 2^41 and twice 2^41. Each sheet is only about 10^9 nm wide, so the bands never overlap and union by point can never leave the band it started in. A dashed arc above the line shows union by label crossing from one band to another, which is what stitches the sheets into one design.</title>
  <defs>
    <marker id="hierarchy-bands-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor" opacity="0.5"/>
    </marker>
  </defs>
  <path d="M312,136 C352,86 432,86 472,136" fill="none" stroke="var(--accent-color)" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="392" y="80" text-anchor="middle" fill="var(--accent-color)" font-size="11.5" font-weight="600">union by label crosses bands</text>
  <line x1="30" y1="176" x2="616" y2="176" stroke="currentColor" stroke-width="1.2" opacity="0.5" marker-end="url(#hierarchy-bands-arrow)"/>
  <g fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.55">
    <rect x="70" y="138" width="44" height="26" rx="2"/>
    <rect x="270" y="138" width="44" height="26" rx="2"/>
    <rect x="470" y="138" width="44" height="26" rx="2"/>
  </g>
  <g fill="currentColor" font-size="10.5" text-anchor="middle" opacity="0.85">
    <text x="92" y="155">root</text>
    <text x="292" y="155">amp1</text>
    <text x="492" y="155">amp2</text>
  </g>
  <g fill="currentColor" font-size="10.5" text-anchor="middle" opacity="0.6">
    <text x="92" y="194">0</text>
    <text x="292" y="194">2^41 nm</text>
    <text x="492" y="194">2 x 2^41 nm</text>
  </g>
  <line x1="116" y1="118" x2="268" y2="118" stroke="currentColor" stroke-width="1" opacity="0.45"/>
  <text x="192" y="110" text-anchor="middle" fill="currentColor" font-size="10" opacity="0.6">2^41 nm of empty space, and a sheet is about 10^9 nm wide</text>
  <text x="320" y="228" text-anchor="middle" fill="currentColor" font-size="11" opacity="0.6">union by point can never leave its band, so one solve covers the whole design</text>
  <text x="320" y="248" text-anchor="middle" fill="currentColor" font-size="11" opacity="0.6">and a diagnostic's coordinates come back by subtracting k times 2^41</text>
</svg>
