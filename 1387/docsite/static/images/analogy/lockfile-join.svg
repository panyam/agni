<svg xmlns="http://www.w3.org/2000/svg" width="640" height="210" font-family="system-ui,sans-serif" font-size="12">
  <text x="320" y="18" text-anchor="middle" fill="#808080">the validation join: instance -> lockfile -> type stub -> vendor docs</text>
  <rect x="20" y="60" width="120" height="70" rx="6" fill="none" stroke="#4a90d9"/>
  <text x="80" y="85" text-anchor="middle" fill="#4a90d9">Component</text>
  <text x="80" y="103" text-anchor="middle" fill="#808080" font-size="10">U1 (placed MCU)</text>
  <text x="80" y="118" text-anchor="middle" fill="#808080" font-size="10">on rail +5V</text>

  <line x1="140" y1="95" x2="180" y2="95" stroke="#808080" marker-end="url(#l)"/>
  <text x="160" y="85" text-anchor="middle" fill="#808080" font-size="9">MPN</text>

  <rect x="180" y="60" width="130" height="70" rx="6" fill="none" stroke="#5aa06a"/>
  <text x="245" y="85" text-anchor="middle" fill="#5aa06a">BomLine / attribute</text>
  <text x="245" y="103" text-anchor="middle" fill="#808080" font-size="10">U1 -&gt; "DEMO-MCU33"</text>
  <text x="245" y="118" text-anchor="middle" fill="#808080" font-size="10">(the lockfile)</text>

  <line x1="310" y1="95" x2="350" y2="95" stroke="#808080" marker-end="url(#l)"/>
  <text x="330" y="85" text-anchor="middle" fill="#808080" font-size="9">join</text>

  <rect x="350" y="60" width="130" height="70" rx="6" fill="none" stroke="#4a90d9"/>
  <text x="415" y="85" text-anchor="middle" fill="#4a90d9">PartSpec</text>
  <text x="415" y="103" text-anchor="middle" fill="#808080" font-size="10">abs-max VDD 4.6V</text>
  <text x="415" y="118" text-anchor="middle" fill="#808080" font-size="10">(the .d.ts stub)</text>

  <line x1="480" y1="95" x2="520" y2="95" stroke="#808080" marker-end="url(#l)"/>
  <text x="500" y="85" text-anchor="middle" fill="#808080" font-size="9">prov</text>

  <rect x="520" y="60" width="100" height="70" rx="6" fill="none" stroke="#808080" stroke-dasharray="5 3"/>
  <text x="570" y="85" text-anchor="middle" fill="#808080">datasheet</text>
  <text x="570" y="103" text-anchor="middle" fill="#808080" font-size="10">p.3, "Absolute</text>
  <text x="570" y="118" text-anchor="middle" fill="#808080" font-size="10">Maximum Ratings"</text>

  <text x="320" y="170" text-anchor="middle" fill="#d98a4a" font-size="11">supply-exceeds-abs-max: 5V rail into a 4.6V abs-max pin -&gt; finding, citing both ends</text>
  <defs><marker id="l" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8" fill="none" stroke="#808080"/></marker></defs>
</svg>
