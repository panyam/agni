<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="680" height="250" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="single-pin-net rule: a one-pin stub net is flagged; a two-pin net is fine">
  <!-- card -->
  <rect x="1" y="1" width="678" height="248" rx="10" fill="#f8f9fb" stroke="#e3e6eb"/>
  <line x1="340" y1="24" x2="340" y2="226" stroke="#e3e6eb" stroke-dasharray="4 4"/>

  <!-- ================= LEFT: flagged ================= -->
  <text x="30" y="42" font-size="15" font-weight="600" fill="#d64545">Flagged: one pin</text>

  <!-- resistor R1 (IEC box) -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="70" y1="120" x2="94" y2="120"/>
    <rect x="94" y="108" width="52" height="24" rx="2" fill="#ffffff"/>
    <line x1="146" y1="120" x2="170" y2="120"/>
  </g>
  <text x="120" y="98" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">R1</text>

  <!-- flagged stub net in red, ending at an open (unconnected) node -->
  <g stroke="#d64545" stroke-width="2.5" fill="none">
    <line x1="170" y1="120" x2="266" y2="120"/>
    <circle cx="272" cy="120" r="6" fill="#f8f9fb"/>
  </g>
  <text x="220" y="108" font-size="12" fill="#d64545" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">STUB</text>
  <text x="160" y="150" font-size="11" fill="#6b7280" font-family="ui-monospace, Menlo, Consolas, monospace">R1.1</text>

  <text x="150" y="206" font-size="13" fill="#d64545" text-anchor="middle">1 pin on the net &#8594; flagged</text>

  <!-- ================= RIGHT: fine ================= -->
  <text x="370" y="42" font-size="15" font-weight="600" fill="#2f9e57">Fine: two pins</text>

  <!-- resistor R1 -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="392" y1="96" x2="416" y2="96"/>
    <rect x="416" y="84" width="52" height="24" rx="2" fill="#ffffff"/>
    <line x1="468" y1="96" x2="540" y2="96"/>
  </g>
  <text x="442" y="74" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">R1</text>

  <!-- resistor R2 -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="392" y1="140" x2="416" y2="140"/>
    <rect x="416" y="128" width="52" height="24" rx="2" fill="#ffffff"/>
    <line x1="468" y1="140" x2="540" y2="140"/>
  </g>
  <text x="442" y="170" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">R2</text>

  <!-- shared net: vertical bus + junction dot + drop to GND -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="540" y1="96" x2="540" y2="176"/>
  </g>
  <circle cx="540" cy="140" r="4" fill="#394049"/>

  <!-- ground symbol -->
  <g stroke="#394049" stroke-width="2">
    <line x1="540" y1="176" x2="540" y2="184"/>
    <line x1="524" y1="184" x2="556" y2="184"/>
    <line x1="529" y1="190" x2="551" y2="190"/>
    <line x1="534" y1="196" x2="546" y2="196"/>
  </g>

  <text x="500" y="222" font-size="13" fill="#2f9e57" text-anchor="middle">2 pins on the net &#8594; fine</text>
</svg>
