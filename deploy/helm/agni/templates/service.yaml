apiVersion: v1
kind: Service
metadata:
  name: {{ include "agni.name" . }}
  labels:
    {{- include "agni.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "agni.selector" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
---
{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "agni.claim" . }}
  labels:
    {{- include "agni.labels" . | nindent 4 }}
  # helm uninstall keeps the claim, so the store and uploads outlive the release.
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "agni.name" . }}
  labels:
    {{- include "agni.labels" . | nindent 4 }}
  annotations:
    # Uploads and LFS objects can be large.
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  tls:
    - hosts: [{{ required "set ingress.host, the host in publicURL" .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecret }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "agni.name" . }}
                port:
                  name: http
