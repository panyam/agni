{{- $oidc := .Values.oidc | default dict -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agni.name" . }}
  labels:
    {{- include "agni.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  # One pod writes the store and keeps sign-ins in flight in memory, so an upgrade stops the old pod
  # before it starts the new one (agni issue 1827 covers several replicas).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "agni.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agni.selector" . | nindent 8 }}
      annotations:
        # A changed serve.yaml restarts the pod, so the server reads the new one.
        agni/serve-sha256: {{ include "agni.serveConfig" . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: agni
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --config=/etc/agni/serve.yaml
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- include "agni.caEnv" . | nindent 12 }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # Ready once every entry of the bootstrap applied, and at once without one (agni issue 1808).
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/agni
            - name: secrets
              mountPath: /run/secrets/agni
              readOnly: true
            - name: ca
              mountPath: /etc/agni/ca
              readOnly: true
            {{- if .Values.connectionSecrets }}
            - name: connections
              mountPath: /run/agni/connections
              readOnly: true
            {{- end }}
            - name: serve-config
              mountPath: /etc/agni/serve.yaml
              subPath: serve.yaml
              readOnly: true
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "agni.claim" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: secrets
          secret:
            secretName: {{ .Values.secretName }}
            defaultMode: 0440
            items:
              - key: connections-key
                path: connections-key
              - key: github-client-secret
                path: github-client-secret
              - key: github-webhook-secret
                path: github-webhook-secret
              {{- if and $oidc.issuer $oidc.clientSecret }}
              - key: oidc-client-secret
                path: oidc-client-secret
              {{- end }}
        - name: ca
          {{- if .Values.caConfigMap }}
          configMap:
            name: {{ .Values.caConfigMap }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.connectionSecrets }}
        - name: connections
          secret:
            secretName: {{ .Values.connectionSecrets }}
            defaultMode: 0440
        {{- end }}
        - name: serve-config
          configMap:
            name: {{ include "agni.name" . }}-serve
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
