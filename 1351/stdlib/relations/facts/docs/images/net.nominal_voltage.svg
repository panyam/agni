<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" width="680" height="240" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="net.nominal_voltage relation: a net named with a voltage token yields its nominal, a net named without one yields no row">
  <rect x="1" y="1" width="678" height="238" rx="10" fill="#f8f9fb" stroke="#e3e6eb"/>
  <line x1="340" y1="24" x2="340" y2="216" stroke="#e3e6eb" stroke-dasharray="4 4"/>

  <text x="30" y="42" font-size="15" font-weight="600" fill="#2f8a4c">Name carries a voltage token</text>
  <text x="370" y="42" font-size="15" font-weight="600" fill="#6b7280">Name carries none</text>

  <!-- LEFT: +3V3 -> 3.3 -->
  <rect x="44" y="96" width="90" height="34" rx="17" fill="#ffffff" stroke="#2f8a4c" stroke-width="2"/>
  <text x="89" y="118" font-size="15" font-weight="600" fill="#2f8a4c" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">+3V3</text>

  <g stroke="#2f8a4c" stroke-width="2" fill="none">
    <line x1="140" y1="113" x2="196" y2="113"/>
  </g>
  <polygon points="196,113 186,108 186,118" fill="#2f8a4c" stroke="none"/>

  <text x="212" y="120" font-size="22" font-weight="600" fill="#2f8a4c">3.3 V</text>
  <text x="44" y="164" font-size="12" fill="#6b7280">the digits in the name ARE the nominal</text>
  <text x="44" y="182" font-size="11" fill="#6b7280" font-family="ui-monospace, Menlo, Consolas, monospace">net.nominal_voltage("+3V3", 3.3)</text>

  <!-- RIGHT: VBAT -> no nominal -->
  <rect x="384" y="96" width="90" height="34" rx="17" fill="#ffffff" stroke="#9aa1ab" stroke-width="2"/>
  <text x="429" y="118" font-size="15" font-weight="600" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">VBAT</text>

  <g stroke="#9aa1ab" stroke-width="2" fill="none">
    <line x1="480" y1="113" x2="536" y2="113"/>
  </g>
  <polygon points="536,113 526,108 526,118" fill="#9aa1ab" stroke="none"/>

  <text x="552" y="120" font-size="22" font-weight="600" fill="#9aa1ab">no row</text>
  <text x="384" y="164" font-size="12" fill="#6b7280">no parseable token: skip, never guess</text>
  <text x="384" y="182" font-size="11" fill="#6b7280" font-family="ui-monospace, Menlo, Consolas, monospace">(no bare number to invent a voltage from)</text>

  <text x="340" y="224" font-size="12" fill="#6b7280" text-anchor="middle">the design-side nominal a datasheet range check compares against, taken straight from the net name</text>
</svg>
