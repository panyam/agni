<svg viewBox="0 0 660 292" role="img" aria-labelledby="absmax-title" style="width:100%;height:auto;font-family:inherit">
  <title id="absmax-title">Three voltage bands: recommended operating below 15 V, an unpromised band from 15 to 20 V, and damage above the 20 V absolute maximum</title>
  <g fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.85">
  <rect x="70" y="24" width="96" height="62" fill="currentColor" opacity="0.14"/>
  <rect x="70" y="86" width="96" height="72" fill="currentColor" opacity="0.06"/>
  <rect x="70" y="158" width="96" height="94" fill="var(--accent-color)" opacity="0.16"/>
  <rect x="70" y="24" width="96" height="228"/></g>
  <g stroke="var(--accent-color)" stroke-width="2">
  <line x1="70" y1="86" x2="166" y2="86"/>
  <line x1="70" y1="158" x2="166" y2="158"/></g>
  <g fill="currentColor" font-size="12.5" text-anchor="end" opacity="0.75">
  <text x="60" y="90">20 V</text>
  <text x="60" y="162">15 V</text>
  <text x="60" y="256">0 V</text></g>
  <g fill="currentColor" font-size="13.5">
  <text x="186" y="60" font-weight="600">Damage</text>
  <text x="186" y="78" font-size="12.5" opacity="0.72">the part may not survive this</text>
  <text x="186" y="118" font-weight="600">Works, but nothing is promised</text>
  <text x="186" y="136" font-size="12.5" opacity="0.72">no specification was evaluated here</text>
  <text x="186" y="200" font-weight="600">Recommended operating</text>
  <text x="186" y="218" font-size="12.5" opacity="0.72">where the datasheet's other numbers hold</text></g>
  <g fill="var(--accent-color)" font-size="11.5" font-weight="600">
  <text x="186" y="92">absolute maximum</text>
  <text x="186" y="164">recommended max</text></g>
  <g fill="currentColor" font-size="11.5" text-anchor="middle" opacity="0.6">
  <text x="118" y="272">a supply pin</text></g>
</svg>
