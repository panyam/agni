<svg viewBox="0 0 640 268" role="img" aria-labelledby="web-request-path-title" style="width:100%;height:auto;font-family:inherit">
  <title id="web-request-path-title">A request runs left to right from the browser, through Connect handlers, into transport-neutral services, and finally into the engine packages. The two middle boxes are the server, and they are two layers on purpose: the services are the reusable surface and the handlers are glue over them. A separate box below shows the CLI reaching the same engine packages directly, with no web tier in the path.</title>
  <defs>
    <marker id="web-request-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor" opacity="0.5"/>
    </marker>
  </defs>
  <path d="M173,46 L173,38 L467,38 L467,46" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.4"/>
  <text x="320" y="30" text-anchor="middle" fill="currentColor" font-size="11" font-weight="600" opacity="0.65">the server, deliberately two layers</text>
  <g fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.35">
    <rect x="17" y="56" width="138" height="100" rx="3"/>
    <rect x="173" y="56" width="138" height="100" rx="3"/>
    <rect x="329" y="56" width="138" height="100" rx="3"/>
  </g>
  <rect x="485" y="56" width="138" height="100" rx="3" fill="none" stroke="var(--accent-color)" stroke-width="1.4"/>
  <g fill="currentColor" font-size="11" font-weight="600" opacity="0.9">
    <text x="30" y="80">the browser</text>
    <text x="186" y="80">Connect handlers</text>
    <text x="342" y="80">the services</text>
  </g>
  <text x="498" y="80" fill="var(--accent-color)" font-size="11" font-weight="600">engine packages</text>
  <g fill="currentColor" font-size="9.5" opacity="0.6">
    <text x="30" y="102">leaf UI components</text>
    <text x="30" y="116">push intents to a</text>
    <text x="30" y="130">TypeScript presenter</text>
    <text x="186" y="102">proto JSON over</text>
    <text x="186" y="116">HTTP, and nothing</text>
    <text x="186" y="130">else</text>
    <text x="342" y="102">transport-neutral:</text>
    <text x="342" y="116">loaders in, proto</text>
    <text x="342" y="130">messages out</text>
    <text x="498" y="102">formats, render,</text>
    <text x="498" y="116">diff, check, query</text>
  </g>
  <g stroke="currentColor" stroke-width="1.2" opacity="0.5" marker-end="url(#web-request-arrow)">
    <line x1="159" y1="106" x2="169" y2="106"/>
    <line x1="315" y1="106" x2="325" y2="106"/>
    <line x1="471" y1="106" x2="481" y2="106"/>
    <line x1="554" y1="196" x2="554" y2="160"/>
  </g>
  <rect x="485" y="196" width="138" height="38" rx="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.35"/>
  <text x="554" y="220" text-anchor="middle" fill="currentColor" font-size="10.5" opacity="0.8">the CLI and the tests</text>
  <text x="320" y="258" text-anchor="middle" fill="currentColor" font-size="11" opacity="0.6">the services know no HTTP, and the web tier owns no engine logic</text>
</svg>
