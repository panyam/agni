<svg viewBox="0 0 640 320" role="img" aria-labelledby="can-interface-contract-title" style="width:100%;height:auto;font-family:inherit">
  <title id="can-interface-contract-title">A CAN link drawn as the set of parts the interface requires. A processor connects to a transceiver over TXD, RXD and STB. The transceiver drives the differential pair CANH and CANL, which carries a 120 ohm termination across it and an ESD clamp to ground before it leaves the board through a connector. Each feature is annotated with the profile requirement that checks it. A netlist missing any of them is still a valid netlist.</title>
  <line x1="40" y1="250" x2="600" y2="250" stroke="currentColor" stroke-width="2" opacity="0.85"/>
  <text x="40" y="268" fill="currentColor" font-size="11" opacity="0.65">ground</text>
  <g fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.6">
  <rect x="24" y="92" width="104" height="88" rx="3"/>
  <rect x="224" y="92" width="112" height="88" rx="3"/>
  <rect x="512" y="92" width="80" height="88" rx="3"/></g>
  <g fill="currentColor" font-size="12" font-weight="600" text-anchor="middle">
  <text x="76" y="140">processor</text>
  <text x="280" y="134">transceiver</text>
  <text x="552" y="132">J1</text></g>
  <text x="552" y="150" text-anchor="middle" fill="currentColor" font-size="9.5" opacity="0.6">off the board</text>
  <g fill="none" stroke="currentColor" stroke-width="1.6" opacity="0.85">
  <path d="M128 110 H224"/>
  <path d="M128 140 H224"/>
  <path d="M128 170 H224"/></g>
  <g fill="currentColor" font-size="10" text-anchor="middle" opacity="0.7">
  <text x="176" y="104">TXD</text>
  <text x="176" y="134">RXD</text>
  <text x="176" y="164">STB</text></g>
  <g fill="none" stroke="var(--accent-color)" stroke-width="2">
  <path d="M336 118 H512"/>
  <path d="M336 158 H512"/></g>
  <g fill="var(--accent-color)" font-size="10" font-weight="600">
  <text x="344" y="112">CANH</text>
  <text x="344" y="172">CANL</text></g>
  <line x1="392" y1="118" x2="392" y2="126" stroke="currentColor" stroke-width="1.6" opacity="0.85"/>
  <line x1="392" y1="150" x2="392" y2="158" stroke="currentColor" stroke-width="1.6" opacity="0.85"/>
  <rect x="382" y="126" width="20" height="24" fill="none" stroke="currentColor" stroke-width="1.6" opacity="0.85"/>
  <text x="410" y="142" fill="currentColor" font-size="10.5" opacity="0.8">120 ohm</text>
  <g fill="none" stroke="currentColor" stroke-width="1.6" opacity="0.85">
  <path d="M450 118 V192"/>
  <path d="M486 158 V192"/>
  <path d="M468 224 V250"/></g>
  <rect x="430" y="192" width="76" height="32" rx="3" fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.7"/>
  <text x="468" y="212" text-anchor="middle" fill="currentColor" font-size="10" opacity="0.8">ESD clamp</text>
  <g fill="var(--accent-color)" font-size="10" text-anchor="middle" font-weight="600">
  <text x="200" y="288">signal-missing, host-incomplete</text>
  <text x="392" y="288">termination, at both ends</text>
  <text x="500" y="288">esd</text></g>
  <text x="320" y="312" text-anchor="middle" fill="currentColor" font-size="11" opacity="0.65">a board with any of these missing is still a perfectly valid netlist, which is why the profile declares them</text>
</svg>
