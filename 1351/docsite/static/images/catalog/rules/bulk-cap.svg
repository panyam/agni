<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="680" height="280" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="bulk-cap rule: a power rail with no capacitor anywhere is flagged; a rail carrying bulk and decoupling caps is fine">
  <!-- card -->
  <rect x="1" y="1" width="678" height="278" rx="10" fill="#f8f9fb" stroke="#e3e6eb"/>
  <line x1="340" y1="24" x2="340" y2="256" stroke="#e3e6eb" stroke-dasharray="4 4"/>

  <!-- ================= LEFT: flagged ================= -->
  <text x="30" y="42" font-size="15" font-weight="600" fill="#d64545">Flagged: no cap on the rail</text>

  <!-- +3V3 rail label + flagged net wire feeding U2 -->
  <text x="46" y="96" font-size="12" fill="#d64545" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">+3V3</text>
  <g stroke="#d64545" stroke-width="2.5" fill="none">
    <line x1="66" y1="92" x2="150" y2="92"/>
  </g>

  <!-- U2 IC box -->
  <rect x="150" y="70" width="80" height="70" rx="4" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="190" y="110" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">U2</text>
  <text x="146" y="88" font-size="11" fill="#6b7280" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">vdd</text>

  <!-- U2 to ground reference -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="190" y1="140" x2="190" y2="164"/>
  </g>
  <g stroke="#394049" stroke-width="2">
    <line x1="174" y1="164" x2="206" y2="164"/>
    <line x1="179" y1="170" x2="201" y2="170"/>
    <line x1="184" y1="176" x2="196" y2="176"/>
  </g>

  <text x="170" y="236" font-size="13" fill="#d64545" text-anchor="middle">no cap anywhere -&gt; flagged</text>

  <!-- ================= RIGHT: fine ================= -->
  <text x="370" y="42" font-size="15" font-weight="600" fill="#2f9e57">Fine: rail carries caps</text>

  <!-- +3V3 rail label + net wire feeding U2 -->
  <text x="386" y="96" font-size="12" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">+3V3</text>
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="406" y1="92" x2="470" y2="92"/>
  </g>

  <!-- U2 IC box -->
  <rect x="470" y="70" width="80" height="70" rx="4" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="510" y="110" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">U2</text>
  <text x="466" y="88" font-size="11" fill="#6b7280" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">vdd</text>

  <!-- rail continues to the cap taps -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="550" y1="92" x2="632" y2="92"/>
  </g>
  <circle cx="580" cy="92" r="4" fill="#394049"/>
  <circle cx="632" cy="92" r="4" fill="#394049"/>

  <!-- C1 bulk cap (drop from junction at x=580) -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="580" y1="92" x2="580" y2="120"/>
    <line x1="568" y1="120" x2="592" y2="120"/>
    <line x1="568" y1="128" x2="592" y2="128"/>
    <line x1="580" y1="128" x2="580" y2="150"/>
  </g>
  <text x="612" y="120" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">C1</text>
  <text x="612" y="136" font-size="11" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">10u</text>

  <!-- C2 decoupling cap (drop from junction at x=632) -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="632" y1="92" x2="632" y2="120"/>
    <line x1="620" y1="120" x2="644" y2="120"/>
    <line x1="620" y1="128" x2="644" y2="128"/>
    <line x1="632" y1="128" x2="632" y2="150"/>
  </g>
  <text x="655" y="120" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">C2</text>
  <text x="655" y="136" font-size="11" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">100n</text>

  <!-- shared ground bus under the caps -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="580" y1="150" x2="632" y2="150"/>
    <line x1="606" y1="150" x2="606" y2="164"/>
  </g>
  <circle cx="580" cy="150" r="4" fill="#394049"/>
  <circle cx="632" cy="150" r="4" fill="#394049"/>
  <g stroke="#394049" stroke-width="2">
    <line x1="590" y1="164" x2="622" y2="164"/>
    <line x1="595" y1="170" x2="617" y2="170"/>
    <line x1="600" y1="176" x2="612" y2="176"/>
  </g>

  <text x="510" y="236" font-size="13" fill="#2f9e57" text-anchor="middle">C1 + C2 on the rail -&gt; fine</text>
</svg>
