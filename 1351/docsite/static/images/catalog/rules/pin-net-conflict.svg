<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" width="680" height="260" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="pin-net-conflict rule: pin U1.3 claimed by two nets is flagged; the same pin on one net is fine">
  <!-- card -->
  <rect x="1" y="1" width="678" height="258" rx="10" fill="#f8f9fb" stroke="#e3e6eb"/>
  <line x1="340" y1="24" x2="340" y2="236" stroke="#e3e6eb" stroke-dasharray="4 4"/>

  <!-- ================= LEFT: flagged ================= -->
  <text x="30" y="42" font-size="15" font-weight="600" fill="#d64545">Flagged: pin in two nets</text>

  <!-- IC U1 -->
  <rect x="56" y="102" width="64" height="60" rx="4" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="88" y="137" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">U1</text>

  <!-- pin 3 stub -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="120" y1="132" x2="150" y2="132"/>
  </g>
  <text x="135" y="126" font-size="11" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">.3</text>

  <!-- conflict: the one pin forks into two separate nets (red) -->
  <g stroke="#d64545" stroke-width="2.5" fill="none">
    <line x1="150" y1="132" x2="222" y2="100"/>
    <line x1="150" y1="132" x2="222" y2="164"/>
    <circle cx="150" cy="132" r="4" fill="#d64545" stroke="none"/>
    <circle cx="228" cy="100" r="6" fill="#f8f9fb"/>
    <circle cx="228" cy="164" r="6" fill="#f8f9fb"/>
  </g>
  <text x="252" y="104" font-size="12" fill="#d64545" font-family="ui-monospace, Menlo, Consolas, monospace">NET_A</text>
  <text x="252" y="168" font-size="12" fill="#d64545" font-family="ui-monospace, Menlo, Consolas, monospace">NET_B</text>

  <text x="150" y="216" font-size="13" fill="#d64545" text-anchor="middle">one pin in two nets → flagged</text>

  <!-- ================= RIGHT: fine ================= -->
  <text x="370" y="42" font-size="15" font-weight="600" fill="#2f9e57">Fine: pin in one net</text>

  <!-- IC U1 -->
  <rect x="396" y="102" width="64" height="60" rx="4" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="428" y="137" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">U1</text>

  <!-- pin 3 stub -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="460" y1="132" x2="490" y2="132"/>
  </g>
  <text x="475" y="126" font-size="11" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">.3</text>

  <!-- single net to a second pin (a proper equivalence class) -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="490" y1="132" x2="560" y2="132"/>
    <line x1="560" y1="100" x2="560" y2="164"/>
    <line x1="560" y1="100" x2="590" y2="100"/>
    <line x1="560" y1="164" x2="590" y2="164"/>
  </g>
  <circle cx="560" cy="132" r="4" fill="#394049"/>

  <!-- second component U2 pins (stubs) -->
  <rect x="590" y="88" width="46" height="24" rx="4" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <rect x="590" y="152" width="46" height="24" rx="4" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="613" y="104" font-size="11" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">U2</text>
  <text x="613" y="168" font-size="11" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">R5</text>

  <text x="520" y="120" font-size="12" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">NET_A</text>
  <text x="513" y="216" font-size="13" fill="#2f9e57" text-anchor="middle">one pin in one net → fine</text>
</svg>
