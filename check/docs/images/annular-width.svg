<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" width="680" height="270" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="annular-width rule: a via whose copper ring is too thin is flagged; an adequate ring is fine">
  <rect x="1" y="1" width="678" height="268" rx="10" fill="#f8f9fb" stroke="#e3e6eb"/>
  <line x1="340" y1="24" x2="340" y2="246" stroke="#e3e6eb" stroke-dasharray="4 4"/>

  <!-- ============ LEFT: flagged (thin ring) ============ -->
  <text x="30" y="42" font-size="15" font-weight="600" fill="#d64545">Flagged: thin ring</text>
  <!-- via: copper pad annulus + drill hole -->
  <circle cx="160" cy="150" r="54" fill="#cf9b57" stroke="#394049" stroke-width="2"/>
  <circle cx="160" cy="150" r="45" fill="#f8f9fb" stroke="#394049" stroke-width="2"/>
  <text x="160" y="154" font-size="11" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">drill</text>
  <!-- ring dimension on the right edge (r45 -> r54) -->
  <g stroke="#d64545" stroke-width="2">
    <line x1="205" y1="150" x2="214" y2="150"/>
    <line x1="205" y1="146" x2="205" y2="154"/>
    <line x1="214" y1="146" x2="214" y2="154"/>
  </g>
  <text x="224" y="154" font-size="12" fill="#d64545" font-family="ui-monospace, Menlo, Consolas, monospace">ring &lt; 0.075 mm</text>
  <text x="150" y="234" font-size="13" fill="#d64545" text-anchor="middle">(pad - drill)/2 below floor &#8594; flagged</text>

  <!-- ============ RIGHT: fine (adequate ring) ============ -->
  <text x="370" y="42" font-size="15" font-weight="600" fill="#2f9e57">Fine: adequate ring</text>
  <circle cx="500" cy="150" r="54" fill="#cf9b57" stroke="#394049" stroke-width="2"/>
  <circle cx="500" cy="150" r="32" fill="#f8f9fb" stroke="#394049" stroke-width="2"/>
  <text x="500" y="154" font-size="11" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">drill</text>
  <g stroke="#2f9e57" stroke-width="2">
    <line x1="532" y1="150" x2="554" y2="150"/>
    <line x1="532" y1="146" x2="532" y2="154"/>
    <line x1="554" y1="146" x2="554" y2="154"/>
  </g>
  <text x="500" y="234" font-size="13" fill="#2f9e57" text-anchor="middle">ring keeps a wandered drill inside &#8594; fine</text>
</svg>
