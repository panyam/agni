syntax = "proto3";

package agni.v1.webapi;

option go_package = "github.com/panyam/agni/gen/go/agni/v1/webapi";

import "agni/v1/ir/ir.proto";
import "agni/v1/param/param.proto";
import "agni/v1/webapi/query.proto";

// This file: CheckService, the rule checks over a loaded design (WS9-026 extracted it from
// DesignService: checks are their own concern, run-on-demand and independent of rendering).
// The Finding/CheckReport shapes here are the canonical wire forms the CLI's
// `check --format json|report` emits too, so the two surfaces cannot drift.

// CheckService runs the rule catalog (the check/ library) over a design's netlist IR and
// serves the catalog itself. A geometry-only file with no netlist is an invalid argument.
service CheckService {
  // ListRules returns the rule catalog the service runs: one RuleInfo per rule, with its tags
  // (open classification the client groups/filters by) and whether it can run against the design.
  // The catalog is static per service build, so the client fetches it once; only availability
  // depends on the design. A CheckDesign call names the subset to actually run.
  rpc ListRules(ListRulesRequest) returns (ListRulesResponse);

  // CheckDesign runs the rule checks over a loaded design and returns the findings. Checks
  // are a run-on-demand action, potentially slower than a metadata fetch, so loading a design
  // and validating it stay independent. request.rules selects the subset to run (empty = all).
  // Each finding's subject (kind + ref) is the join key the viewer uses to highlight the
  // offending element (it matches PackedSheet primitive keys).
  rpc CheckDesign(CheckDesignRequest) returns (CheckDesignResponse);

  // GetExpectations returns a design's expected findings from its `<design>.expect.yaml` sidecar
  // (WS6-006), if one sits beside the file. Expectations are static per design and independent of
  // which rule subset a CheckDesign run uses, so they are their own resource: the viewer fetches
  // them once and reconciles them client-side against the CheckDesign findings, showing each
  // expected rule as matched / missing (not yet implemented) / pending. A design with no sidecar
  // returns an empty list (not an error), so the panel degrades gracefully.
  rpc GetExpectations(GetExpectationsRequest) returns (GetExpectationsResponse);

  // GetCheckReport runs the same checks CheckDesign runs and returns the severity-organized
  // report (WS3-022): sections worst-severity first, findings grouped by rule with the catalog
  // summary baked in. The report is its own message (not a client-side pivot of CheckDesign)
  // so the CLI's markdown/report formats and the web report panel render one canonical shape.
  rpc GetCheckReport(GetCheckReportRequest) returns (GetCheckReportResponse);

  // GetInterfaceCoverage projects the interface-profile mechanism (WS3-034) into a per-interface
  // coverage matrix (WS9-041): for every DETECTED interface profile (its in-use confidence gate
  // holds — two of its signals are present, or a host declares it), each required signal with its
  // matched net and state (present / missing / dangling / pullup_missing). It reuses the same
  // datalog the profile rules compile to, so the panel and the findings cannot disagree. A design
  // with no detected interface returns an empty list (not an error) — silent by construction, like
  // the rules themselves.
  rpc GetInterfaceCoverage(GetInterfaceCoverageRequest) returns (GetInterfaceCoverageResponse);

  // GetComponentParams surfaces the datasheet join (WS10-003) read-only, per design: every component
  // whose MPN resolves to a seeded PartSpec, with that spec's parameters. It is the "what does the
  // engine know about my parts" browse surface (WS9-035) — the same join the datasheet rules consume,
  // exposed for a UI tree rather than re-queried. A design with no joined specs (or a serve started
  // without --params) returns an empty list (not an error), so the panel degrades gracefully.
  rpc GetComponentParams(GetComponentParamsRequest) returns (GetComponentParamsResponse);
}

message CheckDesignRequest {
  string mount = 1;
  string path = 2;
  // rules names the subset of rules to run (by RuleInfo.name); empty runs the full catalog, so an
  // existing caller is unchanged. A selection lets the client run only what it wants to see (and
  // avoid running expensive rules it did not select).
  repeated string rules = 3;
}

// Subject identifies the entity a finding is about, so a consumer can group and highlight by
// entity type without re-guessing from a bare string. It maps directly to a geom.HighlightSpec
// bucket: kind "net" -> nets, "component" -> components, "pin" -> pins (ref + pin).
message Subject {
  string kind = 1; // "net" | "component" | "pin" | "bus"
  string ref = 2;  // net name (kind=net) or ref_des (kind=component | pin)
  string pin = 3;  // pin designator, set only when kind=pin
  // net_id is the deterministic per-instance net identity (ir.Net.id) for a net subject, so a
  // client can highlight/locate ONE of two nets that share a name (the duplicate-net-name case).
  // Empty for a component/pin subject or a pinless net; the client then joins by ref (the name).
  string net_id = 4;
  // bus_id is the bus's NAME (its range-label identity) for a kind="bus" subject, so a
  // bus-not-modeled finding highlights its drawn bus rather than a net (WS7-042b). A bus carries
  // no net, so this is its only geometry join key; empty for every other subject kind.
  string bus_id = 5;
}

// Finding is one rule violation, the wire form of check.Finding. `subject` is the highlight join
// key the viewer needs; `provenance` locates the finding in the source (file, native id, span) for
// a source-link tooltip or an out-of-viewer consumer such as the CLI's `check --format json`. It is
// unset when the subject carries no provenance.
message Finding {
  string rule = 1;
  string severity = 2; // "error" | "warning" | "info"
  Subject subject = 3; // the entity that failed (kind + ref); the highlight join key
  string message = 4;
  agni.v1.ir.Provenance provenance = 5; // source location of the subject; unset when none
  // Sheet ids (SheetRef.id) where the subject appears in the design's default-layout geometry,
  // filled server-side from placements (components/pins) and wires (nets) per sheet (WS9-024). A
  // net spanning sheets lists each; empty when the design has no resolvable geometry, in which
  // case a viewer highlights on the current sheet as before.
  repeated string sheets = 6;
  // locate_reason explains why clicking this finding may highlight nothing, computed
  // server-side from the loaded geometry (WS7-042c). Set to BUS_NOT_DRAWN for a bus finding whose
  // bus has no drawn wire; UNSPECIFIED (the default) means the subject is drawn and will highlight.
  LocateReason locate_reason = 7;
  // datasheet is the datasheet-side provenance of a datasheet-backed finding (WS10-012), the wire
  // form of check.Finding.DatasheetProv: which document, page, and section a limit came from, plus
  // the extraction method and confidence. Unset for a finding not backed by a seeded datasheet value.
  // Carried on the canonical Finding so every consumer — the CLI's `review`/`check --format json`, and
  // the web check panel — shows the source without parsing it out of the message (WS9-048).
  DatasheetCitation datasheet = 8;
}

// DatasheetCitation is where a datasheet-backed value came from, so a consumer shows the source (and
// flags a low confidence) as structured data rather than only inside the finding message. The wire
// form of check.DatasheetCitation.
message DatasheetCitation {
  string doc = 1;         // the SourceDoc title (vendor doc number + revision), "" if unresolved
  string doc_ref = 2;     // the SourceDoc id the value cites (the stable join key into PartSpec.docs)
  int32 page = 3;         // 1-based page in the document
  string section = 4;     // the table or figure the value was read from
  string method = 5;      // how the value was extracted ("hand", "derive/v0", "mock", ...)
  double confidence = 6;  // extraction confidence in (0, 1]; a low value flags "verify before trusting"
}

message CheckDesignResponse {
  // findings are sorted by rule then subject (check.Run's order).
  repeated Finding findings = 1;
}

message GetCheckReportRequest {
  string mount = 1;
  string path = 2;
  // Same selector semantics as CheckDesignRequest.rules: names the subset to run, empty = all.
  repeated string rules = 3;
}

// CheckReport is the severity-organized pivot over one check run: THE report shape, rendered
// by the CLI (`check --format markdown|report`) and the web report panel alike, so the two
// consumers cannot drift (WS3-022). Sections come worst-severity first and empty severities
// are omitted; within a section findings group by rule, each group carrying the catalog's
// one-line summary so a report reads without the tool at hand.
message CheckReport {
  string source = 1;   // the checked file (mount-relative path or CLI argument)
  int32 rules_run = 2; // how many rules the run evaluated (distinguishes "clean" from "skipped")
  repeated SeveritySection sections = 3;

  message SeveritySection {
    string severity = 1; // "error" | "warning" | "info" (worst first in `sections`)
    int32 count = 2;     // findings in this section, for the summary table
    repeated RuleGroup rules = 3;
  }
  message RuleGroup {
    string rule = 1;
    string summary = 2;           // the rule's catalog Summary; "" when the rule is unknown
    repeated Finding findings = 3; // the canonical Finding form, reused
  }
}

message GetCheckReportResponse {
  CheckReport report = 1;
}

message GetExpectationsRequest {
  string mount = 1;
  string path = 2;
}

// RuleExpectation is one expected-findings entry from a design's sidecar: a rule that should fire
// and the exact subjects it should fire on. `pending` marks a staged expectation -- a rule not yet
// implemented, kept so the viewer can show it red without the harness asserting it (WS6-006).
message RuleExpectation {
  string rule = 1;
  repeated string subjects = 2;
  bool pending = 3;
  // The sidecar's optional narration for this expectation (WS6-008): what is wrong in the
  // fixture and what the control case is. Empty for short-form entries.
  string why = 4;
}

message GetExpectationsResponse {
  // The `fires` entries (pending=false) then the `pending` entries. The viewer reconciles these
  // against the CheckDesign findings.
  repeated RuleExpectation expectations = 1;
  // whether a sidecar was found at all, so the viewer tells "no expectations file" (nothing to
  // check against) from "a sidecar that expects nothing" (both have an empty expectations list).
  bool has_sidecar = 2;
}

// ListRulesRequest identifies the design against which rule availability is reported. Both fields
// are currently advisory: availability derives from each rule's declared Reads (design-independent
// today), so the catalog is the same for any design. The fields are kept so availability can become
// design-dependent (e.g. once the datasheet parameter layer lands) without a wire change.
message ListRulesRequest {
  string mount = 1;
  string path = 2;
}

// RuleInfo is the catalog entry for one rule: its identity, its prose (one-line summary, impact,
// long-form detail), the facts it reads, its open classification tags, and whether it can run now.
// The full catalog is small (tens of rules, prose included), so the list carries the detail
// markdown inline rather than behind a per-rule RPC (WS9-020).
message RuleInfo {
  string name = 1;
  string severity = 2; // "error" | "warning" | "info"
  string summary = 3;
  repeated string reads = 4;      // facts the rule reads (docs/15 vocabulary)
  map<string, string> tags = 5;   // open classification: category, tier, distribution, provider keys
  bool available = 6;             // can the rule produce meaningful findings against this design now
  string unavailable_reason = 7;  // why not, when available is false (e.g. "needs the datasheet parameter layer")
  string impact = 8;              // what goes wrong when the rule is violated (check.Rule.Impact)
  string detail = 9;              // long-form markdown: meaning, rationale, query structure (check.Rule.Detail)
}

message ListRulesResponse {
  repeated RuleInfo rules = 1;
}

message GetInterfaceCoverageRequest {
  string mount = 1;
  string path = 2;
}

// SignalCoverage is one required interface signal's state (WS9-041). net is the matched net name,
// "" when the signal is missing. state is "present" | "missing" | "dangling" | "pullup_missing" —
// the same conditions the profile rules fire on, so a coverage cell and a finding agree.
message SignalCoverage {
  string name = 1;  // the signal's role name, e.g. "IO2"
  string net = 2;   // matched net name; "" when missing
  string state = 3; // "present" | "missing" | "dangling" | "pullup_missing"
}

// InterfaceCoverage is one DETECTED interface profile's coverage matrix. profile is the interface
// name (e.g. "SPI_NOR"); anchor_net is the net the interface is anchored at (for context/locate);
// signals lists every required signal in profile order.
message InterfaceCoverage {
  string profile = 1;
  string anchor_net = 2;
  repeated SignalCoverage signals = 3;
}

message GetInterfaceCoverageResponse {
  repeated InterfaceCoverage interfaces = 1;
}

message GetComponentParamsRequest {
  string mount = 1;
  string path = 2;
}

// ComponentParams is one design component joined to its datasheet spec: the ref_des the viewer
// highlights, the resolved MPN, and the full PartSpec (its parameters, limit kinds, conditions, and
// per-parameter provenance) for the tree the panel renders.
message ComponentParams {
  string ref_des = 1;
  string mpn = 2;
  agni.v1.param.PartSpec spec = 3;
}

message GetComponentParamsResponse {
  repeated ComponentParams components = 1;
}
