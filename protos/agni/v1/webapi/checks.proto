syntax = "proto3";

package agni.v1.webapi;

option go_package = "github.com/panyam/agni/gen/go/agni/v1/webapi";

import "agni/v1/checks/checks.proto";
import "agni/v1/config/naming.proto";
import "agni/v1/ir/ir.proto";
import "agni/v1/webapi/config.proto";
import "agni/v1/param/param.proto";

// This file: CheckService, the rule checks over a loaded design (WS9-026 extracted it from
// DesignService: checks are their own concern, run-on-demand and independent of rendering).
//
// The Finding/Subject/DatasheetCitation/CheckReport shapes it serves are NOT declared here: they
// live in agni.v1.checks, the transport-neutral checks contract (WS3-103), and this file references
// them. They were always the canonical forms — the CLI's `check --format json|report` emits the same
// ones — but declaring them inside the web API made "canonical" a convention rather than a fact, and
// left a written results document with nowhere to be defined but a package full of mount/path
// request types. What remains here is genuinely transport: the request/response envelopes, the
// per-request overlay configuration, and the catalog-listing shape.

// CheckService runs the rule catalog (the check/ library) over a design's netlist IR and
// serves the catalog itself. A geometry-only file with no netlist is an invalid argument.
service CheckService {
  // ListRules returns the rule catalog a check of the snapshot runs: one RuleInfo per rule, with its
  // tags (open classification the client groups and filters by) and whether it runs on the design.
  // A rule is available exactly when a whole CheckDesign of the same snapshot would not report it in
  // skipped (agni issue 950). The netlist is read to decide that and the board is not. A CheckDesign
  // call names the subset to actually run.
  rpc ListRules(ListRulesRequest) returns (ListRulesResponse);

  // CheckDesign runs the rule checks over a loaded design and returns the findings. Checks
  // are a run-on-demand action, potentially slower than a metadata fetch, so loading a design
  // and validating it stay independent. request.rules selects the subset to run (empty = all).
  // Each finding's subject (kind + ref) is the join key the viewer uses to highlight the
  // offending element (it matches PackedSheet primitive keys).
  rpc CheckDesign(CheckDesignRequest) returns (CheckDesignResponse);

  // GetExpectations returns a design's expected findings from its `<design>.expect.yaml` sidecar
  // (WS6-006), if one sits beside the file. Expectations are static per design and independent of
  // which rule subset a CheckDesign run uses, so they are their own resource: the viewer fetches
  // them once and reconciles them client-side against the CheckDesign findings, showing each
  // expected rule as matched / missing (not yet implemented) / pending. A design with no sidecar
  // returns an empty list (not an error), so the panel degrades gracefully.
  rpc GetExpectations(GetExpectationsRequest) returns (GetExpectationsResponse);

  // GetCheckReport runs the same checks CheckDesign runs and returns the severity-organized
  // report (WS3-022): sections worst-severity first, findings grouped by rule with the catalog
  // summary baked in. The report is its own message (not a client-side pivot of CheckDesign)
  // so the CLI's markdown/report formats and the web report panel render one canonical shape.
  rpc GetCheckReport(GetCheckReportRequest) returns (GetCheckReportResponse);

  // RenderCheckReport writes a check run the caller already holds as a file to keep (agni issue
  // 127): the CheckResults document `agni check --results-out` writes, or the verdict report
  // `agni check --verdicts --format html` writes. It runs no rules. The engine renders the bytes, so a
  // report saved from the viewer and one written by the CLI are the same file apart from their
  // timestamps, and no second renderer exists to drift from this one.
  rpc RenderCheckReport(RenderCheckReportRequest) returns (RenderCheckReportResponse);

  // GetInterfaceCoverage projects the interface-profile mechanism (WS3-034) into a per-interface
  // coverage matrix (WS9-041): for every DETECTED interface profile (its in-use confidence gate
  // holds — two of its signals are present, or a host declares it), each required signal with its
  // matched net and state (present / missing / dangling / pullup_missing). It reuses the same
  // datalog the profile rules compile to, so the panel and the findings cannot disagree. A design
  // with no detected interface returns an empty list (not an error) — silent by construction, like
  // the rules themselves.
  rpc GetInterfaceCoverage(GetInterfaceCoverageRequest) returns (GetInterfaceCoverageResponse);

  // GetComponentParams surfaces the datasheet join (WS10-003) read-only, per design: every component
  // whose MPN resolves to a seeded PartSpec, with that spec's parameters. It is the "what does the
  // engine know about my parts" browse surface (WS9-035) — the same join the datasheet rules consume,
  // exposed for a UI tree rather than re-queried. A design with no joined specs (or a serve started
  // without --params) returns an empty list (not an error), so the panel degrades gracefully.
  rpc GetComponentParams(GetComponentParamsRequest) returns (GetComponentParamsResponse);

  // GetNamingConvention resolves a stored convention config into the VALUE an OverlayConfig carries
  // (WS9-128). It parses and validates, so a client learns its config is malformed once, here, rather
  // than on every run that carries it.
  //
  // It exists for the same reason GetReviewManifest does. OverlayConfig deliberately carries values
  // rather than paths (C22), so a service composing one needs no filesystem — but a browser holds a
  // ref and no filesystem either, and something has to bridge the two. Making that bridge its own rpc
  // keeps the read named in the contract instead of hidden inside a check run, and a caller that
  // already holds a convention (the CLI reads the YAML the user named) never calls it.
  rpc GetNamingConvention(GetNamingConventionRequest) returns (GetNamingConventionResponse);
}

message CheckDesignRequest {
  // snapshot names the design to check, "snapshots/{snapshot}" (agni issue 1061).
  string snapshot = 7;
  // rules names the subset of rules to run (by RuleInfo.name); empty runs the full catalog, so an
  // existing caller is unchanged. A selection lets the client run only what it wants to see (and
  // avoid running expensive rules it did not select).
  repeated string rules = 1;
  // work_budget caps the work each query this request evaluates may do (agni issue 792): the units
  // a fact base counts, candidate comparisons, each row a generator emits and the connections a
  // circuit walk examines. It can only LOWER the
  // deployment's own budget, never raise it, and zero leaves that budget as it is. A query-backed rule past its budget reports itself inconclusive, naming the budget, and the other rules still answer.
  int64 work_budget = 6;
  // subjects narrows the run to these nets, components and pins (agni issue 897). Each rule answers
  // for them alone: the findings and verdicts are the ones a full run reports with one of them as a
  // subject, and a component covers its own pins. Empty checks the whole design. A rule that
  // concludes about the design as a whole has no answer for a subset, so it is not run and is named
  // in `skipped`. A net matches by net_id when both sides carry one, and by name otherwise.
  repeated agni.v1.checks.Subject subjects = 8;
  reserved 2, 3, 4, 5;
  reserved "overlay", "uri", "board_uri", "as_named";
}

// OverlayConfig is the per-request configuration that extends what a run can check: rules the shipped
// catalog does not carry, and vocabulary the engine cannot guess (WS3-102). It exists so a surface does
// not hand-wire each input separately — that hand-wiring is why --conventions reached `agni check` but
// never `agni review`, leaving any review item bound to a naming rule reading not-automated forever
// with no error to explain it.
//
// It carries VALUES, not file paths. Where the config came from is the caller's business: `agni check`
// reads a YAML file the user named, a web client may build one from a form, and a future deployment may
// resolve one from a shared registry by id. None of that belongs in the API contract, and a service that
// took a path would have to own file I/O to do its job.
//
// The config it carries is an AnalysisConfig, the same message a Project declares, so a tier added
// there is a tier a request can carry without a second edit here (agni issue 224). Whether a given
// host can RESOLVE the ref-shaped fields of a request-supplied config is a property of that
// deployment, not of this schema.
message OverlayConfig {
  // config is what this request wants the design checked against, layered over whatever the design's
  // project declares.
  AnalysisConfig config = 4;
  // ignore_project runs the design against the BUILT-IN catalog only, as though it belonged to no
  // project: no project conventions, profiles, parameters, or intent.
  //
  // It exists because per-design config (agni issue 173) made "whose rules produced this finding" a
  // real question a reviewer will ask, and a findings list cannot answer it. Toggling this and
  // re-running answers it by subtraction: what remains is the engine's opinion, and what disappeared
  // was the project's. Without it the only way to see the built-in catalog would be to move the
  // design out of its project, which nobody is going to do to answer a question.
  //
  // It does NOT disable a convention the request itself carries. Those are different acts: one says
  // "ignore what my project declares", the other says "use this instead", and a caller doing both
  // means both.
  bool ignore_project = 3;
  // Fields 1 and 2 were `conventions` (now AnalysisConfig.conventions) and a reserved
  // `conventions_id`. Both are retired rather than reused: nothing persists an OverlayConfig — the
  // stored results document carries its own RunConfig — so there is no reader of an old wire form to
  // keep compatible, and a number reused for a different meaning is a trap for anyone reading a
  // capture.
  reserved 1, 2;
}

message CheckDesignResponse {
  // findings are sorted by rule then subject (check.Run's order).
  repeated agni.v1.checks.Finding findings = 1;
  // skipped names the selected rules that could NOT run on this design, and why.
  //
  // It exists because silence reads as coverage. A rule whose fact tier this design lacks — a board
  // rule on a netlist, a datasheet rule with no corpus — is gated off before it evaluates, so it
  // contributes no findings, and a findings list has no way to say the difference between "checked
  // and clean" and "never ran". On the viewer's default-open panel that is the whole failure: tick a
  // rule the design cannot support and the result is indistinguishable from a healthy board.
  //
  // The review layer answers this with a per-item outcome vocabulary (not-applicable, needs-data and
  // the rest). This is the same honesty at the finding tier, and deliberately NOT that vocabulary: a
  // flat rule sweep has no checklist item to score, so it reports which rules were gated and the
  // reason check.Available gave, and nothing more.
  repeated SkippedRule skipped = 2;
  // verdicts is the CONSIDERED SET: what each rule concluded about every subject it was applied to,
  // including the passes and the subjects it could not judge. `findings` above stays exactly what it
  // was, the violations, so a consumer that wants defects is unaffected.
  //
  // Only rules that STATE a considered set contribute. A rule absent from here is declining to state
  // one rather than reporting that it considered nothing, and a consumer must not read the two the
  // same way. That is the same distinction `skipped` draws one level up.
  repeated agni.v1.checks.Verdict verdicts = 3;
  // unexpanded_hierarchy lists the hierarchical blocks whose contents the read this run scored left
  // out, the reader's InputDiagnostics field carried as is (agni issues 707, 717). Non-empty means
  // every finding and verdict above covers the top level alone.
  //
  // It rides on the run, rather than being read again where a report is rendered, because
  // RenderCheckReport writes from the run the caller holds and reads no design (C19). A report saved
  // from this run states it in its header.
  repeated agni.v1.ir.UnexpandedHierarchy unexpanded_hierarchy = 4;
}

// SkippedRule is one selected rule that could not evaluate, and the reason.
message SkippedRule {
  // name is the catalog rule name, as ListRules reports it.
  string name = 1;
  // reason is check.Available's own explanation ("design carries no board geometry"), not a
  // reconstruction. The rule decides why it cannot run; a second sentence written here would be a
  // second opinion that drifts.
  string reason = 2;
  // design_wide is set when the rule was left out only because the request named subjects and the
  // rule concludes about the design as a whole (agni issue 897), so it would run on an unscoped
  // request. A client tells the rules a scope left out from the rules this design cannot run at all
  // by this field, never by the reason's text.
  bool design_wide = 3;
}

message GetCheckReportRequest {
  // snapshot names the design to report on, "snapshots/{snapshot}" (agni issue 1061).
  string snapshot = 6;
  // Same selector semantics as CheckDesignRequest.rules: names the subset to run, empty = all.
  repeated string rules = 1;
  reserved 2, 3, 4, 5;
  reserved "overlay", "uri", "board_uri", "as_named";
}

message GetCheckReportResponse {
  agni.v1.checks.CheckReport report = 1;
}

// CheckReportFormat names the file RenderCheckReport writes.
enum CheckReportFormat {
  CHECK_REPORT_FORMAT_UNSPECIFIED = 0;
  // The CheckResults document, as results.Marshal writes it: findings, skipped rules, the catalog
  // snapshot, the run's provenance, the producer version and the design's content hash. The durable,
  // machine-readable record of a run, and what `agni results` re-renders.
  CHECK_REPORT_FORMAT_RESULTS_JSON = 1;
  // The self-contained verdict report page: every rule's considered set, passes included. A
  // CheckResults document cannot carry it, because it holds findings and not verdicts.
  CHECK_REPORT_FORMAT_HTML = 2;
}

// ReportLinks says whether the HTML report's rows link back into a viewer, and where. Only the caller
// knows which viewer will open the file later, so it is a request value and never inferred.
message ReportLinks {
  // url_base is the viewer's base URL, such as "http://localhost:8080" or a static demo's
  // "https://example.org/agni/demo". Empty emits no links.
  string url_base = 1;
  // design_uri is the design as that viewer addresses it, "mount://<mount>/<path>". Empty emits no
  // links.
  string design_uri = 2;
  // withheld is why links were asked for and refused, carried into the page because whoever opens the
  // saved file later never saw the reason (agni issue 626).
  string withheld = 3;
}

message RenderCheckReportRequest {
  // snapshot names the design the run read. It decides the project whose catalog the report describes and the netlist whose content hash it records, "snapshots/{snapshot}" (agni issue 1061).
  string snapshot = 9;
  // rules is the selection the run used, empty meaning the whole catalog, as CheckDesignRequest.rules.
  repeated string rules = 3;
  // run is the CheckDesign answer to write out. Nothing is re-run.
  CheckDesignResponse run = 4;
  CheckReportFormat format = 5;
  // links applies to CHECK_REPORT_FORMAT_HTML only.
  ReportLinks links = 6;
  reserved 1, 2, 7, 8;
  reserved "uri", "overlay", "board_uri", "as_named";
}

message RenderCheckReportResponse {
  bytes content = 1;
  // content_type is "application/json" or "text/html; charset=utf-8".
  string content_type = 2;
  // filename is a name to save under, from the design and the format, such as "gateway.agni-check.json".
  string filename = 3;
}

message GetNamingConventionRequest {
  // uri names the stored convention config, a key the Loader resolves, never a host path.
  string uri = 1;
}

message GetNamingConventionResponse {
  agni.v1.config.NamingConvention convention = 1;
}

message GetExpectationsRequest {
  // snapshot names the design whose expectation sidecar to read, "snapshots/{snapshot}" (agni issue 1061).
  string snapshot = 2;
  reserved 1;
  reserved "uri";
}

// RuleExpectation is one expected-findings entry from a design's sidecar: a rule that should fire
// and the exact subjects it should fire on. `pending` marks a staged expectation -- a rule not yet
// implemented, kept so the viewer can show it red without the harness asserting it (WS6-006).
message RuleExpectation {
  string rule = 1;
  repeated string subjects = 2;
  bool pending = 3;
  // The sidecar's optional narration for this expectation (WS6-008): what is wrong in the
  // fixture and what the control case is. Empty for short-form entries.
  string why = 4;
}

message GetExpectationsResponse {
  // The `fires` entries (pending=false) then the `pending` entries. The viewer reconciles these
  // against the CheckDesign findings.
  repeated RuleExpectation expectations = 1;
  // whether a sidecar was found at all, so the viewer tells "no expectations file" (nothing to
  // check against) from "a sidecar that expects nothing" (both have an empty expectations list).
  bool has_sidecar = 2;
}

// ListRulesRequest names the design whose catalog and availability are reported.
message ListRulesRequest {
  // snapshot names the design whose config and availability decide the listed catalog, so it is the one a check of that snapshot runs, "snapshots/{snapshot}" (agni issue 1061). Empty lists the server's own catalog, where only a missing datasheet parameter set makes a rule unavailable. A snapshot whose netlist cannot be read is listed the same way, since a run of it fails rather than skipping rules.
  string snapshot = 3;
  reserved 1, 2;
  reserved "overlay", "uri";
}

// RuleInfo is the catalog entry for one rule: its identity, its prose (one-line summary, impact,
// long-form detail), the facts it reads, its open classification tags, and whether it can run now.
// The full catalog is small (tens of rules, prose included), so the list carries the detail
// markdown inline rather than behind a per-rule RPC (WS9-020).
message RuleInfo {
  string name = 1;
  string severity = 2; // "error" | "warning" | "info"
  string summary = 3;
  repeated string reads = 4;      // facts the rule reads (docs/15 vocabulary)
  map<string, string> tags = 5;   // open classification: category, tier, distribution, provider keys
  bool available = 6;             // a whole CheckDesign of this snapshot runs the rule rather than skipping it
  string unavailable_reason = 7;  // why not, when available is false (e.g. "needs the datasheet parameter layer")
  string impact = 8;              // what goes wrong when the rule is violated (check.Rule.Impact)
  string detail = 9;              // long-form markdown: meaning, rationale, query structure (check.Rule.Detail)
  string remedy = 10;             // what to do about a violation, in the imperative (check.Rule.Remedy)
  // shipped is whether agni itself ships this rule, rather than a project, a convention or an
  // overlay composing it. A report that crosses the confidentiality boundary may name a shipped rule
  // and never another, since a project's rule is namespaced by the project's own name (agni issue
  // 1057).
  bool shipped = 11;
}

message ListRulesResponse {
  repeated RuleInfo rules = 1;
  // engine_version is the build answering, for a report a client prefills (agni issue 1057). Empty
  // when the deployment did not say.
  string engine_version = 2;
}

message GetInterfaceCoverageRequest {
  // snapshot names the design to project coverage over, "snapshots/{snapshot}" (agni issue 1061).
  string snapshot = 4;
  reserved 1, 2, 3;
  reserved "uri", "overlay", "as_named";
}

// SignalCoverage is one required interface signal's state (WS9-041). net is the matched net name,
// "" when the signal is missing. state is "present" | "missing" | "dangling" | "pullup_missing" —
// the same conditions the profile rules fire on, so a coverage cell and a finding agree.
message SignalCoverage {
  string name = 1;  // the signal's role name, e.g. "IO2"
  string net = 2;   // matched net name; "" when missing
  string state = 3; // "present" | "missing" | "dangling" | "pullup_missing"
}

// InterfaceCoverage is one DETECTED interface profile's coverage matrix. profile is the interface
// name (e.g. "SPI_NOR"); anchor_net is the net the interface is anchored at (for context/locate);
// signals lists every required signal in profile order.
message InterfaceCoverage {
  string profile = 1;
  string anchor_net = 2;
  repeated SignalCoverage signals = 3;
}

message GetInterfaceCoverageResponse {
  repeated InterfaceCoverage interfaces = 1;
}

message GetComponentParamsRequest {
  // snapshot names the design whose components to join against the datasheet corpus, "snapshots/{snapshot}" (agni issue 1061).
  string snapshot = 2;
  reserved 1;
  reserved "uri";
}

// ComponentParams is one design component joined to its datasheet spec: the ref_des the viewer
// highlights, the resolved MPN, and the full PartSpec (its parameters, limit kinds, conditions, and
// per-parameter provenance) for the tree the panel renders.
message ComponentParams {
  string ref_des = 1;
  string mpn = 2;
  agni.v1.param.PartSpec spec = 3;
  // corpus is where the spec came from: "project" or "shared", as a datasheet citation names it.
  string corpus = 4;
}

message GetComponentParamsResponse {
  repeated ComponentParams components = 1;
  // corpus_connected says whether any datasheet corpus was consulted, the project's or the server's.
  // Without it an empty components list means two things a reader must not confuse: nothing was
  // asked (no corpus), or the corpus was asked and holds no spec for these parts.
  bool corpus_connected = 2;
}
