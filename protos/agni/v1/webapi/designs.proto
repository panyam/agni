syntax = "proto3";

package agni.v1.webapi;

option go_package = "github.com/panyam/agni/gen/go/agni/v1/webapi";

import "agni/v1/webapi/checks.proto";
import "agni/v1/webapi/project.proto";
import "agni/v1/webapi/snapshot.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

// This file defines DesignService, which keeps the designs a server holds (agni issues 1694, 1696).
// A design is named "designs/{design}". It holds artifacts, each one source of the design such as a
// schematic with its sheets, a board, or a BOM. It ties to no project, and a project lists it by
// name. DesignViewService (design_view.proto) answers questions about a snapshot of a design instead.
//
// A server holds designs in two kinds of place. The store named by `agni serve --store` keeps the
// designs callers create as records, and `--uploads` keeps their files. Those designs can be changed
// and deleted. Mounted folders declare designs too, and those are read-only. A design id is unique
// across both. Nothing on this service names a folder, so each store decides how it keeps a design.
service DesignService {
  // CreateDesign makes a new design with no artifacts. Its title, series, flatten_hierarchy and
  // intent come from `design`. An id any design already holds is ALREADY_EXISTS. A server started without
  // --store answers FAILED_PRECONDITION, and one without --uploads refuses an artifact's files the
  // same way.
  rpc CreateDesign(CreateDesignRequest) returns (Design);

  // GetDesign returns one design by resource name. An id two mounted folders both declare is
  // FAILED_PRECONDITION naming both, since answering with either could describe the wrong board.
  rpc GetDesign(GetDesignRequest) returns (Design);

  // ListDesigns returns the designs this server holds, ordered by resource name.
  rpc ListDesigns(ListDesignsRequest) returns (ListDesignsResponse);

  // UpdateDesign changes a stored design's title, series, flatten_hierarchy or intent, the fields
  // update_mask names. A design declared in a mounted folder is read-only, and a write to it is
  // FAILED_PRECONDITION.
  rpc UpdateDesign(UpdateDesignRequest) returns (Design);

  // DeleteDesign removes a stored design and its artifacts. A project listing it keeps the name.
  rpc DeleteDesign(DeleteDesignRequest) returns (google.protobuf.Empty);

  // GetArtifact returns one artifact of a stored design.
  rpc GetArtifact(GetArtifactRequest) returns (Artifact);

  // ListArtifacts returns a design's artifacts, ordered by name. A mounted design has none, since its
  // folder names its files.
  rpc ListArtifacts(ListArtifactsRequest) returns (ListArtifactsResponse);

  // UpdateArtifact replaces an artifact's whole file set in one write, so a reader sees the old files
  // or the new ones. With allow_missing it creates the artifact. Contents the server lacks are
  // FAILED_PRECONDITION with a BlobsMissing detail naming their hashes, and the caller sends them with
  // SnapshotService.UploadBlobs and asks again.
  //
  // The server reads the files to find the artifact's type and entry. Files that make two designs
  // are INVALID_ARGUMENT. A write leaving the design with two netlists, two schematics and no netlist,
  // or two boards is FAILED_PRECONDITION, since the server could not tell which one analysis reads.
  rpc UpdateArtifact(UpdateArtifactRequest) returns (Artifact);

  // BatchUpdateArtifacts applies several UpdateArtifact requests to one design in one write, so the
  // design moves from its old artifacts to its new ones with no state in between. Any request failing
  // fails the batch, and nothing is written.
  rpc BatchUpdateArtifacts(BatchUpdateArtifactsRequest) returns (BatchUpdateArtifactsResponse);

  // ImportDesignFiles puts a folder's files into a design as its artifacts, grouped the way
  // ProposeDesigns groups a dropped folder (agni issue 1719). The file analysis reads, with every file
  // it reads, becomes one artifact, and each view of it, such as the board, becomes another. Each is
  // named for its type: netlist, schematic, board. All of them are written in one write, as
  // BatchUpdateArtifacts writes, creating or replacing each. A `design.yaml` or `project.yaml` among
  // the files is left out, since the server writes a design's descriptor itself. Files that make no
  // design, or more than one, are INVALID_ARGUMENT naming what they make. Contents the server lacks
  // are FAILED_PRECONDITION with a BlobsMissing detail, as UpdateArtifact reports them.
  rpc ImportDesignFiles(ImportDesignFilesRequest) returns (ImportDesignFilesResponse);

  // DeleteArtifact removes one artifact. Removing the design's only netlist or schematic leaves the
  // design unable to be read until another is put.
  rpc DeleteArtifact(DeleteArtifactRequest) returns (google.protobuf.Empty);

  // LinkArtifact points an artifact at a path in a mount, reads its files and keeps them by hash
  // (agni issue 1723). With allow_missing it creates the artifact, and it replaces an uploaded one.
  // A path naming a design's entry or companion takes the files a reader opens from it, grouped as
  // ImportDesignFiles groups a folder, so a KiCad root sheet brings its child sheets. A path naming a
  // folder takes every file under it. A ref that names a branch, or none, is followed and a sync
  // moves it. A tag or a commit is pinned. An unknown mount or path is NOT_FOUND, the uploads mount is
  // INVALID_ARGUMENT, and a source the server can't reach is UNAVAILABLE.
  rpc LinkArtifact(LinkArtifactRequest) returns (Artifact);

  // UnlinkArtifact makes a linked artifact an uploaded one. Its files stay as they are, and its
  // source becomes the uploads mount, so UpdateArtifact can replace them. An uploaded artifact is
  // returned unchanged.
  rpc UnlinkArtifact(UnlinkArtifactRequest) returns (Artifact);

  // SyncDesign brings a design's followed artifacts to their sources' current versions in one write
  // (agni issue 1723). Artifacts linked to one mount at one ref move to one version together. An
  // artifact whose version hasn't changed fetches nothing, and a pinned one is never moved. With
  // validate_only it reports what a sync would change and writes nothing.
  rpc SyncDesign(SyncDesignRequest) returns (SyncDesignResponse);

  // CreateReport checks a stored design against packs and keeps the run as
  // "designs/{design}/reports/{report}" (agni issue 1704). The packs apply in order over the design's
  // own intent: the default packs of the project the request names, then the packs the report names.
  // The run is a full check of the catalog the packs compose, as `agni check` with no --rule runs. A
  // report on a mounted design is FAILED_PRECONDITION, since only a stored design has the content
  // hash a report records. A server without --store answers FAILED_PRECONDITION.
  rpc CreateReport(CreateReportRequest) returns (Report);

  // GetReport returns one report, and says whether the design or a pack changed since it ran.
  rpc GetReport(GetReportRequest) returns (Report);

  // ListReports returns a design's reports, newest first, each saying what changed since it ran.
  rpc ListReports(ListReportsRequest) returns (ListReportsResponse);

  // DeleteReport removes one report. DeleteDesign removes a design's reports with it.
  rpc DeleteReport(DeleteReportRequest) returns (google.protobuf.Empty);
}

// Report is one check of a stored design against packs, kept under the design (agni issue 1704). It
// records the design's content hash and each pack's hash as they were when it ran, so a later read
// can say the run is on earlier files or earlier rules.
message Report {
  string name = 1; // "designs/{design}/reports/{report}"
  // packs are the packs the run applied, each "packs/{pack}", in the order they layered: the
  // project's default packs, then the ones the request named. CreateReport reads the request's from
  // here.
  repeated string packs = 2;
  // project is the project whose default packs applied first, "projects/{project}", empty for none.
  string project = 3;
  // design_hash names the design's artifacts and intent as the run read them, "sha256:<hex>". Output
  // only.
  string design_hash = 4;
  // pack_hashes is each pack's hash as the run read it, in the order of packs. Output only.
  repeated string pack_hashes = 5;
  // results is the run: its findings, the rules it skipped, and the rest of a CheckDesign answer.
  // Output only.
  CheckDesignResponse results = 6;
  // create_time is when the run was kept. Output only.
  google.protobuf.Timestamp create_time = 7;
  // design_changed is true when the design's artifacts or intent differ now from what the run read,
  // or the design is gone. Computed on every read. Output only.
  bool design_changed = 8;
  // packs_changed names each pack whose hash differs now from what the run read, or which is gone.
  // Computed on every read. Output only.
  repeated string packs_changed = 9;
  // finding_count is how many findings results holds, set on every read, so a BASIC view that leaves
  // results out still says it (agni issue 1753). Output only.
  int32 finding_count = 10;
}

// ReportView is how much of a report a read returns (AIP-157). A report keeps its whole run, every
// verdict included, which runs to megabytes on a large board, so a listing leaves the run out.
enum ReportView {
  // REPORT_VIEW_UNSPECIFIED is BASIC for ListReports and FULL for GetReport.
  REPORT_VIEW_UNSPECIFIED = 0;
  // REPORT_VIEW_BASIC leaves results out, keeping finding_count.
  REPORT_VIEW_BASIC = 1;
  // REPORT_VIEW_FULL includes results.
  REPORT_VIEW_FULL = 2;
}

message CreateReportRequest {
  string parent = 1; // "designs/{design}"
  // report_id is the new report's id, lowercase letters, digits, '.', '_' or '-'. Empty lets the
  // server assign one that sorts by creation time.
  string report_id = 2;
  // report carries the packs to apply, after the project's defaults. Its other fields are ignored.
  Report report = 3;
  // project names a project, "projects/{project}", whose default packs apply first. Empty applies
  // none.
  string project = 4;
}

message GetReportRequest {
  string name = 1; // "designs/{design}/reports/{report}"
  // view is how much of the report to return. Unspecified returns it whole.
  ReportView view = 2;
}

message ListReportsRequest {
  string parent = 1; // "designs/{design}"
  // page_size is the maximum number of reports to return. 0 uses the server default.
  int32 page_size = 2;
  // page_token continues a previous call. An empty token starts at the newest report.
  string page_token = 3;
  // filter narrows the listing (AIP-160). None is supported yet, so any filter is INVALID_ARGUMENT
  // rather than ignored, since a client that believed it had filtered would read the wrong reports.
  string filter = 4;
  // view is how much of each report to return. Unspecified leaves each report's results out, so a
  // client draws a list without fetching every run, and GetReport fetches the one it opens.
  ReportView view = 5;
}

message ListReportsResponse {
  repeated Report reports = 1;
  // next_page_token is empty when the last page has been reached.
  string next_page_token = 2;
}

message DeleteReportRequest {
  string name = 1; // "designs/{design}/reports/{report}"
}

message CreateDesignRequest {
  // design_id is the new design's id, lowercase letters, digits, '.', '_' or '-'.
  string design_id = 1;
  reserved 2;
  reserved "files";
  // design carries the new design's title, series and flatten_hierarchy, and its config's intent
  // (agni issue 1704). Its name is ignored.
  Design design = 3;
}

message GetDesignRequest {
  string name = 1; // "designs/{design}"
}

message ListDesignsRequest {
  // page_size is the maximum number of designs to return. 0 uses the server default.
  int32 page_size = 1;
  // page_token continues a previous call. An empty token starts at the first design.
  string page_token = 2;
  // filter narrows the listing (AIP-160). Two forms are supported, `series = "memory_unit"` and
  // `project = "projects/b200"`, the second keeping the designs that project lists. Any other filter
  // is INVALID_ARGUMENT, since a client that believed it had filtered would read the wrong designs.
  string filter = 3;
}

message ListDesignsResponse {
  repeated Design designs = 1;
  // next_page_token is empty when the last page has been reached.
  string next_page_token = 2;
  // unreachable names the designs left out because two mounted folders declare the same id (AIP-217).
  // Each entry is "designs/{design}". The rest of the listing is complete.
  repeated string unreachable = 3;
}

message UpdateDesignRequest {
  reserved 1, 2;
  reserved "name", "files";
  // design names the design to change, "designs/{design}", and carries the new values.
  Design design = 3;
  // update_mask names the fields to change, among `title`, `series`, `flatten_hierarchy` and
  // `config.intent` (agni issue 1704). An empty mask changes the first three. Any other path is
  // INVALID_ARGUMENT, since the rest of a stored design's config comes from the packs it is read
  // under.
  google.protobuf.FieldMask update_mask = 4;
}

message DeleteDesignRequest {
  string name = 1; // "designs/{design}"
}

// Artifact is one source of a design, such as a schematic with its sheets, a board, or a BOM. It is
// named "designs/{design}/artifacts/{artifact}". It holds one file or several, and replacing it
// replaces all of them, so a schematic never holds sheets from two releases.
//
// A design is read as one IR built from all its artifacts. The server works out which artifact
// analysis reads: the netlist, else the schematic, else the board. The others are views of the same
// design. Provenance names a file as "{artifact}/{path}".
message Artifact {
  string name = 1; // "designs/{design}/artifacts/{artifact}"
  // files are the artifact's files. Each path is relative to the artifact, and readers find one file
  // from another by it, as a KiCad root sheet names its child sheets by filename.
  repeated SnapshotFile files = 2;
  // type is what the server found the artifact to hold. It is output only.
  ArtifactType type = 3;
  // entry is the path among files that a reader opens first, such as a KiCad root sheet. It is empty
  // for an artifact no reader opens, such as a BOM. It is output only.
  string entry = 4;
  // update_time is when the artifact's files last changed. It is output only.
  google.protobuf.Timestamp update_time = 5;
  // source is where the files were read from (agni issue 1723). An uploaded artifact's mount is the
  // server's uploads mount, and a linked artifact's is another, such as a github one. It is output
  // only, set by UpdateArtifact and LinkArtifact.
  ArtifactSource source = 6;
}

// ArtifactSource is where an artifact's files come from: a mount, a path inside it and a ref.
message ArtifactSource {
  // mount is the mount's name, as Mount.name gives it, such as "uploads" or "jetson".
  string mount = 1;
  // path is the file or folder inside the mount, such as "hw/board.kicad_sch". Empty is its root.
  string path = 2;
  // ref is a branch, tag or commit for a mount with history, and empty for one without. An empty ref
  // on a github mount is its default branch.
  string ref = 3;
  // follow is true when a sync moves the artifact: a branch, an empty ref, or a mount with no
  // history. A tag or commit is pinned. It is output only.
  bool follow = 4;
  // version is the source's own name for what the server last read, a commit SHA on a github mount.
  // It is empty for a mount with no history. It is output only.
  string version = 5;
  // read_time is when the server last read the files from the source. It is output only.
  google.protobuf.Timestamp read_time = 6;
  // read_hash is the SHA-256 of the files as the server last read them, each path and its contents'
  // hash in path order, "sha256:<hex>". A mount with no history has no version, so a sync compares
  // this instead. It is output only.
  string read_hash = 7;
}

// ArtifactType is what an artifact holds, found from its entry's format.
enum ArtifactType {
  ARTIFACT_TYPE_UNSPECIFIED = 0;
  // ARTIFACT_TYPE_NETLIST is a netlist with no drawing, such as an EDIF `.edn`.
  ARTIFACT_TYPE_NETLIST = 1;
  // ARTIFACT_TYPE_SCHEMATIC is a drawn schematic, such as a KiCad root sheet and its child sheets.
  ARTIFACT_TYPE_SCHEMATIC = 2;
  // ARTIFACT_TYPE_BOARD is a board layout, such as a `.kicad_pcb` or an ODB++ job.
  ARTIFACT_TYPE_BOARD = 3;
  // ARTIFACT_TYPE_OTHER is files no reader opens, such as a BOM or a PDF. They are kept with the
  // design and never read.
  ARTIFACT_TYPE_OTHER = 4;
}

message GetArtifactRequest {
  string name = 1; // "designs/{design}/artifacts/{artifact}"
}

message ListArtifactsRequest {
  string parent = 1; // "designs/{design}"
  // page_size is the maximum number of artifacts to return. 0 uses the server default.
  int32 page_size = 2;
  // page_token continues a previous call. An empty token starts at the first artifact.
  string page_token = 3;
}

message ListArtifactsResponse {
  repeated Artifact artifacts = 1;
  // next_page_token is empty when the last page has been reached.
  string next_page_token = 2;
}

message UpdateArtifactRequest {
  // artifact names the artifact and carries its new files. Its type, entry and update_time are
  // ignored, since the server works them out.
  Artifact artifact = 1;
  // allow_missing creates the artifact when the design has none of that name (AIP-134). Without it,
  // a missing artifact is NOT_FOUND.
  bool allow_missing = 2;
}

message BatchUpdateArtifactsRequest {
  string parent = 1; // "designs/{design}"
  // requests each name an artifact of parent. Two naming one artifact is INVALID_ARGUMENT.
  repeated UpdateArtifactRequest requests = 2;
}

message BatchUpdateArtifactsResponse {
  // artifacts are the written artifacts, in the order of the requests.
  repeated Artifact artifacts = 1;
}

message DeleteArtifactRequest {
  string name = 1; // "designs/{design}/artifacts/{artifact}"
}

message LinkArtifactRequest {
  string name = 1; // "designs/{design}/artifacts/{artifact}"
  // source names the mount, path and ref. Its other fields are ignored.
  ArtifactSource source = 2;
  // allow_missing creates the artifact when the design has none of that name. Without it, a missing
  // artifact is NOT_FOUND.
  bool allow_missing = 3;
}

message UnlinkArtifactRequest {
  string name = 1; // "designs/{design}/artifacts/{artifact}"
}

message SyncDesignRequest {
  string name = 1; // "designs/{design}"
  // artifacts limits the sync to these artifact ids. Empty syncs every followed artifact. Naming one
  // that is uploaded is INVALID_ARGUMENT, and naming a pinned one reports it unchanged.
  repeated string artifacts = 2;
  // validate_only reports what a sync would change and writes nothing.
  bool validate_only = 3;
}

message SyncDesignResponse {
  // artifacts holds one entry per linked artifact the sync looked at, ordered by name.
  repeated ArtifactSync artifacts = 1;
}

// ArtifactSync is what a sync did to one artifact.
message ArtifactSync {
  string artifact = 1; // "designs/{design}/artifacts/{artifact}"
  string from_version = 2;
  // to_version equals from_version when nothing changed. On a mount with no history both are empty,
  // and changed says whether the files differ.
  string to_version = 3;
  // changed is true when the artifact's files differ from what the server last read. A dry run on a
  // mount with history reads no files, and sets it when the version moved.
  bool changed = 4;
  // files_fetched counts the files the server downloaded because it held no copy, and bytes_fetched
  // their size. An unchanged version fetches none.
  int32 files_fetched = 5;
  int64 bytes_fetched = 6;
}

message ImportDesignFilesRequest {
  string parent = 1; // "designs/{design}"
  // files are the folder's files, each by its path relative to the folder.
  repeated SnapshotFile files = 2;
}

message ImportDesignFilesResponse {
  // artifacts are the written artifacts, the one analysis reads first.
  repeated Artifact artifacts = 1;
  // unread names the files no reader opens, such as a README. They are not stored.
  repeated string unread = 2;
}
