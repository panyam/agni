syntax = "proto3";

package agni.v1.webapi;

option go_package = "github.com/panyam/agni/gen/go/agni/v1/webapi";

// The application tier is a set of services, one proto file per concern (workspace, design,
// checks, diff, validate); the web layer is just a Connect (later grpc-gateway) translation
// over them. Like the IR and the geometry sidecar, the contract is defined in proto and
// consumed via generated code in Go and TS (CONSTRAINTS C2, C13). No hand-written JSON DTOs.
//
// This file: WorkspaceService, the mounted folders and their contents (the "Files" resource).

// WorkspaceService exposes the read-only folders ("mounts") the server was started with
// and their directory contents. Mounts are the security boundary: a client names an artifact by a
// `mount://<mount>/<path>` URI whose authority is a mount, never an absolute host path.
service WorkspaceService {
  // ListMounts returns the mounts the server is serving, in the order they were
  // configured. It takes no parameters and never fails for a running server.
  rpc ListMounts(ListMountsRequest) returns (ListMountsResponse);

  // ListDir lists one directory level inside a mount: its subdirectories and its files, each file
  // labeled with the reader that would open it. The client addresses a location by an artifact URI
  // whose authority is a mount, never an absolute host path; the server resolves it inside that
  // mount. Lazy, one level per call, so large trees stay responsive. Set prune_empty_dirs to leave
  // out subdirectories with no readable design anywhere beneath them.
  rpc ListDir(ListDirRequest) returns (ListDirResponse);
}

// Mount is one configured root folder. Clients reference it by name in later calls;
// root is a human-readable display path and is not a capability.
message Mount {
  // name is the stable handle the client passes back to address this mount.
  string name = 1;
  // root is the absolute host path the mount serves, for display in the UI.
  string root = 2;
  // uri names the mount itself, "mount://<name>". It is served rather than left for the client to
  // build, because a client that concatenates a scheme by hand is a client that can get the scheme
  // wrong, and every other artifact reference it makes will be a child of this one.
  string uri = 3;
}

message ListMountsRequest {}

message ListMountsResponse {
  repeated Mount mounts = 1;
}

// DirEntry is one item in a directory listing: a subdirectory or a supported design file.
message DirEntry {
  // name is the base name (no path).
  string name = 1;
  // is_dir is true for a subdirectory.
  bool is_dir = 2;
  // format names the reader that would open this file (e.g. "edif", "kicad", "ipc2581",
  // "edif-schematic"). It is empty for a directory and for an unrecognized file (one agni
  // has no reader for). The listing carries such files rather than dropping them, so a client
  // decides for itself what to show: the design tree hides them, the datasheets tree keeps the
  // PDFs among them. It is a hint for the UI; ambiguous extensions are resolved for real at
  // load time.
  string format = 3;
  // uri addresses this entry, to pass back to ListDir (for a directory) or to a design/sheet load
  // (for a file).
  string uri = 4;
}

message ListDirRequest {
  // uri is the directory to list, "mount://<mount>/<dir>". A bare "mount://<mount>" lists the
  // mount root.
  string uri = 1;
  // prune_empty_dirs drops subdirectories whose subtree holds no file any reader understands, at
  // any depth: the folders a design browser can only ever show empty. It is opt-in because "empty"
  // is per-client — a datasheets browser lists PDFs, which no design reader opens, so pruning by
  // design format would hide exactly the folders it wants. Answering it costs a bounded walk of
  // each subtree; a directory the walk cannot settle (bound reached, adapter error) is kept, since
  // a folder wrongly shown costs a click and one wrongly hidden costs a design.
  bool prune_empty_dirs = 2;
}

message ListDirResponse {
  // entries are the directory's subdirectories and supported files, directories first,
  // each group sorted by name.
  repeated DirEntry entries = 1;
}
