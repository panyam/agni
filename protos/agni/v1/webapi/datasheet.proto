syntax = "proto3";

package agni.v1.webapi;

option go_package = "github.com/panyam/agni/gen/go/agni/v1/webapi";

import "agni/v1/doc/doc.proto";
import "agni/v1/param/param.proto";

// This file: DatasheetService, the read side of the extraction workbench (the /datasheets
// page, WS13-006). A datasheet PDF is listed by the shared WorkspaceService (filtered to PDFs
// on the client) and rendered in the browser; this service returns the pre-derived doc-IR
// (pages, tables, figures, text, each with a bbox) that the workbench overlays as selectable
// regions. There is no Go PDF->doc-IR producer: doc-IR is produced offline (tools/pdf2doc) and
// loaded here via doc.Load. A datasheet with no derived doc-IR yet returns extracted=false with
// no document, which the UI shows as "not yet extracted" rather than an error — silence never
// reads as coverage (the WS13 extraction posture).

// DatasheetService serves a datasheet's doc-IR to the extraction workbench. It is the analogue
// of DesignService for documents: DesignService turns a schematic file into drawable geometry,
// DatasheetService turns a datasheet into its decomposed region model. Directory listing is the
// shared WorkspaceService (mounts are the security boundary); this service only resolves and
// returns doc-IR for a named datasheet.
service DatasheetService {
  // GetDocument returns the doc-IR for the datasheet at (mount, path). path names the source
  // document (the PDF the browser renders); the server resolves the datasheet's sibling doc-IR.
  // When none has been derived yet, extracted is false and document is unset — a normal state,
  // not an error.
  rpc GetDocument(GetDocumentRequest) returns (GetDocumentResponse);

  // GetPartSpec returns the datasheet's saved PartSpec (the <stem>.partspec.json sibling, the
  // shared, param.LoadSet-ready extraction) plus a version token for optimistic concurrency.
  // found is false (and version empty) when nothing has been saved yet. One PartSpec is shared
  // per datasheet across users; the workbench's per-user UI state (drawn regions, type tags) is
  // NOT here — it lives in each client's localStorage so users do not clobber each other's view.
  rpc GetPartSpec(GetPartSpecRequest) returns (GetPartSpecResponse);

  // SavePartSpec writes the PartSpec sibling with optimistic concurrency: base_version must equal
  // the current on-disk version (empty base_version asserts "expected absent", a first write), or
  // the save is rejected as a conflict (Connect Aborted) and the client refetches. The read,
  // compare, and write are atomic per path within the serve process. Returns the new version.
  rpc SavePartSpec(SavePartSpecRequest) returns (SavePartSpecResponse);

  // ExtractDocIR runs the configured doc-IR producer (pdf2doc/docling) over the datasheet, writes
  // the <stem>.doc.textproto sibling, and returns the produced doc-IR so the workbench can show the
  // auto-detected regions immediately (the "first pass" the human then reviews). It is gated: a
  // server started without --pdf2doc rejects it as FailedPrecondition (GetDocumentResponse.
  // extract_available reports whether it is offered). Docling is external and CI-excluded; the
  // engine invokes a configured command, never bundles it, and it runs in-boundary (C16).
  rpc ExtractDocIR(ExtractDocIRRequest) returns (ExtractDocIRResponse);

  // GetAnnotations returns the region-annotation overlay for a datasheet as the UNION of every
  // author's overlay (WS13-011): a per-author working layer of drawn boxes, routing-type tags, and
  // draft parameter assertions the human made against the doc-IR regions. Unlike the single shared
  // PartSpec, annotations are per author (a coordination namespace, NOT a security boundary — mounts
  // are the boundary), so two people annotating one datasheet compose instead of clobbering. They
  // are the SOURCE that WS13-012 canonicalizes into the shared PartSpec; query/check never read
  // them. Empty when nobody has annotated yet.
  rpc GetAnnotations(GetAnnotationsRequest) returns (GetAnnotationsResponse);

  // SaveAnnotations writes ONE author's complete overlay for a datasheet, replacing that author's
  // prior overlay. There is no compare-and-swap: each author owns their own file, so writes never
  // contend and a delete only ever removes the caller's own annotations. author is supplied by the
  // client (self-asserted); it namespaces the overlay, it does not authenticate.
  rpc SaveAnnotations(SaveAnnotationsRequest) returns (SaveAnnotationsResponse);
}

message GetDocumentRequest {
  // uri names the datasheet document.
  string uri = 1;
}

message GetDocumentResponse {
  // extracted is true when a derived doc-IR exists for this datasheet. False means "not yet
  // extracted": document is unset and the workbench shows the PDF with an empty region overlay.
  bool extracted = 1;
  // document is the doc-IR (pages/tables/figures/text with bboxes) when extracted; unset otherwise.
  agni.v1.doc.Document document = 2;
  // extract_available is true when the server was started with a doc-IR producer configured
  // (--pdf2doc), so the workbench can offer an "Extract (first pass)" action on an un-extracted
  // datasheet. False means the operator did not enable extraction on this deployment.
  bool extract_available = 3;
}

message ExtractDocIRRequest {
  // uri names the datasheet PDF to extract.
  string uri = 1;
}

message ExtractDocIRResponse {
  // document is the doc-IR the producer just wrote (pages/tables/figures/text with bboxes).
  agni.v1.doc.Document document = 1;
}

message GetPartSpecRequest {
  // uri names the stored PartSpec.
  string uri = 1;
}

message GetPartSpecResponse {
  // found is true when a PartSpec has been saved for this datasheet.
  bool found = 1;
  // spec is the saved PartSpec; unset when found is false.
  agni.v1.param.PartSpec spec = 2;
  // version is an opaque token (the sibling's content hash) the client passes back as
  // base_version on the next save. Empty when found is false.
  string version = 3;
}

message SavePartSpecRequest {
  agni.v1.param.PartSpec spec = 1;
  // base_version is the version GetPartSpec returned (or "" to assert the sibling does not exist
  // yet). A mismatch with the current on-disk version fails the save as a conflict.
  string base_version = 2;
  // uri names the PartSpec to write.
  string uri = 3;
}

message SavePartSpecResponse {
  // version is the new version after this write; the client keeps it for its next save.
  string version = 1;
}

// RegionAnnotation is one human judgement about one region of a datasheet: its routing type, its
// geometry (only for a user-drawn region — a doc-IR region already has geometry server-side), and
// the draft parameter assertions transcribed from it. The document it belongs to is the enclosing
// AnnotationSet's doc_id, so (doc_id, region_id) is the annotation's key.
message RegionAnnotation {
  // region_id is a doc-IR region id ("p4.t1") or a user-drawn region's id, unique within the doc.
  string region_id = 1;
  // type is the user's routing tag: table/schematic/chart/pinout/text/other (the RegionType
  // vocabulary). Distinct from doc-IR kind, which cannot tell a chart from a schematic.
  string type = 2;
  // bbox is the region's page-local geometry (points, top-left origin), present ONLY for a
  // user-drawn region; a doc-IR region's geometry lives in the doc-IR and is not duplicated here.
  optional agni.v1.doc.BBox bbox = 3;
  // page is the 1-based page the region is on (needed to place a user-drawn box on re-open).
  int32 page = 4;
  // kind is the doc-IR-style kind (table/figure/text) or "user" for a marquee-drawn region.
  string kind = 5;
  string label = 6;
  // draft_params are the human's draft parameter assertions for this region, the SOURCE WS13-012
  // canonicalizes into the shared PartSpec. Empty until WS13-012 moves param authoring here; the
  // field exists now so that is a pure-logic change, not a proto change.
  repeated agni.v1.param.Parameter draft_params = 7;
  // confidence is the author's draft confidence in (0, 1]; 0 means unset (WS13-012 assigns it).
  double confidence = 8;
}

// AnnotationSet is ONE author's overlay for ONE datasheet: their drawn/tagged regions. doc_id is
// the datasheet's stable SourceDoc id (WS13-010), so the overlay survives re-extraction; author is
// the self-asserted coordination namespace. GetAnnotations returns one set per author (the union).
message AnnotationSet {
  string doc_id = 1;
  string author = 2;
  repeated RegionAnnotation annotations = 3;
}

message GetAnnotationsRequest {
  // uri names the document the annotations belong to.
  string uri = 1;
}

message GetAnnotationsResponse {
  // sets is the union of every author's overlay for this datasheet, one AnnotationSet per author.
  // Empty when nobody has annotated yet (a normal first-open state, not an error).
  repeated AnnotationSet sets = 1;
}

message SaveAnnotationsRequest {
  // set is one author's complete overlay; it REPLACES that author's prior overlay for this
  // datasheet. set.author names the file written; set.doc_id is carried through unchanged.
  AnnotationSet set = 1;
  // uri names the document the annotations belong to.
  string uri = 2;
}

message SaveAnnotationsResponse {}
