syntax = "proto3";

package agni.v1.webapi;

option go_package = "github.com/panyam/agni/gen/go/agni/v1/webapi";

import "agni/v1/geom/geom.proto";
import "agni/v1/geom/geom_packed.proto";

// This file: DesignService, loading and rendering one design. Rule checks are the separate
// CheckService (checks.proto); the structural diff is DiffService (diff.proto).

// DesignService loads a design file into something the viewer can draw. It reuses the
// engine's readers, auto-layout, and packer; the web tier only chooses which per file and
// serves the result. A design that carries schematic geometry (EDIF .eds) renders faithfully;
// any other supported format is drawn as an auto-layout of its netlist graph.
service DesignService {
  // GetDesign loads a file and returns its summary plus the list of drawable sheets (the
  // sheet navigator's source). It resolves the render mode per file (faithful for geometry,
  // else an auto-layout).
  rpc GetDesign(GetDesignRequest) returns (GetDesignResponse);

  // GetSheet returns one rendered sheet. The `format` selects the renderer: PACKED (the
  // tier-2 geometry for the WebGL viewer, C8), SVG (the render.SheetSVG verification
  // backend), or NATIVE (the format's own tool, a golden reference; not yet implemented).
  // `sheet` selects by id, name, or 0-based index (as the CLI does).
  rpc GetSheet(GetSheetRequest) returns (GetSheetResponse);

  // HighlightSheet resolves highlight specs ("these components, nets, and pins, in this
  // color/alpha") against one rendered sheet and returns a drawable overlay layer, decoupled
  // from the base render: PACKED yields primitive-index groups that join the GetSheet
  // PackedSheet by index (the WebGL viewer redraws just those primitives), SVG yields a
  // transparent overlay document with the same viewBox as the GetSheet SVG (the client
  // stacks or composites it above the sheet). NATIVE has no overlay and is rejected. The
  // request's sheet/layout/symbols must match the GetSheet call that produced the base
  // render, so the two layers describe the same geometry.
  rpc HighlightSheet(HighlightSheetRequest) returns (HighlightSheetResponse);

  // GetLayoutReport explains how an auto-layout maps each component to a drawn node (device class,
  // and whether it drew a glyph, the generic box, the design's own symbol, or an unresolved
  // fallback). It uses the same symbol source as the render, so it describes what the viewer
  // shows and points at --symbol-path when provided symbols do not resolve.
  rpc GetLayoutReport(GetLayoutReportRequest) returns (GetLayoutReportResponse);

  // TraceDesign walks from one pin to another through the series parts between them and returns the
  // route: each part crossed with its own pin on both sides, each net passed through, and what else
  // sits on those nets. It is the same answer `agni trace` prints, so a route read in a terminal and
  // a route drawn on the canvas cannot disagree.
  //
  // Verb-shaped (C23): a route does not exist after the call, so it is derived rather than a
  // resource. The three outcomes stay apart on the wire for the reason they stay apart everywhere
  // else — an endpoint naming nothing the design has is a failed QUESTION, and a client that
  // rendered it as "not connected" would send its reader to look at the board instead of at what
  // they typed.
  rpc TraceDesign(TraceDesignRequest) returns (TraceDesignResponse);
}

// SheetFormat selects which renderer draws a sheet. It is an axis distinct from
// GetSheetRequest.layout (faithful vs auto-layout geometry): layout chooses the geometry,
// format chooses how it is rendered.
enum SheetFormat {
  SHEET_FORMAT_UNSPECIFIED = 0; // treated as PACKED
  SHEET_FORMAT_PACKED = 1;      // tier-2 PackedSheet for the WebGL viewer
  SHEET_FORMAT_SVG = 2;         // render.SheetSVG (our reference render)
  SHEET_FORMAT_NATIVE = 3;      // the format's native tool (golden); not yet implemented
}

// SymbolSource selects what an auto-layout draws at each component node: predefined synthetic
// glyphs, or the design's own provided symbols re-laid-out (partial-faithful, WS7-031).
enum SymbolSource {
  SYMBOL_SOURCE_UNSPECIFIED = 0; // treated as GLYPH
  SYMBOL_SOURCE_GLYPH = 1;       // classified synthetic glyphs
  SYMBOL_SOURCE_FAITHFUL = 2;    // the design's own symbols (needs provided geometry)
}

// SheetRef identifies a drawable sheet within a design.
message SheetRef {
  string id = 1;
  string name = 2;
  // parent_id is the id of this sheet's parent sheet, or empty for a top-level sheet. It lets
  // the UI show a sheet hierarchy (KiCad hierarchical schematics); flat formats (EDIF pages,
  // single-sheet designs) leave it empty. Populated by hierarchy-aware readers (a later step).
  string parent_id = 3;
}

message GetDesignRequest {
  // layout overrides the auto-layout strategy for netlist formats (e.g. "grid", "layered");
  // empty uses the default. Ignored for geometry-bearing files, which render faithfully.
  string layout = 1;
  // uri names the design to load, "mount://<mount>/<path>".
  string uri = 2;
  // as_named reads exactly the artifact this uri names, even when the enclosing design declares it a
  // companion view of a different entry. Without it, a ref belonging to a declared design resolves
  // to the artifact each TIER should read: analysis from the entry, sheets from a schematic
  // companion, copper from a board one.
  //
  // It exists because the CLI is a client of this service and carries the same flag. Resolution
  // happens here, once, so a caller that wants the file itself has to be able to say so; without
  // this field the service would silently override the CLI's own opt-out (agni issue 656).
  //
  // Reading a companion AS a netlist is a legitimate diagnostic rather than only a mistake: it is
  // how two views of one design are checked against each other.
  bool as_named = 3;
}

message GetDesignResponse {
  // name is the design name (from the IR, or the geometry's design ref for .eds).
  string name = 1;
  // source_format is the origin format tag from the IR; empty for a geometry-only file.
  string source_format = 2;
  // component_count / net_count come from the netlist IR; 0 for a geometry-only file.
  int32 component_count = 3;
  int32 net_count = 4;
  // undrawn are the placements this design's drawing cannot draw, because no symbol resolved for them
  // (agni issue 354). Empty is the normal case.
  //
  // It is on the DESIGN response rather than per sheet because it is a property of the read: a symbol
  // library either resolved or did not, and a reader needs to know before deciding whether the
  // drawing in front of them is worth trusting. It describes the layout this response resolved, so a
  // client changing layout re-reads it with the rest of the design.
  repeated agni.v1.geom.UndrawnPlacement undrawn = 9;
  // layout is the render mode actually used: "faithful" or the auto-layout name.
  string layout = 5;
  // sheets are the drawable pages, in document order.
  repeated SheetRef sheets = 6;
  // native_available is true when this file's format has a native renderer that is enabled
  // and installed, so the UI can offer the NATIVE format. False otherwise.
  bool native_available = 7;
  // available_layouts are the layouts this file can render (the geometry axis, distinct from
  // the render format): "faithful" for geometry-bearing files, plus auto-layout strategy names
  // (grid, layered, ...) for files with a netlist IR. The UI offers these; `layout` above is
  // the one used for this response.
  repeated string available_layouts = 8;
  // content_hash is "sha256:<hex>" over the design's entry file, the same revision identity
  // agni.v1.checks.DesignRef.content_hash carries and computed by the same loader call, so a link
  // minted by the CLI can be compared against what this server just read (agni issue 392).
  //
  // It is on the DESIGN response for the same reason `undrawn` is: it is a property of THIS read.
  // The viewer needs it before it draws a proof a link asked for, which is before any check has run,
  // so hanging it off the check response would arrive one step too late to prevent the highlight the
  // reader should not trust.
  //
  // Empty when this server could not hash the file, which a consumer MUST NOT read as a match. It is
  // the third state: an unverifiable link is not a verified one, and collapsing the two reproduces
  // exactly the false confidence the hash exists to remove.
  string content_hash = 10;
}

message GetSheetRequest {
  // sheet selects by id, name, or 0-based index; empty selects the first sheet.
  string sheet = 1;
  string layout = 2;
  // format selects the renderer; unset means PACKED.
  SheetFormat format = 3;
  // symbols selects the node artwork for an auto-layout; unset means GLYPH. Ignored by the
  // faithful layout (always the design's own symbols).
  SymbolSource symbols = 4;
  // uri names the design the sheet belongs to.
  string uri = 5;
  // as_named reads exactly the artifact this uri names, even when the enclosing design declares it a
  // companion view of a different entry. Without it, a ref belonging to a declared design resolves
  // to the artifact each TIER should read: analysis from the entry, sheets from a schematic
  // companion, copper from a board one.
  //
  // It exists because the CLI is a client of this service and carries the same flag. Resolution
  // happens here, once, so a caller that wants the file itself has to be able to say so; without
  // this field the service would silently override the CLI's own opt-out (agni issue 656).
  //
  // Reading a companion AS a netlist is a legitimate diagnostic rather than only a mistake: it is
  // how two views of one design are checked against each other.
  bool as_named = 6;
}

message GetSheetResponse {
  // content carries exactly one rendering, matching the requested format: packed geometry
  // for PACKED, an SVG document for SVG/NATIVE.
  oneof content {
    agni.v1.geom.PackedSheet packed = 1; // tier-2 contract (C8), for the WebGL viewer
    string svg = 2;                        // standalone SVG document
  }
}

message HighlightSheetRequest {
  // sheet/layout/symbols select the same geometry as the GetSheet call being overlaid.
  string sheet = 1;
  string layout = 2;
  SymbolSource symbols = 3;
  // format selects the overlay projection: PACKED or SVG (NATIVE is InvalidArgument).
  // Unset means PACKED, matching GetSheet.
  SheetFormat format = 4;
  // specs are the highlight layers to resolve, in paint order (a later spec wins overlaps).
  repeated agni.v1.geom.HighlightSpec specs = 5;
  // uri names the design the sheet belongs to.
  string uri = 6;
  // as_named matches GetSheetRequest's, and must, or a highlight would be drawn against a different
  // artifact than the sheet it lands on: the two calls resolve one design and have to resolve it the
  // same way.
  bool as_named = 7;
}

message HighlightSheetResponse {
  // content matches the requested format: index groups for PACKED, a transparent standalone
  // SVG overlay document for SVG.
  oneof content {
    agni.v1.geom.PackedHighlight packed = 1;
    string svg = 2;
  }
}

message GetLayoutReportRequest {
  // symbols selects the node artwork the report explains; unset means GLYPH.
  SymbolSource symbols = 1;
  // uri names the design to report on.
  string uri = 2;
  // as_named reads exactly the artifact this uri names, even when the enclosing design declares it a
  // companion view of a different entry. Without it, a ref belonging to a declared design resolves
  // to the artifact each TIER should read: analysis from the entry, sheets from a schematic
  // companion, copper from a board one.
  //
  // It exists because the CLI is a client of this service and carries the same flag. Resolution
  // happens here, once, so a caller that wants the file itself has to be able to say so; without
  // this field the service would silently override the CLI's own opt-out (agni issue 656).
  //
  // Reading a companion AS a netlist is a legitimate diagnostic rather than only a mistake: it is
  // how two views of one design are checked against each other.
  bool as_named = 3;
}

message GetLayoutReportResponse {
  ConversionReport report = 1;
}

// TraceOutcome is what a trace answered.
//
// An enum rather than the string the Go side started with, so a client meets an unrecognised value
// at decode rather than in a string comparison that quietly falls through to "not connected".
enum TraceOutcome {
  TRACE_OUTCOME_UNSPECIFIED = 0;
  TRACE_OUTCOME_ROUTED = 1;      // a route was found within the radius
  TRACE_OUTCOME_NO_ROUTE = 2;    // both endpoints resolved and no route joins them
  TRACE_OUTCOME_UNRESOLVED = 3;  // an endpoint names nothing the design has; nothing was walked
}

message TraceDesignRequest {
  // uri names the design to trace over, "mount://<mount>/<path>".
  string uri = 1;
  // from / to are the endpoint pins, as ref-des and pin designator.
  TraceEndpoint from = 2;
  TraceEndpoint to = 3;
  // hops bounds the search in series crossings; 0 takes the server's default. Unlike the protection
  // radii this is a SEARCH BUDGET rather than an electrical claim, which is why the response repeats
  // the value it rests on: nothing about a route degrades with distance, so a no-route can be
  // re-asked wider and the reader has to be able to see what was asked the first time.
  int32 hops = 4;
  // as_named reads exactly the artifact this uri names, as it does on every other design request.
  // A trace resolves tiers too: the walk is over the netlist and the sheets come from the geometry
  // companion, which for a netlist entry is a different artifact.
  bool as_named = 5;
}

// TraceEndpoint names one pin of one component.
message TraceEndpoint {
  string ref_des = 1;
  string pin = 2;
}

message TraceDesignResponse {
  Trace trace = 1;
}

// Trace is one pin-to-pin question and its whole answer.
message Trace {
  TraceEnd from = 1;
  TraceEnd to = 2;
  TraceOutcome outcome = 3;
  // reason says why, for NO_ROUTE and UNRESOLVED; empty for a route.
  string reason = 4;
  // radius is the number of series crossings the walk searched to.
  int32 radius = 5;
  repeated TraceCross crossings = 6;
  repeated TraceNet nets = 7;
}

// TraceEnd is one resolved endpoint of a trace.
message TraceEnd {
  TraceEndpoint endpoint = 1;
  // pin_name is the functional name the part type declares for this pin ("SDA", "PTC11"), or empty
  // on a source carrying no part-type pin data. It is what a datasheet and a firmware header call
  // the pin, so it is what makes the endpoint recognisable to the person reading.
  string pin_name = 2;
  // net is the net the pin sits on, empty when the endpoint did not resolve.
  string net = 3;
  // sheet_ids names the sheets this endpoint's net is drawn on, empty when it is drawn on none.
  //
  // Filled on EVERY outcome, including no-route. The two nets that fail to join are drawn somewhere,
  // and that picture is what a reader goes looking for the moment they read "no route", so a field
  // populated only on success would answer with silence exactly where the question is sharpest. Empty
  // then honestly means not drawn, rather than nobody looked.
  repeated string sheet_ids = 4;
}

// TraceCross is one series element crossed on the route, with its own pins on each side.
message TraceCross {
  string ref_des = 1;
  string class = 2;
  string enter_pin = 3;
  string exit_pin = 4;
  string from_net = 5;
  string to_net = 6;
}

// TraceNet is one net on the route, with what else sits on it.
message TraceNet {
  string name = 1;
  repeated TraceStub stubs = 2;
  // stubs_elided is how many further parts sit on this net beyond the ones listed, so a capped list
  // reads as capped rather than as complete.
  int32 stubs_elided = 3;
  // bus_like marks a net the walk would refuse to continue THROUGH: a rail, a ground, or any
  // rail-scale fan-out. A route may END on one, so saying which net it was is what stops a reader
  // assuming the trace stopped early for some other reason.
  bool bus_like = 4;
  // sheet_ids names the sheets this net is drawn on, empty when it is drawn on none.
  //
  // PER NET rather than one sheet for the whole trace, because a route crossing three sheets is
  // exactly when a reader wants to choose. It is the same shape a Finding's `sheets` and a query
  // cell's `cell_sheets` already carry, so the panel renders the same SheetBadges and a click
  // navigates the same way.
  repeated string sheet_ids = 5;
}

// TraceStub is a part sitting on a net of the route that the route does not pass through. Test
// points especially: a probe point on a path net is the most actionable thing on the line, and
// reducing the answer to its series elements removes exactly the parts a person reads a trace to find.
message TraceStub {
  string ref_des = 1;
  string pin = 2;
  string class = 3;
}

// ConversionReport is how an auto-layout mapped each component to a drawn node.
message ConversionReport {
  repeated ComponentReport components = 1;
}

// ComponentReport is one component's mapping in the conversion report.
message ComponentReport {
  string ref_des = 1;
  string symbol = 2;       // source part/symbol name, empty if none
  string device_class = 3; // device class (empty for the box or a provided symbol)
  string cell = 4;         // drawn symbol cell_ref
  string kind = 5;         // provided | glyph | box | unresolved
}
