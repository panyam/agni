syntax = "proto3";

package agni.v1.webapi;

option go_package = "github.com/panyam/agni/gen/go/agni/v1/webapi";

import "agni/v1/checks/checks.proto";
import "agni/v1/geom/geom.proto";
import "agni/v1/geom/geom_packed.proto";
import "agni/v1/ir/ir.proto";
import "google/protobuf/field_mask.proto";

// This file defines DesignService, which loads and renders one design. Rule checks are in the
// separate CheckService (checks.proto), and the structural diff is in DiffService (diff.proto).

// DesignService loads a design file into something the viewer can draw. It reuses the
// engine's readers, auto-layout, and packer. The web tier only chooses which to use per file,
// and serves the result. A design with schematic geometry (EDIF .eds) renders faithfully. Any
// other supported format is drawn as an auto-layout of its netlist graph.
service DesignService {
  // GetDesign loads a file and returns its summary plus the list of drawable sheets. The sheet
  // navigator reads that list. It resolves the render mode per file, faithful for geometry and
  // an auto-layout otherwise.
  rpc GetDesign(GetDesignRequest) returns (GetDesignResponse);

  // GetSheet returns one rendered sheet. The `format` selects the renderer. PACKED is the
  // tier-2 geometry for the WebGL viewer (C8). SVG is the render.SheetSVG verification
  // backend. NATIVE is the format's own tool as a golden reference, and is not yet
  // implemented. `sheet` selects by id, name, or 0-based index, as the CLI does.
  rpc GetSheet(GetSheetRequest) returns (GetSheetResponse);

  // HighlightSheet resolves highlight specs against one rendered sheet. A spec says "these
  // components, nets, and pins, in this color/alpha". It returns a drawable overlay layer,
  // separate from the base render. PACKED yields primitive-index groups. They join the GetSheet
  // PackedSheet by index, and the WebGL viewer redraws just those primitives. SVG yields a
  // transparent overlay document with the same viewBox as the GetSheet SVG. The client stacks
  // or composites it above the sheet. NATIVE has no overlay and is rejected. The request's
  // sheet/layout/symbols must match the GetSheet call that produced the base render. Then the
  // two layers describe the same geometry.
  rpc HighlightSheet(HighlightSheetRequest) returns (HighlightSheetResponse);

  // GetLayoutReport explains how an auto-layout maps each component to a drawn node. It gives the
  // device class, and says whether the node is a glyph, the generic box, the design's own symbol,
  // or an unresolved fallback. It uses the same symbol source as the render, so it describes what
  // the viewer shows. It points at --symbol-path when provided symbols do not resolve.
  rpc GetLayoutReport(GetLayoutReportRequest) returns (GetLayoutReportResponse);

  // LocateSubjects says which sheets draw each named part, pin, net or bus (agni issue 1325). A
  // viewer opens one of them for a selection that came from another pane, a finding or a link. It
  // answers from the snapshot's schematic, and from its board only when the request asks, since
  // reading a large board costs seconds (agni issue 943).
  rpc LocateSubjects(LocateSubjectsRequest) returns (LocateSubjectsResponse);

  // TraceDesign walks from one pin to another through the series parts between them, and returns
  // the route. The route lists each part crossed with its own pin on both sides, each net passed
  // through, and the other parts on those nets. `agni trace` prints the same answer. So a route read
  // in a terminal and a route drawn on the canvas cannot disagree.
  //
  // It is verb-shaped (C23). A route does not exist after the call, so it is derived rather than a
  // resource. The wire keeps the three outcomes apart, as every other surface does. Imagine an
  // endpoint that names nothing the design has. That is a failed QUESTION. A client that rendered
  // it as "not connected" would send its reader to look at the board, when the mistake is in what
  // they typed.
  rpc TraceDesign(TraceDesignRequest) returns (TraceDesignResponse);

  // WalkDesign walks outwards from one part or pin, hop by hop, and answers the nets it reached, the
  // part it crossed into each, and the parts it left at the boundary with the reason (agni issue
  // 1339). Hop 1 is the start's own nets. A ground or a global net is reached and never walked
  // through, and so is a rail except on the series walk, which passes through one as trace does.
  // The answer says which branches ended there. The walk kind decides which parts are crossed. `agni walk` prints the same answer.
  //
  // Like TraceDesign it is verb-shaped (C23), and a start that names nothing the design has is an
  // answer with `reason` set rather than an empty walk.
  rpc WalkDesign(WalkDesignRequest) returns (WalkDesignResponse);

  // ListWalkKinds lists the walk kinds WalkDesign takes, in the order a viewer offers them. It reads
  // no design, so it names no snapshot.
  rpc ListWalkKinds(ListWalkKindsRequest) returns (ListWalkKindsResponse);
}

// SheetFormat selects which renderer draws a sheet. It is a separate axis from
// GetSheetRequest.layout, which picks faithful or auto-layout geometry. layout chooses the
// geometry, and format chooses how it is rendered.
enum SheetFormat {
  SHEET_FORMAT_UNSPECIFIED = 0; // treated as PACKED
  SHEET_FORMAT_PACKED = 1;      // tier-2 PackedSheet for the WebGL viewer
  SHEET_FORMAT_SVG = 2;         // render.SheetSVG (our reference render)
  SHEET_FORMAT_NATIVE = 3;      // the format's native tool (golden); not yet implemented
}

// SymbolSource selects what an auto-layout draws at each component node. It draws either
// predefined synthetic glyphs, or the design's own symbols laid out again (partial-faithful,
// WS7-031).
enum SymbolSource {
  SYMBOL_SOURCE_UNSPECIFIED = 0; // treated as GLYPH
  SYMBOL_SOURCE_GLYPH = 1;       // classified synthetic glyphs
  SYMBOL_SOURCE_FAITHFUL = 2;    // the design's own symbols (needs provided geometry)
}

// SheetRef identifies a drawable sheet within a design.
message SheetRef {
  string id = 1;
  string name = 2;
  // parent_id is the id of this sheet's parent sheet, or empty for a top-level sheet. The UI uses
  // it to show a sheet hierarchy, as in KiCad hierarchical schematics. Flat formats, such as EDIF
  // pages and single-sheet designs, leave it empty. Hierarchy-aware readers fill it (a later step).
  string parent_id = 3;
}

message GetDesignRequest {
  // snapshot names the design to describe, "snapshots/{snapshot}" (agni issue 1061).
  string snapshot = 7;
  // layout overrides the auto-layout strategy for netlist formats (e.g. "grid", "layered").
  // Empty uses the default. Ignored for geometry-bearing files, which render faithfully.
  string layout = 1;
  // read_mask selects which fields the response fills (agni issue 836). When unset, the response is
  // the usual summary, with no IR. The viewer asks on every open, and a large board's IR is
  // megabytes. When set, the response keeps exactly the named paths of GetDesignResponse. `design`
  // selects the whole IR. `design.nets` or `design.components.mpn` select parts of it. `sheets`
  // selects a summary field, and `*` selects everything. A path through a repeated or map field
  // applies to every element. When every path is under `design`, the server reads the netlist alone
  // and skips the drawing. An unknown path is an invalid argument.
  google.protobuf.FieldMask read_mask = 4;
  // nets and ref_des narrow WHICH entities `design` holds, by exact name. design.nets then holds
  // only these nets, and design.components only these components. Each narrows its own list, and
  // neither filters the other. A name missing from the design is simply absent. They apply only
  // when the mask selects `design`.
  repeated string nets = 5;
  repeated string ref_des = 6;
  reserved 2, 3;
  reserved "uri", "as_named";
}

message GetDesignResponse {
  // name is the design name (from the IR, or the geometry's design ref for .eds).
  string name = 1;
  // source_format is the origin format tag from the IR; empty for a geometry-only file.
  string source_format = 2;
  // component_count / net_count come from the netlist IR; 0 for a geometry-only file.
  int32 component_count = 3;
  int32 net_count = 4;
  // undrawn are the placements this design's drawing cannot draw, because no symbol resolved for them
  // (agni issue 354). Empty is the normal case.
  //
  // It is on the DESIGN response rather than per sheet, because it is a property of the read. A
  // symbol library either resolved or did not. A reader needs to know that before deciding whether
  // to trust the drawing in front of them. It describes the layout this response resolved. So a
  // client changing layout reads it again with the rest of the design.
  repeated agni.v1.geom.UndrawnPlacement undrawn = 9;
  // layout is the render mode actually used: "faithful" or the auto-layout name.
  string layout = 5;
  // sheets are the drawable pages, in document order.
  repeated SheetRef sheets = 6;
  // native_available is true when this file's format has a native renderer that is enabled
  // and installed, so the UI can offer the NATIVE format. False otherwise.
  bool native_available = 7;
  // available_layouts are the layouts this file can render. This is the geometry axis, separate
  // from the render format. A geometry-bearing file offers "faithful". A file with a netlist IR
  // also offers the auto-layout strategy names (grid, layered, ...). The UI offers these, and
  // `layout` above names the one this response used.
  repeated string available_layouts = 8;
  // content_hash is "sha256:<hex>" over the design's entry file (agni issue 392). It is the same
  // revision identity as agni.v1.checks.DesignRef.content_hash, and the same loader call computes
  // it. So a link the CLI minted can be compared against what this server just read.
  //
  // It is on the DESIGN response for the same reason as `undrawn`, since it is a property of THIS
  // read. A link may ask the viewer to draw a proof. The viewer needs the hash before it draws
  // that, and that is before any check has run. On the check response, the hash would arrive one
  // step too late to stop a highlight the reader should not trust.
  //
  // Empty when this server could not hash the file. A consumer MUST NOT read empty as a match.
  // Empty is a third state. An unverifiable link is not a verified one. Treating the two alike
  // brings back the false confidence the hash exists to remove.
  string content_hash = 10;
  // unexpanded_hierarchy lists the hierarchical blocks whose contents the netlist read left out
  // (agni issue 707). It copies the reader's InputDiagnostics field as is. When it is non-empty,
  // component_count and net_count cover the top level alone. A viewer should say so before anyone
  // trusts the counts.
  //
  // It is on the DESIGN response for the same reason as `undrawn`, since it is a property of this
  // read. It is empty whenever the counts are, since both come from the same netlist read.
  repeated agni.v1.ir.UnexpandedHierarchy unexpanded_hierarchy = 11;
  // design is the design's IR as every analysis reads it (agni issue 836). It reflects the project's
  // configuration, the declared tiers, and the format-neutral ingestion passes such as part-number
  // promotion. It is present only when the request's read_mask selects it. A client prototyping an
  // analysis reads this instead of parsing the netlist again.
  agni.v1.ir.Design design = 12;
  // hierarchy_note is a sentence stating what unexpanded_hierarchy means for this read (agni issue
  // 717). It is "" when the read left nothing out. report.HierarchyNote builds it, and the CLI's
  // stderr note and both HTML reports use the same wording. The server sends it whole, so the
  // viewer's strip renders it and does not compose a second copy.
  string hierarchy_note = 13;
  // drawing_note is a sentence saying why the sheets are a computed layout, and which file would
  // draw them as the designer did. It is "" when the geometry tier carries its own drawing. The
  // server writes it from the format registry (formats.Format.DrawnBy), so the viewer shows it as
  // sent and keeps no list of formats.
  string drawing_note = 14;
}

message GetSheetRequest {
  // snapshot names the design whose sheet to draw, "snapshots/{snapshot}" (agni issue 1061).
  string snapshot = 7;
  // sheet selects by id, name, or 0-based index; empty selects the first sheet.
  string sheet = 1;
  string layout = 2;
  // format selects the renderer; unset means PACKED.
  SheetFormat format = 3;
  // symbols selects the node artwork for an auto-layout, and unset means GLYPH. The faithful
  // layout ignores it, since it always draws the design's own symbols.
  SymbolSource symbols = 4;
  reserved 5, 6;
  reserved "uri", "as_named";
}

message GetSheetResponse {
  // content holds exactly one rendering, matching the requested format. PACKED gets packed
  // geometry, and SVG or NATIVE gets an SVG document.
  oneof content {
    agni.v1.geom.PackedSheet packed = 1; // tier-2 contract (C8), for the WebGL viewer
    string svg = 2;                        // standalone SVG document
  }
  // board_layers lists the board sheet's layers, for either format (agni 1351). It is empty for a
  // schematic sheet.
  repeated agni.v1.geom.BoardLayerRow board_layers = 3;
}

message HighlightSheetRequest {
  // snapshot names the design whose sheet to highlight, "snapshots/{snapshot}" (agni issue 1061).
  string snapshot = 8;
  // sheet/layout/symbols select the same geometry as the GetSheet call being overlaid.
  string sheet = 1;
  string layout = 2;
  SymbolSource symbols = 3;
  // format selects the overlay projection: PACKED or SVG (NATIVE is InvalidArgument).
  // Unset means PACKED, matching GetSheet.
  SheetFormat format = 4;
  // specs are the highlight layers to resolve, in paint order (a later spec wins overlaps).
  repeated agni.v1.geom.HighlightSpec specs = 5;
  reserved 6, 7;
  reserved "uri", "as_named";
}

message HighlightSheetResponse {
  // content matches the requested format: index groups for PACKED, a transparent standalone
  // SVG overlay document for SVG.
  oneof content {
    agni.v1.geom.PackedHighlight packed = 1;
    string svg = 2;
  }
}

message GetLayoutReportRequest {
  // snapshot names the design whose auto-layout to report on, "snapshots/{snapshot}" (agni issue 1061).
  string snapshot = 4;
  // symbols selects the node artwork the report explains; unset means GLYPH.
  SymbolSource symbols = 1;
  reserved 2, 3;
  reserved "uri", "as_named";
}

message GetLayoutReportResponse {
  ConversionReport report = 1;
}

// TraceOutcome is what a trace answered.
//
// The Go side started with a string, and this is an enum instead. So a client meets an unrecognised
// value at decode. With a string, a comparison could quietly fall through to "not connected".
enum TraceOutcome {
  TRACE_OUTCOME_UNSPECIFIED = 0;
  TRACE_OUTCOME_ROUTED = 1;      // a route was found within the radius
  TRACE_OUTCOME_NO_ROUTE = 2;    // both endpoints resolved and no route joins them
  TRACE_OUTCOME_UNRESOLVED = 3;  // an endpoint names nothing the design has; nothing was walked
}

message TraceDesignRequest {
  // snapshot names the design to trace through, "snapshots/{snapshot}" (agni issue 1061).
  string snapshot = 6;
  // from / to are the endpoint pins, as ref-des and pin designator.
  TraceEndpoint from = 2;
  TraceEndpoint to = 3;
  // hops bounds the search in series crossings, and 0 takes the server's default. The protection
  // radii make an electrical claim. hops does not, since it is a SEARCH BUDGET. Nothing about a
  // route degrades with distance, so a reader can ask a no-route again with a wider budget. The
  // reader has to see what was asked the first time. So the response repeats the radius it used.
  int32 hops = 4;
  reserved 1, 5;
  reserved "uri", "as_named";
}

// TraceEndpoint names one pin of one component.
message TraceEndpoint {
  string ref_des = 1;
  string pin = 2;
}

message TraceDesignResponse {
  Trace trace = 1;
}

// Trace is one pin-to-pin question and its whole answer.
message Trace {
  TraceEnd from = 1;
  TraceEnd to = 2;
  TraceOutcome outcome = 3;
  // reason says why, for NO_ROUTE and UNRESOLVED; empty for a route.
  string reason = 4;
  // radius is the number of series crossings the walk searched to.
  int32 radius = 5;
  repeated TraceCross crossings = 6;
  repeated TraceNet nets = 7;
}

// TraceEnd is one resolved endpoint of a trace.
message TraceEnd {
  TraceEndpoint endpoint = 1;
  // pin_name is the functional name the part type declares for this pin ("SDA", "PTC11"). It is
  // empty on a source with no part-type pin data. A datasheet and a firmware header call the pin by
  // this name. So the person reading recognises the endpoint by it.
  string pin_name = 2;
  // net is the net the pin sits on, empty when the endpoint did not resolve.
  string net = 3;
  // sheet_ids names the sheets this endpoint's net is drawn on, empty when it is drawn on none.
  //
  // Filled on EVERY outcome, including no-route. Imagine a reader sees "no route". The two nets that
  // fail to join are drawn somewhere, and the reader goes looking for that picture at once. A field
  // filled only on success would give them nothing at the moment they most need it. So empty means
  // not drawn, rather than nobody looked.
  repeated string sheet_ids = 4;
}

// TraceCross is one series element crossed on the route, with its own pins on each side.
message TraceCross {
  string ref_des = 1;
  string class = 2;
  string enter_pin = 3;
  string exit_pin = 4;
  string from_net = 5;
  string to_net = 6;
  // paired marks a walk's crossing from one pin of a through pair to its partner alone, such as a
  // level translator's A2 to B2 (agni issue 1338). A trace never sets it.
  bool paired = 7;
}

// TraceNet is one net on the route, with what else sits on it.
message TraceNet {
  string name = 1;
  repeated TraceStub stubs = 2;
  // stubs_elided counts the parts on this net beyond the ones listed. So a capped list reads as
  // capped, not as complete.
  int32 stubs_elided = 3;
  // bus_like marks a net that the walk refuses to continue THROUGH, such as a rail, a ground, or
  // any rail-scale fan-out. A route may END on one. This flag names that net, so a reader does not
  // assume the trace stopped early for some other reason.
  bool bus_like = 4;
  // sheet_ids names the sheets this net is drawn on, empty when it is drawn on none.
  //
  // It is PER NET rather than one sheet for the whole trace. A reader most wants to choose when a
  // route crosses three sheets. A Finding's `sheets` and a query AnswerEntity's `sheet_ids` have
  // the same shape. So the panel renders the same SheetBadges, and a click navigates the same way.
  repeated string sheet_ids = 5;
}

message WalkDesignRequest {
  // snapshot names the design to walk, "snapshots/{snapshot}".
  string snapshot = 1;
  // from is the start. A part when pin is empty, which starts from every pin of it, or one pin.
  TraceEndpoint from = 2;
  // kind names the walk, one of ListWalkKinds' names. Empty takes "series".
  string kind = 3;
  // hops is how many hops to walk, hop 1 being the start's own nets. 0 takes the default of 2.
  int32 hops = 4;
  // through names parts to cross whatever the kind's rule says, such as one IC a reader wants to
  // walk past.
  repeated string through = 5;
}

message WalkDesignResponse {
  Walk walk = 1;
}

// Walk is one walk outwards from a part or pin, and its whole answer.
message Walk {
  // from is the start as resolved. Its pin and net are empty when the walk started from a part.
  TraceEnd from = 1;
  string kind = 2;
  // radius is the number of hops walked.
  int32 radius = 3;
  // reason says why nothing was walked, when the start names nothing the design has. Empty
  // otherwise.
  string reason = 4;
  // nets are the nets reached, hop by hop, in the order the walk reached them.
  repeated WalkNet nets = 5;
  // boundary lists the parts on a reached net that the walk did not cross, each once.
  repeated WalkBoundary boundary = 6;
  // elided counts the nets a hop left out under its kind's cap.
  repeated WalkElided elided = 7;
}

// WalkNet is one net a walk reached.
message WalkNet {
  int32 hop = 1;
  // net is the net with the other parts on it, and the sheets it is drawn on.
  TraceNet net = 2;
  // entered is the part the walk crossed into this net, with its pin on each side. On a hop-1 net it
  // is the start part's own pin, and from_net and enter_pin are empty.
  TraceCross entered = 3;
  // ended says why the walk went no further from this net: "ground", "rail", "global", or a
  // fan-out. Empty when the net was walked through or lies at the radius.
  string ended = 4;
  // also_entered lists the later crossings into this net, by parts that reached it after `entered`
  // did, such as a crystal's second load capacitor into GND. A viewer lights those parts too.
  repeated TraceCross also_entered = 5;
}

// WalkBoundary is a part the walk did not cross, and why. Naming it in `through` crosses it.
message WalkBoundary {
  string ref_des = 1;
  string class = 2;
  // hop and net are where the walk met it first.
  int32 hop = 3;
  string net = 4;
  string reason = 5;
}

// WalkElided counts the nets one hop left out.
message WalkElided {
  int32 hop = 1;
  int32 nets = 2;
}

message ListWalkKindsRequest {}

message ListWalkKindsResponse {
  repeated WalkKind kinds = 1;
}

// WalkKind is one walk a viewer can offer for a part.
message WalkKind {
  string name = 1;
  string title = 2;
  // summary says which parts the walk crosses, in a sentence a reader can choose by.
  string summary = 3;
}

// TraceStub is a part on one of the route's nets, which the route does not pass through. Test points
// matter most. A probe point on a path net is the most actionable thing on the line. A person often
// reads a trace to find those parts, and an answer with series elements alone would drop them.
message TraceStub {
  string ref_des = 1;
  string pin = 2;
  string class = 3;
}

// ConversionReport is how an auto-layout mapped each component to a drawn node.
message ConversionReport {
  repeated ComponentReport components = 1;
}

// ComponentReport is one component's mapping in the conversion report.
message ComponentReport {
  string ref_des = 1;
  string symbol = 2;       // source part/symbol name, empty if none
  string device_class = 3; // device class (empty for a provided symbol or a component with no class)
  string cell = 4;         // drawn symbol cell_ref
  string kind = 5;         // provided | glyph | box | unresolved
  // label is how the report's summary groups the component. A glyph groups by its device class, and
  // anything else by its kind. The engine decides it in graph.ComponentReport.Label (agni issue
  // 1045). So the CLI's summary and the viewer's Properties group one report alike.
  string label = 6;
}

// LocateSubjectsRequest names the entities to locate in one snapshot.
message LocateSubjectsRequest {
  // snapshot names the design, "snapshots/{snapshot}" (agni issue 1061).
  string snapshot = 1;
  // subjects are the entities to locate, each as a finding names one. A part and a net join the
  // drawing by ref-des and net NAME, so an EDIF schematic and an ODB++ board, which share no net id,
  // still answer. A pin locates on the sheets that draw its unit, so U1's pin 5 answers U1B's sheet
  // and not U1A's. A net_id narrows a net to one of two that share a name, where the schematic
  // stamps ids on its wires.
  repeated agni.v1.checks.Subject subjects = 2;
  // board adds the board sheet ("board") for a part with a footprint, a pin with a pad, and a net
  // with copper or a pad. Unset, the board is not read.
  bool board = 3;
}

// LocateSubjectsResponse answers each subject in request order.
message LocateSubjectsResponse {
  repeated SubjectSheets subjects = 1;
}

// SubjectSheets is where one subject is drawn.
message SubjectSheets {
  agni.v1.checks.Subject subject = 1;
  // sheet_ids are the GetDesign sheet ids that draw the subject, schematic sheets in design order
  // and then "board". Empty means drawn nowhere, and locate_reason says why.
  repeated string sheet_ids = 2;
  // locate_reason is UNSPECIFIED when sheet_ids is not empty.
  agni.v1.checks.LocateReason locate_reason = 3;
}
