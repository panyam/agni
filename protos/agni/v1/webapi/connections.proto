syntax = "proto3";

package agni.v1.webapi;

option go_package = "github.com/panyam/agni/gen/go/agni/v1/webapi";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// This file defines ConnectionService, which keeps the sign-ins a server reads private sources
// through (agni issue 1724). A mount names a connection, and the server reads the mount's source
// with that connection's token. Several mounts can share one, such as one GitHub App installation
// over many repos. The records come from goapplib storage's connections package.
//
// A server connection never holds a secret. Its key_source and token_source name where the secret
// is, "env:NAME" or "file:/abs/path", and the server reads it from there when it needs a token. So
// no secret is written to --store or sent back over this API.
//
// A person's connection belongs to the caller who made it (agni issue 1728). It holds that
// person's own GitHub token, sealed in --store under the server's --connections-key, and nobody
// else's request can use it. A design linked from a private repo opens only for a caller whose own
// connection can read the repo.
service ConnectionService {
  // CreateConnection keeps a new connection. Each person's ids are their own (agni issue 1778), so
  // an id is ALREADY_EXISTS only when the caller already keeps one by it, or, for a person's
  // connection, when a server connection holds it. A secret field holding anything but a
  // reference, or a kind's field left empty, is INVALID_ARGUMENT. A server started without --store
  // answers FAILED_PRECONDITION. A person's connection needs a signed-in caller, and a server
  // started with --connections-key.
  rpc CreateConnection(CreateConnectionRequest) returns (Connection);

  // GetConnection returns one connection by resource name: the caller's own when they keep one by
  // that id, else the server's. Another person's connection never answers, so its id is NOT_FOUND.
  rpc GetConnection(GetConnectionRequest) returns (Connection);

  // ListConnections returns the server's connections and the caller's own, ordered by name.
  rpc ListConnections(ListConnectionsRequest) returns (ListConnectionsResponse);

  // DeleteConnection forgets a connection. One a mount still reads through is FAILED_PRECONDITION,
  // naming the mounts, until they are deleted. Deleting a person's connection deletes their sealed
  // token too. Another person's connection is NOT_FOUND.
  rpc DeleteConnection(DeleteConnectionRequest) returns (google.protobuf.Empty);
}

// Connection is one sign-in the server reads a source through, named "connections/{connection}".
message Connection {
  string name = 1; // "connections/{connection}"
  ConnectionKind kind = 2;
  // display_name is what a page shows, such as "acme org (App)". Empty shows the id.
  string display_name = 3;
  // base_url is the service's API root. Empty is https://api.github.com. GitHub Enterprise
  // names its own.
  string base_url = 4;
  // app_id and installation_id identify a GitHub App installation, for CONNECTION_KIND_GITHUB_APP.
  string app_id = 5;
  int64 installation_id = 6;
  // key_source is where a secret is, "env:NAME" or "file:/abs/path": the App's private key for
  // CONNECTION_KIND_GITHUB_APP, the secret access key for CONNECTION_KIND_AWS, the service account
  // key file for CONNECTION_KIND_GCP, and for CONNECTION_KIND_ENTRA the client secret, the
  // certificate's private key, or the workload identity token file, as entra_auth says. Empty for
  // AWS, GCP and an Entra managed identity takes the host's own credentials.
  string key_source = 7;
  // token_source is where the token is, "env:NAME" or "file:/abs/path", for
  // CONNECTION_KIND_GITHUB_TOKEN.
  string token_source = 8;
  // status is CONNECTION_STATUS_OK until a token request fails, and last_error says why, with no
  // secret in it. Output only.
  ConnectionStatus status = 9;
  string last_error = 10;
  // create_time and last_use_time are output only. last_use_time moves at most once an hour.
  google.protobuf.Timestamp create_time = 11;
  google.protobuf.Timestamp last_use_time = 12;
  // scope says whether the connection signs in as the server or as one person. Unspecified on a
  // create is CONNECTION_SCOPE_SERVER.
  ConnectionScope scope = 13;
  // owner is the subject of the person a CONNECTION_SCOPE_PERSON connection belongs to, the caller
  // who made it. It is empty for a server connection. Output only.
  string owner = 14;
  // access_key_id is an AWS access key's id, for CONNECTION_KIND_AWS. It is set exactly when
  // key_source names the secret access key. AWS doesn't treat it as a secret.
  string access_key_id = 15;
  // role_arn is a role a CONNECTION_KIND_AWS connection assumes before it signs, such as
  // "arn:aws:iam::123456789012:role/reader". Empty assumes none.
  string role_arn = 16;
  // region is a CONNECTION_KIND_AWS connection's region, such as "us-east-1".
  string region = 17;
  // tenant_id and client_id are a CONNECTION_KIND_ENTRA app registration: its Entra tenant, as a
  // GUID or a domain, and its application id. For a managed identity, client_id picks a
  // user-assigned identity and may be empty.
  string tenant_id = 18;
  string client_id = 19;
  // entra_auth says how a CONNECTION_KIND_ENTRA connection proves it is its app registration.
  EntraAuth entra_auth = 20;
  // cert_source is where an ENTRA_AUTH_CERTIFICATE connection's certificate is, "env:NAME" or
  // "file:/abs/path". Its private key is at key_source.
  string cert_source = 21;
}

// EntraAuth says how a CONNECTION_KIND_ENTRA connection signs in.
enum EntraAuth {
  ENTRA_AUTH_UNSPECIFIED = 0;
  // ENTRA_AUTH_SECRET sends the client secret at key_source.
  ENTRA_AUTH_SECRET = 1;
  // ENTRA_AUTH_CERTIFICATE signs with the private key at key_source and names the certificate at
  // cert_source.
  ENTRA_AUTH_CERTIFICATE = 2;
  // ENTRA_AUTH_MANAGED_IDENTITY asks the Azure host's managed identity for a token, so the
  // connection holds no secret.
  ENTRA_AUTH_MANAGED_IDENTITY = 3;
  // ENTRA_AUTH_WORKLOAD_IDENTITY sends the Kubernetes service account token in the file at
  // key_source, as AKS workload identity does.
  ENTRA_AUTH_WORKLOAD_IDENTITY = 4;
}

enum ConnectionScope {
  CONNECTION_SCOPE_UNSPECIFIED = 0;
  // CONNECTION_SCOPE_SERVER signs in as the server. Every caller the server lets in reads a mount
  // through it.
  CONNECTION_SCOPE_SERVER = 1;
  // CONNECTION_SCOPE_PERSON signs in as the caller who made it, and only their requests use it. It
  // decides which linked designs they may open.
  CONNECTION_SCOPE_PERSON = 2;
}

enum ConnectionKind {
  CONNECTION_KIND_UNSPECIFIED = 0;
  // CONNECTION_KIND_GITHUB_APP signs in as a GitHub App installation, scoped to the repos the
  // installation covers rather than to one person.
  CONNECTION_KIND_GITHUB_APP = 1;
  // CONNECTION_KIND_GITHUB_TOKEN sends a token, such as a fine-grained personal access token.
  CONNECTION_KIND_GITHUB_TOKEN = 2;
  // CONNECTION_KIND_GITHUB_USER signs in as one person with their own GitHub token. It is always
  // CONNECTION_SCOPE_PERSON, and the server keeps the token sealed rather than naming where it is.
  CONNECTION_KIND_GITHUB_USER = 3;
  // CONNECTION_KIND_AWS signs S3 requests: with the key pair access_key_id and key_source, or with
  // the AWS SDK's default chain, such as an instance or IRSA role. It is a server connection only
  // (agni issue 1730).
  CONNECTION_KIND_AWS = 4;
  // CONNECTION_KIND_GCP signs Cloud Storage requests with a service account key at key_source, or
  // with Application Default Credentials. It is a server connection only (agni issue 1730).
  CONNECTION_KIND_GCP = 5;
  // CONNECTION_KIND_ENTRA signs Microsoft Graph requests as an Entra app registration, for
  // SharePoint and OneDrive. It is a server connection only (agni issue 1729).
  CONNECTION_KIND_ENTRA = 6;
}

enum ConnectionStatus {
  CONNECTION_STATUS_UNSPECIFIED = 0;
  CONNECTION_STATUS_OK = 1;
  // CONNECTION_STATUS_FAILED is a token request that failed, such as a key ref naming nothing.
  CONNECTION_STATUS_FAILED = 2;
}

message CreateConnectionRequest {
  // connection_id is the new connection's id: a-z and 0-9 first, then also '-', '_' and '.'.
  string connection_id = 1;
  // connection holds the kind and its fields. Its name and output fields are ignored.
  Connection connection = 2;
  // user_token is the caller's own GitHub token, for CONNECTION_KIND_GITHUB_USER. The server seals it
  // under --connections-key and never sends it back. A token kind of person connection takes no
  // token_source, since a reference would let a caller name a secret of the server's.
  string user_token = 3;
}

message GetConnectionRequest {
  string name = 1; // "connections/{connection}"
}

message ListConnectionsRequest {}

message ListConnectionsResponse {
  repeated Connection connections = 1;
}

message DeleteConnectionRequest {
  string name = 1; // "connections/{connection}"
}
