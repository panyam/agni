syntax = "proto3";

package agni.v1.webapi;

option go_package = "github.com/panyam/agni/gen/go/agni/v1/webapi";

import "agni/v1/checks/checks.proto";
import "agni/v1/webapi/checks.proto";

// This file: QueryService, the ad-hoc datalog query surface (WS3-029) over a loaded design's fact
// base — the web front-end to the same `query` engine `agni query` runs. Search is its own concern
// distinct from the rule checks (a rule is one named query among arbitrary ones), so it is its own
// service, mirroring the WS9-026 extraction of CheckService from DesignService. v1 evaluates
// server-side (the client posts query text; the backend loads the file and runs query.Naive); the
// engine is WASM-clean, so client-side eval is a later option, not a rewrite.

// QueryService evaluates a declarative-datalog query over a design's fact relations (the WS3-004
// fact base, the same relations the rules assert over) and returns the answer rows with provenance.
// A geometry-only file with no netlist is an invalid argument; a malformed query is an invalid
// argument the caller shows inline.
service QueryService {
  // RunQuery parses and evaluates the query text over the loaded design and returns the projected
  // columns and answer rows, each row carrying the provenance of the facts that produced it. The
  // relation vocabulary is the same the CLI documents (net.max_voltage, component.mpn,
  // component.net, reaches). v1 evaluates the netlist fact base only: the `param` (datasheet)
  // relation is empty because the server wires no params dir and datasheet data is deployment-bound
  // (C16), so a query over `param` returns no rows rather than an error.
  rpc RunQuery(RunQueryRequest) returns (RunQueryResponse);

  // RunQueries answers a named list of queries over ONE read of the design (agni issue 729). An
  // audit is usually a workbook rather than a question, and asking each table through RunQuery would
  // read and project the design once per table. Every result has exactly the shape RunQuery returns
  // for that query alone. A query that fails is reported against its name and the others still
  // answer; a set that is unusable as a whole (no queries, a repeated name, a preamble holding a
  // goal) and a design that cannot be read are errors for the call.
  rpc RunQueries(RunQueriesRequest) returns (RunQueriesResponse);

  // ListRelations returns the queryable relation catalog (WS9-037): the built-in relations, the
  // derived relations the shipped library defines, the predicates, and any overlay-registered
  // relations, each with its argument labels, a one-line summary, and a kind for grouping. The
  // catalog is static per service build (it does not depend on a loaded design), so the client
  // fetches it once to populate the panel's relation picker.
  //
  // With a path set it answers one place in the namespace tree instead (agni issue 751): a module
  // and its members, or one member with its signature and, for a derived relation, its definition.
  // `agni query --relations <path>` prints the same answer.
  rpc ListRelations(ListRelationsRequest) returns (ListRelationsResponse);
}

message RunQueryRequest {
  // query is the datalog text, the same surface `agni query` accepts:
  //   component.mpn(?r,?m), component.net(?r,?n), net.max_voltage(?n,?v), ?v < 30 => ?r, ?n
  string query = 1;
  // overlay carries the per-request rule-catalog configuration (WS3-102). A query runs no rules, so
  // only its LEXICON half does anything here — and it does a great deal.
  //
  // The lexicon decides which net names are rails, grounds, and feedback nodes, and it is applied at
  // the design READ because those roles are resolved once at ingestion. So it does not merely add a
  // relation: it changes the answer of `rail`, `feedback`, `pin.type`, and everything derived from
  // them. A project whose rails are named function-first sees one rail on a four-rail board without
  // it, which is a correct answer to a question they did not ask.
  //
  // That is also why this field is on the ad-hoc query surface at all. Authoring a lexicon is a loop
  // (write a pattern, ask which nets are rails now, adjust), and query is the natural tool for that
  // loop; without this it could not participate in it.
  //
  // The convention's RULES half is accepted and ignored, deliberately rather than by oversight: a
  // project keeps one conventions file carrying both halves, and a query legitimately consumes only
  // one of them.
  OverlayConfig overlay = 2;
  // board_uri attaches a SEPARATE board-geometry export (.kicad_pcb / IPC-2581) so the board.*
  // relations (board.layer, board.track_width, board.via_drill) have facts to range over. Empty means
  // no board is attached, and those relations are then simply empty — which is indistinguishable, in
  // a result table, from a board with nothing to report. Same ref semantics as `path`.
  string board_uri = 3;
  // uri names the design to query.
  string uri = 4;
  // as_named reads exactly the artifact this uri names, even when the enclosing design declares it a
  // companion view of a different entry. Without it, a ref belonging to a declared design resolves
  // to the artifact each TIER should read: analysis from the entry, sheets from a schematic
  // companion, copper from a board one.
  //
  // It exists because the CLI is a client of this service and carries the same flag. Resolution
  // happens here, once, so a caller that wants the file itself has to be able to say so; without
  // this field the service would silently override the CLI's own opt-out (agni issue 656).
  //
  // Reading a companion AS a netlist is a legitimate diagnostic rather than only a mistake: it is
  // how two views of one design are checked against each other.
  bool as_named = 5;
  // work_budget caps the work each query this request evaluates may do (agni issue 792): the units
  // a fact base counts, candidate comparisons plus each row a generator emits. It can only LOWER the
  // deployment's own budget, never raise it, and zero leaves that budget as it is. A query past its budget fails with RESOURCE_EXHAUSTED, naming the budget.
  int64 work_budget = 6;
  // bindings give goal variables values from the caller, keyed by the variable's name without its
  // `?` (agni issue 793). A bound variable answers exactly as the same value written into the goal as
  // a constant, so a caller asking about one net or part sends the same query text every time and the
  // value as data, with nothing to escape or splice. A binding naming a variable the goal does not use
  // is refused as an invalid argument. Rules are unaffected: their variables are their own.
  map<string, QueryValue> bindings = 7;
}

// QueryRow is one answer: cells aligns positionally with RunQueryResponse.columns, and cites is the
// provenance of the base facts that produced the row (the same citations the CLI prints), kept a
// separate list so a client can show them on demand rather than widen the results table.
message QueryRow {
  repeated string cells = 1;
  repeated string cites = 2;
  // cell_sheets aligns positionally with cells (WS9-038): the sheet ids each navigable cell's entity
  // lives on, so the panel can render an inline sheet badge per cell and navigate on click. Sheet
  // ids only (the client resolves names, as it does for Finding.sheets); empty for a scalar cell, an
  // unresolved entity, or a single-sheet design. A row with no navigable cells omits it entirely.
  repeated CellSheets cell_sheets = 3;
  // cell_reasons aligns positionally with cells (WS9-039): why a navigable cell's entity is not
  // highlightable in the faithful view — set ONLY for an entity the loaded geometry does not draw
  // (a `#` virtual power/flag symbol, a power rail with no drawn wire, an unknown ref/net, or any
  // other undrawn entity), with the reason classified from design facts. UNSPECIFIED means the
  // entity IS drawn (it will highlight). Populated only when faithful geometry is loaded; the panel
  // additionally shows it only on a faithful layout, since an auto-layout draws every entity.
  repeated agni.v1.checks.LocateReason cell_reasons = 4;
  // cell_kinds aligns positionally with cells and OVERRIDES column_kinds for this row (agni issue
  // 338), set only where a column's kind cannot be a column property at all.
  //
  // Kind is normally fixed per column, because a variable binds at the same relation position in
  // every row. `entity(?name, ?kind)` breaks that: it enumerates what exists, so one answer set
  // holds a component, a net and a bus, and the kind of the `name` cell is whatever that row's
  // `kind` cell says. Without this the name column types as a scalar and a search result is the one
  // answer a reader cannot click.
  //
  // Empty for every ordinary query, and "" for every non-polymorphic cell within a row that has
  // one, so a client reads `cell_kinds[i] || column_kinds[i]` and column_kinds keeps meaning what it
  // has always meant.
  repeated string cell_kinds = 5;
  // cell_refs aligns positionally with cells and carries the OTHER HALF of a cell's identity, set
  // only where one cell cannot name the entity by itself (agni issue 259 follow-up).
  //
  // A pin is the case. Its identity is two fields, the component and the designator, so the cell
  // holding "5" names nothing until you know it means U7's pin 5. That is why a pin column typed as
  // a scalar for so long: not because a pin is unlocatable, but because a table cell is one string
  // and a pin is two.
  //
  // This is a sibling of cell_kinds rather than the same mechanism. A pin column's KIND is fixed
  // (every row is a pin, so column_kinds says "pin"); what varies per row is the ref, which may come
  // from a sibling column, from a constant in the query, or from a variable the projection dropped.
  // Empty for every column that is not a pin column.
  repeated string cell_refs = 6;
}

// CellSheets is one cell's sheet membership (WS9-038), a message wrapper because proto has no
// repeated-of-repeated. sheet_ids is empty for a non-navigable or unlocated cell.
message CellSheets {
  repeated string sheet_ids = 1;
}

message RunQueryResponse {
  // columns are the projected answer columns (the query's Select, or its goal variables in
  // first-seen order), naming each cell position in every row.
  repeated string columns = 1;
  repeated QueryRow rows = 2;
  // column_kinds aligns positionally with columns (WS9-038): the entity kind of each column,
  // derived from the arg-label of the relation position its variable was bound from — "component"
  // (a ref_des), "net", or "" for a scalar or unresolved column. It drives which cells the panel
  // renders as clickable-to-locate. Empty (or all "") when no column resolves to an entity.
  repeated string column_kinds = 3;
  // query and source echo the request's identifying inputs, so an ANSWER says which question
  // produced it and which design it was asked of.
  //
  // Added when the CLI's `--format json` moved onto this message. The CLI had been emitting a
  // hand-rolled shape that carried both, and dropping them to adopt the wire form would have made
  // the machine-readable format the only one that cannot say what it is an answer to, which is
  // backwards: markdown and html carry them precisely so a saved view states its own question.
  //
  // The panel ignores them, since it sent the request and already knows. That is the ordinary cost
  // of a self-describing response and it is one string each.
  string query = 4;
  string source = 5;
  // work is what answering this query cost, in the units a work budget counts, so a deployment can
  // see which queries are expensive and choose a budget from evidence (agni issue 792).
  int64 work = 6;
  // bindings echo the request's, so an answer to a parameterized query still states the whole
  // question it answers.
  map<string, QueryValue> bindings = 7;
}

// QueryValue is a value bound to a query variable. Where the schema types the variable's position,
// the engine reads the value as that type whichever field carries it (panyam/jaala#65): text that
// parses binds a number in a number position, text that does not is refused, and a number in a name
// position matches by its text. Where nothing types the variable, this field decides, as `3.3`
// versus `"3.3"` written into the query would.
message QueryValue {
  oneof kind {
    string text = 1;
    double number = 2;
  }
}

message ListRelationsRequest {
  // path names a place in the namespace tree to describe in `entry`: "net" a module,
  // "net.has_test_point" a member, and "." the root module. Empty asks for the flat catalog, as
  // before, which is why the root needs a spelling of its own. An unknown path is INVALID_ARGUMENT,
  // with the suggestion a query would get.
  string path = 1;
  // uri, when set, names a design whose project's own library joins the catalog (agni issue 773), so
  // its members list and describe beside the shipped ones. Empty answers for the shipped vocabulary
  // alone. A project library that does not compose is an error rather than a catalog without it.
  string uri = 2;
  // overlay carries library modules sent with the request (AnalysisConfig.library_modules, agni
  // issue 788), so the catalog lists and describes them as a query sent with the same overlay would
  // read them. They join the design's project library when uri is set too.
  OverlayConfig overlay = 3;
}

// RelationInfo is the discovery metadata for one relation or predicate: `name` as queries write it,
// `args` the labels a template inserts as `?arg` (so `component.net` inserts
// `component.net(?ref_des, ?net)`), `summary` a one-liner, and `kind` the grouping bucket
// ("netlist" | "board" | "datasheet" | "derived" | "predicate" | "extension").
message RelationInfo {
  string name = 1;
  repeated string args = 2;
  string summary = 3;
  string kind = 4;
  // detail is the relation's rich reference markdown from check/facts/docs/<name>.md (WS14-005),
  // or "" when the relation has no doc yet. summary is the one-liner for the picker chip; detail is
  // the deep-dive the panel renders on demand, the same markdown pipeline rule Detail uses.
  string detail = 5;
  // signature renders the member as a rule head declaring its argument types, such as
  // `component.two_terminal(r: component, a: net, b: net)`.
  string signature = 6;
  // definition is a derived relation's clauses as its module defines them, one per clause. Empty
  // for every other kind.
  repeated string definition = 7;
}

// RelationEntry is one place in the namespace tree, for drill-down: a module listing what it holds,
// or a member with what a reader needs to call it.
message RelationEntry {
  string path = 1;
  // entry_kind is "module", "base", "predicate" or "derived".
  string entry_kind = 2;
  // signature is a member's rule head with its argument types; empty for a module.
  string signature = 3;
  // doc is the member's one-line description.
  string doc = 4;
  // detail is the member's reference markdown, as on RelationInfo, or "".
  string detail = 5;
  // module is the module a derived relation is defined in.
  string module = 6;
  // definition is a derived relation's clauses, one per clause.
  repeated string definition = 7;
  // inferred names the arguments whose types the engine worked out from the rules rather than
  // reading from a declaration, so a reader can tell which types the author stated.
  repeated string inferred = 8;
  // members are a module's direct children, each a member or a nested module, described one level
  // deep (their own members are not filled).
  repeated RelationEntry members = 9;
}

// ExampleQuery is one runnable teaching query (WS14-002): a plain-language `label`, the datalog
// `query` a click fills and runs, and the one `teaches` concept it introduces. The panel and the CLI
// `--examples` read the same catalog, so they never drift.
message ExampleQuery {
  string label = 1;
  string query = 2;
  string teaches = 3;
}

// EntityQuery is the preset a viewer runs when the reader CLICKS an entity in the drawing: the
// datalog that asks what is known about a pin, a component, a net or a bus.
//
// It is served rather than held in the browser because every preset names relations defined on this
// side. A client-held template would be the one caller nothing checks — renaming a relation would go
// red in the example tests while every click in the viewer started producing a query that errors.
// Here it inherits the same parse and evaluate guards the examples have.
message EntityQuery {
  // kind is the picked entity's kind: "pin", "component", "net" or "bus".
  string kind = 1;
  // query is the same text for every click: the picked entity reaches it through binds.
  string query = 2;
  // teaches is the one concept this preset introduces, so a click that answers a question also
  // shows the reader a piece of the language.
  string teaches = 3;
  // binds names the variables the client binds from the picked selection (agni issue 793), each
  // also the selection field that fills it: ref, pin, net or bus. It is explicit because one
  // preset's input is another's output (the pin preset answers ?net, the net preset asks about one).
  repeated string binds = 4;
}

// SearchQuery is the query the panel's search mode runs: find a design's entities by name (agni
// issue 338). The client binds the variable `bind` names to `pattern` with {term} replaced by the
// reader's escaped text (agni issue 793), so the query text never changes and the (?i) that makes
// the search case-insensitive is written here, once.
//
// It is served for the same reason the entity presets are. It names `entity` and `str.match`, both
// defined on this side, and a client-held copy would be the one caller nothing checks.
message SearchQuery {
  string query = 1;
  // teaches is the concept a search leaves behind, since what the reader gets back is an editable
  // datalog query rather than a search box's opinion.
  string teaches = 2;
  // bind names the variable the client binds, without its `?`.
  string bind = 3;
  // pattern is the regex bound to it, with {term} standing for the reader's escaped text.
  string pattern = 4;
}

message ListRelationsResponse {
  // relations are pre-sorted by kind then name, so the client renders the grouped picker without
  // re-sorting.
  repeated RelationInfo relations = 1;
  // examples are runnable teaching queries in concept-ladder order (WS14-002), rendered as
  // click-to-run chips beside the relation picker.
  repeated ExampleQuery examples = 2;
  // entity_queries are the click-to-ask presets, one per pickable entity kind (WS: canvas picking).
  repeated EntityQuery entity_queries = 3;
  // search_query is the find-by-name template the panel's search mode fills (agni issue 338).
  SearchQuery search_query = 4;
  // entry answers a request naming a path. When it is set the other fields are empty, since a
  // drill-down asks about one place rather than for the whole picker.
  RelationEntry entry = 5;
}

// QuerySet is a named list of queries sharing a preamble of derived relations. It travels as values
// rather than as YAML (C22); `agni query --set` reads the YAML file and sends this.
message QuerySet {
  // title names the set for a rendered report.
  string title = 1;
  // preamble holds rules (clauses with `:-`) every query may use. Rules only: each query brings its
  // own goal.
  string preamble = 2;
  repeated NamedQuery queries = 3;
}

// NamedQuery is one entry of a QuerySet. name is unique within the set and identifies the entry's
// answer.
message NamedQuery {
  string name = 1;
  // query is the datalog text, the same surface RunQueryRequest.query accepts.
  string query = 2;
  // description is carried into a rendered report for the reader.
  string description = 3;
  // bindings mean what they mean on RunQueryRequest, for this query alone.
  map<string, QueryValue> bindings = 4;
}

message RunQueriesRequest {
  QuerySet set = 1;
  // uri, overlay, board_uri and as_named mean what they mean on RunQueryRequest, and apply to the one
  // read every query in the set shares.
  string uri = 2;
  OverlayConfig overlay = 3;
  string board_uri = 4;
  bool as_named = 5;
  // work_budget caps the work each query this request evaluates may do (agni issue 792): the units
  // a fact base counts, candidate comparisons plus each row a generator emits. It can only LOWER the
  // deployment's own budget, never raise it, and zero leaves that budget as it is. Each query in the set has the whole budget; one past it reports that in its own result.
  int64 work_budget = 6;
}

message RunQueriesResponse {
  // title and preamble echo the request, so a saved response states the questions it answers.
  string title = 1;
  string preamble = 2;
  // source is the design the set was asked of, as RunQueryResponse.source.
  string source = 3;
  // results align with the request's queries, in the same order.
  repeated NamedQueryResult results = 4;
}

// NamedQueryResult is one query's answer, or why it has none. Exactly one of result and error is set.
message NamedQueryResult {
  string name = 1;
  string description = 2;
  RunQueryResponse result = 3;
  // error says why this query could not be answered: it would not parse, or it named something the
  // design's relations do not have. The query's text is in the request.
  string error = 4;
}
