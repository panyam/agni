syntax = "proto3";

package agni.v1.viewer;

option go_package = "github.com/panyam/agni/gen/go/agni/v1/viewer";

// This file defines ViewerPageService, the contract a LIVE viewer page answers (agni issues 1150,
// 1152).
//
// A server or the browser engine answers every other service in agni. The open viewer page answers
// this one itself, so a host can move the page without reloading it. The host can open a sheet,
// focus a verdict, or apply a link's location to the page already showing the design. A link
// (ViewerLocation in the URL) is the cold form of the same question, and ApplyLocation is its hot
// form. So a link and a call have the same effect.
//
// The service is transport-neutral. The page dispatches a method name and a protojson body
// (web/src/pageservice.ts), and each transport only carries that pair. One transport is postMessage
// from a parent page (web/src/embed.ts, the `agni-viewer/v1` envelope). The other is a design's
// relay room, where each method is an agent's tool (web/src/viewerroom.ts, agni issue 1154). No
// server implements it.
//
// Every response includes the page's location after the call. So a caller learns where the page
// ended up (which sheet a verdict opened) without asking again.
service ViewerPageService {
  // GetLocation returns where the page is now. It changes nothing. NO_SIDE_EFFECTS records that, so
  // an agent holding only read access may call it (agni issue 1154).
  rpc GetLocation(GetLocationRequest) returns (GetLocationResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ApplyLocation moves the open page to a location, as following a link to it would. A location
  // naming a different design, or a different flatten, opens that design. That is the cold path. A
  // location naming the open design, or no design, applies to the page as it stands.
  rpc ApplyLocation(ApplyLocationRequest) returns (ApplyLocationResponse);
  // LocateVerdict focuses one verdict and draws its proof on a sheet it is drawn on.
  rpc LocateVerdict(LocateVerdictRequest) returns (LocateVerdictResponse);
  // SelectFinding focuses one finding of the last run, as clicking its row does.
  rpc SelectFinding(SelectFindingRequest) returns (SelectFindingResponse);
  // LocateEntity highlights a net, part or pin, as clicking a query result cell does.
  rpc LocateEntity(LocateEntityRequest) returns (LocateEntityResponse);
  // ShowSheet opens one sheet of the open design, on the canvas or in an open sheet view.
  rpc ShowSheet(ShowSheetRequest) returns (ShowSheetResponse);
  // OpenSheetView opens a sheet view beside the canvas on one sheet of the open design, as the
  // Sheets panel's "open beside" does (agni issues 1326, 1370).
  rpc OpenSheetView(OpenSheetViewRequest) returns (OpenSheetViewResponse);
  // CloseSheetView closes one sheet view.
  rpc CloseSheetView(CloseSheetViewRequest) returns (CloseSheetViewResponse);
}

// ViewerLocation is the page's URL-addressable state, the wire twin of router.ts's ViewerLocation,
// field for field except `isDir`, since a viewer page only ever addresses a design. The field
// comments there are the reference; the URL spelling of each is in router.ts's locationToUrl.
//
// As a REQUEST, an empty string, an empty list and an unset optional mean "leave it as it is", so a
// caller sends only what it wants changed. As a RESPONSE every field is filled.
message ViewerLocation {
  string mount = 1;
  string path = 2;
  string sheet = 3;
  // mode is "svg", "webgl" or "native".
  string mode = 4;
  string layout = 5;
  optional bool symbols = 6;
  optional bool flatten = 7;
  // verdict is a verdict id ("<rule>:(<kind>:<ref>,...)"). hash, rule and subjects are the link's
  // hints for it, and they mean nothing without it.
  string verdict = 8;
  string hash = 9;
  string rule = 10;
  repeated string subjects = 11;
  // trace is "<from>,<to>", two pins, and trace_hops its radius (0 for the server default).
  string trace = 12;
  int32 trace_hops = 13;
  // query, title and binds ask a query in a new tab; set and q open a member of a project set.
  string query = 14;
  string title = 15;
  repeated string binds = 16;
  string set = 17;
  string q = 18;
  // against starts a comparison with "<mount>/<path>", pairing near-renames when rename_approx is
  // set.
  string against = 19;
  bool rename_approx = 20;
}

message GetLocationRequest {}

message GetLocationResponse {
  ViewerLocation location = 1;
  // views lists the sheet views open beside the canvas, in the order they opened. A link cannot
  // address a view, so the views are kept out of ViewerLocation.
  repeated SheetView views = 2;
}

// SheetView is one view open beside the canvas (agni issue 1370). It has its own sheet and camera,
// and it follows a selection made anywhere on the page.
message SheetView {
  // id names the view for as long as the page is open, such as "sheetview-2". A page numbers its
  // views from 1 and never reuses a number, so a closed view's id names nothing.
  string id = 1;
  // sheet is the sheet id that the view shows.
  string sheet = 2;
}

message ApplyLocationRequest {
  ViewerLocation location = 1;
  // url is a viewer link, sent instead of a location. The server mints such links (`agni check
  // --server`, an MCP answer's `link`, a report row). The page reads url with the same parser it
  // uses for its own address. Only the fields the link sets are applied. Exactly one of location
  // and url.
  //
  // The page accepts a request with only a url from a page at ANY origin, and the reply has no
  // location (agni issue 1156). Any page holding the viewer's window can already navigate it to the
  // same link. So this grants nothing that loading the link would not, except keeping the page.
  string url = 2;
}

message ApplyLocationResponse {
  ViewerLocation location = 1;
  // verdict_resolved says whether the location's verdict was found and drawn. False when it named
  // none, so a caller that sent one reads false as "a stale or mistyped id".
  bool verdict_resolved = 2;
}

message LocateVerdictRequest {
  // id is the verdict's derived id, as `agni check --verdicts` prints it.
  string id = 1;
  // rule and subjects are the same hints a link has (ViewerLocation.rule, .subjects). Suppose the
  // page has not answered the verdict yet. The hints let it ask that one rule about those subjects
  // alone, as a cold link does. Without them, the verdict is left unresolved.
  string rule = 2;
  repeated string subjects = 3;
}

message LocateVerdictResponse {
  // resolved is false for an id the page could not find, and then the page is left as it was.
  bool resolved = 1;
  ViewerLocation location = 2;
}

message SelectFindingRequest {
  // subject is the finding's subject ref (a net name, a ref-des), and net_id the per-instance net id
  // when two nets share the name.
  string subject = 1;
  string net_id = 2;
  // sheet opens that sheet; empty opens the first one the finding is drawn on when the shown sheet
  // has none of them.
  string sheet = 3;
}

message SelectFindingResponse {
  // selected is false when the last run has no such finding, and then the page is left as it was.
  // Selecting the finding already focused is not a toggle, unlike a second click on its row.
  bool selected = 1;
  ViewerLocation location = 2;
}

message LocateEntityRequest {
  // kind is "net", "component" or "pin"; pin is set only for a pin.
  string kind = 1;
  string subject = 2;
  string pin = 3;
  string sheet = 4;
}

message LocateEntityResponse {
  ViewerLocation location = 1;
}

message ShowSheetRequest {
  string sheet = 1;
  // view is the id of an open sheet view to show the sheet in. Empty shows it on the canvas. An id
  // naming no open view is refused.
  string view = 2;
}

message ShowSheetResponse {
  ViewerLocation location = 1;
  repeated SheetView views = 2;
}

message OpenSheetViewRequest {
  // sheet is the sheet id the new view shows. A sheet the open design lacks is refused.
  string sheet = 1;
}

message OpenSheetViewResponse {
  // view is the view just opened. The call returns once the view has drawn its sheet.
  SheetView view = 1;
  ViewerLocation location = 2;
  repeated SheetView views = 3;
}

message CloseSheetViewRequest {
  string view = 1;
}

message CloseSheetViewResponse {
  // closed is false when no open view has that id, and then the page is left as it was.
  bool closed = 1;
  ViewerLocation location = 2;
  repeated SheetView views = 3;
}
