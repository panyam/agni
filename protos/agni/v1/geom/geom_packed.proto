syntax = "proto3";

package agni.v1.geom;

option go_package = "github.com/panyam/agni/gen/go/agni/v1/geom";

// Tier 2 is the columnar transport for schematic geometry (CONSTRAINTS C8).
//
// This is a DERIVED PROJECTION of the tier-1 logical contract in geom.proto, not a
// second schema. It holds one sheet's vertex geometry as a packed bytes envelope for
// direct upload to a GPU vertex pipeline. It is in its own file so the tier-1 contract
// has no storage/packing details (docsite architecture/geometry-and-rendering.md). It is
// still in the agni.v1.geom package, because it joins back to tier 1 by index and shares
// the sidecar identity.
//
// This is a TRANSPORT concern, not a WebGL concern. Any GPU vertex pipeline without 64-bit
// attributes needs int32 + sheet-relative coordinates. That covers WebGL2/GLSL ES 3.0
// today, and equally WebGPU, native GL, Canvas typed-arrays, or a server-side rasterizer.
// Each surface chooses its renderer backend above this layer. See the docsite's
// architecture/geometry-and-rendering.md.

// PrimitiveKey maps a primitive (by index into the primitives table) back to the IR
// element it belongs to, for view-local picking/highlight.
message PrimitiveKey {
  uint32 primitive = 1;  // index into PackedSheet.primitives
  string ref_des = 2;    // set for symbol/pin primitives
  string net = 3;        // set for wire primitives
  // pin is the pin designator (PinPoint.port_ref, e.g. "3") for a pin primitive, so a
  // highlight can target one pin of a component rather than the whole symbol. Empty for
  // symbol/wire primitives.
  string pin = 4;
  // net_id is the deterministic per-instance net identity (ir.Net.id / WireGeometry.net_id) for
  // a wire primitive, so a highlight can target one of two nets that share a name. Empty when the
  // solve produced no id; matching then falls back to net.
  string net_id = 5;
  // bus_id is the bus's NAME (its range-label identity, WireGeometry.net) for a bus trunk/entry
  // primitive, so a bus-not-modeled finding highlights its own bus rather than a net (WS7-042b). A
  // bus has no net/net_id, so this is its only join key. Empty for a non-bus primitive.
  string bus_id = 6;
}

// PinRef names one pin of one placed component, the pin-granularity highlight target.
message PinRef {
  string ref_des = 1;  // the component (SymbolPlacement.ref_des)
  string pin = 2;      // the pin designator (PinPoint.port_ref)
}

// HighlightShape selects HOW a highlight layer draws its matched entities (WS9-017).
//
// OUTLINE re-strokes each matched element's own geometry (wires, symbol shapes). It is the
// WS9-016 behavior and the zero-value default.
//
// The bounding shapes frame each matched ENTITY with a translucent fill. They draw one
// rect/circle per component, net, or listed pin, and never one box over the whole union. They
// suit callers that want area emphasis over line emphasis, such as a selection layer against
// a finding layer.
//
// PATH is the focus highlighter (WS9-040). It re-strokes the entity's own geometry like
// OUTLINE, but wider and translucent by default. So focusing a net marks its actual PATH like
// a highlighter pen, rather than an opaque bar or a bounding box over its whole span. The SVG
// backend draws the wider stroke. The WebGL backend cannot thicken 1px GL lines, so it
// recolors the primitives translucently, as for OUTLINE. That is the documented backend
// asymmetry.
enum HighlightShape {
  HIGHLIGHT_SHAPE_UNSPECIFIED = 0;  // treated as OUTLINE
  HIGHLIGHT_SHAPE_OUTLINE = 1;
  HIGHLIGHT_SHAPE_BOUNDING_RECT = 2;
  HIGHLIGHT_SHAPE_BOUNDING_CIRCLE = 3;
  HIGHLIGHT_SHAPE_PATH = 4;
}

// HighlightSpec selects a set of schematic elements and the style to draw them with. It is
// the renderer-agnostic INPUT of the highlight layer. The same spec projects to a
// PackedHighlight for a GPU renderer, which joins PackedSheet by primitive index. It also
// projects to an SVG overlay document for the SVG backend, composited above the sheet render.
// Selection is a union. Every listed component (all its symbol + pin primitives), net (its
// wires), and pin matches. Several specs form independent layers with their own colors (e.g.
// selection vs finding), and a later spec wins where they overlap.
message HighlightSpec {
  repeated string components = 1;  // ref_des values; matches symbol graphics and their pins
  repeated string nets = 2;        // net names; matches wire polylines
  repeated PinRef pins = 3;        // individual pins
  // net_ids matches wire polylines by deterministic per-instance net identity (PrimitiveKey.net_id),
  // so a highlight can target one of two nets that share a name. A wire matches if its net_id is
  // listed here OR (fallback) its net name is in nets, so a name-only spec is unchanged (WS9).
  repeated string net_ids = 8;
  // bus_ids matches a bus trunk/entry by its name (PrimitiveKey.bus_id), so a bus finding highlights
  // its own bus (WS7-042b). A bus has no net, so it matches ONLY by bus_id.
  repeated string bus_ids = 9;
  string color = 4;                // "#rrggbb"; empty lets the renderer pick its default
  // alpha in (0, 1]; 0/unset means fully opaque. proto3 cannot distinguish unset from 0,
  // and a caller never means an invisible highlight. The bounding shapes are the exception.
  // They default an unset alpha to 0.3, not opaque, because a fully opaque box would hide
  // the entity it frames, and a caller never means that either.
  float alpha = 5;
  HighlightShape shape = 6;  // how matched entities draw; unset means OUTLINE (WS9-016)
  // stroke_scale multiplies the PATH highlighter's width (WS9-044), so a user can make the
  // focus marker thicker or thinner. 0/unset means 1 (the default width). Only PATH reads it;
  // OUTLINE and the bounding shapes ignore it.
  float stroke_scale = 7;
}

// PackedHighlight is the packed projection of highlight specs against one PackedSheet. For
// each input spec, in the same order, it lists the indices of the primitives the spec
// selects. The client redraws those primitives in the group's color/alpha above the base
// geometry. No new vertices cross the wire, because the group joins the already-uploaded
// buffer by index.
message PackedHighlight {
  message Group {
    string color = 1;               // "#rrggbb"; empty means the renderer's default
    float alpha = 2;                // (0,1]; 0/unset means opaque, as in HighlightSpec
    repeated uint32 primitives = 3; // indices into PackedSheet.primitives, ascending
    // Echo of the spec's shape, so a packed consumer knows what to draw. The wire is
    // index-only for every shape. A bounding-shape consumer computes each entity's bounds
    // locally from the vertices it already holds, grouping indices by its PrimitiveKeys.
    HighlightShape shape = 4;
  }
  repeated Group groups = 1;  // one per input HighlightSpec, in request order
}

// PackedLabel is one text label positioned in sheet-relative world coordinates (rebased by
// origin_x/origin_y, the same as the vertex blob). A GPU line pipeline draws no glyphs, so
// an overlay above the geometry draws the text. The browser owns text metrics (docsite
// architecture/geometry-and-rendering.md). The server computes the world position and the
// color with the SVG backend's transform math, so the overlay and the SVG oracle agree. The
// browser only maps world->screen with the view camera. O(labels), and structured like keys.
// TextRun is one piece of a label that draws in one style. The engine splits a label by its
// markup, so the SVG backend and the overlay draw it alike without parsing it again.
message TextRun {
  string text = 1;
  Kind kind = 2;
  enum Kind {
    KIND_PLAIN = 0;
    KIND_OVERBAR = 1;
    KIND_SUBSCRIPT = 2;
    KIND_SUPERSCRIPT = 3;
  }
}

message PackedLabel {
  int32 x = 1;             // sheet-relative world origin (rebased, like the vertex blob)
  int32 y = 2;
  string text = 3;
  int32 height = 4;        // text height in world units; the camera scales it to pixels
  int32 rotation_deg = 5;  // degrees counter-clockwise (Y-up); 0/90/180/270 typical
  string justify = 6;      // canonical "<h> <v>" alignment (see geom.Label.justify)
  string color = 7;        // "#rrggbb", chosen server-side to match the SVG oracle
  int32 max_width = 8;     // world-space width to condense the run into (0 = unbounded). A symbol
                           // caption gets its box width here; the overlay squeezes glyphs to fit
                           // (textLength) rather than spilling past the box, matching the SVG backend.
  // runs is the text split by markup (SchematicGeometry.text_markup), in order. Their texts join
  // to `text`. Empty means `text` draws as one plain run.
  repeated TextRun runs = 9;
  // group is the primitive group the label hides with, so a board's silkscreen text hides with its
  // layer (agni 1351). 0 means the label belongs to no group and always draws, as every schematic
  // label does.
  uint32 group = 10;
  // mirror draws the text mirrored left to right about its anchor, after rotating it, as a board
  // draws its back-side text (BoardText.mirror, agni issue 1368). A schematic label never sets it.
  bool mirror = 11;
  // There is no font field yet. Every renderer draws one font (monospace, matching the SVG
  // backend), and the geom IR has no per-text font. Add `string font` here once a reader
  // populates per-element font on the IR. It is an additive change, so waiting loses nothing.
}

// PackedImage is one raster image positioned in sheet-relative world coordinates (rebased by
// origin_x/origin_y, like PackedLabel and the vertex blob). A GPU line pipeline draws no
// raster, so images go in the same overlay above the geometry as text. The browser positions
// an <image> with the per-frame camera transform. x/y is the world min corner and w/h the
// bbox span, so the client bakes the Y-up->Y-down flip the same way it does for labels. data
// is the raw image bytes, not a data URI, to avoid base64 bloat on the binary transport. The
// client builds "data:<mime>;base64,...". Images are sheet-level only for now. The SVG
// backend does not draw SymbolDef images either, so the overlay matches the SVG oracle.
message PackedImage {
  int32 x = 1;             // sheet-relative world min-x (rebased)
  int32 y = 2;             // sheet-relative world min-y (rebased)
  int32 w = 3;             // world width (bbox span)
  int32 h = 4;             // world height (bbox span)
  string mime = 5;         // e.g. "image/png"; empty defaults to image/png
  bytes data = 6;          // raw image bytes; the client base64-encodes into the data URI
  int32 rotation_deg = 7;  // degrees counter-clockwise (Y-up), matching geom.Image
  bool mirror = 8;         // mirror across the y-axis (flip x) before rotation
}

// PackedSheet is the GPU-upload form of one sheet's vertex geometry. Coordinates are
// int32 and sheet-relative (subtract origin_x/origin_y), because a GPU vertex pipeline has
// no 64-bit vertex attribute. Rebasing bounds them by the sheet extent, so int32 is exact.
message PackedSheet {
  string sheet_id = 1;
  int32 layout_version = 2;  // owned here; bump on layout change
  int64 origin_x = 3;        // sheet min corner; blob coords are relative to this
  int64 origin_y = 4;
  // int32 LE pairs, sheet-relative: [x0,y0,x1,y1,...].
  bytes vertices = 5;
  // Fixed-width LE records: (kind:u8, group:u8, _pad:u16, first_vertex:u32, count:u32).
  bytes primitives = 6;
  repeated PrimitiveKey keys = 7;   // O(primitives), stays structured
  repeated PackedLabel labels = 8;  // O(labels), stays structured; drawn by the text overlay
  // The default font-family for the sheet's text (render.Style.Font), so the overlay draws in
  // the same face as the SVG backend. One face per sheet; per-element font is not sent yet.
  string font_family = 9;
  // Geometry colors indexed by primitive group (0 symbol, 1 wire, 2 pin, 3 free, 4 frame).
  // The server resolves them from render.Style. So the WebGL renderer colors geometry from the
  // same palette as the SVG backend instead of a hardcoded client map. "#rrggbb".
  repeated string group_colors = 10;
  // The page background color (render.Style.Page), so the WebGL canvas clears to the same
  // background the SVG backend paints. "#rrggbb".
  string background_color = 11;
  // Sheet-level raster images (logos, notes), rebased to origin_x/origin_y; drawn by the
  // overlay above the geometry. O(images), and structured like labels.
  repeated PackedImage images = 12;
  // The opacity each group draws at, indexed like group_colors. 0, and a group past the list's
  // end, draw opaque. A board's zones draw as a wash, 18% of their layer's copper over whatever is
  // under them, as the SVG backend fills them (agni issue 1334), so two overlapping zones darken
  // as they do in SVG.
  repeated float group_alphas = 13;
}

// BoardLayerRow is one row of a board sheet's layer list, which the viewer shows as checkboxes
// under the Board entry in its Sheets panel (agni 1351). The rows come in the order a reader
// expects, copper in stackup order from the front, then the edge, the through copper, the zones,
// and the graphics layers. Only a layer the geometry draws gets a row.
//
// A row says how to hide it in each renderer, so the client knows nothing about how a board is
// drawn. svg_selector matches every element of the row in render.BoardSVG's output, and groups
// lists the PackedSheet primitive groups of the row in render.PackBoard's output. A client hides a
// row by hiding both. An element can belong to two rows, as a zone on In1.Cu does, and it stays
// hidden while either row is hidden.
message BoardLayerRow {
  // name is the layer's own name ("F.Cu", "In1.Cu", "F.SilkS"), or "Edge", "Through" or "Zones"
  // for the three rows that hold no single layer.
  string name = 1;
  // kind is "copper", "edge", "through", "zones", "silk", "fab", "courtyard" or "graphic".
  string kind = 2;
  // side is "front", "back" or "inner", or "" for a row that belongs to both sides.
  string side = 3;
  // color is the row's swatch, the colour both renderers draw it in. "#rrggbb".
  string color = 4;
  string svg_selector = 5;
  repeated uint32 groups = 6;
}
