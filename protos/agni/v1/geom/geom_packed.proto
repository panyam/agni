syntax = "proto3";

package agni.v1.geom;

option go_package = "github.com/panyam/agni/gen/go/agni/v1/geom";

// Tier 2: columnar transport for schematic geometry (CONSTRAINTS C8).
//
// This is a DERIVED PROJECTION of the tier-1 logical contract in geom.proto, not a
// second schema. It carries one sheet's vertex geometry as a packed bytes envelope for
// direct upload to a GPU vertex pipeline. Kept in its own file so the tier-1 contract
// stays free of storage/packing details (docs/16), while remaining in the same
// agni.v1.geom package (it joins back to tier 1 by index and shares the sidecar
// identity).
//
// This is a TRANSPORT concern, not a WebGL concern: int32 + sheet-relative coordinates
// are forced by any GPU vertex pipeline without 64-bit attributes (WebGL2/GLSL ES 3.0
// today; WebGPU, native GL, Canvas typed-arrays, or a server-side rasterizer equally).
// The renderer backend is a per-surface choice above this layer. See docs/16.

// PrimitiveKey maps a primitive (by index into the primitives table) back to the IR
// element it belongs to, for view-local picking/highlight.
message PrimitiveKey {
  uint32 primitive = 1;  // index into PackedSheet.primitives
  string ref_des = 2;    // set for symbol/pin primitives
  string net = 3;        // set for wire primitives
  // pin is the pin designator (PinPoint.port_ref, e.g. "3") for a pin primitive, so a
  // highlight can target one pin of a component rather than the whole symbol. Empty for
  // symbol/wire primitives.
  string pin = 4;
  // net_id is the deterministic per-instance net identity (ir.Net.id / WireGeometry.net_id) for
  // a wire primitive, so a highlight can target one of two nets that share a name. Empty when the
  // solve produced no id; matching then falls back to net.
  string net_id = 5;
  // bus_id is the bus's NAME (its range-label identity, WireGeometry.net) for a bus trunk/entry
  // primitive, so a bus-not-modeled finding highlights its own bus rather than a net (WS7-042b). A
  // bus carries no net/net_id, so this is its only join key. Empty for a non-bus primitive.
  string bus_id = 6;
}

// PinRef names one pin of one placed component, the pin-granularity highlight target.
message PinRef {
  string ref_des = 1;  // the component (SymbolPlacement.ref_des)
  string pin = 2;      // the pin designator (PinPoint.port_ref)
}

// HighlightShape selects HOW a highlight layer draws its matched entities (WS9-017). OUTLINE
// re-strokes each matched element's own geometry (wires, symbol shapes) — the WS9-016
// behavior and the zero-value default. The bounding shapes frame each matched ENTITY (one
// rect/circle per component, net, or listed pin, never one box over the whole union) with a
// translucent fill, for callers that want area emphasis over line emphasis (a selection
// layer vs a finding layer). PATH is the focus highlighter (WS9-040): it re-strokes the
// entity's own geometry like OUTLINE but wider and translucent by default, so focusing a net
// marks its actual PATH like a highlighter pen rather than an opaque bar or a bounding box
// over its whole span. The SVG backend draws the wider stroke; the WebGL backend cannot
// thicken 1px GL lines, so it recolors the primitives translucently (same as OUTLINE), the
// documented backend asymmetry.
enum HighlightShape {
  HIGHLIGHT_SHAPE_UNSPECIFIED = 0;  // treated as OUTLINE
  HIGHLIGHT_SHAPE_OUTLINE = 1;
  HIGHLIGHT_SHAPE_BOUNDING_RECT = 2;
  HIGHLIGHT_SHAPE_BOUNDING_CIRCLE = 3;
  HIGHLIGHT_SHAPE_PATH = 4;
}

// HighlightSpec selects a set of schematic elements and the style to draw them with. It is
// the renderer-agnostic INPUT of the highlight layer: the same spec projects to a
// PackedHighlight (for a GPU renderer, joining PackedSheet by primitive index) or to an SVG
// overlay document (for the SVG backend, composited above the sheet render). Selection is a
// union: every listed component (all its symbol + pin primitives), net (its wires), and pin
// matches. Several specs form independent layers with their own colors (e.g. selection vs
// finding); a later spec wins where they overlap.
message HighlightSpec {
  repeated string components = 1;  // ref_des values; matches symbol graphics and their pins
  repeated string nets = 2;        // net names; matches wire polylines
  repeated PinRef pins = 3;        // individual pins
  // net_ids matches wire polylines by deterministic per-instance net identity (PrimitiveKey.net_id),
  // so a highlight can target one of two nets that share a name. A wire matches if its net_id is
  // listed here OR (fallback) its net name is in nets, so a name-only spec is unchanged (WS9).
  repeated string net_ids = 8;
  // bus_ids matches a bus trunk/entry by its name (PrimitiveKey.bus_id), so a bus finding highlights
  // its own bus (WS7-042b). A bus has no net, so it matches ONLY by bus_id.
  repeated string bus_ids = 9;
  string color = 4;                // "#rrggbb"; empty lets the renderer pick its default
  // alpha in (0, 1]; 0/unset means fully opaque (proto3 cannot distinguish unset from 0,
  // and an invisible highlight is never what a caller means). Exception: the bounding
  // shapes default an unset alpha to 0.3, not opaque — a fully opaque box would hide the
  // entity it frames, which is likewise never what a caller means.
  float alpha = 5;
  HighlightShape shape = 6;  // how matched entities draw; unset means OUTLINE (WS9-016)
  // stroke_scale multiplies the PATH highlighter's width (WS9-044), so a user can make the
  // focus marker thicker or thinner. 0/unset means 1 (the default width). Only PATH reads it;
  // OUTLINE and the bounding shapes ignore it.
  float stroke_scale = 7;
}

// PackedHighlight is the packed projection of highlight specs against one PackedSheet: for
// each input spec (same order), the indices of the primitives it selects. The client redraws
// those primitives in the group's color/alpha above the base geometry — no new vertices
// cross the wire, the group joins the already-uploaded buffer by index.
message PackedHighlight {
  message Group {
    string color = 1;               // "#rrggbb"; empty means the renderer's default
    float alpha = 2;                // (0,1]; 0/unset means opaque, as in HighlightSpec
    repeated uint32 primitives = 3; // indices into PackedSheet.primitives, ascending
    // Echo of the spec's shape so a packed consumer knows what to draw. The wire stays
    // index-only for every shape: a bounding-shape consumer computes each entity's bounds
    // locally from the vertices it already holds (grouping indices by its PrimitiveKeys).
    HighlightShape shape = 4;
  }
  repeated Group groups = 1;  // one per input HighlightSpec, in request order
}

// PackedLabel is one text label positioned in sheet-relative world coordinates (rebased by
// origin_x/origin_y, the same as the vertex blob). A GPU line pipeline draws no glyphs, so
// text is drawn by an overlay above the geometry (text metrics are browser-owned, docs/14).
// The server computes the world position and the color with the same transform math the SVG
// backend uses, so the overlay and the SVG oracle agree; the browser only maps world->screen
// with the view camera. O(labels), stays structured (like keys).
message PackedLabel {
  int32 x = 1;             // sheet-relative world origin (rebased, like the vertex blob)
  int32 y = 2;
  string text = 3;
  int32 height = 4;        // text height in world units; the camera scales it to pixels
  int32 rotation_deg = 5;  // degrees counter-clockwise (Y-up); 0/90/180/270 typical
  string justify = 6;      // canonical "<h> <v>" alignment (see geom.Label.justify)
  string color = 7;        // "#rrggbb", chosen server-side to match the SVG oracle
  int32 max_width = 8;     // world-space width to condense the run into (0 = unbounded). A symbol
                           // caption gets its box width here; the overlay squeezes glyphs to fit
                           // (textLength) rather than spilling past the box, matching the SVG backend.
  // No font field yet: every renderer draws one font (monospace, matching the SVG backend),
  // and the geom IR carries no per-text font. Add `string font` here once a reader populates
  // per-element font on the IR; it is an additive change, so nothing is lost by waiting.
}

// PackedImage is one raster image positioned in sheet-relative world coordinates (rebased by
// origin_x/origin_y, like PackedLabel and the vertex blob). A GPU line pipeline draws no
// raster, so images ride the same overlay above the geometry as text: the browser positions an
// <image> with the per-frame camera transform. x/y is the world min corner and w/h the bbox
// span, so the client bakes the Y-up->Y-down flip the same way it does for labels. data is the
// raw image bytes (not a data URI) to avoid base64 bloat on the binary transport; the client
// builds "data:<mime>;base64,...". Sheet-level only for now (SymbolDef images are not drawn in
// the SVG backend either), so the overlay stays in step with the SVG oracle.
message PackedImage {
  int32 x = 1;             // sheet-relative world min-x (rebased)
  int32 y = 2;             // sheet-relative world min-y (rebased)
  int32 w = 3;             // world width (bbox span)
  int32 h = 4;             // world height (bbox span)
  string mime = 5;         // e.g. "image/png"; empty defaults to image/png
  bytes data = 6;          // raw image bytes; the client base64-encodes into the data URI
  int32 rotation_deg = 7;  // degrees counter-clockwise (Y-up), matching geom.Image
  bool mirror = 8;         // mirror across the y-axis (flip x) before rotation
}

// PackedSheet is the GPU-upload form of one sheet's vertex geometry. Coordinates are
// int32 and sheet-relative (subtract origin_x/origin_y) because a GPU vertex pipeline has
// no 64-bit vertex attribute; rebasing bounds them by the sheet extent so int32 is exact.
message PackedSheet {
  string sheet_id = 1;
  int32 layout_version = 2;  // owned here; bump on layout change
  int64 origin_x = 3;        // sheet min corner; blob coords are relative to this
  int64 origin_y = 4;
  // int32 LE pairs, sheet-relative: [x0,y0,x1,y1,...].
  bytes vertices = 5;
  // Fixed-width LE records: (kind:u8, group:u8, _pad:u16, first_vertex:u32, count:u32).
  bytes primitives = 6;
  repeated PrimitiveKey keys = 7;   // O(primitives), stays structured
  repeated PackedLabel labels = 8;  // O(labels), stays structured; drawn by the text overlay
  // The default font-family for the sheet's text (render.Style.Font), so the overlay draws in
  // the same face the SVG backend uses. One face per sheet; per-element font is not carried yet.
  string font_family = 9;
  // Geometry colors indexed by primitive group (0 symbol, 1 wire, 2 pin, 3 free, 4 frame),
  // resolved server-side from render.Style so the WebGL renderer colors geometry from the same
  // palette as the SVG backend instead of a hardcoded client map. "#rrggbb".
  repeated string group_colors = 10;
  // The page background color (render.Style.Page), so the WebGL canvas clears to the same
  // background the SVG backend paints. "#rrggbb".
  string background_color = 11;
  // Sheet-level raster images (logos, notes), rebased to origin_x/origin_y; drawn by the
  // overlay above the geometry. O(images), stays structured (like labels).
  repeated PackedImage images = 12;
}
