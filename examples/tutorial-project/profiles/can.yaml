# This project's CAN profile. It has the same NAME as the built-in CAN profile, which is what makes
# it supersede it: the overlay's rules replace the built-in's for this run rather than running
# alongside them. That is the point of the file. The house always routes the transceiver's standby
# pin back to the MCU so firmware can put the bus to sleep, and the built-in profile has no opinion
# about STB because it is a house practice, not a CAN requirement.
#
# Supersession is worth being deliberate about. Because this replaces the built-in rules wholesale,
# anything the built-in checked and this file omits stops being checked, silently. So the signals and
# requirements below repeat the built-in set rather than listing only the delta.
name: CAN
host: {attr: interface, value: CAN}
signals:
  - {name: CANH, suffix: _CANH, anchor: true}
  - {name: CANL, suffix: _CANL}
  - {name: TXD,  suffix: _TXD}
  - {name: RXD,  suffix: _RXD}
  - {name: STB,  suffix: _STB}
requirements:
  - {type: signal-missing}
  - {type: host-incomplete}
  - {type: termination, params: {high: _CANH, low: _CANL}}
  - {type: signal-dangling}
  - {type: esd}
