# A checklist of this team's own questions, answered by its own library (lib/house.dl). It sits
# beside review.yaml rather than inside it so the tutorial's checklist keeps the counts its pages
# teach with. Run it with
#
#   agni review designs/gateway --checklist house-review.yaml
#
# An inline query here compiles against the vocabulary the review runs with: the shipped library,
# this project's lib/, and anything sent with --lib.
name: Gateway house checklist
areas:
  - name: Bring-up
    items:
      - id: "P6"
        title: every rail the PMIC drives has a test point
        description: >-
          house.pmic_rail names the PMIC's rails by this team's PMIC_ convention, and
          house.pmic_probe_point the ones a probe can reach. The query matches the rails with no
          test point, the violation.
        query:
          match: 'house.pmic_rail(?n), not house.pmic_probe_point(?n) => ?n'
          subject: n
          kind: net
          message: 'PMIC rail {n} has no test point'
