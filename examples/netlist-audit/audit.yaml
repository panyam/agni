# A netlist audit as a query set: every table a review workbook holds, answered over one read of
# the design. Run it with
#
#   agni query <design> --set audit.yaml --format markdown
#
# The tables call the shipped library (stdlib/lib) for what they share, such as net.has_test_point
# and component.probed_both, so the set needs no preamble and each query reads as the question it
# asks. `agni query --relations component.probed_both` prints a member's definition. Pass/fail
# questions (is every I2C line pulled up?) are checks, not tables: run them with `agni check`.
title: Netlist audit
queries:
  - name: Parts on nets
    description: Every part and the nets it lands on.
    query: component.net(?part, ?net) => ?part, ?net
  - name: Part numbers
    query: component.mpn(?part, ?mpn) => ?part, ?mpn
  - name: Net count
    query: entity(?net, "net") => count(?net)
  - name: Test points per net
    description: Nets carrying a test point, and which ones.
    query: component.net(?tp, ?net), component.class(?tp, "test_point") => ?net, count(distinct ?tp), list(distinct ?tp)
  - name: Nets with no test point
    query: entity(?net, "net"), not net.has_test_point(?net) => ?net
  - name: Ground test points
    description: Compare against your house ratio, for example one per 30 nets.
    query: net.ground(?net), component.net(?tp, ?net), component.class(?tp, "test_point") => count(distinct ?tp)
  - name: Two-terminal parts probed on both nets
    description: Parts an in-circuit tester can measure across their two nets.
    query: component.probed_both(?part), component.mpn(?part, ?mpn) => ?mpn, ?part
  - name: Two-terminal parts probed on one net
    description: The probed net, then the one with no test point.
    query: component.probed_one(?part, ?probed, ?unprobed), component.mpn(?part, ?mpn) => ?mpn, ?part, ?probed, ?unprobed
  - name: MPNs never probed on both nets
    description: Part numbers where no placed two-terminal part has a test point on both of its nets.
    query: |
      mpn_probed(?m) :- component.mpn(?r, ?m), component.probed_both(?r);
      component.two_terminal(?part, ?a, ?b), component.mpn(?part, ?mpn), not mpn_probed(?mpn) => ?mpn, list(distinct ?part)
