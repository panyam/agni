# What makes this folder a DESIGN, and the one file in it that is ours. The KiCad files beside it are
# Antmicro's, copied in by `make board`, so this descriptor says which of them analysis reads, which
# is the same board's copper, and what the board is meant to be.
#
# `entry` is the root schematic, which walks the other fourteen sheets. `companions` is the board,
# geometry to draw and the copper the board-tier rules check, never a second netlist.
name: jetson-agx-thor-baseboard
title: Jetson AGX Thor baseboard
entry: jetson-agx-thor-baseboard.kicad_sch
companions:
  - jetson-agx-thor-baseboard.kicad_pcb

# Every connector is a way into the board unless declared otherwise, which is right for a cable
# entry and wrong for a module socket. These are the ones that join this board to another part of
# the same product. The USB-C ports, the SFP cage, the power entry and the two JST-SH I2C ports are
# left undeclared, because a user plugs cables into them.
intent:
  components:
    J1:  {exposure: internal}   # Jetson AGX Thor module, board-to-board
    J8:  {exposure: internal}   # FMC+ expansion power, mates with J18's accessory
    J18: {exposure: internal}   # FMC+ expansion mezzanine
    J13: {exposure: internal}   # M.2 key-M, NVMe card
    J14: {exposure: internal}   # M.2 key-E, wireless card
    J10: {exposure: internal}   # CSI camera FFC, cabled to a camera inside the product
    J11: {exposure: internal}   # CSI camera FFC
    J15: {exposure: internal}   # fan
    J4:  {exposure: internal}   # Tag-Connect debug pads, used in manufacturing
    J20: {exposure: internal}   # Tag-Connect debug pads
