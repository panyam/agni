<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="680" height="250" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="profile-signal-missing rule: an in-use SPI-NOR interface missing one of its required signals is flagged; one with all six is fine">
