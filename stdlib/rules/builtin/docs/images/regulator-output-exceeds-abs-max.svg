<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="680" height="250" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="regulator-output-exceeds-abs-max rule: a regulator whose datasheet output exceeds the absolute maximum of a part it feeds is flagged; an output under it is fine">
  <rect x="1" y="1" width="678" height="248" rx="10" fill="#f8f9fb" stroke="#e3e6eb"/>
  <line x1="340" y1="24" x2="340" y2="226" stroke="#e3e6eb" stroke-dasharray="4 4"/>
  <text x="30" y="42" font-size="15" fill="#d64545" font-weight="600">Flagged</text>
  <text x="30" y="60" font-size="11.5" fill="#6b7280">regulator output over a load's abs-max</text>
  <text x="370" y="42" font-size="15" fill="#2f9e57" font-weight="600">Fine</text>
  <text x="370" y="60" font-size="11.5" fill="#6b7280">output under the load's abs-max</text>
  <rect x="20" y="96" width="76" height="48" rx="3" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="58.0" y="118.0" font-size="13" fill="#394049" font-weight="600" text-anchor="middle">U2</text>
  <text x="58.0" y="133.0" font-size="10" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">VOUT 5 V</text>
  <line x1="96" y1="120" x2="130" y2="120" stroke="#d64545" stroke-width="2.5"/>
  <rect x="130" y="112" width="40" height="16" rx="2" fill="#ffffff" stroke="#d64545" stroke-width="2"/>
  <text x="150" y="146" font-size="10" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">FB1</text>
  <line x1="170" y1="120" x2="220" y2="120" stroke="#d64545" stroke-width="2.5"/>
  <text x="195" y="110" font-size="10" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">VOUT_A</text>
  <rect x="220" y="96" width="100" height="48" rx="3" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="270.0" y="118.0" font-size="13" fill="#394049" font-weight="600" text-anchor="middle">U1</text>
  <text x="270.0" y="133.0" font-size="10" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">abs-max 3.6 V</text>
  <text x="170" y="192" font-size="12" fill="#d64545" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">5 V  &gt;  3.6 V abs-max</text>
  <text x="170" y="214" font-size="11" fill="#6b7280" text-anchor="middle">both values from datasheets</text>
  <rect x="360" y="96" width="76" height="48" rx="3" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="398.0" y="118.0" font-size="13" fill="#394049" font-weight="600" text-anchor="middle">U2</text>
  <text x="398.0" y="133.0" font-size="10" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">VOUT 3.3 V</text>
  <line x1="436" y1="120" x2="470" y2="120" stroke="#394049" stroke-width="2"/>
  <rect x="470" y="112" width="40" height="16" rx="2" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="490" y="146" font-size="10" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">FB1</text>
  <line x1="510" y1="120" x2="560" y2="120" stroke="#394049" stroke-width="2"/>
  <text x="535" y="110" font-size="10" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">VOUT_A</text>
  <rect x="560" y="96" width="100" height="48" rx="3" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="610.0" y="118.0" font-size="13" fill="#394049" font-weight="600" text-anchor="middle">U1</text>
  <text x="610.0" y="133.0" font-size="10" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">abs-max 3.6 V</text>
  <text x="510" y="192" font-size="12" fill="#2f9e57" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">3.3 V  ≤  3.6 V abs-max</text>
  <text x="510" y="214" font-size="11" fill="#6b7280" text-anchor="middle">both values from datasheets</text>
</svg>
