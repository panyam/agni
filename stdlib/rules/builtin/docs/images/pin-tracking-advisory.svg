<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="680" height="250" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="pin-tracking-advisory rule: a datasheet recommending OE at least 1 V above VREF, missed by the rails, is flagged as advice; rails that meet it are fine">
  <rect x="1" y="1" width="678" height="248" rx="10" fill="#f8f9fb" stroke="#e3e6eb"/>
  <line x1="340" y1="24" x2="340" y2="226" stroke="#e3e6eb" stroke-dasharray="4 4"/>
  <text x="30" y="42" font-size="15" fill="#b7791f" font-weight="600">Advisory</text>
  <text x="30" y="60" font-size="11.5" fill="#6b7280">recommends OE - VREF ≥ 1 V</text>
  <text x="370" y="42" font-size="15" fill="#2f9e57" font-weight="600">Fine</text>
  <text x="370" y="60" font-size="11.5" fill="#6b7280">the recommendation holds</text>
  <rect x="110" y="84" width="100" height="110" rx="3" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="160.0" y="143.0" font-size="13" fill="#394049" font-weight="600" text-anchor="middle">U1</text>
  <text x="160" y="112" font-size="10" fill="#6b7280" text-anchor="middle">level shifter</text>
  <line x1="20" y1="140" x2="110" y2="140" stroke="#b7791f" stroke-width="2.5"/>
  <text x="20" y="133" font-size="11.5" fill="#b7791f" font-family="ui-monospace, Menlo, Consolas, monospace">+3V3</text>
  <text x="116" y="144" font-size="10" fill="#6b7280" font-family="ui-monospace, Menlo, Consolas, monospace">OE</text>
  <line x1="20" y1="172" x2="110" y2="172" stroke="#b7791f" stroke-width="2.5"/>
  <text x="20" y="165" font-size="11.5" fill="#b7791f" font-family="ui-monospace, Menlo, Consolas, monospace">+3V3</text>
  <text x="116" y="176" font-size="10" fill="#6b7280" font-family="ui-monospace, Menlo, Consolas, monospace">VREF</text>
  <text x="170" y="224" font-size="12" fill="#b7791f" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">3.3 - 3.3 = 0 V  &lt;  1 V</text>
  <rect x="450" y="84" width="100" height="110" rx="3" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="500.0" y="143.0" font-size="13" fill="#394049" font-weight="600" text-anchor="middle">U1</text>
  <text x="500" y="112" font-size="10" fill="#6b7280" text-anchor="middle">level shifter</text>
  <line x1="360" y1="140" x2="450" y2="140" stroke="#394049" stroke-width="2"/>
  <text x="360" y="133" font-size="11.5" fill="#394049" font-family="ui-monospace, Menlo, Consolas, monospace">+5V</text>
  <text x="456" y="144" font-size="10" fill="#6b7280" font-family="ui-monospace, Menlo, Consolas, monospace">OE</text>
  <line x1="360" y1="172" x2="450" y2="172" stroke="#394049" stroke-width="2"/>
  <text x="360" y="165" font-size="11.5" fill="#394049" font-family="ui-monospace, Menlo, Consolas, monospace">+3V3</text>
  <text x="456" y="176" font-size="10" fill="#6b7280" font-family="ui-monospace, Menlo, Consolas, monospace">VREF</text>
  <text x="510" y="224" font-size="12" fill="#2f9e57" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">5 - 3.3 = 1.7 V  ≥  1 V</text>
</svg>
