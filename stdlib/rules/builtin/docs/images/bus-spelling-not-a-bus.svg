<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="680" height="250" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="bus-spelling-not-a-bus rule: in KiCad a range label spelled with a colon is one net, while KiCad's own two-dot spelling is a bus of eight">
  <rect x="1" y="1" width="678" height="248" rx="10" fill="#f8f9fb" stroke="#e3e6eb"/>
  <line x1="340" y1="24" x2="340" y2="226" stroke="#e3e6eb" stroke-dasharray="4 4"/>
  <text x="30" y="42" font-size="15" fill="#d64545" font-weight="600">Flagged</text>
  <text x="30" y="60" font-size="11.5" fill="#6b7280">a range KiCad reads as one net</text>
  <text x="370" y="42" font-size="15" fill="#2f9e57" font-weight="600">Fine</text>
  <text x="370" y="60" font-size="11.5" fill="#6b7280">KiCad's own bus spelling</text>
  <line x1="40" y1="120" x2="300" y2="120" stroke="#d64545" stroke-width="4"/>
  <text x="170" y="108" font-size="13" fill="#d64545" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">DATA[7:0]</text>
  <text x="170" y="160" font-size="12" fill="#d64545" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">one net, named DATA[7:0]</text>
  <text x="170" y="200" font-size="11" fill="#6b7280" text-anchor="middle">the author meant eight signals</text>
  <line x1="380" y1="120" x2="640" y2="120" stroke="#394049" stroke-width="4"/>
  <text x="510" y="108" font-size="13" fill="#394049" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">DATA[0..7]</text>
  <line x1="420" y1="120" x2="420" y2="146" stroke="#394049" stroke-width="1.5"/>
  <line x1="480" y1="120" x2="480" y2="146" stroke="#394049" stroke-width="1.5"/>
  <line x1="600" y1="120" x2="600" y2="146" stroke="#394049" stroke-width="1.5"/>
  <text x="540" y="141" font-size="12" fill="#6b7280" text-anchor="middle">...</text>
  <text x="510" y="172" font-size="12" fill="#2f9e57" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">eight nets, DATA0 to DATA7</text>
  <text x="510" y="200" font-size="11" fill="#6b7280" text-anchor="middle">xschem and gEDA read [7:0] this way</text>
</svg>
