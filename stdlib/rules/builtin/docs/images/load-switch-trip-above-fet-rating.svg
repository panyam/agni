<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="680" height="250" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="load-switch-trip-above-fet-rating rule: a controller that trips above its external FET's continuous rating is flagged; one that trips below it is fine">
  <rect x="1" y="1" width="678" height="248" rx="10" fill="#f8f9fb" stroke="#e3e6eb"/>
  <line x1="340" y1="24" x2="340" y2="226" stroke="#e3e6eb" stroke-dasharray="4 4"/>
  <text x="30" y="42" font-size="15" fill="#d64545" font-weight="600">Flagged</text>
  <text x="30" y="60" font-size="11.5" fill="#6b7280">trips above the FET's rating</text>
  <text x="370" y="42" font-size="15" fill="#2f9e57" font-weight="600">Fine</text>
  <text x="370" y="60" font-size="11.5" fill="#6b7280">trips below the FET's rating</text>
  <rect x="80" y="72" width="160" height="40" rx="3" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="160.0" y="90.0" font-size="13" fill="#394049" font-weight="600" text-anchor="middle">controller</text>
  <text x="160.0" y="105.0" font-size="10" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">V(OCP) 50 mV</text>
