  <rect x="80" y="152" width="56" height="16" rx="2" fill="#ffffff" stroke="#d64545" stroke-width="2"/>
  <text x="108" y="186" font-size="10" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">Rsns 10 mΩ</text>
  <line x1="136" y1="160" x2="190" y2="160" stroke="#394049" stroke-width="2"/>
  <rect x="190" y="140" width="70" height="40" rx="3" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="225.0" y="158.0" font-size="13" fill="#394049" font-weight="600" text-anchor="middle">Q1</text>
  <text x="225.0" y="173.0" font-size="10" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">ID 3 A</text>
  <line x1="260" y1="160" x2="320" y2="160" stroke="#394049" stroke-width="2"/>
  <text x="320" y="150" font-size="11" fill="#6b7280" text-anchor="end">load</text>
  <line x1="108" y1="112" x2="108" y2="152" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="225" y1="112" x2="225" y2="140" stroke="#6b7280" stroke-width="1.2"/>
  <text x="170" y="224" font-size="12" fill="#d64545" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">trips at 5 A  &gt;  3 A rating</text>
  <rect x="420" y="72" width="160" height="40" rx="3" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="500.0" y="90.0" font-size="13" fill="#394049" font-weight="600" text-anchor="middle">controller</text>
  <text x="500.0" y="105.0" font-size="10" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">V(OCP) 50 mV</text>
  <line x1="370" y1="160" x2="420" y2="160" stroke="#394049" stroke-width="2"/>
  <rect x="420" y="152" width="56" height="16" rx="2" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="448" y="186" font-size="10" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">Rsns 25 mΩ</text>
  <line x1="476" y1="160" x2="530" y2="160" stroke="#394049" stroke-width="2"/>
  <rect x="530" y="140" width="70" height="40" rx="3" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="565.0" y="158.0" font-size="13" fill="#394049" font-weight="600" text-anchor="middle">Q1</text>
  <text x="565.0" y="173.0" font-size="10" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">ID 3 A</text>
  <line x1="600" y1="160" x2="660" y2="160" stroke="#394049" stroke-width="2"/>
  <text x="660" y="150" font-size="11" fill="#6b7280" text-anchor="end">load</text>
  <line x1="448" y1="112" x2="448" y2="152" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="565" y1="112" x2="565" y2="140" stroke="#6b7280" stroke-width="1.2"/>
  <text x="510" y="224" font-size="12" fill="#2f9e57" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">trips at 2 A  ≤  3 A rating</text>
</svg>
