<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="680" height="250" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="rail-not-classified rule: a net whose name states a voltage and which feeds a supply pin, but is not a rail, is flagged; the same net with the project's rail pattern is fine">
  <rect x="1" y="1" width="678" height="248" rx="10" fill="#f8f9fb" stroke="#e3e6eb"/>
  <line x1="340" y1="24" x2="340" y2="226" stroke="#e3e6eb" stroke-dasharray="4 4"/>
  <text x="30" y="42" font-size="15" fill="#d64545" font-weight="600">Flagged</text>
  <text x="30" y="60" font-size="11.5" fill="#6b7280">named like a rail, read as a signal</text>
  <text x="370" y="42" font-size="15" fill="#2f9e57" font-weight="600">Fine</text>
  <text x="370" y="60" font-size="11.5" fill="#6b7280">the project's rail pattern</text>
  <line x1="20" y1="130" x2="190" y2="130" stroke="#d64545" stroke-width="2.5"/>
  <text x="20" y="120" font-size="12" fill="#d64545" font-family="ui-monospace, Menlo, Consolas, monospace">SENSOR_5V0</text>
  <rect x="190" y="106" width="86" height="48" rx="3" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="233.0" y="128.0" font-size="13" fill="#394049" font-weight="600" text-anchor="middle">U1</text>
  <text x="233.0" y="143.0" font-size="10" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">VDD</text>
  <text x="170" y="192" font-size="12" fill="#d64545" text-anchor="middle">not a rail, so rail rules skip it</text>
  <text x="170" y="214" font-size="11" fill="#6b7280" text-anchor="middle">no built-in pattern matches</text>
  <line x1="360" y1="130" x2="530" y2="130" stroke="#394049" stroke-width="2"/>
  <text x="360" y="120" font-size="12" fill="#394049" font-family="ui-monospace, Menlo, Consolas, monospace">SENSOR_5V0</text>
  <rect x="530" y="106" width="86" height="48" rx="3" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="573.0" y="128.0" font-size="13" fill="#394049" font-weight="600" text-anchor="middle">U1</text>
  <text x="573.0" y="143.0" font-size="10" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">VDD</text>
  <text x="510" y="192" font-size="12" fill="#2f9e57" text-anchor="middle">a rail, so rail rules see it</text>
  <text x="510" y="214" font-size="11" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">conventions lexicon: ^SENSOR_</text>
</svg>
