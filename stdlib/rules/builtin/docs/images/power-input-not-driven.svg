<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" width="700" height="290" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="power-input-not-driven rule: a power-input pin with no power-output driver and no power flag is flagged; a net driven by a power-output pin or asserted by a power flag is fine">
  <!-- card -->
  <rect x="1" y="1" width="698" height="288" rx="10" fill="#f8f9fb" stroke="#e3e6eb"/>
  <line x1="340" y1="24" x2="340" y2="266" stroke="#e3e6eb" stroke-dasharray="4 4"/>

  <!-- ================= LEFT: flagged ================= -->
  <text x="30" y="42" font-size="15" font-weight="600" fill="#d64545">Flagged: power_in, no source</text>

  <!-- U1 IC box -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <rect x="44" y="108" width="60" height="48" rx="3" fill="#ffffff"/>
    <line x1="104" y1="132" x2="128" y2="132"/>
  </g>
  <text x="74" y="136" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">U1</text>

  <!-- flagged net VDD in red ending at an open (undriven) node -->
  <g stroke="#d64545" stroke-width="2.5" fill="none">
    <line x1="128" y1="132" x2="266" y2="132"/>
    <circle cx="272" cy="132" r="6" fill="#f8f9fb"/>
  </g>
  <text x="200" y="120" font-size="12" fill="#d64545" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">VDD</text>
  <text x="150" y="176" font-size="11" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">U1.vdd (power_in)</text>
  <text x="272" y="176" font-size="11" fill="#d64545" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">no driver</text>

  <text x="175" y="256" font-size="13" fill="#d64545" text-anchor="middle">power_in, no power_out, no flag -&gt; flagged</text>

  <!-- ================= RIGHT: fine ================= -->
  <text x="370" y="42" font-size="15" font-weight="600" fill="#2f9e57">Fine: net is driven</text>

  <!-- scenario A: driven by a power_out pin -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <rect x="378" y="72" width="52" height="40" rx="3" fill="#ffffff"/>
    <line x1="430" y1="92" x2="454" y2="92"/>
  </g>
  <text x="404" y="96" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">U1</text>

  <g stroke="#2f9e57" stroke-width="2.5" fill="none">
    <line x1="454" y1="92" x2="602" y2="92"/>
  </g>
  <circle cx="528" cy="92" r="4" fill="#394049"/>
  <text x="528" y="80" font-size="12" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">VDD</text>

  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="602" y1="92" x2="626" y2="92"/>
    <rect x="626" y="72" width="52" height="40" rx="3" fill="#ffffff"/>
  </g>
  <text x="652" y="96" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">REG</text>
  <text x="558" y="126" font-size="11" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">REG.out (power_out)</text>

  <!-- scenario B: asserted by a power flag -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <rect x="378" y="164" width="52" height="40" rx="3" fill="#ffffff"/>
    <line x1="430" y1="184" x2="454" y2="184"/>
  </g>
  <text x="404" y="188" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">U1</text>

  <g stroke="#2f9e57" stroke-width="2.5" fill="none">
    <line x1="454" y1="184" x2="588" y2="184"/>
  </g>
  <text x="512" y="172" font-size="12" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">VDD</text>

  <!-- PWR_FLAG symbol: pin stub up into a flag box -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="588" y1="184" x2="588" y2="164"/>
    <rect x="558" y="140" width="60" height="24" rx="3" fill="#ffffff"/>
  </g>
  <text x="588" y="156" font-size="10" font-weight="600" fill="#394049" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">PWR_FLAG</text>

  <text x="510" y="256" font-size="13" fill="#2f9e57" text-anchor="middle">power_out or power flag on the net -&gt; fine</text>
</svg>
