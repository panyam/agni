<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="680" height="280" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="io-map-coverage rule: nets the IO map never names are reported not-considered, which is not a defect; nets it names are considered">
  <rect x="1" y="1" width="678" height="278" rx="10" fill="#f8f9fb" stroke="#e3e6eb"/>
  <line x1="340" y1="24" x2="340" y2="226" stroke="#e3e6eb" stroke-dasharray="4 4"/>
  <text x="30" y="42" font-size="15" fill="#b7791f" font-weight="600">Not considered</text>
  <text x="30" y="60" font-size="11.5" fill="#6b7280">nets the map never names</text>
  <text x="370" y="42" font-size="15" fill="#2f9e57" font-weight="600">Fine</text>
  <text x="370" y="60" font-size="11.5" fill="#6b7280">nets the map names</text>
  <text x="340" y="266" font-size="11.5" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">design.yaml io_map names 200 of the design's 1,600 nets</text>
  <text x="60" y="96" font-size="11.5" fill="#394049" font-family="ui-monospace, Menlo, Consolas, monospace">LED_STATUS</text>
  <text x="60" y="116" font-size="11.5" fill="#394049" font-family="ui-monospace, Menlo, Consolas, monospace">FAN_TACH</text>
  <text x="60" y="136" font-size="11.5" fill="#394049" font-family="ui-monospace, Menlo, Consolas, monospace">GND</text>
  <text x="60" y="156" font-size="11.5" fill="#394049" font-family="ui-monospace, Menlo, Consolas, monospace">+3V3</text>
  <text x="60" y="176" font-size="11.5" fill="#6b7280" font-family="ui-monospace, Menlo, Consolas, monospace">...</text>
  <text x="170" y="214" font-size="12" fill="#b7791f" text-anchor="middle">1,400 unexamined, not clean</text>
  <text x="170" y="236" font-size="11" fill="#6b7280" text-anchor="middle">rails and grounds are counted too</text>
  <text x="400" y="96" font-size="11.5" fill="#394049" font-family="ui-monospace, Menlo, Consolas, monospace">BLE_UART_RX</text>
  <text x="400" y="116" font-size="11.5" fill="#394049" font-family="ui-monospace, Menlo, Consolas, monospace">SPI_MISO</text>
  <text x="400" y="136" font-size="11.5" fill="#394049" font-family="ui-monospace, Menlo, Consolas, monospace">PMIC_PG</text>
  <text x="400" y="156" font-size="11.5" fill="#394049" font-family="ui-monospace, Menlo, Consolas, monospace">MCU_NRST</text>
  <text x="400" y="176" font-size="11.5" fill="#6b7280" font-family="ui-monospace, Menlo, Consolas, monospace">...</text>
  <text x="510" y="214" font-size="12" fill="#2f9e57" text-anchor="middle">200 checked against the map</text>
  <text x="510" y="236" font-size="11" fill="#6b7280" text-anchor="middle">each gets a pass or a fail</text>
</svg>
