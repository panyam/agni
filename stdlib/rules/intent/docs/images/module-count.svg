<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" width="700" height="290" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="module-count rule: a module declared with count 2 but only one instance present is flagged; two instances is fine">
  <!-- card -->
  <rect x="1" y="1" width="698" height="288" rx="10" fill="#f8f9fb" stroke="#e3e6eb"/>
  <line x1="350" y1="24" x2="350" y2="252" stroke="#e3e6eb" stroke-dasharray="4 4"/>
  <text x="350" y="278" font-size="12" fill="#6b7280" text-anchor="middle">intent.yaml declares the exact count (modules: class can_transceiver, count 2)</text>

  <!-- ================= LEFT: flagged (too few) ================= -->
  <text x="30" y="42" font-size="15" font-weight="600" fill="#d64545">Flagged: 1 of 2 present</text>

  <!-- one transceiver present -->
  <g stroke="#2f9e57" stroke-width="2" fill="none">
    <rect x="60" y="98" width="90" height="48" rx="4" fill="#ffffff"/>
  </g>
  <text x="105" y="90" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">U1</text>
  <text x="105" y="126" font-size="11" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">can_transceiver</text>

  <!-- ghost second instance -->
  <g stroke="#d64545" stroke-width="2" stroke-dasharray="5 4" fill="none">
    <rect x="200" y="98" width="90" height="48" rx="4" fill="#ffffff"/>
  </g>
  <text x="245" y="128" font-size="16" fill="#d64545" text-anchor="middle">missing</text>

  <text x="175" y="196" font-size="20" font-weight="600" fill="#d64545" text-anchor="middle">found 1 / expected 2</text>
  <text x="175" y="234" font-size="13" fill="#d64545" text-anchor="middle">count differs &#8594; flagged</text>

  <!-- ================= RIGHT: fine (exact count) ================= -->
  <text x="378" y="42" font-size="15" font-weight="600" fill="#2f9e57">Fine: 2 of 2 present</text>

  <g stroke="#2f9e57" stroke-width="2" fill="none">
    <rect x="410" y="98" width="90" height="48" rx="4" fill="#ffffff"/>
  </g>
  <text x="455" y="90" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">U2</text>
  <text x="455" y="126" font-size="11" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">can_transceiver</text>

  <g stroke="#2f9e57" stroke-width="2" fill="none">
    <rect x="550" y="98" width="90" height="48" rx="4" fill="#ffffff"/>
  </g>
  <text x="595" y="90" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">U3</text>
  <text x="595" y="126" font-size="11" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">can_transceiver</text>

  <text x="525" y="196" font-size="20" font-weight="600" fill="#2f9e57" text-anchor="middle">found 2 / expected 2</text>
  <text x="525" y="234" font-size="13" fill="#2f9e57" text-anchor="middle">count matches &#8594; fine</text>
</svg>
