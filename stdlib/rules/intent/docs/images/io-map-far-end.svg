<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="680" height="280" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="io-map-far-end rule: an IO map row whose net does not arrive at its declared far-end device is flagged; one that arrives is fine">
  <rect x="1" y="1" width="678" height="278" rx="10" fill="#f8f9fb" stroke="#e3e6eb"/>
  <line x1="340" y1="24" x2="340" y2="226" stroke="#e3e6eb" stroke-dasharray="4 4"/>
  <text x="30" y="42" font-size="15" fill="#d64545" font-weight="600">Flagged</text>
  <text x="30" y="60" font-size="11.5" fill="#6b7280">the net reaches another part</text>
  <text x="370" y="42" font-size="15" fill="#2f9e57" font-weight="600">Fine</text>
  <text x="370" y="60" font-size="11.5" fill="#6b7280">the net reaches U7000.PG</text>
  <text x="340" y="266" font-size="11.5" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">io_map  {net: PMIC_PG, device: U101, pin: PTC11, to: {device: U7000, pin: PG}}</text>
  <rect x="20" y="100" width="70" height="44" rx="3" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="55.0" y="120.0" font-size="13" fill="#394049" font-weight="600" text-anchor="middle">U101</text>
  <text x="55.0" y="135.0" font-size="10" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">PTC11</text>
  <line x1="90" y1="122" x2="140" y2="122" stroke="#d64545" stroke-width="2.5"/>
  <rect x="140" y="115" width="26" height="14" rx="2" fill="#ffffff" stroke="#d64545" stroke-width="2"/>
  <text x="153" y="146" font-size="10" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">R3</text>
  <line x1="166" y1="122" x2="226" y2="122" stroke="#d64545" stroke-width="2.5"/>
  <rect x="226" y="100" width="80" height="44" rx="3" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="266.0" y="120.0" font-size="13" fill="#394049" font-weight="600" text-anchor="middle">U9</text>
  <text x="266.0" y="135.0" font-size="10" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">EN</text>
  <text x="115" y="112" font-size="10" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">PMIC_PG</text>
  <text x="165" y="196" font-size="12" fill="#d64545" text-anchor="middle">arrives at U9.EN, not U7000.PG</text>
  <text x="165" y="220" font-size="11" fill="#6b7280" text-anchor="middle">the walk crosses series parts</text>
  <rect x="360" y="100" width="70" height="44" rx="3" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="395.0" y="120.0" font-size="13" fill="#394049" font-weight="600" text-anchor="middle">U101</text>
  <text x="395.0" y="135.0" font-size="10" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">PTC11</text>
  <line x1="430" y1="122" x2="480" y2="122" stroke="#394049" stroke-width="2"/>
  <rect x="480" y="115" width="26" height="14" rx="2" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="493" y="146" font-size="10" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">R3</text>
  <line x1="506" y1="122" x2="566" y2="122" stroke="#394049" stroke-width="2"/>
  <rect x="566" y="100" width="80" height="44" rx="3" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="606.0" y="120.0" font-size="13" fill="#394049" font-weight="600" text-anchor="middle">U7000</text>
  <text x="606.0" y="135.0" font-size="10" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">PG</text>
  <text x="455" y="112" font-size="10" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">PMIC_PG</text>
  <text x="505" y="196" font-size="12" fill="#2f9e57" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">PMIC_PG -&gt; [R3] -&gt; U7000.PG</text>
  <text x="505" y="220" font-size="11" fill="#6b7280" text-anchor="middle">the walk crosses series parts</text>
</svg>
