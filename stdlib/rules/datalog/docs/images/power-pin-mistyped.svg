<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="680" height="250" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="power-pin-mistyped rule: a pin named VDD but typed passive, alone on its net, is flagged; the same pin wired to its rail is fine">
  <rect x="1" y="1" width="678" height="248" rx="10" fill="#f8f9fb" stroke="#e3e6eb"/>
  <line x1="340" y1="24" x2="340" y2="226" stroke="#e3e6eb" stroke-dasharray="4 4"/>
  <text x="30" y="42" font-size="15" fill="#d64545" font-weight="600">Flagged</text>
  <text x="30" y="60" font-size="11.5" fill="#6b7280">named VDD, typed passive, on a stub</text>
  <text x="370" y="42" font-size="15" fill="#2f9e57" font-weight="600">Fine</text>
  <text x="370" y="60" font-size="11.5" fill="#6b7280">the same pin on its rail</text>
  <rect x="170" y="92" width="90" height="76" rx="3" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="215" y="160" font-size="13" fill="#394049" font-weight="600" text-anchor="middle">U1</text>
  <text x="178" y="124" font-size="11" fill="#d64545" font-family="ui-monospace, Menlo, Consolas, monospace">VDD</text>
  <text x="178" y="140" font-size="10" fill="#6b7280" font-family="ui-monospace, Menlo, Consolas, monospace">passive</text>
  <line x1="130" y1="120" x2="170" y2="120" stroke="#d64545" stroke-width="2.5"/>
  <circle cx="130" cy="120" r="3.5" fill="#d64545"/>
  <text x="170" y="206" font-size="12" fill="#d64545" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">net.pin_count = 1</text>
  <text x="170" y="228" font-size="11" fill="#6b7280" text-anchor="middle">the name says power, the type does not</text>
  <rect x="510" y="92" width="90" height="76" rx="3" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="555" y="160" font-size="13" fill="#394049" font-weight="600" text-anchor="middle">U1</text>
  <text x="518" y="124" font-size="11" fill="#394049" font-family="ui-monospace, Menlo, Consolas, monospace">VDD</text>
  <text x="518" y="140" font-size="10" fill="#6b7280" font-family="ui-monospace, Menlo, Consolas, monospace">passive</text>
  <line x1="380" y1="120" x2="510" y2="120" stroke="#394049" stroke-width="2"/>
  <text x="380" y="110" font-size="11.5" fill="#394049" font-family="ui-monospace, Menlo, Consolas, monospace">+3V3</text>
  <text x="510" y="206" font-size="12" fill="#2f9e57" text-anchor="middle">not alone on its net</text>
  <text x="510" y="228" font-size="11" fill="#6b7280" text-anchor="middle">the name says power, the type does not</text>
</svg>
