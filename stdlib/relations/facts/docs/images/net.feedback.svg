<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="680" height="280" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="feedback relation: a divider tap into a regulator FB pin must not be probed; a plain output rail is probe-safe">
  <rect x="1" y="1" width="678" height="278" rx="10" fill="#f8f9fb" stroke="#e3e6eb"/>
  <line x1="340" y1="24" x2="340" y2="256" stroke="#e3e6eb" stroke-dasharray="4 4"/>

  <!-- LEFT: feedback / sense node -->
  <text x="30" y="42" font-size="15" font-weight="600" fill="#d64545">Feedback node: do not probe</text>

  <!-- regulator -->
  <rect x="44" y="96" width="54" height="70" rx="4" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="71" y="127" font-size="12" font-weight="600" fill="#394049" text-anchor="middle">REG</text>
  <text x="71" y="145" font-size="9" fill="#6b7280" text-anchor="middle">FB in</text>

  <!-- output wire to top of divider -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="98" y1="110" x2="160" y2="110"/>
    <line x1="160" y1="110" x2="160" y2="122"/>
  </g>
  <text x="176" y="108" font-size="11" fill="#6b7280" font-family="ui-monospace, Menlo, Consolas, monospace">VOUT</text>

  <!-- R1 -->
  <rect x="150" y="122" width="20" height="34" rx="2" fill="#ffffff" stroke="#394049" stroke-width="2"/>

  <!-- FB node -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="160" y1="156" x2="160" y2="172"/>
  </g>
  <circle cx="160" cy="172" r="4" fill="#d64545" stroke="none"/>
  <text x="176" y="176" font-size="11" fill="#d64545" font-family="ui-monospace, Menlo, Consolas, monospace">VOUT_FB</text>

  <!-- feedback wire back into REG FB pin -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="160" y1="172" x2="118" y2="172"/>
    <line x1="118" y1="172" x2="118" y2="140"/>
    <line x1="118" y1="140" x2="98" y2="140"/>
  </g>

  <!-- R2 -->
  <rect x="150" y="180" width="20" height="34" rx="2" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <line x1="160" y1="172" x2="160" y2="180" stroke="#394049" stroke-width="2"/>

  <!-- GND -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="160" y1="214" x2="160" y2="226"/>
    <line x1="148" y1="226" x2="172" y2="226"/>
    <line x1="152" y1="231" x2="168" y2="231"/>
    <line x1="156" y1="236" x2="164" y2="236"/>
  </g>

  <!-- probe on FB, flagged -->
  <g stroke="#d64545" stroke-width="2.5" fill="none">
    <line x1="160" y1="172" x2="214" y2="140"/>
  </g>
  <polygon points="160,172 172,168 168,180" fill="#d64545" stroke="none"/>
  <text x="220" y="138" font-size="12" fill="#d64545">scope probe</text>
  <text x="220" y="153" font-size="11" fill="#d64545">disturbs the loop</text>

  <!-- RIGHT: plain output rail -->
  <text x="370" y="42" font-size="15" font-weight="600" fill="#2f8a4c">Rail: probe-safe</text>

  <rect x="384" y="96" width="54" height="70" rx="4" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="411" y="135" font-size="12" font-weight="600" fill="#394049" text-anchor="middle">REG</text>

  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="438" y1="120" x2="560" y2="120"/>
    <circle cx="510" cy="120" r="4" fill="#2f8a4c" stroke="none"/>
  </g>
  <text x="566" y="124" font-size="12" fill="#2f8a4c" font-family="ui-monospace, Menlo, Consolas, monospace">VOUT</text>

  <!-- probe on rail, fine -->
  <g stroke="#2f8a4c" stroke-width="2.5" fill="none">
    <line x1="510" y1="120" x2="470" y2="88"/>
  </g>
  <polygon points="510,120 498,116 502,128" fill="#2f8a4c" stroke="none"/>
  <text x="452" y="80" font-size="12" fill="#2f8a4c">scope probe</text>
  <text x="452" y="65" font-size="11" fill="#2f8a4c">no loop to disturb</text>

  <text x="180" y="262" font-size="13" fill="#d64545" text-anchor="middle">a sense tap in the control loop</text>
  <text x="510" y="262" font-size="13" fill="#2f8a4c" text-anchor="middle">a plain low-impedance rail</text>
</svg>
