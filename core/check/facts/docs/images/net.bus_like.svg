<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" width="680" height="260" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="net.bus_like relation: a ground / rail-scale net is bus-like so the reach walk stops there; a two-pin series node is not, so the walk crosses it">
  <rect x="1" y="1" width="678" height="258" rx="10" fill="#f8f9fb" stroke="#e3e6eb"/>
  <line x1="340" y1="24" x2="340" y2="236" stroke="#e3e6eb" stroke-dasharray="4 4"/>

  <!-- LEFT: bus-like, walk stops -->
  <text x="30" y="42" font-size="15" font-weight="600" fill="#d64545">bus-like: walk stops</text>
  <!-- fan-out node -->
  <circle cx="88" cy="120" r="5" fill="#394049"/>
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="88" y1="120" x2="150" y2="90"/>
    <line x1="88" y1="120" x2="150" y2="110"/>
    <line x1="88" y1="120" x2="150" y2="130"/>
    <line x1="88" y1="120" x2="150" y2="150"/>
  </g>
  <text x="88" y="100" font-size="11" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">GND</text>
  <text x="163" y="80" font-size="11" fill="#6b7280">many pins</text>
  <!-- ground symbol -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="88" y1="120" x2="88" y2="168"/>
    <line x1="72" y1="168" x2="104" y2="168"/>
    <line x1="78" y1="176" x2="98" y2="176"/>
    <line x1="84" y1="184" x2="92" y2="184"/>
  </g>
  <!-- stop marker -->
  <g stroke="#d64545" stroke-width="3" fill="none">
    <line x1="215" y1="105" x2="245" y2="135"/>
    <line x1="245" y1="105" x2="215" y2="135"/>
  </g>
  <text x="150" y="216" font-size="13" fill="#d64545" text-anchor="middle">rail / ground / &gt;16 pins → stop</text>

  <!-- RIGHT: not bus-like, walk crosses -->
  <text x="370" y="42" font-size="15" font-weight="600" fill="#2f8a4c">point-to-point: walk crosses</text>
  <!-- R as a series pass element between two 2-pin nets -->
  <g stroke="#2f8a4c" stroke-width="2.5" fill="none">
    <line x1="380" y1="132" x2="440" y2="132"/>
    <rect x="440" y="120" width="44" height="24" rx="3" fill="#ffffff"/>
    <line x1="484" y1="132" x2="600" y2="132"/>
  </g>
  <text x="462" y="112" font-size="12" fill="#394049" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">R1</text>
  <circle cx="380" cy="132" r="4" fill="#2f8a4c"/>
  <circle cx="600" cy="132" r="4" fill="#2f8a4c"/>
  <text x="360" y="120" font-size="11" fill="#6b7280" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">NET_A</text>
  <text x="620" y="136" font-size="11" fill="#6b7280" font-family="ui-monospace, Menlo, Consolas, monospace">NET_B</text>
  <text x="490" y="216" font-size="13" fill="#2f8a4c" text-anchor="middle">two-pin series node → cross</text>
</svg>
