# A query set: named queries sharing a preamble, answered over one read of the design.
#
# The heredoc writes the set the page shows, verbatim, so `show` hides only that setup. The design is
# the netlist-audit fixture, built so each of these tables has rows.
fixture: examples/common/designs
script: |
  cat > audit.yaml <<'YAML'
  title: Test point audit
  preamble: |
    has_tp(?n) :- component-on-net(?tp, ?n), component.class(?tp, "test_point");
  queries:
    - name: Net count
      query: entity(?net, "net") => count(?net)
    - name: Nets with no test point
      query: entity(?net, "net"), not has_tp(?net) => ?net
    - name: Ground test points
      query: net.ground(?net), component-on-net(?tp, ?net), component.class(?tp, "test_point") => count(distinct ?tp)
  YAML
  agni query netlist-audit.tel --set audit.yaml
show: |
  agni query netlist-audit.tel --set audit.yaml
