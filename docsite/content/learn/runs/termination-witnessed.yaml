# Chapter 10's closing point, and a callback to chapter 1. R1 is the 120R across CANH/CANL, so the
# profile's termination requirement is SATISFIED. The rule used to say nothing at all, which made a
# terminated bus and an absent bus produce identical output. Since agni issue 424 the profile rules
# state the set they considered, so the satisfied requirement has a verdict and a witness.
fixture: examples/tutorial-project
from_root: true
script: |
  agni query examples/tutorial-project/designs/gateway/gateway.edn 'component.class(?r, "resistor"), component.mpn(?r, ?m), component-on-net(?r, ?n) => ?r, ?m, ?n'
  echo
  agni check --verdicts --rule gateway-profiles/can-termination-missing examples/tutorial-project/designs/gateway/gateway.edn
match: '^(R1|r |\s+pass|gateway-profiles|[0-9]+ verdicts)'
