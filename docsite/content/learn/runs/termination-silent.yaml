# Chapter 10's closing point, and a callback to chapter 1. R1 is the 120R across CANH/CANL, so the
# profile's termination requirement is SATISFIED, and the rule says nothing at all: profile rules are
# datalog-derived and report violations only. The run summary line is what carries the caveat.
fixture: examples/tutorial-project
from_root: true
script: |
  agni query examples/tutorial-project/designs/gateway/gateway.edn 'component.class(?r, "resistor"), component.mpn(?r, ?m), component-on-net(?r, ?n) => ?r, ?m, ?n'
  echo
  agni check examples/tutorial-project/designs/gateway/gateway.edn
match: '^(R1|r |CAN|.*rule\(s\) reported violations|[0-9]+ subject)'
