# Rung 11: the same checklist after the parameter corpus moves away. DESTRUCTIVE — the `mv` is the
# lesson, and it is safe because every run gets a scratch copy of the fixture.
fixture: examples/tutorial-project
script: |
  mv params params-old
  agni review designs/gateway --coverage
# The two leading numbers are what this rung is about; the per-area table belongs to rung 9. Selected
# by SHAPE rather than by line number, so adding a line to the rollup cannot silently show the wrong one.
match: '^\*\*.*covered'
