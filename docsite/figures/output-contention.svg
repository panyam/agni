<svg viewBox="0 0 640 320" role="img" aria-labelledby="output-contention-title" style="width:100%;height:auto;font-family:inherit">
  <title id="output-contention-title">Two ordinary push-pull outputs on one net, disagreeing. The left one has connected the net to the supply rail and the right one has connected the same net to ground. The highlighted path runs unbroken from the rail, through the left output's on-resistance, across the net, through the right output's on-resistance, and into ground, so the only thing between the rail and ground is two transistors in series.</title>
  <line x1="40" y1="46" x2="600" y2="46" stroke="currentColor" stroke-width="2" opacity="0.85"/>
  <text x="40" y="36" fill="currentColor" font-size="11.5" font-weight="600" opacity="0.8">+3V3</text>
  <line x1="40" y1="272" x2="600" y2="272" stroke="currentColor" stroke-width="2" opacity="0.85"/>
  <text x="40" y="288" fill="currentColor" font-size="11.5" opacity="0.7">ground</text>
  <g fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.55">
  <rect x="100" y="106" width="150" height="70" rx="3"/>
  <rect x="390" y="106" width="150" height="70" rx="3"/></g>
  <path d="M130 46 V156 H510 V272" fill="none" stroke="var(--accent-color)" stroke-width="2.6"/>
  <g fill="currentColor">
  <circle cx="130" cy="46" r="3.6"/>
  <circle cx="510" cy="272" r="3.6"/></g>
  <g fill="currentColor" font-size="12" font-weight="600" text-anchor="middle">
  <text x="185" y="128">U1 output</text>
  <text x="465" y="128">U2 output</text></g>
  <text x="320" y="146" text-anchor="middle" fill="var(--accent-color)" font-size="11.5" font-weight="600">SIG</text>
  <g fill="var(--accent-color)" font-size="11.5" font-weight="600" text-anchor="middle">
  <text x="175" y="200">driving high</text>
  <text x="465" y="200">driving low</text></g>
  <g fill="currentColor" font-size="10" text-anchor="middle" opacity="0.6">
  <text x="175" y="216">about 20 ohms when on</text>
  <text x="465" y="216">about 20 ohms when on</text>
  <text x="320" y="200">one net, two deciders</text></g>
  <text x="320" y="308" text-anchor="middle" fill="currentColor" font-size="11" opacity="0.65">3.3 V across roughly 40 ohms is about 80 mA, through pins rated for a few, and both parts heat</text>
</svg>
