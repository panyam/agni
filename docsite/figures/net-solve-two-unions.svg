<svg viewBox="0 0 640 268" role="img" aria-labelledby="net-solve-two-unions-title" style="width:100%;height:auto;font-family:inherit">
  <title id="net-solve-two-unions-title">Two panels. In the first, union by point, two separate wires each run from a component pin to a GND label. Nothing touches, so the solver holds two nodes. In the second, union by label, the two GND labels carry the same name, which folds both nodes into one net even though no wire joins them.</title>
  <g fill="currentColor" font-size="12" font-weight="600" opacity="0.75">
    <text x="16" y="34">1. union by point</text>
    <text x="340" y="34">2. union by label</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.3">
    <rect x="16" y="44" width="284" height="164" rx="3"/>
    <rect x="340" y="44" width="284" height="164" rx="3"/>
  </g>
  <!-- panel 1: two geometric nodes -->
  <g stroke="currentColor" stroke-width="1.6" opacity="0.8">
    <line x1="56" y1="96" x2="180" y2="96"/>
    <line x1="56" y1="156" x2="180" y2="156"/>
  </g>
  <g fill="currentColor" opacity="0.8">
    <circle cx="56" cy="96" r="3.2"/>
    <circle cx="56" cy="156" r="3.2"/>
  </g>
  <g fill="currentColor" font-size="11" text-anchor="end" opacity="0.8">
    <text x="48" y="100">U1.1</text>
    <text x="48" y="160">C2.2</text>
  </g>
  <g fill="var(--accent-color)" font-size="11.5" font-weight="600">
    <text x="188" y="100">GND</text>
    <text x="188" y="160">GND</text>
  </g>
  <text x="158" y="190" text-anchor="middle" fill="currentColor" font-size="11" opacity="0.6">two nodes, because nothing touches</text>
  <!-- panel 2: folded by name -->
  <g stroke="currentColor" stroke-width="1.6" opacity="0.8">
    <line x1="380" y1="96" x2="504" y2="96"/>
    <line x1="380" y1="156" x2="504" y2="156"/>
  </g>
  <g fill="currentColor" opacity="0.8">
    <circle cx="380" cy="96" r="3.2"/>
    <circle cx="380" cy="156" r="3.2"/>
  </g>
  <g fill="currentColor" font-size="11" text-anchor="end" opacity="0.8">
    <text x="372" y="100">U1.1</text>
    <text x="372" y="160">C2.2</text>
  </g>
  <g fill="var(--accent-color)" font-size="11.5" font-weight="600">
    <text x="512" y="100">GND</text>
    <text x="512" y="160">GND</text>
  </g>
  <path d="M548,92 L556,92 L556,160 L548,160" fill="none" stroke="var(--accent-color)" stroke-width="1.4"/>
  <text x="562" y="130" fill="var(--accent-color)" font-size="11.5" font-weight="600">one net</text>
  <text x="482" y="190" text-anchor="middle" fill="currentColor" font-size="11" opacity="0.6">one node, because the names agree</text>
  <text x="320" y="238" text-anchor="middle" fill="currentColor" font-size="11" opacity="0.6">a third pass names each merged root, taking its lowest-ranked label</text>
  <text x="320" y="256" text-anchor="middle" fill="currentColor" font-size="11" opacity="0.6">and a root with pins but no label gets a synthetic one</text>
</svg>
