<svg viewBox="0 0 620 248" role="img" aria-labelledby="net-rename-title" style="width:100%;height:auto;font-family:inherit">
  <title id="net-rename-title">Two revisions side by side. A net called SIG in rev A and a net called DATA in rev B hold the same three pin connections, so the diff reports one renamed net instead of one deletion and one addition.</title>

  <g fill="currentColor" font-size="12" text-anchor="middle" opacity="0.6">
  <text x="140" y="44">rev A</text>
  <text x="480" y="44">rev B</text></g>

  <g fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.4">
  <rect x="30" y="54" width="220" height="96" rx="4"/>
  <rect x="370" y="54" width="220" height="96" rx="4"/></g>

  <g fill="var(--accent-color)" font-size="15" font-weight="600" text-anchor="middle">
  <text x="140" y="80">SIG</text>
  <text x="480" y="80">DATA</text></g>

  <g stroke="currentColor" stroke-width="1" opacity="0.4">
  <line x1="140" y1="86" x2="140" y2="94"/>
  <line x1="70" y1="94" x2="210" y2="94"/>
  <line x1="70" y1="94" x2="70" y2="104"/>
  <line x1="140" y1="94" x2="140" y2="104"/>
  <line x1="210" y1="94" x2="210" y2="104"/>
  <line x1="480" y1="86" x2="480" y2="94"/>
  <line x1="410" y1="94" x2="550" y2="94"/>
  <line x1="410" y1="94" x2="410" y2="104"/>
  <line x1="480" y1="94" x2="480" y2="104"/>
  <line x1="550" y1="94" x2="550" y2="104"/></g>

  <g fill="currentColor" opacity="0.08">
  <rect x="40" y="104" width="60" height="24" rx="3"/>
  <rect x="110" y="104" width="60" height="24" rx="3"/>
  <rect x="180" y="104" width="60" height="24" rx="3"/>
  <rect x="380" y="104" width="60" height="24" rx="3"/>
  <rect x="450" y="104" width="60" height="24" rx="3"/>
  <rect x="520" y="104" width="60" height="24" rx="3"/></g>

  <g fill="currentColor" font-size="11.5" text-anchor="middle" opacity="0.75">
  <text x="70" y="120">U1.4</text>
  <text x="140" y="120">R3.1</text>
  <text x="210" y="120">J2.7</text>
  <text x="410" y="120">U1.4</text>
  <text x="480" y="120">R3.1</text>
  <text x="550" y="120">J2.7</text></g>

  <g fill="currentColor" font-size="11.5" text-anchor="middle" opacity="0.6">
  <text x="310" y="88">identical</text>
  <text x="310" y="101">pin set</text></g>

  <g stroke="var(--accent-color)" stroke-width="1.4">
  <line x1="258" y1="116" x2="354" y2="116"/></g>
  <polygon points="354,110 368,116 354,122" fill="var(--accent-color)"/>

  <line x1="30" y1="176" x2="590" y2="176" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <text x="310" y="202" text-anchor="middle" fill="var(--accent-color)" font-size="12.5" font-weight="600">agni diff: [renamed] SIG -&gt; DATA</text>
  <text x="310" y="228" text-anchor="middle" fill="currentColor" font-size="11.5" opacity="0.55">matching on names alone would report one net deleted and one net appeared</text>
</svg>
