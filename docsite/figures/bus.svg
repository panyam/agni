<svg viewBox="0 0 680 270" role="img" aria-labelledby="bus-title" style="width:100%;height:auto;font-family:inherit">
  <title id="bus-title">A two-wire bus running left to right with three nodes tapping the same pair of nets, and a terminating resistor bridging the pair at each end of the run</title>
  <g fill="currentColor" font-size="13" text-anchor="middle" opacity="0.75">
  <text x="340" y="30">one set of nets, shared by every part on it</text></g>
  <g fill="none" stroke="currentColor" stroke-width="2">
  <path d="M80 110 H600"/>
  <path d="M80 146 H166 M174 146 H326 M334 146 H486 M494 146 H600"/>
  <path d="M80 110 V146 M600 110 V146"/>
  <path d="M170 110 V186 M190 146 V186 M330 110 V186 M350 146 V186 M490 110 V186 M510 146 V186"/></g>
  <g fill="var(--accent-color)" fill-opacity="0.2" stroke="currentColor" stroke-width="1.6">
  <rect x="69" y="116" width="22" height="24"/>
  <rect x="589" y="116" width="22" height="24"/></g>
  <g fill="currentColor">
  <circle cx="170" cy="110" r="3.2"/>
  <circle cx="330" cy="110" r="3.2"/>
  <circle cx="490" cy="110" r="3.2"/>
  <circle cx="190" cy="146" r="3.2"/>
  <circle cx="350" cy="146" r="3.2"/>
  <circle cx="510" cy="146" r="3.2"/></g>
  <g fill="none" stroke="currentColor" stroke-width="1.6" opacity="0.85">
  <rect x="125" y="186" width="110" height="36"/>
  <rect x="285" y="186" width="110" height="36"/>
  <rect x="445" y="186" width="110" height="36"/></g>
  <g fill="currentColor" font-size="13" text-anchor="middle">
  <text x="180" y="209">node 1</text>
  <text x="340" y="209">node 2</text>
  <text x="500" y="209">node 3</text></g>
  <g fill="var(--accent-color)" font-size="11.5" font-weight="600" text-anchor="middle">
  <text x="80" y="176">termination</text>
  <text x="600" y="176">termination</text></g>
  <g fill="currentColor" font-size="11.5" text-anchor="middle" opacity="0.6">
  <text x="340" y="252">the terminators sit at the two ends of the run, not at every node</text></g>
</svg>
