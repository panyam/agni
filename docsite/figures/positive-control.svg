<svg viewBox="0 0 640 292" role="img" aria-labelledby="positive-control-title" style="width:100%;height:auto;font-family:inherit">
  <title id="positive-control-title">The same detector run twice over the same corpus. Run as-is it reports zero hits, which is equally consistent with a clean corpus and with a blind instrument, so nothing distinguishes them. Run again with one known instance planted in the corpus, it reports one hit, and only then does a zero over the rest carry information.</title>
  <defs>
    <marker id="positive-control-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor" opacity="0.5"/>
    </marker>
  </defs>
  <text x="20" y="44" fill="currentColor" font-size="11.5" font-weight="600" opacity="0.7">as run</text>
  <g fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.45">
  <rect x="20" y="56" width="130" height="58" rx="3"/>
  <rect x="186" y="56" width="110" height="58" rx="3"/>
  <rect x="332" y="56" width="76" height="58" rx="3"/></g>
  <g fill="currentColor" font-size="11" text-anchor="middle" opacity="0.85">
  <text x="85" y="80">62 documents</text>
  <text x="241" y="90">the detector</text>
  <text x="370" y="90">0 hits</text></g>
  <text x="85" y="96" text-anchor="middle" fill="currentColor" font-size="9.5" opacity="0.55">none known to match</text>
  <g stroke="currentColor" stroke-width="1.2" opacity="0.5" marker-end="url(#positive-control-arrow)">
  <line x1="154" y1="85" x2="182" y2="85"/>
  <line x1="300" y1="85" x2="328" y2="85"/></g>
  <g fill="currentColor" font-size="10" opacity="0.65">
  <text x="424" y="76">the corpus is clean,</text>
  <text x="424" y="90">or the instrument is blind,</text>
  <text x="424" y="104">and nothing tells them apart</text></g>
  <text x="20" y="164" fill="var(--accent-color)" font-size="11.5" font-weight="600">with a positive control</text>
  <g fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.45">
  <rect x="186" y="176" width="110" height="58" rx="3"/></g>
  <rect x="20" y="176" width="130" height="58" rx="3" fill="none" stroke="var(--accent-color)" stroke-width="1.4"/>
  <rect x="332" y="176" width="76" height="58" rx="3" fill="none" stroke="var(--accent-color)" stroke-width="1.4"/>
  <g fill="currentColor" font-size="11" text-anchor="middle" opacity="0.85">
  <text x="85" y="200">62 documents</text>
  <text x="241" y="210">the detector</text></g>
  <text x="85" y="216" text-anchor="middle" fill="var(--accent-color)" font-size="9.5" font-weight="600">plus 1 planted instance</text>
  <text x="370" y="210" text-anchor="middle" fill="var(--accent-color)" font-size="11" font-weight="600">1 hit</text>
  <g stroke="currentColor" stroke-width="1.2" opacity="0.5" marker-end="url(#positive-control-arrow)">
  <line x1="154" y1="205" x2="182" y2="205"/>
  <line x1="300" y1="205" x2="328" y2="205"/></g>
  <g fill="currentColor" font-size="10" opacity="0.65">
  <text x="424" y="198">the instrument can see one,</text>
  <text x="424" y="212">so a 0 over the other 62</text>
  <text x="424" y="226">is now a result</text></g>
  <text x="320" y="272" text-anchor="middle" fill="currentColor" font-size="11" opacity="0.65">a negative result is a claim about the instrument until the instrument has been shown to work</text>
</svg>
