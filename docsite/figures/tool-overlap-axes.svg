<svg viewBox="0 0 640 324" role="img" aria-labelledby="tool-overlap-axes-title" style="width:100%;height:auto;font-family:inherit">
  <title id="tool-overlap-axes-title">Three bands of flagged entities side by side. A bracket over the left two is labelled agni, and a bracket over the right two is labelled your existing DRC, so the middle band is what both tools reached. The left band holds nets only agni flagged, which are statements about what the circuit means. The right band holds components only the DRC flagged, which are physical manufacturability. The two tools answer on different axes rather than one finding more than the other.</title>
  <path d="M30 68 L30 60 L410 60 L410 68" fill="none" stroke="var(--accent-color)" stroke-width="1.5"/>
  <text x="220" y="52" text-anchor="middle" fill="var(--accent-color)" font-size="12" font-weight="600">agni flagged 17 entities</text>
  <path d="M230 100 L230 92 L610 92 L610 100" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.7"/>
  <text x="420" y="84" text-anchor="middle" fill="currentColor" font-size="12" font-weight="600" opacity="0.8">your existing DRC flagged 25</text>
  <g fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.4">
  <rect x="30" y="110" width="200" height="46" rx="3"/>
  <rect x="230" y="110" width="180" height="46" rx="3"/>
  <rect x="410" y="110" width="200" height="46" rx="3"/></g>
  <g fill="currentColor" font-size="13" font-weight="600" text-anchor="middle">
  <text x="130" y="139">9 nets</text>
  <text x="320" y="139">8 entities</text>
  <text x="510" y="139">17 components</text></g>
  <g fill="currentColor" font-size="9.5" opacity="0.65">
  <text x="40" y="180">what the circuit means</text>
  <text x="40" y="196">a bus with no pull-up, a</text>
  <text x="40" y="212">transceiver's logic side,</text>
  <text x="40" y="228">control signals, a naming rule</text>
  <text x="240" y="180">where both routes reach</text>
  <text x="240" y="196">the same thing</text>
  <text x="420" y="180">physical manufacturability</text>
  <text x="420" y="196">edge clearance, silk over pads,</text>
  <text x="420" y="212">footprint library mismatches</text></g>
  <text x="320" y="272" text-anchor="middle" fill="var(--accent-color)" font-size="12.5" font-weight="600">not a bigger number, a different axis</text>
  <text x="320" y="296" text-anchor="middle" fill="currentColor" font-size="11" opacity="0.65">a copper checker has no model in which "this bus needs a pull-up" is expressible</text>
  <text x="320" y="312" text-anchor="middle" fill="currentColor" font-size="9.5" opacity="0.5">28 and 309 findings respectively, since one entity can carry several</text>
</svg>
