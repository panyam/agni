<svg viewBox="0 0 690 350" role="img" aria-labelledby="edif-xref-title" style="width:100%;height:auto;font-family:inherit">
  <title id="edif-xref-title">A net names a pin by the instance's internal ampersand-id, that instance names its part type by cellRef and libraryRef, and the instance's own designator supplies the ref-des the IR stores, so resolving one connection is a two-hop lookup through the file.</title>
  <g fill="currentColor" font-size="12" font-weight="600" opacity="0.7">
  <text x="16" y="22">in the .edn file</text>
  <text x="460" y="22">in the IR</text></g>
  <g fill="none" stroke="currentColor" stroke-width="1" opacity="0.35">
  <rect x="16" y="32" width="414" height="54"/>
  <rect x="16" y="118" width="414" height="86"/>
  <rect x="16" y="236" width="414" height="70"/>
  <rect x="460" y="118" width="214" height="88"/></g>
  <g fill="currentColor" font-size="10.5" opacity="0.6">
  <text x="26" y="50">a net</text>
  <text x="26" y="136">the instance, one placed part</text>
  <text x="26" y="254">the cell, a part type defined once</text></g>
  <g fill="currentColor" font-size="10.5" font-family="ui-monospace, monospace">
  <text x="26" y="72">(net VDD (joined (portRef &amp;1 (instanceRef &amp;04417I12086))))</text>
  <text x="26" y="158">(instance (rename &amp;04417I12086 "$17I12086")</text>
  <text x="26" y="174">  (viewRef TP (cellRef TP_1mm (libraryRef Misc)))</text>
  <text x="26" y="190">  (designator "TP9224"))</text>
  <text x="26" y="276">(cell TP_1mm (cellType GENERIC)</text>
  <text x="26" y="292">  (view TP (port (rename &amp;1 "1") (direction INPUT))))</text></g>
  <g stroke="var(--accent-color)" stroke-width="1.4" fill="none">
  <line x1="40" y1="88" x2="40" y2="110"/>
  <line x1="40" y1="206" x2="40" y2="228"/>
  <line x1="432" y1="161" x2="450" y2="161"/></g>
  <g fill="var(--accent-color)">
  <polygon points="40,116 36,108 44,108"/>
  <polygon points="40,234 36,226 44,226"/>
  <polygon points="458,161 450,157 450,165"/></g>
  <g fill="var(--accent-color)" font-size="10.5">
  <text x="52" y="106">instanceRef matches the instance's &amp;id</text>
  <text x="52" y="224">cellRef and libraryRef select the part type</text>
  <text x="460" y="108">the reader resolves the &amp;id to a ref-des</text></g>
  <g fill="currentColor" font-size="10" font-family="ui-monospace, monospace">
  <text x="470" y="140">Net{ name: "VDD",</text>
  <text x="470" y="155">  connections: [</text>
  <text x="470" y="170">    PortRef{ port_ref: "1",</text>
  <text x="470" y="185">    instance_ref: "TP9224" }]}</text></g>
  <text x="345" y="332" text-anchor="middle" fill="currentColor" font-size="11.5" opacity="0.6">every cross-reference carries the &amp;id, and the human name comes from the paired rename</text>
</svg>
