<svg viewBox="0 0 640 334" role="img" aria-labelledby="open-drain-bus-title" style="width:100%;height:auto;font-family:inherit">
  <title id="open-drain-bus-title">A supply rail across the top and a ground line across the bottom, with one shared bus line between them. A single pull-up resistor joins the rail to the bus. Three open-drain devices hang off the bus, and each one can only connect the line to ground, never to the rail. Any device pulling low simply makes the line low, so several can share the wire without fighting, and with the resistor removed nothing can bring the line back up.</title>
  <line x1="40" y1="46" x2="600" y2="46" stroke="currentColor" stroke-width="2" opacity="0.85"/>
  <text x="40" y="36" fill="currentColor" font-size="11.5" font-weight="600" opacity="0.8">+3V3</text>
  <line x1="140" y1="46" x2="140" y2="74" stroke="currentColor" stroke-width="1.8" opacity="0.85"/>
  <rect x="130" y="74" width="20" height="34" fill="none" stroke="var(--accent-color)" stroke-width="1.8"/>
  <line x1="140" y1="108" x2="140" y2="140" stroke="currentColor" stroke-width="1.8" opacity="0.85"/>
  <text x="160" y="86" fill="var(--accent-color)" font-size="11.5" font-weight="600">the pull-up</text>
  <text x="160" y="102" fill="currentColor" font-size="10" opacity="0.6">the only thing that can raise the line</text>
  <line x1="40" y1="140" x2="600" y2="140" stroke="var(--accent-color)" stroke-width="2.2"/>
  <text x="40" y="132" fill="var(--accent-color)" font-size="11.5" font-weight="600">SDA</text>
  <circle cx="140" cy="140" r="3.4" fill="currentColor"/>
  <g fill="none" stroke="currentColor" stroke-width="1.8" opacity="0.85">
  <line x1="250" y1="140" x2="250" y2="186"/>
  <line x1="390" y1="140" x2="390" y2="186"/>
  <line x1="530" y1="140" x2="530" y2="186"/></g>
  <g fill="currentColor">
  <circle cx="250" cy="140" r="3.4"/>
  <circle cx="390" cy="140" r="3.4"/>
  <circle cx="530" cy="140" r="3.4"/></g>
  <g fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.5">
  <rect x="196" y="186" width="108" height="52" rx="3"/>
  <rect x="336" y="186" width="108" height="52" rx="3"/>
  <rect x="476" y="186" width="108" height="52" rx="3"/></g>
  <g fill="currentColor" font-size="12" font-weight="600" text-anchor="middle">
  <text x="250" y="208">U1</text>
  <text x="390" y="208">U2</text>
  <text x="530" y="208">U3</text></g>
  <g fill="currentColor" font-size="9.5" text-anchor="middle" opacity="0.6">
  <text x="250" y="226">pulls low only</text>
  <text x="390" y="226">pulls low only</text>
  <text x="530" y="226">pulls low only</text></g>
  <g fill="none" stroke="currentColor" stroke-width="1.8" opacity="0.85">
  <line x1="250" y1="238" x2="250" y2="272"/>
  <line x1="390" y1="238" x2="390" y2="272"/>
  <line x1="530" y1="238" x2="530" y2="272"/></g>
  <line x1="40" y1="272" x2="600" y2="272" stroke="currentColor" stroke-width="2" opacity="0.85"/>
  <text x="40" y="288" fill="currentColor" font-size="11.5" opacity="0.7">ground</text>
  <text x="320" y="304" text-anchor="middle" fill="currentColor" font-size="11" opacity="0.6">two devices pulling low at once is simply low, so they can share the wire</text>
  <text x="320" y="320" text-anchor="middle" fill="currentColor" font-size="11" opacity="0.6">take the resistor away and the line never comes back up</text>
</svg>
