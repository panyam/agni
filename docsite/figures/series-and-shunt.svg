<svg viewBox="0 0 640 300" role="img" aria-labelledby="series-and-shunt-title" style="width:100%;height:auto;font-family:inherit">
  <title id="series-and-shunt-title">Two ways a two-terminal part sits on a net. On the left the part is in series: it joins net A to net B, and the signal passes through it. On the right the part is a shunt: one end is on the net and the other goes to ground, so it sits beside the signal rather than in its path.</title>
  <g fill="currentColor" font-size="12.5" font-weight="600" text-anchor="middle">
  <text x="160" y="32">in series</text>
  <text x="480" y="32">shunt</text></g>
  <g stroke="currentColor" stroke-width="2" opacity="0.85">
  <path d="M40 100 H120 M200 100 H280"/>
  <path d="M360 100 H600 M480 100 V130 M480 170 V190"/>
  <path d="M462 190 H498 M468 196 H492 M474 202 H486"/></g>
  <circle cx="480" cy="100" r="3.6" fill="currentColor"/>
  <g fill="none" stroke="var(--accent-color)" stroke-width="2.4">
  <rect x="120" y="86" width="80" height="28" rx="3"/>
  <rect x="466" y="130" width="28" height="40" rx="3"/></g>
  <g fill="currentColor" font-size="11.5" opacity="0.75">
  <text x="40" y="88">net A</text>
  <text x="280" y="88" text-anchor="end">net B</text>
  <text x="360" y="88">one net</text>
  <text x="508" y="200">ground</text></g>
  <g fill="var(--accent-color)" font-size="11.5" font-weight="600" text-anchor="middle">
  <text x="160" y="234">the signal passes through it</text>
  <text x="480" y="234">it sits beside the signal</text></g>
  <g fill="currentColor" font-size="10.5" text-anchor="middle" opacity="0.6">
  <text x="160" y="252">coupling cap, ferrite, fuse, series resistor, diode</text>
  <text x="480" y="252">decoupling cap, TVS, pull-down</text></g>
  <text x="320" y="288" text-anchor="middle" fill="currentColor" font-size="11" opacity="0.65">A capacitor to another signal is in series. The same part to ground is a shunt.</text>
</svg>
