<svg viewBox="0 0 660 156" role="img" aria-labelledby="derate-title" style="width:100%;height:auto;font-family:inherit">
  <title id="derate-title">A voltage axis showing a 10 V rail, a 12.5 V requirement after a 1.25 derate factor, a 10 V part that falls short and a 16 V part that clears it</title>
  <rect x="340" y="38" width="70" height="30" fill="var(--accent-color)" opacity="0.18"/>
  <g stroke="currentColor" stroke-width="1.2" opacity="0.6">
  <line x1="60" y1="68" x2="620" y2="68"/>
  <line x1="60" y1="68" x2="60" y2="74"/>
  <line x1="200" y1="68" x2="200" y2="74"/>
  <line x1="340" y1="68" x2="340" y2="74"/>
  <line x1="480" y1="68" x2="480" y2="74"/>
  <line x1="620" y1="68" x2="620" y2="74"/></g>
  <g fill="currentColor" font-size="11.5" text-anchor="middle" opacity="0.6">
  <text x="60" y="86">0 V</text>
  <text x="200" y="86">5 V</text>
  <text x="340" y="86">10 V</text>
  <text x="480" y="86">15 V</text>
  <text x="620" y="86">20 V</text></g>
  <line x1="340" y1="38" x2="340" y2="68" stroke="currentColor" stroke-width="2"/>
  <line x1="410" y1="38" x2="410" y2="68" stroke="var(--accent-color)" stroke-width="2"/>
  <line x1="410" y1="68" x2="410" y2="140" stroke="var(--accent-color)" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.7"/>
  <text x="340" y="30" fill="currentColor" font-size="12.5" font-weight="600" text-anchor="middle">the rail: 10 V</text>
  <text x="418" y="30" fill="var(--accent-color)" font-size="12.5" font-weight="600">required: 12.5 V</text>
  <text x="418" y="48" fill="currentColor" font-size="11.5" opacity="0.72">rail x 1.25 derate factor</text>
  <rect x="60" y="98" width="280" height="18" fill="currentColor" opacity="0.14" stroke="currentColor" stroke-opacity="0.5"/>
  <rect x="60" y="122" width="448" height="18" fill="var(--accent-color)" opacity="0.18" stroke="var(--accent-color)" stroke-opacity="0.7"/>
  <g fill="currentColor" font-size="11.5">
  <text x="418" y="111">rated 10 V: misses the derate</text>
  <text x="516" y="135">rated 16 V: passes</text></g>
</svg>
