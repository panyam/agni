<svg viewBox="0 0 640 292" role="img" aria-labelledby="geometry-producers-renderers-title" style="width:100%;height:auto;font-family:inherit">
  <title id="geometry-producers-renderers-title">Four producers on the left all feed one geometry contract in the middle, and two renderers on the right all read from it. The producers are the EDIF schematic reader, the KiCad schematic geometry reader, the IPC-2581 board reader, and the auto-layout path. The renderers are the SVG backend and the tier-two packer that feeds WebGL. A new source lights up every renderer and a new renderer consumes every source.</title>
  <defs>
    <marker id="geometry-pr-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor" opacity="0.5"/>
    </marker>
  </defs>
  <g fill="currentColor" font-size="11" font-weight="600" opacity="0.6">
    <text x="16" y="24">producers</text>
    <text x="454" y="24">renderers</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.35">
    <rect x="16" y="34" width="170" height="42" rx="3"/>
    <rect x="16" y="88" width="170" height="42" rx="3"/>
    <rect x="16" y="142" width="170" height="42" rx="3"/>
    <rect x="16" y="196" width="170" height="42" rx="3"/>
    <rect x="454" y="80" width="170" height="42" rx="3"/>
    <rect x="454" y="150" width="170" height="42" rx="3"/>
  </g>
  <g fill="currentColor" font-size="10.5" opacity="0.85">
    <text x="30" y="54">EDIF ReadSchematic</text>
    <text x="30" y="108">KiCad schematic</text>
    <text x="30" y="124">geometry</text>
    <text x="30" y="162">IPC-2581 board</text>
    <text x="30" y="178">reader</text>
    <text x="30" y="216">auto-layout</text>
    <text x="30" y="232">(grid, layered)</text>
    <text x="468" y="100">the SVG backend</text>
    <text x="468" y="170">the tier-2 packer,</text>
    <text x="468" y="186">feeding WebGL</text>
  </g>
  <rect x="236" y="92" width="168" height="88" rx="3" fill="none" stroke="var(--accent-color)" stroke-width="1.4"/>
  <text x="320" y="126" text-anchor="middle" fill="var(--accent-color)" font-size="12.5" font-weight="600">agni.v1.geom</text>
  <text x="320" y="146" text-anchor="middle" fill="currentColor" font-size="10" opacity="0.65">a render contract,</text>
  <text x="320" y="160" text-anchor="middle" fill="currentColor" font-size="10" opacity="0.65">owned by no one format</text>
  <g stroke="currentColor" stroke-width="1.2" opacity="0.5" marker-end="url(#geometry-pr-arrow)">
    <line x1="190" y1="55" x2="232" y2="106"/>
    <line x1="190" y1="109" x2="232" y2="122"/>
    <line x1="190" y1="163" x2="232" y2="140"/>
    <line x1="190" y1="217" x2="232" y2="158"/>
    <line x1="408" y1="122" x2="450" y2="101"/>
    <line x1="408" y1="150" x2="450" y2="171"/>
  </g>
  <text x="320" y="264" text-anchor="middle" fill="currentColor" font-size="11" opacity="0.6">a new source lights up every renderer, and a new renderer consumes every source</text>
  <text x="320" y="282" text-anchor="middle" fill="currentColor" font-size="11" opacity="0.6">and when two producers fill one field, the contract surfaces the disagreement</text>
</svg>
