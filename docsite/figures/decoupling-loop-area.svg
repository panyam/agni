<svg viewBox="0 0 640 288" role="img" aria-labelledby="decoupling-loop-area-title" style="width:100%;height:auto;font-family:inherit">
  <title id="decoupling-loop-area-title">The same capacitor, the same net and the same value, placed twice. On the left it sits at the chip's supply pin and the current loop it closes encloses a small area. On the right it sits across the board and the same loop encloses a much larger one. Loop inductance follows that area, so only geometry tells the two apart; a netlist reads them as identical.</title>
  <g fill="currentColor" font-size="11.5" font-weight="600" opacity="0.8">
  <text x="16" y="32">at the pin</text>
  <text x="340" y="32">across the board</text></g>
  <g fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.28">
  <rect x="16" y="42" width="284" height="164" rx="3"/>
  <rect x="340" y="42" width="284" height="164" rx="3"/></g>
  <g fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.7">
  <rect x="196" y="72" width="88" height="76" rx="2"/>
  <rect x="520" y="72" width="88" height="76" rx="2"/></g>
  <g fill="currentColor" font-size="11.5" text-anchor="middle" opacity="0.85">
  <text x="240" y="116">chip</text>
  <text x="564" y="116">chip</text></g>
  <g fill="none" stroke="currentColor" stroke-width="1.8" opacity="0.85">
  <path d="M152 84 V78 H196"/>
  <path d="M152 100 V142 H196"/>
  <path d="M136 84 H168 M136 92 H168"/>
  <path d="M152 92 V100"/>
  <path d="M380 84 V78 H520"/>
  <path d="M380 100 V142 H520"/>
  <path d="M364 84 H396 M364 92 H396"/>
  <path d="M380 92 V100"/></g>
  <g fill="var(--accent-color)" font-size="10" text-anchor="middle" font-weight="600">
  <text x="152" y="70">100 nF</text>
  <text x="380" y="70">100 nF</text></g>
  <rect x="152" y="78" width="44" height="64" fill="none" stroke="var(--accent-color)" stroke-width="1.6" stroke-dasharray="4 3"/>
  <rect x="380" y="78" width="140" height="64" fill="none" stroke="var(--accent-color)" stroke-width="1.6" stroke-dasharray="4 3"/>
  <g fill="var(--accent-color)" font-size="11" text-anchor="middle" font-weight="600">
  <text x="174" y="170">a small loop</text>
  <text x="450" y="170">the same loop, three times the area</text></g>
  <g fill="currentColor" font-size="10" text-anchor="middle" opacity="0.6">
  <text x="158" y="188">the cap still supplies the gulp</text>
  <text x="482" y="188">the inductance swamps the cap</text></g>
  <text x="320" y="238" text-anchor="middle" fill="currentColor" font-size="11" opacity="0.65">both boards have the same netlist, the same part and the same value on the same two nets</text>
  <text x="320" y="256" text-anchor="middle" fill="currentColor" font-size="11" opacity="0.65">reading a netlist can prove a capacitor is present, and only geometry can say whether it is close</text>
</svg>
