<svg viewBox="0 0 640 268" role="img" aria-labelledby="render-surfaces-title" style="width:100%;height:auto;font-family:inherit">
  <title id="render-surfaces-title">One geometry source at the top fans out into three render surfaces: PACKED, the columnar bytes WebGL uploads; SVG, the verification backend and the default; and NATIVE, the format's own tool as a golden reference. Underneath, a band shows the highlight layer, which is decoupled from all three: one spec names components, nets and pins plus a style and a shape, and projects onto whichever backend is showing.</title>
  <defs>
    <marker id="render-surfaces-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor" opacity="0.5"/>
    </marker>
  </defs>
  <rect x="220" y="16" width="200" height="40" rx="3" fill="none" stroke="var(--accent-color)" stroke-width="1.4"/>
  <text x="320" y="41" text-anchor="middle" fill="var(--accent-color)" font-size="12" font-weight="600">one geometry source</text>
  <g stroke="currentColor" stroke-width="1.2" opacity="0.5" marker-end="url(#render-surfaces-arrow)">
    <line x1="280" y1="58" x2="120" y2="104"/>
    <line x1="320" y1="58" x2="320" y2="104"/>
    <line x1="360" y1="58" x2="520" y2="104"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.35">
    <rect x="16" y="110" width="180" height="70" rx="3"/>
    <rect x="230" y="110" width="180" height="70" rx="3"/>
    <rect x="444" y="110" width="180" height="70" rx="3"/>
  </g>
  <g fill="currentColor" font-size="11.5" font-weight="600" opacity="0.9">
    <text x="30" y="134">PACKED</text>
    <text x="244" y="134">SVG</text>
    <text x="458" y="134">NATIVE</text>
  </g>
  <g fill="currentColor" font-size="10" opacity="0.62">
    <text x="30" y="152">columnar bytes, uploaded once</text>
    <text x="30" y="168">keys make selection an index join</text>
    <text x="244" y="152">the verification backend</text>
    <text x="244" y="168">full text fidelity, the default</text>
    <text x="458" y="152">the format's own tool</text>
    <text x="458" y="168">a golden reference, opt-in</text>
  </g>
  <g stroke="currentColor" stroke-width="1.3" opacity="0.5" stroke-dasharray="4 3" marker-end="url(#render-surfaces-arrow)">
    <line x1="106" y1="200" x2="106" y2="184"/>
    <line x1="320" y1="200" x2="320" y2="184"/>
    <line x1="534" y1="200" x2="534" y2="184"/>
  </g>
  <rect x="16" y="202" width="608" height="46" rx="3" fill="none" stroke="var(--accent-color)" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="320" y="222" text-anchor="middle" fill="var(--accent-color)" font-size="11.5" font-weight="600">the highlight layer, decoupled from the base render</text>
  <text x="320" y="238" text-anchor="middle" fill="currentColor" font-size="10" opacity="0.65">one spec names components, nets and pins, plus a style and a shape, and projects onto whichever is showing</text>
</svg>
