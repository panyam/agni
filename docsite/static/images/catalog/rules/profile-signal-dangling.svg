<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="680" height="250" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="profile-signal-dangling rule: a profile signal net wired to only one pin is flagged; one reaching both ends is fine">
  <rect x="1" y="1" width="678" height="248" rx="10" fill="#f8f9fb" stroke="#e3e6eb"/>
  <line x1="340" y1="24" x2="340" y2="226" stroke="#e3e6eb" stroke-dasharray="4 4"/>
  <text x="30" y="42" font-size="15" fill="#d64545" font-weight="600">Flagged</text>
  <text x="30" y="60" font-size="11.5" fill="#6b7280">named, but wired to one pin</text>
  <text x="370" y="42" font-size="15" fill="#2f9e57" font-weight="600">Fine</text>
  <text x="370" y="60" font-size="11.5" fill="#6b7280">wired to both ends</text>
  <rect x="20" y="96" width="70" height="48" rx="3" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="55.0" y="118.0" font-size="13" fill="#394049" font-weight="600" text-anchor="middle">U1</text>
  <text x="55.0" y="133.0" font-size="10" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">controller</text>
  <rect x="240" y="96" width="70" height="48" rx="3" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="275.0" y="118.0" font-size="13" fill="#394049" font-weight="600" text-anchor="middle">U2</text>
  <text x="275.0" y="133.0" font-size="10" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">flash</text>
  <line x1="150" y1="120" x2="240" y2="120" stroke="#d64545" stroke-width="2.5"/>
  <circle cx="150" cy="120" r="3.5" fill="#d64545"/>
  <text x="192" y="110" font-size="11" fill="#d64545" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">SPI_IO2</text>
  <text x="165" y="190" font-size="12" fill="#d64545" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">1 connection</text>
  <text x="165" y="214" font-size="11" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">net.pin_count</text>
  <rect x="360" y="96" width="70" height="48" rx="3" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="395.0" y="118.0" font-size="13" fill="#394049" font-weight="600" text-anchor="middle">U1</text>
  <text x="395.0" y="133.0" font-size="10" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">controller</text>
  <rect x="580" y="96" width="70" height="48" rx="3" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="615.0" y="118.0" font-size="13" fill="#394049" font-weight="600" text-anchor="middle">U2</text>
  <text x="615.0" y="133.0" font-size="10" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">flash</text>
  <line x1="430" y1="120" x2="580" y2="120" stroke="#394049" stroke-width="2"/>
  <text x="505" y="110" font-size="11" fill="#394049" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">SPI_IO2</text>
  <text x="505" y="190" font-size="12" fill="#2f9e57" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">2 connections</text>
  <text x="505" y="214" font-size="11" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">net.pin_count</text>
