<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="680" height="250" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="fet-vdss-below-switched-rail rule: a FET on a rail at or above its VDSS is flagged; a FET rated above its rail is fine">
  <rect x="1" y="1" width="678" height="248" rx="10" fill="#f8f9fb" stroke="#e3e6eb"/>
  <line x1="340" y1="24" x2="340" y2="226" stroke="#e3e6eb" stroke-dasharray="4 4"/>
  <text x="30" y="42" font-size="15" fill="#d64545" font-weight="600">Flagged</text>
  <text x="30" y="60" font-size="11.5" fill="#6b7280">rail at or above VDSS</text>
  <text x="370" y="42" font-size="15" fill="#2f9e57" font-weight="600">Fine</text>
  <text x="370" y="60" font-size="11.5" fill="#6b7280">rated above the rail</text>
  <line x1="40" y1="120" x2="150" y2="120" stroke="#d64545" stroke-width="2.5"/>
  <text x="90" y="110" font-size="12" fill="#d64545" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">+48V</text>
  <rect x="150" y="96" width="86" height="48" rx="3" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="193.0" y="118.0" font-size="13" fill="#394049" font-weight="600" text-anchor="middle">Q1</text>
  <text x="193.0" y="133.0" font-size="10" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">VDSS 30 V</text>
  <line x1="236" y1="120" x2="300" y2="120" stroke="#394049" stroke-width="2"/>
  <text x="268" y="110" font-size="11" fill="#6b7280" text-anchor="middle">load</text>
  <text x="170" y="180" font-size="12" fill="#d64545" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">48 V  ≥  30 V VDSS</text>
  <text x="170" y="206" font-size="11" fill="#6b7280" text-anchor="middle">VDSS from the FET's datasheet</text>
  <line x1="380" y1="120" x2="490" y2="120" stroke="#394049" stroke-width="2"/>
  <text x="430" y="110" font-size="12" fill="#394049" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">+12V</text>
  <rect x="490" y="96" width="86" height="48" rx="3" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="533.0" y="118.0" font-size="13" fill="#394049" font-weight="600" text-anchor="middle">Q1</text>
  <text x="533.0" y="133.0" font-size="10" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">VDSS 30 V</text>
  <line x1="576" y1="120" x2="640" y2="120" stroke="#394049" stroke-width="2"/>
  <text x="608" y="110" font-size="11" fill="#6b7280" text-anchor="middle">load</text>
  <text x="510" y="180" font-size="12" fill="#2f9e57" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">12 V  &lt;  30 V VDSS</text>
  <text x="510" y="206" font-size="11" fill="#6b7280" text-anchor="middle">VDSS from the FET's datasheet</text>
</svg>
