<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="680" height="250" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="floating-input rule: a net carrying only an input pin with nothing to set its level is flagged; the same input pulled to a rail is fine">
  <!-- card -->
  <rect x="1" y="1" width="678" height="248" rx="10" fill="#f8f9fb" stroke="#e3e6eb"/>
  <line x1="340" y1="24" x2="340" y2="226" stroke="#e3e6eb" stroke-dasharray="4 4"/>

  <!-- ================= LEFT: flagged ================= -->
  <text x="30" y="42" font-size="15" font-weight="600" fill="#d64545">Flagged: input only</text>

  <!-- IC U1 with a single input pin stub -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <rect x="210" y="104" width="62" height="44" rx="6" fill="#ffffff"/>
    <line x1="210" y1="126" x2="196" y2="126"/>
  </g>
  <text x="241" y="131" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">U1</text>
  <text x="192" y="118" font-size="11" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">IN</text>

  <!-- flagged net: only the input, ending at an open (undriven) node -->
  <g stroke="#d64545" stroke-width="2.5" fill="none">
    <line x1="196" y1="126" x2="100" y2="126"/>
    <circle cx="94" cy="126" r="6" fill="#f8f9fb"/>
  </g>
  <text x="146" y="114" font-size="12" fill="#d64545" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">floating</text>

  <text x="175" y="206" font-size="13" fill="#d64545" text-anchor="middle">input only, nothing sets it &#8594; flagged</text>

  <!-- ================= RIGHT: fine ================= -->
  <text x="370" y="42" font-size="15" font-weight="600" fill="#2f9e57">Fine: pulled to a rail</text>

  <!-- +3V3 rail -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="442" y1="80" x2="478" y2="80"/>
  </g>
  <text x="460" y="72" font-size="12" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">+3V3</text>

  <!-- pull resistor R1 (vertical IEC box) -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="460" y1="80" x2="460" y2="94"/>
    <rect x="448" y="94" width="24" height="46" rx="2" fill="#ffffff"/>
    <line x1="460" y1="140" x2="460" y2="166"/>
  </g>
  <text x="486" y="122" font-size="13" font-weight="600" fill="#394049" text-anchor="start">R1</text>

  <!-- net: junction, wire to the input pin of U1 -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="460" y1="166" x2="536" y2="166"/>
  </g>
  <circle cx="460" cy="166" r="4" fill="#394049"/>

  <!-- IC U1 with input pin -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <rect x="548" y="145" width="62" height="44" rx="6" fill="#ffffff"/>
    <line x1="548" y1="166" x2="536" y2="166"/>
  </g>
  <text x="579" y="172" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">U1</text>
  <text x="540" y="158" font-size="11" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">IN</text>

  <text x="505" y="206" font-size="13" fill="#2f9e57" text-anchor="middle">a pull (or a driver) sets it &#8594; fine</text>
</svg>
