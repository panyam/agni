<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" width="680" height="260" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="power-tap-conflict rule: two rival design-wide rail names on one net is flagged; one shared name is fine">
  <!-- card -->
  <rect x="1" y="1" width="678" height="258" rx="10" fill="#f8f9fb" stroke="#e3e6eb"/>
  <line x1="340" y1="24" x2="340" y2="236" stroke="#e3e6eb" stroke-dasharray="4 4"/>

  <!-- ================= LEFT: flagged ================= -->
  <text x="30" y="42" font-size="15" font-weight="600" fill="#d64545">Flagged: two rival rails</text>

  <!-- flagged net: one wire joining two power taps, in red -->
  <g stroke="#d64545" stroke-width="2.5" fill="none">
    <line x1="80" y1="150" x2="280" y2="150"/>
  </g>
  <circle cx="180" cy="150" r="4" fill="#d64545"/>

  <!-- left power tap: +3V3 -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="80" y1="150" x2="80" y2="112"/>
    <line x1="66" y1="112" x2="94" y2="112"/>
  </g>
  <text x="80" y="100" font-size="12" fill="#d64545" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">+3V3</text>

  <!-- right power tap: +3.3V -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="280" y1="150" x2="280" y2="112"/>
    <line x1="266" y1="112" x2="294" y2="112"/>
  </g>
  <text x="280" y="100" font-size="12" fill="#d64545" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">+3.3V</text>

  <text x="180" y="176" font-size="11" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">one net</text>

  <text x="170" y="216" font-size="13" fill="#d64545" text-anchor="middle">two design-wide names -&gt; flagged</text>

  <!-- ================= RIGHT: fine ================= -->
  <text x="370" y="42" font-size="15" font-weight="600" fill="#2f9e57">Fine: one rail name</text>

  <!-- shared net: one wire joining two taps of the same name -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="420" y1="150" x2="620" y2="150"/>
  </g>
  <circle cx="520" cy="150" r="4" fill="#394049"/>

  <!-- left power tap: VCC -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="420" y1="150" x2="420" y2="112"/>
    <line x1="406" y1="112" x2="434" y2="112"/>
  </g>
  <text x="420" y="100" font-size="12" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">VCC</text>

  <!-- right power tap: VCC -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="620" y1="150" x2="620" y2="112"/>
    <line x1="606" y1="112" x2="634" y2="112"/>
  </g>
  <text x="620" y="100" font-size="12" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">VCC</text>

  <text x="520" y="176" font-size="11" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">one net</text>

  <text x="520" y="216" font-size="13" fill="#2f9e57" text-anchor="middle">one design-wide name -&gt; fine</text>
</svg>
