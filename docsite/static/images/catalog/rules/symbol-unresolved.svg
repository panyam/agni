<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="680" height="280" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="symbol-unresolved rule: a resolved symbol contributes pins so the component joins the net; an unresolved symbol leaves the component pinless and silently off the net">
  <rect x="1" y="1" width="678" height="278" rx="10" fill="#f8f9fb" stroke="#e3e6eb"/>
  <line x1="340" y1="24" x2="340" y2="256" stroke="#e3e6eb" stroke-dasharray="4 4"/>

  <!-- ============ LEFT: symbol resolves ============ -->
  <text x="30" y="42" font-size="15" font-weight="600" fill="#2f9e57">Symbol resolves: pins, so connections</text>

  <rect x="34" y="66" width="86" height="34" rx="4" fill="#ffffff" stroke="#2f9e57" stroke-width="2"/>
  <text x="77" y="88" font-size="12" fill="#2f9e57" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">res.sym</text>
  <line x1="77" y1="100" x2="77" y2="122" stroke="#2f9e57" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="128" y="117" font-size="11" fill="#6b7280">pin defs</text>

  <rect x="52" y="122" width="50" height="52" rx="3" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="77" y="153" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">R1</text>
  <!-- pins present -->
  <circle cx="102" cy="136" r="4" fill="#2f9e57"/>
  <circle cx="102" cy="160" r="4" fill="#2f9e57"/>
  <line x1="106" y1="136" x2="250" y2="136" stroke="#394049" stroke-width="2"/>
  <rect x="250" y="110" width="50" height="52" rx="3" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="275" y="141" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">U1</text>
  <text x="178" y="128" font-size="12" fill="#394049" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">SIG</text>

  <text x="170" y="214" font-size="13" fill="#2f9e57" text-anchor="middle">SIG = { R1.1, U1.3 }</text>
  <text x="170" y="234" font-size="12" fill="#6b7280" text-anchor="middle">the netlist matches the drawing</text>

  <!-- ============ RIGHT: symbol does not resolve ============ -->
  <text x="370" y="42" font-size="15" font-weight="600" fill="#d64545">Symbol missing: no pins, no connections</text>

  <rect x="374" y="66" width="86" height="34" rx="4" fill="#ffffff" stroke="#d64545" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="417" y="88" font-size="12" fill="#d64545" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">res.sym</text>
  <text x="468" y="83" font-size="16" fill="#d64545">&#215;</text>
  <text x="468" y="99" font-size="11" fill="#d64545">not found</text>

  <rect x="392" y="122" width="50" height="52" rx="3" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="417" y="153" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">R1</text>
  <!-- pins absent: hollow markers, wire never reaches -->
  <circle cx="442" cy="136" r="4" fill="#ffffff" stroke="#d64545" stroke-width="2" stroke-dasharray="2 2"/>
  <circle cx="442" cy="160" r="4" fill="#ffffff" stroke="#d64545" stroke-width="2" stroke-dasharray="2 2"/>
  <line x1="446" y1="136" x2="590" y2="136" stroke="#c9ced6" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="590" y="110" width="50" height="52" rx="3" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="615" y="141" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">U1</text>
  <text x="518" y="128" font-size="12" fill="#9aa1ab" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">SIG</text>

  <text x="510" y="214" font-size="13" fill="#d64545" text-anchor="middle">SIG = { U1.3 }</text>
  <text x="510" y="234" font-size="12" fill="#6b7280" text-anchor="middle">a smaller netlist, not an error</text>
</svg>
