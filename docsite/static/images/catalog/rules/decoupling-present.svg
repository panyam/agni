<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" width="700" height="270" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="decoupling-present rule: a power rail feeding a chip with no capacitor is flagged; a rail with a decoupling capacitor is fine">
  <!-- card -->
  <rect x="1" y="1" width="698" height="268" rx="10" fill="#f8f9fb" stroke="#e3e6eb"/>
  <line x1="350" y1="24" x2="350" y2="246" stroke="#e3e6eb" stroke-dasharray="4 4"/>

  <!-- ================= LEFT: flagged ================= -->
  <text x="30" y="42" font-size="15" font-weight="600" fill="#d64545">Flagged: no cap on rail</text>

  <!-- regulator box -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <rect x="34" y="100" width="60" height="40" rx="4" fill="#ffffff"/>
  </g>
  <text x="64" y="124" font-size="12" fill="#394049" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">REG</text>

  <!-- U1 chip -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <rect x="246" y="96" width="66" height="48" rx="4" fill="#ffffff"/>
  </g>
  <text x="279" y="88" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">U1</text>
  <text x="279" y="124" font-size="11" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">vdd</text>

  <!-- flagged rail: reg out to U1 vdd, no cap -->
  <g stroke="#d64545" stroke-width="2.5" fill="none">
    <line x1="94" y1="120" x2="246" y2="120"/>
  </g>
  <circle cx="94" cy="120" r="4" fill="#d64545"/>
  <circle cx="246" cy="120" r="4" fill="#d64545"/>
  <text x="170" y="108" font-size="12" fill="#d64545" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">VCC1</text>

  <text x="190" y="226" font-size="13" fill="#d64545" text-anchor="middle">no capacitor on the rail -&gt; flagged</text>

  <!-- ================= RIGHT: fine ================= -->
  <text x="378" y="42" font-size="15" font-weight="600" fill="#2f9e57">Fine: cap present</text>

  <!-- regulator box -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <rect x="384" y="100" width="60" height="40" rx="4" fill="#ffffff"/>
  </g>
  <text x="414" y="124" font-size="12" fill="#394049" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">REG</text>

  <!-- U2 chip -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <rect x="600" y="96" width="66" height="48" rx="4" fill="#ffffff"/>
  </g>
  <text x="633" y="88" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">U2</text>
  <text x="633" y="124" font-size="11" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">vdd</text>

  <!-- rail: reg out to U2 vdd, with a cap branch to ground -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="444" y1="120" x2="600" y2="120"/>
  </g>
  <text x="475" y="108" font-size="12" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">VCC2</text>

  <!-- junction where cap taps the rail -->
  <circle cx="522" cy="120" r="4" fill="#394049"/>

  <!-- capacitor C1 dropping from rail to ground -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="522" y1="120" x2="522" y2="156"/>
    <line x1="508" y1="156" x2="536" y2="156"/>
    <line x1="508" y1="164" x2="536" y2="164"/>
    <line x1="522" y1="164" x2="522" y2="184"/>
  </g>
  <text x="552" y="164" font-size="13" font-weight="600" fill="#2f9e57" text-anchor="middle">C1</text>

  <!-- ground symbol -->
  <g stroke="#394049" stroke-width="2">
    <line x1="506" y1="184" x2="538" y2="184"/>
    <line x1="511" y1="190" x2="533" y2="190"/>
    <line x1="516" y1="196" x2="528" y2="196"/>
  </g>

  <text x="540" y="226" font-size="13" fill="#2f9e57" text-anchor="middle">C1 decouples the rail -&gt; fine</text>
</svg>
