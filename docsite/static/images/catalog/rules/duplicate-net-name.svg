<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" width="680" height="260" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="duplicate-net-name rule: two separate net records both named VCC are flagged; one net named VCC is fine">
  <!-- card -->
  <rect x="1" y="1" width="678" height="258" rx="10" fill="#f8f9fb" stroke="#e3e6eb"/>
  <line x1="340" y1="24" x2="340" y2="236" stroke="#e3e6eb" stroke-dasharray="4 4"/>

  <!-- ================= LEFT: flagged ================= -->
  <text x="24" y="42" font-size="15" font-weight="600" fill="#d64545">Flagged: two nets, one name</text>

  <!-- U1 -->
  <rect x="44" y="64" width="44" height="40" rx="4" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="66" y="90" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">U1</text>
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="88" y1="84" x2="112" y2="84"/>
  </g>
  <!-- net record #1: named VCC -->
  <g stroke="#d64545" stroke-width="2.5" fill="none">
    <line x1="112" y1="84" x2="206" y2="84"/>
    <circle cx="212" cy="84" r="6" fill="#f8f9fb"/>
  </g>
  <text x="162" y="76" font-size="12" fill="#d64545" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">VCC</text>
  <text x="118" y="100" font-size="11" fill="#6b7280" font-family="ui-monospace, Menlo, Consolas, monospace">U1.1</text>

  <!-- U2 -->
  <rect x="44" y="150" width="44" height="40" rx="4" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="66" y="176" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">U2</text>
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="88" y1="170" x2="112" y2="170"/>
  </g>
  <!-- net record #2: ALSO named VCC, a separate record -->
  <g stroke="#d64545" stroke-width="2.5" fill="none">
    <line x1="112" y1="170" x2="206" y2="170"/>
    <circle cx="212" cy="170" r="6" fill="#f8f9fb"/>
  </g>
  <text x="162" y="162" font-size="12" fill="#d64545" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">VCC</text>
  <text x="118" y="186" font-size="11" fill="#6b7280" font-family="ui-monospace, Menlo, Consolas, monospace">U2.4</text>

  <text x="182" y="224" font-size="13" fill="#d64545" text-anchor="middle">two records claim VCC -&gt; both flagged</text>

  <!-- ================= RIGHT: fine ================= -->
  <text x="364" y="42" font-size="15" font-weight="600" fill="#2f9e57">Fine: one net VCC</text>

  <!-- U1 -->
  <rect x="372" y="100" width="44" height="40" rx="4" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="394" y="126" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">U1</text>

  <!-- single net VCC joining U1.1 and C1.1 -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="416" y1="120" x2="520" y2="120"/>
  </g>

  <!-- C1 (decoupling cap to GND) -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="520" y1="120" x2="536" y2="120"/>
    <line x1="536" y1="106" x2="536" y2="134"/>
    <line x1="544" y1="106" x2="544" y2="134"/>
    <line x1="544" y1="120" x2="560" y2="120"/>
    <line x1="560" y1="120" x2="560" y2="150"/>
  </g>
  <text x="536" y="96" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">C1</text>
  <!-- ground -->
  <g stroke="#394049" stroke-width="2">
    <line x1="546" y1="158" x2="574" y2="158"/>
    <line x1="551" y1="164" x2="569" y2="164"/>
    <line x1="556" y1="170" x2="564" y2="170"/>
  </g>

  <text x="468" y="112" font-size="12" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">VCC</text>
  <text x="420" y="138" font-size="11" fill="#6b7280" font-family="ui-monospace, Menlo, Consolas, monospace">U1.1</text>
  <text x="512" y="146" font-size="11" fill="#6b7280" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">C1.1</text>

  <text x="500" y="224" font-size="13" fill="#2f9e57" text-anchor="middle">one net named VCC -&gt; fine</text>
</svg>
