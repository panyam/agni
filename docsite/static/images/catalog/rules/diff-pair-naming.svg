<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="680" height="250" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="diff-pair-naming rule: a positive net with no matching negative half is flagged; a complete P and N pair is fine">
  <!-- card -->
  <rect x="1" y="1" width="678" height="248" rx="10" fill="#f8f9fb" stroke="#e3e6eb"/>
  <line x1="340" y1="24" x2="340" y2="226" stroke="#e3e6eb" stroke-dasharray="4 4"/>

  <!-- ================= LEFT: flagged ================= -->
  <text x="30" y="42" font-size="15" font-weight="600" fill="#d64545">Flagged: _P with no _N</text>

  <!-- driver IC U1 -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <rect x="58" y="100" width="46" height="60" rx="6" fill="#ffffff"/>
    <line x1="104" y1="120" x2="120" y2="120"/>
    <line x1="104" y1="144" x2="120" y2="144"/>
  </g>
  <text x="81" y="94" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">U1</text>

  <!-- positive half present, flagged (red) -->
  <g stroke="#d64545" stroke-width="2.5" fill="none">
    <line x1="120" y1="120" x2="242" y2="120"/>
    <circle cx="248" cy="120" r="6" fill="#f8f9fb"/>
  </g>
  <text x="184" y="112" font-size="12" fill="#d64545" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">HDMI_TX0_P</text>

  <!-- negative half absent (ghost) -->
  <g stroke="#b0b4bb" stroke-width="2" fill="none" stroke-dasharray="5 4">
    <line x1="120" y1="144" x2="242" y2="144"/>
    <circle cx="248" cy="144" r="6" fill="#f8f9fb" stroke-dasharray="0"/>
  </g>
  <text x="184" y="166" font-size="12" fill="#d64545" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">HDMI_TX0_N (missing)</text>

  <text x="184" y="210" font-size="13" fill="#d64545" text-anchor="middle">_P present, no _N -&gt; flagged</text>

  <!-- ================= RIGHT: fine ================= -->
  <text x="370" y="42" font-size="15" font-weight="600" fill="#2f9e57">Fine: _P and _N both present</text>

  <!-- driver IC U1 -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <rect x="398" y="100" width="46" height="60" rx="6" fill="#ffffff"/>
    <line x1="444" y1="120" x2="460" y2="120"/>
    <line x1="444" y1="144" x2="460" y2="144"/>
  </g>
  <text x="421" y="94" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">U1</text>

  <!-- positive half -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="460" y1="120" x2="582" y2="120"/>
    <circle cx="588" cy="120" r="6" fill="#f8f9fb" stroke="#394049"/>
  </g>
  <text x="524" y="112" font-size="12" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">HDMI_TX1_P</text>

  <!-- negative half -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="460" y1="144" x2="582" y2="144"/>
    <circle cx="588" cy="144" r="6" fill="#f8f9fb" stroke="#394049"/>
  </g>
  <text x="524" y="166" font-size="12" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">HDMI_TX1_N</text>

  <text x="500" y="210" font-size="13" fill="#2f9e57" text-anchor="middle">matched pair -&gt; fine</text>
</svg>
