<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="subsystem rule: a declared subsystem missing its source part or a required net is flagged; the complete subsystem is fine">
  <!-- card -->
  <rect x="1" y="1" width="698" height="298" rx="10" fill="#f8f9fb" stroke="#e3e6eb"/>
  <line x1="350" y1="24" x2="350" y2="262" stroke="#e3e6eb" stroke-dasharray="4 4"/>
  <text x="350" y="288" font-size="12" fill="#6b7280" text-anchor="middle">intent.yaml declares the subsystem (subsystems: name main-clock, source class crystal, nets CLK)</text>

  <!-- ================= LEFT: flagged (source absent) ================= -->
  <text x="30" y="42" font-size="15" font-weight="600" fill="#d64545">Flagged: source part missing</text>

  <!-- MCU with clock input -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <rect x="200" y="96" width="66" height="48" rx="4" fill="#ffffff"/>
  </g>
  <text x="233" y="88" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">U1</text>
  <text x="233" y="124" font-size="11" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">xin</text>

  <!-- ghost crystal (declared source, absent) -->
  <g stroke="#d64545" stroke-width="2" stroke-dasharray="5 4" fill="none">
    <rect x="60" y="100" width="40" height="40" rx="3" fill="#ffffff"/>
  </g>
  <text x="80" y="90" font-size="12" fill="#d64545" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">crystal</text>
  <text x="80" y="126" font-size="14" fill="#d64545" text-anchor="middle">absent</text>

  <!-- CLK net stub (present but no source drives it) -->
  <g stroke="#d64545" stroke-width="2.5" fill="none">
    <line x1="100" y1="120" x2="200" y2="120"/>
  </g>
  <text x="150" y="108" font-size="12" fill="#d64545" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">CLK</text>

  <text x="175" y="234" font-size="13" fill="#d64545" text-anchor="middle">source part or required net missing &#8594; flagged</text>

  <!-- ================= RIGHT: fine (complete) ================= -->
  <text x="378" y="42" font-size="15" font-weight="600" fill="#2f9e57">Fine: subsystem complete</text>

  <!-- crystal present -->
  <g stroke="#2f9e57" stroke-width="2" fill="none">
    <rect x="410" y="100" width="40" height="40" rx="3" fill="#ffffff"/>
  </g>
  <text x="430" y="90" font-size="12" fill="#394049" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">Y1</text>
  <text x="430" y="126" font-size="10" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">crystal</text>

  <!-- CLK net driven by the crystal into the MCU -->
  <g stroke="#2f9e57" stroke-width="2.5" fill="none">
    <line x1="450" y1="120" x2="550" y2="120"/>
  </g>
  <circle cx="450" cy="120" r="4" fill="#2f9e57"/>
  <circle cx="550" cy="120" r="4" fill="#2f9e57"/>
  <text x="500" y="108" font-size="12" fill="#2f9e57" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">CLK</text>

  <!-- MCU -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <rect x="550" y="96" width="66" height="48" rx="4" fill="#ffffff"/>
  </g>
  <text x="583" y="88" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">U2</text>
  <text x="583" y="124" font-size="11" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">xin</text>

  <text x="525" y="234" font-size="13" fill="#2f9e57" text-anchor="middle">source and required net present &#8594; fine</text>
</svg>
