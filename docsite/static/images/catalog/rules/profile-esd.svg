<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="680" height="250" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="profile-esd rule: a connector-facing interface net with no clamp near the connector is flagged; one with a TVS beside it is fine">
