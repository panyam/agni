  <text x="122" y="137.0" font-size="11" fill="#6b7280" font-family="ui-monospace, Menlo, Consolas, monospace">R1</text>
  <line x1="110" y1="168" x2="110" y2="176" stroke="#d64545" stroke-width="2"/>
  <line x1="230" y1="98" x2="230" y2="117.0" stroke="#d64545" stroke-width="2"/>
