  <text x="170" y="210" font-size="12" fill="#394049" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">SDA</text>
  <text x="170" y="232" font-size="11" fill="#d64545" text-anchor="middle">the bus ties +3V3 to +1V8</text>
  <text x="510" y="92" font-size="12" fill="#394049" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">+1V8</text>
