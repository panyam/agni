  <line x1="230" y1="168" x2="230" y2="176" stroke="#d64545" stroke-width="2"/>
  <line x1="110" y1="176" x2="230" y2="176" stroke="#d64545" stroke-width="2"/>
  <circle cx="170" cy="176" r="3.5" fill="#d64545"/>
