  <line x1="510" y1="149.0" x2="510" y2="168" stroke="#394049" stroke-width="2"/>
  <text x="522" y="137.0" font-size="11" fill="#6b7280" font-family="ui-monospace, Menlo, Consolas, monospace">R1</text>
  <line x1="510" y1="168" x2="510" y2="194" stroke="#394049" stroke-width="2"/>
