<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="680" height="250" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="i2c-pull-up-split-rail rule: an I2C net pulled up to two different rails is flagged; one pull-up to one rail is fine">
