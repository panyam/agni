<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" width="680" height="270" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="hole-size rule: a via drilled below the fab floor is flagged; an adequate drill is fine">
  <rect x="1" y="1" width="678" height="268" rx="10" fill="#f8f9fb" stroke="#e3e6eb"/>
  <line x1="340" y1="24" x2="340" y2="246" stroke="#e3e6eb" stroke-dasharray="4 4"/>

  <!-- ============ LEFT: flagged (tiny drill) ============ -->
  <text x="30" y="42" font-size="15" font-weight="600" fill="#d64545">Flagged: drill too small</text>
  <circle cx="160" cy="150" r="54" fill="#cf9b57" stroke="#394049" stroke-width="2"/>
  <circle cx="160" cy="150" r="16" fill="#f8f9fb" stroke="#394049" stroke-width="2"/>
  <!-- drill diameter dimension across the hole -->
  <g stroke="#d64545" stroke-width="2">
    <line x1="144" y1="150" x2="176" y2="150"/>
    <line x1="144" y1="145" x2="144" y2="155"/>
    <line x1="176" y1="145" x2="176" y2="155"/>
  </g>
  <text x="160" y="86" font-size="12" fill="#d64545" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">drill &lt; 0.2 mm</text>
  <text x="150" y="234" font-size="13" fill="#d64545" text-anchor="middle">below the fab's drill floor &#8594; flagged</text>

  <!-- ============ RIGHT: fine (adequate drill) ============ -->
  <text x="370" y="42" font-size="15" font-weight="600" fill="#2f9e57">Fine: adequate drill</text>
  <circle cx="500" cy="150" r="54" fill="#cf9b57" stroke="#394049" stroke-width="2"/>
  <circle cx="500" cy="150" r="34" fill="#f8f9fb" stroke="#394049" stroke-width="2"/>
  <g stroke="#2f9e57" stroke-width="2">
    <line x1="466" y1="150" x2="534" y2="150"/>
    <line x1="466" y1="145" x2="466" y2="155"/>
    <line x1="534" y1="145" x2="534" y2="155"/>
  </g>
  <text x="500" y="86" font-size="12" fill="#2f9e57" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">drill &#8805; 0.2 mm</text>
  <text x="500" y="234" font-size="13" fill="#2f9e57" text-anchor="middle">within the fab's tooling &#8594; fine</text>
</svg>
