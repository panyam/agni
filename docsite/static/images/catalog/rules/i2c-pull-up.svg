<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" width="680" height="270" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="i2c-pull-up rule: an I2C line with no pull-up resistor is flagged; a line with a pull-up to the rail is fine">
  <!-- card -->
  <rect x="1" y="1" width="678" height="268" rx="10" fill="#f8f9fb" stroke="#e3e6eb"/>
  <line x1="340" y1="24" x2="340" y2="246" stroke="#e3e6eb" stroke-dasharray="4 4"/>

  <!-- ================= LEFT: flagged ================= -->
  <text x="30" y="42" font-size="15" font-weight="600" fill="#d64545">Flagged: no pull-up</text>

  <!-- +3V3 rail -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="120" y1="76" x2="290" y2="76"/>
  </g>
  <text x="112" y="80" font-size="12" fill="#6b7280" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">+3V3</text>

  <!-- U1 -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <rect x="60" y="150" width="54" height="52" rx="4" fill="#ffffff"/>
    <line x1="114" y1="176" x2="150" y2="176"/>
  </g>
  <text x="87" y="181" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">U1</text>

  <!-- flagged SDA net in red, ending at open node; nothing bridges to the rail -->
  <g stroke="#d64545" stroke-width="2.5" fill="none">
    <line x1="150" y1="176" x2="250" y2="176"/>
    <circle cx="256" cy="176" r="6" fill="#f8f9fb"/>
  </g>
  <text x="200" y="164" font-size="12" fill="#d64545" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">SDA</text>
  <text x="235" y="120" font-size="12" fill="#d64545" text-anchor="middle">(no pull-up)</text>

  <text x="180" y="228" font-size="13" fill="#d64545" text-anchor="middle">no resistor to rail -&gt; flagged</text>

  <!-- ================= RIGHT: fine ================= -->
  <text x="370" y="42" font-size="15" font-weight="600" fill="#2f9e57">Fine: pull-up present</text>

  <!-- +3V3 rail -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="460" y1="76" x2="630" y2="76"/>
  </g>
  <text x="452" y="80" font-size="12" fill="#6b7280" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">+3V3</text>

  <!-- U1 -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <rect x="400" y="150" width="54" height="52" rx="4" fill="#ffffff"/>
    <line x1="454" y1="176" x2="490" y2="176"/>
  </g>
  <text x="427" y="181" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">U1</text>

  <!-- SCL net to junction -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="490" y1="176" x2="560" y2="176"/>
  </g>
  <circle cx="560" cy="176" r="4" fill="#394049"/>
  <text x="525" y="164" font-size="12" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">SCL</text>

  <!-- R3 pull-up: vertical resistor from junction up to the rail -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="560" y1="176" x2="560" y2="146"/>
    <rect x="548" y="106" width="24" height="40" rx="2" fill="#ffffff"/>
    <line x1="560" y1="106" x2="560" y2="76"/>
  </g>
  <circle cx="560" cy="76" r="4" fill="#394049"/>
  <text x="590" y="130" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">R3</text>

  <text x="510" y="228" font-size="13" fill="#2f9e57" text-anchor="middle">R3 pulls to +3V3 -&gt; fine</text>
</svg>
