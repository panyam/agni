<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="700" height="280" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="crystal-load-caps rule: a crystal with a load cap missing on one terminal is flagged; a crystal with a cap on both terminals is fine">
  <!-- card -->
  <rect x="1" y="1" width="698" height="278" rx="10" fill="#f8f9fb" stroke="#e3e6eb"/>
  <line x1="350" y1="24" x2="350" y2="256" stroke="#e3e6eb" stroke-dasharray="4 4"/>

  <!-- ================= LEFT: flagged ================= -->
  <text x="30" y="42" font-size="15" font-weight="600" fill="#d64545">Flagged: one terminal has no cap</text>

  <!-- OSC_IN terminal (fine side) -->
  <circle cx="48" cy="118" r="6" fill="#f8f9fb" stroke="#394049" stroke-width="2"/>
  <text x="48" y="140" font-size="11" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">U1.OSC_IN</text>

  <!-- OSC_IN net wire to crystal, junction A for C1 -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="54" y1="118" x2="150" y2="118"/>
  </g>
  <circle cx="110" cy="118" r="4" fill="#394049"/>

  <!-- load cap C1 to GND -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="110" y1="118" x2="110" y2="152"/>
    <line x1="98" y1="152" x2="122" y2="152"/>
    <line x1="98" y1="160" x2="122" y2="160"/>
    <line x1="110" y1="160" x2="110" y2="180"/>
    <line x1="110" y1="180" x2="110" y2="188"/>
    <line x1="96" y1="188" x2="124" y2="188"/>
    <line x1="101" y1="194" x2="119" y2="194"/>
    <line x1="105" y1="200" x2="115" y2="200"/>
  </g>
  <text x="132" y="158" font-size="13" font-weight="600" fill="#394049">C1</text>

  <!-- crystal Y1 (horizontal, bridges the two terminals) -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="150" y1="118" x2="160" y2="118"/>
    <line x1="160" y1="106" x2="160" y2="130"/>
    <rect x="162" y="107" width="22" height="22" rx="2" fill="#ffffff"/>
    <line x1="186" y1="106" x2="186" y2="130"/>
    <line x1="186" y1="118" x2="198" y2="118"/>
  </g>
  <text x="173" y="98" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">Y1</text>
  <text x="147" y="146" font-size="11" fill="#6b7280" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">Y1.1</text>
  <text x="200" y="146" font-size="11" fill="#6b7280" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">Y1.2</text>

  <!-- OSC_OUT net: FLAGGED, missing load cap -->
  <g stroke="#d64545" stroke-width="2.5" fill="none">
    <line x1="198" y1="118" x2="300" y2="118"/>
  </g>
  <circle cx="245" cy="118" r="4" fill="#d64545"/>
  <circle cx="300" cy="118" r="6" fill="#f8f9fb" stroke="#d64545" stroke-width="2"/>
  <text x="300" y="140" font-size="11" fill="#d64545" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">U1.OSC_OUT</text>

  <!-- ghost of the missing cap, dashed red -->
  <g stroke="#d64545" stroke-width="2" fill="none" stroke-dasharray="4 3">
    <line x1="245" y1="118" x2="245" y2="152"/>
    <line x1="233" y1="152" x2="257" y2="152"/>
    <line x1="233" y1="160" x2="257" y2="160"/>
    <line x1="245" y1="160" x2="245" y2="180"/>
    <line x1="245" y1="180" x2="245" y2="188"/>
    <line x1="231" y1="188" x2="259" y2="188"/>
    <line x1="236" y1="194" x2="254" y2="194"/>
    <line x1="240" y1="200" x2="250" y2="200"/>
  </g>
  <text x="266" y="158" font-size="12" fill="#d64545" font-family="ui-monospace, Menlo, Consolas, monospace">no cap</text>

  <text x="185" y="248" font-size="13" fill="#d64545" text-anchor="middle">OSC_OUT terminal has no cap -&gt; flagged</text>

  <!-- ================= RIGHT: fine ================= -->
  <text x="368" y="42" font-size="15" font-weight="600" fill="#2f9e57">Fine: both terminals have caps</text>

  <!-- OSC_IN terminal -->
  <circle cx="388" cy="118" r="6" fill="#f8f9fb" stroke="#394049" stroke-width="2"/>
  <text x="388" y="140" font-size="11" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">U1.OSC_IN</text>

  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="394" y1="118" x2="490" y2="118"/>
  </g>
  <circle cx="450" cy="118" r="4" fill="#394049"/>

  <!-- load cap C1 to GND -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="450" y1="118" x2="450" y2="152"/>
    <line x1="438" y1="152" x2="462" y2="152"/>
    <line x1="438" y1="160" x2="462" y2="160"/>
    <line x1="450" y1="160" x2="450" y2="180"/>
    <line x1="450" y1="180" x2="450" y2="188"/>
    <line x1="436" y1="188" x2="464" y2="188"/>
    <line x1="441" y1="194" x2="459" y2="194"/>
    <line x1="445" y1="200" x2="455" y2="200"/>
  </g>
  <text x="472" y="158" font-size="13" font-weight="600" fill="#394049">C1</text>

  <!-- crystal Y1 -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="490" y1="118" x2="500" y2="118"/>
    <line x1="500" y1="106" x2="500" y2="130"/>
    <rect x="502" y="107" width="22" height="22" rx="2" fill="#ffffff"/>
    <line x1="526" y1="106" x2="526" y2="130"/>
    <line x1="526" y1="118" x2="538" y2="118"/>
  </g>
  <text x="513" y="98" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">Y1</text>
  <text x="487" y="146" font-size="11" fill="#6b7280" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">Y1.1</text>
  <text x="540" y="146" font-size="11" fill="#6b7280" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">Y1.2</text>

  <!-- OSC_OUT net with its cap present -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="538" y1="118" x2="640" y2="118"/>
  </g>
  <circle cx="585" cy="118" r="4" fill="#394049"/>
  <circle cx="640" cy="118" r="6" fill="#f8f9fb" stroke="#394049" stroke-width="2"/>
  <text x="640" y="140" font-size="11" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">U1.OSC_OUT</text>

  <!-- load cap C2 to GND -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="585" y1="118" x2="585" y2="152"/>
    <line x1="573" y1="152" x2="597" y2="152"/>
    <line x1="573" y1="160" x2="597" y2="160"/>
    <line x1="585" y1="160" x2="585" y2="180"/>
    <line x1="585" y1="180" x2="585" y2="188"/>
    <line x1="571" y1="188" x2="599" y2="188"/>
    <line x1="576" y1="194" x2="594" y2="194"/>
    <line x1="580" y1="200" x2="590" y2="200"/>
  </g>
  <text x="607" y="158" font-size="13" font-weight="600" fill="#394049">C2</text>

  <text x="525" y="248" font-size="13" fill="#2f9e57" text-anchor="middle">a load cap on each terminal -&gt; fine</text>
</svg>
