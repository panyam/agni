<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="680" height="280" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="exposure-declared rule: an internal-exposure declaration naming a ref-des that is not a connector on the design is flagged; one naming a connector is fine">
