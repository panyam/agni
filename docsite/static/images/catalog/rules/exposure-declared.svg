  <text x="170" y="212" font-size="11" fill="#6b7280" text-anchor="middle">J18 is still checked as external</text>
  <rect x="370" y="100" width="80" height="44" rx="3" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="410.0" y="120.0" font-size="13" fill="#394049" font-weight="600" text-anchor="middle">J1</text>
  <text x="410.0" y="135.0" font-size="10" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">connector</text>
  <rect x="466" y="100" width="80" height="44" rx="3" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="506.0" y="120.0" font-size="13" fill="#394049" font-weight="600" text-anchor="middle">J17</text>
  <text x="506.0" y="135.0" font-size="10" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">connector</text>
