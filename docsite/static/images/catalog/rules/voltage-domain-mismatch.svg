<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="voltage-domain-mismatch rule: a declared rail absent, or a rail whose name declares the wrong voltage, is flagged; a rail on its declared nominal is fine">
  <!-- card -->
  <rect x="1" y="1" width="698" height="298" rx="10" fill="#f8f9fb" stroke="#e3e6eb"/>
  <line x1="350" y1="24" x2="350" y2="262" stroke="#e3e6eb" stroke-dasharray="4 4"/>
  <text x="350" y="288" font-size="12" fill="#6b7280" text-anchor="middle">intent.yaml declares the domain (voltage_domains: name io_3v3, nominal 3.3, rails 3V3)</text>

  <!-- ================= LEFT: flagged ================= -->
  <text x="30" y="42" font-size="15" font-weight="600" fill="#d64545">Flagged: absent, or wrong nominal</text>

  <!-- regulator -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <rect x="34" y="88" width="60" height="40" rx="4" fill="#ffffff"/>
  </g>
  <text x="64" y="112" font-size="12" fill="#394049" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">REG</text>

  <!-- case 1: declared rail 3V3 absent (ghost) -->
  <g stroke="#d64545" stroke-width="2.5" stroke-dasharray="5 4" fill="none">
    <line x1="94" y1="108" x2="250" y2="108"/>
  </g>
  <text x="172" y="98" font-size="12" fill="#d64545" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">3V3</text>
  <text x="285" y="112" font-size="14" fill="#d64545" text-anchor="middle">absent</text>

  <!-- case 2: rail present but name declares 5V, domain is 3.3 -->
  <g stroke="#d64545" stroke-width="2.5" fill="none">
    <line x1="94" y1="168" x2="250" y2="168"/>
  </g>
  <circle cx="94" cy="168" r="4" fill="#d64545"/>
  <text x="172" y="158" font-size="12" fill="#d64545" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">5V0</text>
  <text x="288" y="172" font-size="12" fill="#d64545" text-anchor="middle">name says 5V</text>

  <text x="185" y="244" font-size="13" fill="#d64545" text-anchor="middle">missing rail, or name off the domain &#8594; flagged</text>

  <!-- ================= RIGHT: fine ================= -->
  <text x="378" y="42" font-size="15" font-weight="600" fill="#2f9e57">Fine: rail on its declared nominal</text>

  <g stroke="#394049" stroke-width="2" fill="none">
    <rect x="384" y="118" width="60" height="40" rx="4" fill="#ffffff"/>
  </g>
  <text x="414" y="142" font-size="12" fill="#394049" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">REG</text>

  <!-- 3V3 rail present, name matches domain -->
  <g stroke="#2f9e57" stroke-width="2.5" fill="none">
    <line x1="444" y1="138" x2="600" y2="138"/>
  </g>
  <circle cx="444" cy="138" r="4" fill="#2f9e57"/>
  <circle cx="600" cy="138" r="4" fill="#2f9e57"/>
  <text x="522" y="128" font-size="12" fill="#2f9e57" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">3V3</text>
  <text x="522" y="162" font-size="12" fill="#6b7280" text-anchor="middle">name declares 3.3V</text>

  <text x="522" y="244" font-size="13" fill="#2f9e57" text-anchor="middle">present and on-nominal &#8594; fine</text>
</svg>
