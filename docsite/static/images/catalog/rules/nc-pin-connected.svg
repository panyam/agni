<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="680" height="250" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="nc-pin-connected rule: a NO_CONNECT pin wired into a net is flagged; the same pin left unwired is fine">
  <!-- card -->
  <rect x="1" y="1" width="678" height="248" rx="10" fill="#f8f9fb" stroke="#e3e6eb"/>
  <line x1="340" y1="24" x2="340" y2="226" stroke="#e3e6eb" stroke-dasharray="4 4"/>

  <!-- ================= LEFT: flagged ================= -->
  <text x="30" y="42" font-size="15" font-weight="600" fill="#d64545">Flagged: NC pin wired</text>

  <!-- U1 IC -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <rect x="46" y="94" width="52" height="62" rx="6" fill="#ffffff"/>
    <line x1="30" y1="112" x2="46" y2="112"/>
    <line x1="30" y1="138" x2="46" y2="138"/>
    <line x1="98" y1="125" x2="122" y2="125"/>
  </g>
  <text x="72" y="86" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">U1</text>
  <text x="100" y="146" font-size="11" fill="#6b7280" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">7 (nc)</text>

  <!-- flagged net: NC pin joined to R3.1 -->
  <g stroke="#d64545" stroke-width="2.5" fill="none">
    <line x1="122" y1="125" x2="216" y2="125"/>
  </g>
  <circle cx="168" cy="125" r="4" fill="#d64545"/>
  <text x="180" y="115" font-size="11" fill="#d64545" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">R3.1</text>

  <!-- resistor R3 -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <rect x="216" y="113" width="52" height="24" rx="2" fill="#ffffff"/>
    <line x1="268" y1="125" x2="292" y2="125"/>
    <line x1="292" y1="125" x2="292" y2="170"/>
  </g>
  <text x="242" y="103" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">R3</text>

  <!-- ground symbol -->
  <g stroke="#394049" stroke-width="2">
    <line x1="276" y1="170" x2="308" y2="170"/>
    <line x1="281" y1="176" x2="303" y2="176"/>
    <line x1="286" y1="182" x2="298" y2="182"/>
  </g>

  <text x="176" y="212" font-size="13" fill="#d64545" text-anchor="middle">NC pin wired into net &#8594; flagged</text>

  <!-- ================= RIGHT: fine ================= -->
  <text x="370" y="42" font-size="15" font-weight="600" fill="#2f9e57">Fine: NC pin unwired</text>

  <!-- U1 IC -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <rect x="428" y="94" width="52" height="62" rx="6" fill="#ffffff"/>
    <line x1="412" y1="112" x2="428" y2="112"/>
    <line x1="412" y1="138" x2="428" y2="138"/>
    <line x1="480" y1="125" x2="504" y2="125"/>
  </g>
  <text x="454" y="86" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">U1</text>
  <text x="482" y="146" font-size="11" fill="#6b7280" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">7 (nc)</text>

  <!-- unwired: open node, nothing else on the net -->
  <circle cx="510" cy="125" r="6" fill="#f8f9fb" stroke="#2f9e57" stroke-width="2"/>
  <text x="560" y="129" font-size="12" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">floating</text>

  <text x="512" y="212" font-size="13" fill="#2f9e57" text-anchor="middle">NC pin left unwired &#8594; fine</text>
</svg>
