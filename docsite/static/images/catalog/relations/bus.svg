<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" width="680" height="270" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="bus relation: a detected bus is flagged as not yet expanded into member nets; the same signals modeled as individual member nets are queryable">
  <rect x="1" y="1" width="678" height="268" rx="10" fill="#f8f9fb" stroke="#e3e6eb"/>
  <line x1="340" y1="24" x2="340" y2="246" stroke="#e3e6eb" stroke-dasharray="4 4"/>

  <!-- LEFT: detected bus, not expanded -->
  <text x="30" y="42" font-size="15" font-weight="600" fill="#c47f17">Detected: bus, members not yet nets</text>
  <!-- thick bus line -->
  <line x1="60" y1="140" x2="230" y2="140" stroke="#c47f17" stroke-width="6"/>
  <text x="60" y="122" font-size="13" fill="#c47f17" font-family="ui-monospace, Menlo, Consolas, monospace">DATA[7:0]</text>
  <!-- bus entries, dashed to show unresolved members -->
  <g stroke="#c9a24a" stroke-width="2" fill="none" stroke-dasharray="4 3">
    <line x1="100" y1="140" x2="118" y2="170"/>
    <line x1="140" y1="140" x2="158" y2="170"/>
    <line x1="180" y1="140" x2="198" y2="170"/>
  </g>
  <text x="150" y="204" font-size="13" fill="#c47f17" text-anchor="middle">construct seen,</text>
  <text x="150" y="222" font-size="13" fill="#c47f17" text-anchor="middle">members not expanded</text>

  <!-- RIGHT: modeled member nets -->
  <text x="370" y="42" font-size="15" font-weight="600" fill="#2f8a4c">Modeled: member nets</text>
  <g stroke="#2f8a4c" stroke-width="2.5" fill="none">
    <line x1="400" y1="96" x2="500" y2="96"/>
    <circle cx="506" cy="96" r="5" fill="#f8f9fb"/>
    <line x1="400" y1="128" x2="500" y2="128"/>
    <circle cx="506" cy="128" r="5" fill="#f8f9fb"/>
    <line x1="400" y1="160" x2="500" y2="160"/>
    <circle cx="506" cy="160" r="5" fill="#f8f9fb"/>
  </g>
  <text x="520" y="100" font-size="12" fill="#2f8a4c" font-family="ui-monospace, Menlo, Consolas, monospace">DATA0</text>
  <text x="520" y="132" font-size="12" fill="#2f8a4c" font-family="ui-monospace, Menlo, Consolas, monospace">DATA1</text>
  <text x="520" y="164" font-size="12" fill="#2f8a4c" font-family="ui-monospace, Menlo, Consolas, monospace">DATA2</text>
  <text x="490" y="204" font-size="13" fill="#2f8a4c" text-anchor="middle">each member is</text>
  <text x="490" y="222" font-size="13" fill="#2f8a4c" text-anchor="middle">its own net</text>
</svg>
