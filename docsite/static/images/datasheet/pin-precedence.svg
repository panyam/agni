<svg xmlns="http://www.w3.org/2000/svg" width="660" height="250" font-family="system-ui,sans-serif" font-size="12">
  <text x="330" y="16" text-anchor="middle" fill="#808080">name leads, number only breaks ties</text>

  <rect x="240" y="36" width="180" height="40" rx="6" fill="none" stroke="#808080"/>
  <text x="330" y="61" text-anchor="middle" fill="#808080" font-size="11">match on pin NAME</text>

  <line x1="330" y1="76" x2="330" y2="104" stroke="#808080" marker-end="url(#p)"/>

  <rect x="240" y="104" width="180" height="40" rx="6" fill="none" stroke="#808080"/>
  <text x="330" y="122" text-anchor="middle" fill="#808080" font-size="11">how many hit?</text>
  <text x="330" y="136" text-anchor="middle" fill="#808080" font-size="9">a name is not unique</text>

  <line x1="240" y1="124" x2="150" y2="124" stroke="#808080" marker-end="url(#p)"/>
  <text x="195" y="117" text-anchor="middle" fill="#5aa06a" font-size="9">exactly one</text>
  <rect x="20" y="104" width="128" height="40" rx="6" fill="none" stroke="#5aa06a"/>
  <text x="84" y="129" text-anchor="middle" fill="#5aa06a" font-size="11">that pin</text>

  <line x1="330" y1="144" x2="330" y2="172" stroke="#808080" marker-end="url(#p)"/>
  <text x="392" y="160" text-anchor="middle" fill="#808080" font-size="9">several, or none</text>

  <rect x="228" y="172" width="204" height="44" rx="6" fill="none" stroke="#4a90d9"/>
  <text x="330" y="190" text-anchor="middle" fill="#4a90d9" font-size="11">number, inside a known package</text>
  <text x="330" y="205" text-anchor="middle" fill="#808080" font-size="9">or across packages that agree</text>

  <line x1="432" y1="194" x2="500" y2="194" stroke="#d98a4a" marker-end="url(#p)"/>
  <rect x="500" y="172" width="144" height="44" rx="6" fill="none" stroke="#d98a4a"/>
  <text x="572" y="190" text-anchor="middle" fill="#d98a4a" font-size="11">refuse, with a sentinel</text>
  <text x="572" y="205" text-anchor="middle" fill="#808080" font-size="9">Ambiguous / Conflict / NoPinData</text>

  <text x="548" y="72" text-anchor="middle" fill="#808080" font-size="10">WHY NOT NUMBER FIRST</text>
  <text x="548" y="90" text-anchor="middle" fill="#808080" font-size="9">a number is a fact about a PACKAGE,</text>
  <text x="548" y="104" text-anchor="middle" fill="#808080" font-size="9">a parameter is a fact about the DIE.</text>
  <text x="548" y="122" text-anchor="middle" fill="#808080" font-size="9">TXB0104 pin 11 is data I/O B3 in TSSOP-14,</text>
  <text x="548" y="136" text-anchor="middle" fill="#808080" font-size="9">and the VCCB supply in UQFN-12.</text>

  <defs><marker id="p" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8" fill="none" stroke="#808080"/></marker></defs>
</svg>
