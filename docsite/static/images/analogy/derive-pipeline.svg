<svg xmlns="http://www.w3.org/2000/svg" width="640" height="230" font-family="system-ui,sans-serif" font-size="12">
  <text x="320" y="18" text-anchor="middle" fill="#808080">derivation = codegen from vendor docs: PartSpec = f(document, toolchain, recipes, patches)</text>
  <rect x="20" y="70" width="90" height="60" rx="6" fill="none" stroke="#808080" stroke-dasharray="5 3"/>
  <text x="65" y="95" text-anchor="middle" fill="#808080">PDF</text>
  <text x="65" y="112" text-anchor="middle" fill="#808080" font-size="10">(vendor docs)</text>

  <line x1="110" y1="100" x2="150" y2="100" stroke="#808080" marker-end="url(#d)"/>
  <text x="130" y="90" text-anchor="middle" fill="#808080" font-size="9">parse</text>

  <rect x="150" y="70" width="100" height="60" rx="6" fill="none" stroke="#4a90d9"/>
  <text x="200" y="95" text-anchor="middle" fill="#4a90d9">doc-IR</text>
  <text x="200" y="112" text-anchor="middle" fill="#808080" font-size="10">(the AST)</text>

  <line x1="250" y1="100" x2="290" y2="100" stroke="#808080" marker-end="url(#d)"/>

  <rect x="290" y="70" width="110" height="60" rx="6" fill="none" stroke="#5aa06a"/>
  <text x="345" y="95" text-anchor="middle" fill="#5aa06a">derive</text>
  <text x="345" y="112" text-anchor="middle" fill="#808080" font-size="10">(the generator)</text>

  <line x1="400" y1="100" x2="440" y2="100" stroke="#808080" marker-end="url(#d)"/>

  <rect x="440" y="45" width="180" height="50" rx="6" fill="none" stroke="#4a90d9"/>
  <text x="530" y="66" text-anchor="middle" fill="#4a90d9">PartSpec (.d.ts stub)</text>
  <text x="530" y="84" text-anchor="middle" fill="#808080" font-size="10">confidence 0.9, cited per row</text>
  <rect x="440" y="110" width="180" height="50" rx="6" fill="none" stroke="#808080"/>
  <text x="530" y="131" text-anchor="middle" fill="#808080">RunManifest</text>
  <text x="530" y="149" text-anchor="middle" fill="#808080" font-size="10">(generator lockfile + warnings)</text>

  <!-- config inputs -->
  <rect x="240" y="170" width="100" height="40" rx="6" fill="none" stroke="#d98a4a"/>
  <text x="290" y="187" text-anchor="middle" fill="#d98a4a" font-size="11">recipes</text>
  <text x="290" y="202" text-anchor="middle" fill="#808080" font-size="9">generator config, per vendor</text>
  <rect x="360" y="170" width="100" height="40" rx="6" fill="none" stroke="#d98a4a"/>
  <text x="410" y="187" text-anchor="middle" fill="#d98a4a" font-size="11">patches</text>
  <text x="410" y="202" text-anchor="middle" fill="#808080" font-size="9">pinned overrides, applied last</text>
  <line x1="300" y1="170" x2="330" y2="132" stroke="#d98a4a" marker-end="url(#d)"/>
  <line x1="400" y1="170" x2="365" y2="132" stroke="#d98a4a" marker-end="url(#d)"/>
  <defs><marker id="d" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8" fill="none" stroke="#808080"/></marker></defs>
</svg>
