<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" font-family="system-ui,sans-serif" font-size="12">
  <text x="360" y="18" text-anchor="middle" fill="#808080">the protection walk: BFS over a pass-element graph; a series part is middleware that splits one channel into two nets</text>

  <!-- Reach span bracket -->
  <path d="M 118 66 Q 300 46 482 66" fill="none" stroke="#4a90d9" stroke-width="1.6"/>
  <path d="M 482 66 l -9 -3 l 3 8 z" fill="#4a90d9"/>
  <text x="300" y="42" text-anchor="middle" fill="#4a90d9" font-size="11">Reach(VBUS, hops=2)</text>

  <!-- the chain -->
  <rect x="40" y="93" width="62" height="34" fill="none" stroke="#4a90d9"/>
  <text x="71" y="108" text-anchor="middle" fill="#4a90d9" font-size="11">J1</text>
  <text x="71" y="121" text-anchor="middle" fill="#808080" font-size="9">connector</text>

  <line x1="102" y1="110" x2="190" y2="110" stroke="#d98a4a" stroke-width="2"/>
  <text x="146" y="104" text-anchor="middle" fill="#d98a4a" font-size="11">VBUS</text>

  <rect x="190" y="93" width="62" height="34" fill="none" stroke="#5aa06a"/>
  <text x="221" y="108" text-anchor="middle" fill="#5aa06a" font-size="11">FB1</text>
  <text x="221" y="121" text-anchor="middle" fill="#808080" font-size="9">ferrite</text>

  <line x1="252" y1="110" x2="340" y2="110" stroke="#d98a4a" stroke-width="2"/>
  <text x="296" y="104" text-anchor="middle" fill="#d98a4a" font-size="11">VMID</text>

  <rect x="340" y="93" width="62" height="34" fill="none" stroke="#5aa06a"/>
  <text x="371" y="108" text-anchor="middle" fill="#5aa06a" font-size="11">F1</text>
  <text x="371" y="121" text-anchor="middle" fill="#808080" font-size="9">fuse</text>

  <line x1="402" y1="110" x2="490" y2="110" stroke="#d98a4a" stroke-width="2"/>
  <text x="446" y="104" text-anchor="middle" fill="#d98a4a" font-size="11">VCC</text>

  <rect x="490" y="93" width="70" height="34" fill="none" stroke="#4a90d9"/>
  <text x="525" y="108" text-anchor="middle" fill="#4a90d9" font-size="11">U1</text>
  <text x="525" y="121" text-anchor="middle" fill="#808080" font-size="9">power_in</text>

  <!-- shunt cap = DC block, non-edge -->
  <line x1="296" y1="110" x2="296" y2="150" stroke="#808080"/>
  <line x1="282" y1="150" x2="310" y2="150" stroke="#c0504d" stroke-width="2.4"/>
  <line x1="282" y1="159" x2="310" y2="159" stroke="#c0504d" stroke-width="2.4"/>
  <text x="320" y="157" fill="#c0504d" font-size="10">C1: a series/shunt cap is a DC block, a non-edge (never crossed)</text>

  <!-- API surface -->
  <line x1="40" y1="192" x2="680" y2="192" stroke="#e0e0e0"/>
  <text x="40" y="210" fill="#808080" font-size="10">the four methods, read like a stack trace:</text>
  <text x="52" y="232" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#333">Reach(start, hops)         -&gt; nodes reachable across pass elements (BFS, start first)</text>
  <text x="52" y="252" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#333">  .Nets    = [VBUS, VMID, VCC]        .Crossed = {FB1, F1}</text>
  <text x="52" y="272" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#333">PathTo(VCC)        = [VBUS, VMID, VCC]     ThroughOnPath(VCC) = [FB1, F1]</text>
  <text x="52" y="292" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#333">Between(VBUS, VCC, Fuse, 2) = true        Between(VBUS, VCC, TVS, 2) = false</text>

  <text x="40" y="318" fill="#808080" font-size="10">stops are bus evidence: ground names, the global-rail fact, fan-out &gt; 16 (a rail is a global singleton the walk must not follow an import into).</text>
</svg>
