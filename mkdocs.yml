site_name: agni
site_description: An engine that reads schematics and PCBs from several formats into one neutral IR, then checks, diffs, renders, and queries them.
site_url: https://panyam.github.io/agni/
repo_url: https://github.com/panyam/agni
repo_name: panyam/agni
docs_dir: docs
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

# External links (../CONSTRAINTS.md, ../examples/, ../xschem, ../geda) point at files that
# live in the repo but outside docs/, so they resolve on GitHub and are expected to be
# unresolved here. Keep the build non-strict so those warnings do not fail CI.

nav:
  - Home: README.md
  - Getting started:
      - Build and setup: GETTING_STARTED.md
      - Native EDA tools: NATIVE_VERIFICATION.md
      - Browser viewer tour: WEB_WALKTHROUGH.md
      - Authoring an overlay: OVERLAY_AUTHORING.md
      - Documentation style: STYLE.md
  - User guide:
      - Overview: userguide/README.md
      - Getting started: userguide/getting-started.md
      - Software-to-hardware concepts: userguide/concepts.md
      - CLI reference: userguide/cli-reference.md
      - Checks and reports: userguide/checks-and-reports.md
      - Comparing revisions: userguide/comparing-revisions.md
      - Querying: userguide/querying.md
      - Naming conventions: userguide/naming-conventions.md
      - Datasheets: userguide/datasheets.md
  - Concepts:
      - Hardware and software analogy: ANALOGY.md
  - Architecture:
      - 13 Ingestion and IR: 13-ingestion-ir-architecture.md
      - 14 Stack and architecture: 14-stack-and-architecture.md
      - 15 Presenter contract: 15-presenter-contract.md
      - 16 Geometry and rendering: 16-geometry-and-rendering.md
      - 17 IR v0: 17-ir-v0.md
      - 18 Semantic diff: 18-semantic-diff.md
      - 19 Rules and checks: 19-rules-dsl.md
      - 20 Parameter IR: 20-parameter-ir.md
      - 21 Document IR: 21-document-ir.md
      - 22 Net solving and the hierarchy walk: 22-net-solving-and-hierarchy.md
      - 23 The web app: 23-web-app.md
      - 24 Derivation: 24-derivation.md
      - 25 Open core: 25-open-core.md
      - 26 Parameter resolution: 26-parameter-resolution.md
      - 27 Authoring a check rule: 27-rule-authoring.md
  - Format references:
      - EDIF netlist primer: edif-primer.md
      - EDIF schematic primer: edif-schematic-primer.md
