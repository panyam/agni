# esbuild ships its platform binary as an optional dependency and its postinstall links and verifies
# it. pnpm refuses to run a dependency's build script until the repo declares a decision about it, so
# an undeclared esbuild is a hard ERR_PNPM_IGNORED_BUILDS on pnpm 12 and a warning on pnpm 10. The two
# spellings are the same decision for the two versions: pnpm 12 reads allowBuilds and ignores
# onlyBuiltDependencies, pnpm 10 reads onlyBuiltDependencies and tolerates allowBuilds. CI installs
# whatever `packageManager` in package.json names, so the second spelling is no longer for CI: it is
# for a developer whose own pnpm predates that pin. Both stay, because dropping one costs nothing to
# keep and breaks an install on the version that reads it.
allowBuilds:
  esbuild: true
onlyBuiltDependencies:
  - esbuild
