{{# include "./BasePage.html" #}}

{{ define "HeadExtra" }}
<style>
  .lb-app { max-width: 920px; margin: 0 auto; padding: 32px 20px 60px; }
  .lb-app h1 { font-size: 20px; margin: 0 0 4px; color: #222; }
  .lb-app h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; color: #888; margin: 22px 0 8px; border-top: 1px solid #e5e5e5; padding-top: 10px; }
  .lb-tagline { color: #777; margin: 0 0 20px; }
  .lb-app h2.lb-title { font-size: 18px; text-transform: none; letter-spacing: 0; color: #222; border: 0; padding: 0; margin: 8px 0 4px; }
  .lb-artifacts td .lb-drop { display: inline-flex; border: 0; padding: 0; gap: 6px; }
  .lb-delete { margin-left: 6px; }
  .lb-list { list-style: none; margin: 0; padding: 0; }
  .lb-row { display: flex; align-items: baseline; gap: 12px; padding: 5px 0; border-bottom: 1px solid #f0f0f0; }
  .lb-link { flex: 1 1 auto; min-width: 0; display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: inherit; }
  .lb-link:hover .lb-label { text-decoration: underline; }
  .lb-label { font-weight: 600; color: #222; }
  .lb-id, .lb-when, .lb-meta { color: #999; font-size: 12px; }
  .lb-latest { font-size: 11px; color: #166534; background: #dcfce7; border-radius: 3px; padding: 1px 6px; }
  .lb-open { font-size: 12px; color: #2563eb; }
  .lb-note { color: #888; font-size: 12px; margin: 6px 0; }
  .lb-status { color: #555; min-height: 1.2em; }
  .lb-new { margin-top: 30px; display: flex; flex-direction: column; gap: 8px; max-width: 520px; }
  .lb-new label { display: flex; gap: 8px; align-items: baseline; }
  .lb-new label input { flex: 1; padding: 4px 6px; }
  /* The link form (agni issue 1727): a column of fields, the mount's folder as a list of buttons. */
  .lb-new .lb-mode { display: flex; gap: 16px; margin: 4px 0; }
  .lb-new .lb-mode label, .lb-link .lb-mode label { display: inline-flex; flex: none; gap: 4px; align-items: center; }
  .lb-new .lb-mode input { flex: none; }
  .lb-link { display: flex; flex-direction: column; gap: 8px; max-width: 520px; }
  .lb-link label { display: flex; gap: 8px; align-items: baseline; }
  .lb-link label input, .lb-link label select { flex: 1; padding: 4px 6px; }
  .lb-link .mount-add form { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .lb-browse { border: 1px solid #e5e5e5; border-radius: 4px; padding: 4px 8px; max-height: 240px; overflow-y: auto; }
  .lb-browse ul { list-style: none; margin: 0; padding: 0; }
  .lb-browse button { background: none; border: 0; padding: 2px 0; cursor: pointer; font: inherit; color: #1a5fd0; text-align: left; }
  .lb-browse .lb-picked { font-weight: 600; color: #222; }
  .lb-link-more { margin: 10px 0; }
  .lb-link-controls .lb-ref { width: 9em; padding: 2px 4px; }
  .lb-access { color: #8a5a00; }
  .lb-revisions td { padding: 2px 10px 2px 0; font-size: 13px; }
  .lb-versions { font-family: ui-monospace, monospace; color: #555; }
  .lb-drop { border: 1px dashed #bbb; border-radius: 6px; padding: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; color: #666; }
  .lb-drop-over { border-color: #2563eb; background: #f8faff; }
  .lb-submit { align-self: flex-start; padding: 5px 12px; }
  .lb-artifacts { border-collapse: collapse; width: 100%; margin: 12px 0; }
  .lb-artifacts th, .lb-artifacts td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; vertical-align: top; font-size: 13px; }
  .lb-artifacts .lb-drop { padding: 4px 6px; font-size: 12px; }
  .lb-nav { display: flex; gap: 14px; margin: 0 0 14px; font-size: 14px; }
  .lb-nav-link { color: #2563eb; text-decoration: none; }
  .lb-nav-here { color: #222; font-weight: 600; }
  .lb-filter { display: flex; gap: 8px; margin: 8px 0; }
  .lb-filter input { flex: 1; padding: 4px 6px; }
  .lb-where { font-size: 11px; color: #555; background: #f1f5f9; border-radius: 3px; padding: 1px 6px; }
  .lb-info { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin: 8px 0; }
  .lb-info label { display: flex; gap: 6px; align-items: baseline; }
  .lb-validate { margin: 8px 0 14px; }
  .lb-validate fieldset { border: 1px solid #e5e5e5; display: flex; flex-direction: column; gap: 4px; margin: 8px 0; }
  .lb-tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid #e5e5e5; margin: 10px 0; }
  .lb-tab { border: 1px solid #e5e5e5; border-bottom: 0; background: #fafafa; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  .lb-tab-on { background: #fff; font-weight: 600; }
  .lb-tab.lb-stale { color: #9a3412; }
  .lb-state { font-size: 12px; color: #166534; margin: 4px 0; }
  .lb-state.lb-stale { color: #9a3412; }
  .lb-newer { color: #9a3412; }
  .lb-packs { margin: 4px 0 8px; padding-left: 20px; }
  .lb-files { font-size: 12px; color: #555; }
  .lb-rule { border-bottom: 1px solid #f0f0f0; padding: 4px 0; font-size: 13px; }
  .lb-rule ul { margin: 4px 0 6px; padding-left: 22px; color: #444; }
  .lb-subject { font-family: ui-monospace, monospace; font-size: 12px; }
  .lb-sev { font-size: 11px; border-radius: 3px; padding: 0 5px; background: #f1f5f9; color: #555; }
  .lb-sev-error { background: #fee2e2; color: #991b1b; }
  .lb-sev-warning { background: #fef3c7; color: #92400e; }
  @media (max-width: 600px) { .lb-row { flex-wrap: wrap; } .lb-filter { flex-direction: column; } }
</style>
{{ end }}

{{ define "Body" }}
<div class="lb-app">
  <h1><a class="ld-home" href="/">Agni</a></h1>
  <div id="library" data-component="library"></div>
</div>
{{ end }}

{{ define "AppScript" }}
<script type="module" src="/static/library.js"></script>
{{ end }}

{{ define "LibraryPage" }}{{ template "BasePage" . }}{{ end }}
