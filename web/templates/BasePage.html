{{ define "BasePage" }}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ or .Title "Agni" }}</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font: 13px system-ui, sans-serif; color: #1c1c1c; background: #fff; }
    .app { display: flex; flex-direction: column; height: 100vh; width: 100vw; overflow: hidden; }
    /* WS9-021 dock shell: dockview fills the page below the top bar; each panel hole fills its dockview panel */
    .dock { flex: 1 1 auto; min-height: 0; position: relative; }
    .dock-body { width: 100%; height: 100%; overflow: auto; padding: 8px; background: #fafafa; }
    .panels-menu { position: relative; margin-left: auto; padding: 4px 6px; }
    .panels-list { position: absolute; right: 6px; top: 100%; z-index: 1000; min-width: 140px; background: #fff; border: 1px solid #ccc; border-radius: 4px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15); }
    .panels-item { display: block; width: 100%; text-align: left; border: 0; background: none; font: inherit; padding: 4px 10px; cursor: pointer; white-space: pre; }
    .panels-item:hover { background: #eef; }
    .highlight-menu { position: relative; padding: 4px 6px; }
    .highlight-panel { padding: 8px; min-width: 190px; }
    .highlight-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 4px 0; font-size: 12px; }
    .highlight-row input[type="range"] { width: 110px; }
    .highlight-reset { margin-top: 6px; }
    /* WS9-049 phase 3: the compare picker modal. Hidden until .on so the tree island inside stays
       mounted and measurable rather than being created lazily (see dock.ts on why this app never
       lazily mounts island holes). */
    .compare-picker { position: fixed; inset: 0; z-index: 4000; display: none; align-items: center; justify-content: center; background: rgba(15, 23, 42, 0.45); }
    .compare-picker.on { display: flex; }
    .compare-dialog { display: flex; flex-direction: column; width: 420px; max-width: 90vw; max-height: 70vh; background: #fff; border: 1px solid #bbb; border-radius: 6px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.3); overflow: hidden; }
    .compare-dialog-head { flex: 0 0 auto; padding: 8px 12px; border-bottom: 1px solid #eee; font-weight: 600; color: #333; }
    .compare-tree { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 8px; }
    /* The open design (side A) is pushed as the tree's active file; in the picker that means
       "already open", not "selected", so it reads as unavailable rather than highlighted. */
    .compare-tree .node.active { background: none; color: #999; font-weight: 400; cursor: default; }
    .summary { color: #333; font-size: 12px; white-space: pre-wrap; }
    .sheet-nav-bar { flex: 0 0 auto; min-height: 0; border-bottom: 1px solid #ddd; background: #f4f4f4; display: flex; align-items: flex-end; gap: 8px; }
    /* The viewer's breadcrumb, at the head of the same strip. Sized to its content so the tab
       strip keeps the bar's free width, and bottom-padded to sit on the tabs' baseline. */
    .vw-crumb { flex: 0 0 auto; padding: 0 0 5px 8px; color: #999; font-size: 12px; white-space: nowrap; }
    /* WS9-049: the visited-sheet tab strip. It takes the bar's free width (so the Compare/Panels
       chrome stays right-aligned) and scrolls horizontally rather than wrapping the bar taller. */
    .sheet-tabs-host { flex: 1 1 auto; min-width: 0; }
    .sheet-tabs { display: flex; align-items: flex-end; gap: 2px; overflow-x: auto; scrollbar-width: thin; padding: 4px 0 0 6px; }
    .sheet-tab { display: inline-flex; align-items: center; flex: 0 0 auto; max-width: 200px; border: 1px solid #ccc; border-bottom: none; border-radius: 4px 4px 0 0; background: #e8e8e8; }
    .sheet-tab.active { background: #fff; border-color: #bbb; }
    .sheet-tab-label { max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 0; background: none; font: inherit; font-size: 12px; padding: 4px 4px 4px 8px; cursor: pointer; }
    .sheet-tab.active .sheet-tab-label { font-weight: 600; }
    .sheet-tab-close { border: 0; background: none; color: #777; font: inherit; line-height: 1; padding: 2px 6px 2px 2px; border-radius: 3px; cursor: pointer; }
    .sheet-tab-close:hover { background: #d8d8d8; color: #111; }
    .controls { display: flex; align-items: flex-end; gap: 4px; }
    .render-mode { display: flex; gap: 2px; padding: 4px 0 4px 6px; }
    .mode-btn { border: 1px solid #ccc; background: #eee; padding: 3px 10px; border-radius: 4px; cursor: pointer; font: inherit; }
    .mode-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }
    .layout-select { font: inherit; padding: 2px 6px; margin-left: 4px; }
    .layout-select:disabled { opacity: 0.5; }
    .mode-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .render-busy { position: fixed; inset: 0; z-index: 5000; display: none; align-items: center; justify-content: center; gap: 12px; background: rgba(15, 23, 42, 0.5); color: #fff; font-size: 18px; letter-spacing: 0.02em; cursor: progress; }
    .render-busy.on { display: flex; }
    .render-busy::before { content: ""; width: 26px; height: 26px; border: 3px solid rgba(255, 255, 255, 0.35); border-top-color: #fff; border-radius: 50%; animation: render-spin 0.8s linear infinite; }
    @keyframes render-spin { to { transform: rotate(360deg); } }
    .svg-view { position: absolute; inset: 0; overflow: hidden; background: #fff; display: none; }
    .text-overlay { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .canvas-wrap { width: 100%; height: 100%; position: relative; }
    #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
    #view:active { cursor: grabbing; }
    #readout { position: absolute; left: 8px; top: 8px; padding: 4px 8px; background: rgba(255, 255, 255, 0.85); border: 1px solid #ccc; border-radius: 4px; pointer-events: none; }
    .expect-caption { position: absolute; left: 8px; bottom: 8px; z-index: 10; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.02em; pointer-events: none; display: none; }
    .expect-caption.on { display: block; }
    .expect-caption.pass { background: rgba(34, 197, 94, 0.15); color: #166534; border: 1px solid #22c55e; }
    .expect-caption.fail { background: rgba(239, 68, 68, 0.15); color: #991b1b; border: 1px solid #ef4444; }
    .tree, .children { list-style: none; margin: 0; padding: 0; }
    .node { display: block; width: 100%; text-align: left; border: 0; background: none; font: inherit; color: inherit; padding: 3px 4px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .node:hover { background: #eef; }
    .node.active { background: #dbeafe; font-weight: 600; }
    .node.dir { color: #333; }
    .twist { color: #999; display: inline-block; width: 1em; }
    .fmt { color: #999; font-size: 11px; }
    .error { color: #b00; padding: 3px 4px; }
    /* The way back to the landing page, carried by each work page's sidebar heading. */
    .ld-home { color: #2563eb; text-decoration: none; }
    .ld-home:hover { text-decoration: underline; }
    /* The tree's account of what it pruned. Quiet on purpose: it explains an absence, so it must
       be findable when someone goes looking for a mount and invisible the rest of the time. */
    .tree .note { color: #999; font-size: 11px; padding: 6px 4px; }
    .findings-title { margin-top: 14px; }
    .findings-empty { color: #999; font-size: 12px; }
    /* Rules that could not run. Deliberately quiet rather than alarming: it is not a defect, it is
       the panel declining to imply coverage it does not have. */
    .checks-skipped { margin-bottom: 8px; padding: 6px 8px; border-left: 3px solid #c9a227; background: #fdf8e6; font-size: 12px; }
    .checks-skipped-head { color: #6b5400; margin-bottom: 4px; }
    .checks-skipped-list { list-style: none; margin: 0; padding: 0; }
    .checks-skipped-list li { display: flex; gap: 8px; color: #555; }
    .checks-skipped-rule { font-family: ui-monospace, monospace; color: #333; }
    .checks-skipped-reason { color: #777; }
    .findings-toolbar { margin-bottom: 6px; font-size: 12px; color: #555; }
    .findings-toolbar select { font: inherit; font-size: 12px; padding: 2px 4px; }
    .finding-groups { list-style: none; margin: 0; padding: 0; }
    .finding-group { margin-bottom: 6px; }
    .finding-group-head { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; border: 0; background: none; font: inherit; color: #444; font-weight: 600; padding: 2px 2px; cursor: pointer; }
    .finding-group-head:hover { background: #eef; border-radius: 4px; }
    .finding-group-twist { color: #999; width: 1em; display: inline-block; }
    .finding-group-name { text-transform: capitalize; }
    .finding-group-badge { color: #999; font-size: 11px; font-weight: 400; }
    .finding-list { list-style: none; margin: 0; padding: 0; }
    .finding { display: grid; grid-template-columns: auto auto 1fr; align-items: baseline; gap: 4px 6px; width: 100%; text-align: left; border: 1px solid transparent; background: none; font: inherit; color: inherit; padding: 4px 5px; border-radius: 4px; cursor: pointer; }
    .finding:hover { background: #eef; }
    .finding.selected { background: #fde6f5; border-color: #ec1bb8; }
    .finding-subject { font-weight: 600; }
    .finding-rule { color: #888; font-size: 11px; }
    .finding-msg { grid-column: 1 / -1; color: #555; font-size: 11px; }
    .sev-dot { width: 8px; height: 8px; border-radius: 50%; background: #999; align-self: center; }
    .sev-dot.sev-error { background: #d21f3c; }
    .sev-dot.sev-warning { background: #e39a1b; }
    .sev-dot.sev-info { background: #2563eb; }
    /* WS9-018 expectations panel: expected-vs-actual per rule */
    .expectations-title { margin-top: 14px; }
    .expectations-empty { color: #999; font-size: 12px; }
    .exp-list { list-style: none; margin: 0; padding: 0; }
    .exp-row { padding: 5px 6px; border-radius: 4px; border-left: 3px solid #ccc; margin-bottom: 5px; background: #fafafa; }
    .exp-row.status-matched { border-left-color: #1a9e4b; }
    .exp-row.status-missing { border-left-color: #d21f3c; }
    .exp-row.status-partial { border-left-color: #e39a1b; }
    .exp-row.status-unexpected { border-left-color: #e39a1b; }
    .exp-row.status-pending { border-left-color: #999; border-left-style: dashed; }
    .exp-head { display: flex; align-items: baseline; gap: 8px; }
    .exp-rule { font-weight: 600; }
    .exp-status { font-size: 11px; font-weight: 600; }
    .status-matched > .exp-status, .exp-status.status-matched { color: #1a9e4b; }
    .status-missing > .exp-status, .exp-status.status-missing { color: #d21f3c; }
    .status-partial > .exp-status, .exp-status.status-partial { color: #b9770f; }
    .status-unexpected > .exp-status, .exp-status.status-unexpected { color: #b9770f; }
    .status-pending > .exp-status, .exp-status.status-pending { color: #888; }
    .exp-subjects { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px; margin-top: 3px; }
    .exp-label { color: #999; font-size: 11px; margin-right: 2px; }
    .exp-summary { color: #666; font-size: 11px; margin: 1px 0 1px 2px; }
    .exp-why { color: #777; font-size: 11px; font-style: italic; margin: 2px 0 2px 2px; }
    .exp-chip { border: 1px solid #ccd; background: #fff; font: inherit; font-size: 11px; padding: 1px 6px; border-radius: 10px; cursor: pointer; color: #334; }
    /* WS9-024 sheet badges: where a finding's subject lives; click shows that sheet */
    .sheet-badge { display: inline-block; margin-left: 4px; padding: 0 5px; border-radius: 8px; background: #e8edf8; border: 1px solid #c4d2ef; color: #2b4a8b; font-size: 10px; font-weight: 400; cursor: pointer; }
    .sheet-badge:hover { background: #d5e0f6; }
    /* The "+N" chip that stands for the sheets not shown. Quieter than a real sheet, because it
       names a count rather than a place to go. */
    .sheet-badge-more { background: #f0f2f6; border-color: #d3d8e2; color: #5a6478; }
    .sheet-badge-more:hover { background: #e4e8ef; }
    .exp-chip:hover { background: #eef; }
    .exp-chip.selected { background: #fde6f5; border-color: #ec1bb8; }
    /* WS9-022 report panel: severity pivot sections */
    .report-run { color: #999; font-size: 12px; margin-bottom: 8px; }
    .report-section { margin-bottom: 10px; }
    .report-sec-head { display: flex; align-items: center; gap: 6px; font-weight: 600; color: #444; margin-bottom: 4px; }
    .report-sec-name { text-transform: capitalize; }
    .report-rule { margin: 0 0 6px 14px; }
    .report-rule-head { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
    .report-rule-name { font-weight: 600; font-size: 12px; }
    .report-rule-summary { color: #777; font-size: 11px; }
    /* WS9 merged checks panel: on-demand Run + a server-sourced, client-grouped/sorted table */
    .checks-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 12px; color: #555; flex-wrap: wrap; }
    .checks-run { font: inherit; font-size: 12px; padding: 3px 12px; border: 1px solid #ccc; background: #eee; border-radius: 4px; cursor: pointer; }
    .checks-run:hover:not(:disabled) { background: #e0e0e0; }
    .checks-run:disabled { color: #aaa; cursor: not-allowed; }
    .checks-groupby select { font: inherit; font-size: 12px; padding: 2px 4px; }
    .checks-table { border-collapse: collapse; font-size: 12px; width: 100%; }
    /* A cell wraps rather than growing its column. Findings carry values with no break opportunities
       — a long net name, a hierarchical path, a citation — and under the default auto layout one of
       those widens its column until the neighbours are squeezed and the text bleeds across them.
       Wrapping keeps the row taller instead of the table wider, which is the trade a reader wants:
       the columns stay where they were and nothing is hidden. Deliberately not `table-layout: fixed`
       like the query table, because these columns are not peers — the message deserves the room the
       severity dot does not. */
    .checks-table th, .checks-table td { text-align: left; padding: 3px 6px; border-bottom: 1px solid #eee; vertical-align: top; overflow-wrap: anywhere; }
    .checks-table th { color: #444; font-weight: 600; border-bottom: 1px solid #ddd; }
    .check-sort button { font: inherit; font-weight: 600; color: #444; border: 0; background: none; padding: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 3px; }
    .check-sort.active button { color: #2563eb; }
    .check-sort-dir { font-size: 9px; }
    .check-exp { width: 34px; padding-left: 2px; padding-right: 2px; }
    .check-exp-btn { display: inline-flex; align-items: center; gap: 2px; border: 0; background: none; color: #888; font: inherit; font-size: 11px; padding: 0; cursor: pointer; }
    .check-exp-btn:hover, .check-exp-btn.open { color: #2563eb; }
    .check-exp-twist { color: #999; }
    .check-count { font-size: 10px; color: #666; font-weight: 600; }
    .check-group td { background: #f6f7f9; border-bottom: 1px solid #e3e5e8; padding: 2px 6px; }
    .check-group-head { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; font: inherit; color: #444; font-weight: 600; padding: 0; cursor: pointer; text-transform: capitalize; }
    .check-group-twist { color: #999; }
    .check-sev { width: 14px; }
    .check-subject .check-locate { font: inherit; font-weight: 600; padding: 0; border: 0; background: none; color: #2563eb; cursor: pointer; }
    .check-subject .check-locate:hover { color: #1d4ed8; text-decoration: underline; }
    .check-rule { color: #888; font-size: 11px; }
    .check-msg { color: #555; font-size: 11px; }
    .check-row.selected td { background: #fde6f5; }
    .check-inst td { background: #fafbfc; }
    .check-inst-label { color: #999; font-size: 10px; margin-right: 6px; }
    .check-inst-id { margin-left: 6px; color: #aaa; font-size: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .rules-title { margin-top: 14px; }
    .rules-empty { color: #999; font-size: 12px; }
    .rules-bundles { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-bottom: 6px; font-size: 12px; color: #555; }
    .rules-bundles select, .rules-bundle-name { font: inherit; font-size: 12px; padding: 2px 4px; }
    .rules-bundle-name { flex: 1 1 80px; min-width: 70px; }
    .rules-bundle-savebtn, .rules-bundles button { font: inherit; font-size: 12px; padding: 2px 8px; border: 1px solid #ccc; background: #eee; border-radius: 4px; cursor: pointer; }
    .rules-bundle-del { color: #b00; border-color: #e0b4b4; padding: 2px 6px; }
    .rules-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-bottom: 8px; font-size: 12px; }
    .rules-toolbar select, .rules-search { font: inherit; font-size: 12px; padding: 2px 4px; }
    .rules-search { flex: 1 1 90px; min-width: 80px; }
    .rules-availonly { display: inline-flex; align-items: center; gap: 4px; color: #555; }
    .rule-groups, .rule-list { list-style: none; margin: 0; padding: 0; }
    .rule-group { margin-bottom: 8px; }
    .rule-group-head { display: flex; align-items: center; gap: 6px; font-weight: 600; color: #444; }
    .rule-group-name { text-transform: capitalize; }
    .rule-group-badge { color: #999; font-size: 11px; font-weight: 400; }
    .rule-list { margin: 2px 0 0 18px; }
    .rule { display: flex; align-items: center; gap: 6px; flex: 1 1 auto; min-width: 0; padding: 2px 4px; border-radius: 4px; cursor: pointer; }
    .rule:hover { background: #eef; }
    .rule.unavailable { color: #aaa; cursor: not-allowed; }
    .rule.unavailable:hover { background: none; }
    .rule-name { font-size: 12px; }
    /* WS9-020 rule prose: summary subtext per row, long-form detail behind the row toggle */
    .rule-item { margin-bottom: 4px; }
    .rule-row { display: flex; align-items: center; }
    .rule-detail-toggle { flex: 0 0 auto; border: 0; background: none; color: #999; font: inherit; font-size: 11px; padding: 0 4px; cursor: pointer; }
    .rule-detail-toggle:hover, .rule-detail-toggle.open { color: #2563eb; }
    .rule-summary { color: #666; font-size: 11px; margin: 0 0 0 26px; }
    .rule-detail { margin: 4px 0 6px 26px; padding: 6px 8px; background: #f6f7f9; border: 1px solid #e3e5e8; border-radius: 4px; font-size: 11px; color: #333; }
    .rule-impact { margin: 0 0 4px 0; font-style: italic; color: #555; }
    .rule-detail-md h2 { font-size: 12px; margin: 0 0 4px 0; }
    .rule-detail-md h3 { font-size: 11px; margin: 6px 0 2px 0; }
    .rule-detail-md p, .rule-detail-md ul { margin: 4px 0; }
    .rule-detail-md ul { padding-left: 16px; }
    .rule-detail-md pre { background: #eef0f3; padding: 4px 6px; border-radius: 3px; overflow-x: auto; }
    .rule-detail-md code { font-size: 10px; }
    /* WS9-005 visual diff: chrome bar + two synced SVG panes */
    .compare-host { display: flex; align-items: flex-end; padding: 4px 0; }
    .diff-wrap { width: 100%; height: 100%; display: flex; flex-direction: column; position: relative; background: #fafafa; }
    .diff-head { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 12px; padding: 5px 8px; border-bottom: 1px solid #ddd; background: #f4f4f4; font-size: 12px; }
    .diff-files { display: flex; gap: 10px; align-items: baseline; min-width: 0; }
    .diff-file { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; color: #333; }
    .diff-pair-select { font: inherit; font-size: 12px; padding: 2px 4px; }
    .diff-legend { display: flex; flex-wrap: wrap; gap: 3px 10px; margin-left: auto; }
    .diff-chip { display: inline-flex; align-items: center; gap: 4px; color: #444; }
    .diff-nochange { color: #999; }
    .diff-swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
    .diff-close { border: 1px solid #ccc; background: #eee; border-radius: 4px; cursor: pointer; font: inherit; padding: 1px 7px; }
    .diff-close:hover { background: #e0e0e0; }
    .diff-error { color: #b00; }
    .diff-empty { padding: 10px; color: #999; font-size: 12px; }
    .diff-sides { flex: 1 1 auto; min-height: 0; display: flex; gap: 1px; background: #ddd; }
    /* WS9-007 overlay mode: the union draws on the a pane, the b pane hides */
    .diff-sides.overlay .diff-side + .diff-side { display: none; }
    .diff-modes { display: flex; gap: 2px; }
    .diff-side { flex: 1 1 50%; min-width: 0; position: relative; background: #fff; overflow: hidden; }
    .diff-side-label { position: absolute; left: 8px; top: 8px; z-index: 5; background: rgba(255, 255, 255, 0.85); border: 1px solid #ccc; border-radius: 4px; padding: 2px 8px; pointer-events: none; font-size: 11px; color: #555; }
    .diff-svg { position: absolute; inset: 0; overflow: hidden; }
    .diff-ph { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: #999; background: #fafafa; z-index: 4; }
    .diff-ph.on { display: flex; }
    /* WS7-034 render controls float inside the canvas panel (they configure only the render) */
    .canvas-toolbar { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 6; background: rgba(255, 255, 255, 0.92); border: 1px solid #ccc; border-radius: 6px; padding: 2px 8px; }
    /* WS7-034 board layer visibility: the CSS side of BoardSVG's classed strata */
    .board-front .copper-back, .board-front .zones-back { display: none; }
    .board-back .copper-front, .board-back .zones-front { display: none; }
    /* WS9-025 sheet overview: name tiles with violation-count badges */
    .sheet-tiles { list-style: none; margin: 0; padding: 0; }
    .sheet-tile { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; text-align: left; border: 1px solid transparent; background: none; font: inherit; color: inherit; padding: 5px 8px; border-radius: 4px; cursor: pointer; }
    .sheet-tile:hover { background: #eef; }
    .sheet-tile.active { background: #dbeafe; font-weight: 600; }
    .sheet-tile-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sheet-tile-count { flex: 0 0 auto; min-width: 22px; text-align: center; border-radius: 10px; font-size: 11px; padding: 1px 6px; }
    .sheet-tile-count.firing { background: #d21f3c; color: #fff; }
    .sheet-tile-count.clean { background: #e6f4ea; color: #1a7e3f; border: 1px solid #bce3c8; }
    .sheet-tile-count.norules { color: #999; }
    /* WS9-006 changes panel: rows reuse the findings grid; the swatch replaces the severity dot */
    .finding.chg { grid-template-columns: auto auto 1fr; }
    .finding.chg .diff-swatch { align-self: center; }
    .finding-group-head .diff-swatch { flex: 0 0 auto; }
    /* WS9-036 datalog query panel: query box + provenance-linked results */
    /* The panel fills its dock body and manages its own scroll: the query box is pinned, and the
       results table is its own scroll region, so a wide/tall result never drags the query box with
       it. The helper chrome (examples/relations) lives in a slide-in drawer, not in the flow. */
    #query-panel { height: 100%; }
    /* The left gutter is the drawer handle's lane. The handle is absolutely positioned and floats at
       the panel's vertical middle, so whatever content happens to be at that height sits under it —
       with the panel short (its dock default), that was the Run button and the first characters of
       the query. Padding the panel clears the lane; an absolutely positioned child resolves against
       the padding box, so the handle and the drawer itself stay flush against the edge. */
    .query { position: relative; display: flex; flex-direction: column; height: 100%; min-height: 0; overflow: hidden; padding-left: 22px; }
    .query-input { flex: 0 0 auto; display: flex; flex-direction: column; gap: 4px; }
    .query-text { width: 100%; box-sizing: border-box; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; padding: 6px; border: 1px solid #ccc; border-radius: 4px; resize: vertical; }
    .query-actions { display: flex; align-items: center; gap: 8px; }
    .query-run { font: inherit; font-size: 12px; padding: 3px 12px; border: 1px solid #ccc; background: #eee; border-radius: 4px; cursor: pointer; }
    .query-run:hover:not(:disabled) { background: #e0e0e0; }
    .query-run:disabled { color: #aaa; cursor: not-allowed; }
    .query-hint { color: #999; font-size: 11px; }
    .query-relhint { color: #666; font-size: 11px; margin: 6px 0; }
    .query-relhint code { background: #eef0f3; padding: 0 3px; border-radius: 3px; }
    /* WS9-037 relation picker: click-to-insert chips, grouped by kind */
    .query-examples { margin: 6px 0 8px; }
    .query-examples-hint { color: #666; font-size: 11px; margin-bottom: 4px; }
    .query-examples-chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .query-example { font: inherit; font-size: 11px; padding: 2px 9px; border: 1px solid #cdd8ea; background: #eef3fb; border-radius: 10px; cursor: pointer; color: #24457e; }
    .query-example:hover { background: #e0e9f8; border-color: #b7c6e3; }
    .query-relations { margin: 6px 0 4px; }
    .query-relations-hint { color: #666; font-size: 11px; margin-bottom: 4px; }
    .query-relgroup { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px; margin-bottom: 3px; }
    .query-relgroup-name { color: #888; font-size: 10px; text-transform: uppercase; letter-spacing: 0.03em; flex: 0 0 62px; }
    .query-relchip-wrap { display: inline-flex; align-items: stretch; }
    .query-relchip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; padding: 1px 7px; border: 1px solid #d0d4da; background: #f2f4f7; border-radius: 10px; cursor: pointer; color: #334; }
    .query-relchip:hover { background: #e2e8f0; border-color: #b9c0ca; }
    .query-relchip-wrap:has(.query-relinfo) .query-relchip { border-radius: 10px 0 0 10px; border-right: 0; }
    .query-relinfo { font-size: 10px; font-weight: 700; width: 16px; padding: 0; border: 1px solid #d0d4da; background: #e7ebf1; border-radius: 0 10px 10px 0; cursor: pointer; color: #556; }
    .query-relinfo:hover { background: #d3dae4; border-color: #b9c0ca; }
    .query-reldetail { margin: 6px 0; border: 1px solid #d0d4da; border-radius: 6px; background: #fbfcfe; }
    .query-reldetail-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px; border-bottom: 1px solid #e3e6eb; }
    .query-reldetail-name { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 600; color: #334; }
    .query-reldetail-close { border: 0; background: transparent; cursor: pointer; color: #889; font-size: 13px; padding: 0 2px; }
    .query-reldetail-body { padding: 6px 10px; font-size: 12px; overflow-x: auto; }
    .query-reldetail-body img { max-width: 100%; height: auto; }
    /* The selection bar sits under the query box: what was picked on the left, the next question as a
       button on the right. It shares the example chip's palette because it is the same kind of thing,
       a query written for the reader. */
    .query-selection { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 0; }
    .query-selection-what { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
    .query-selection-kind { color: #889; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
    .query-selection-name { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: #334; overflow-wrap: anywhere; }
    .query-ask { font: inherit; font-size: 11px; padding: 2px 9px; border: 1px solid #cdd8ea; background: #eef3fb; border-radius: 10px; cursor: pointer; color: #24457e; white-space: nowrap; }
    .query-ask:hover:not(:disabled) { background: #e2ebfa; }
    .query-ask:disabled { color: #aaa; cursor: not-allowed; }
    .query-error { color: #b00; font-size: 12px; white-space: pre-wrap; background: #fdf0f0; border: 1px solid #e0b4b4; border-radius: 4px; padding: 6px 8px; }
    .query-locate-note { color: #7a5b00; font-size: 12px; background: #fdf7e3; border: 1px solid #e6d9a8; border-radius: 4px; padding: 6px 8px; }
    .query-empty { color: #999; font-size: 12px; padding: 4px 0; }
    /* The results are the panel's own scroll region — a wide table scrolls horizontally here without
       moving the query box, and long results scroll vertically under a sticky header. */
    .query-results { flex: 1 1 auto; min-height: 0; overflow: auto; }
    /* fixed layout is what makes the columns equal by default and a dragged width stick. Under the
       old auto layout the browser sized each column to its widest cell, so one long provenance
       string or net name ate the panel and the rest were slivers. */
    .query-table { border-collapse: collapse; font-size: 12px; width: 100%; table-layout: fixed; }
    .query-table th, .query-table td { text-align: left; padding: 3px 8px; border-bottom: 1px solid #eee; vertical-align: top; }
    .query-table th { color: #444; font-weight: 600; border-bottom: 1px solid #ddd; position: sticky; top: 0; background: #fafafa; z-index: 1; }
    .query-table th.query-sortable { cursor: pointer; user-select: none; white-space: nowrap; }
    .query-table th.query-sortable:hover { color: #1c1c1c; background: #f0f1f3; }
    .query-sort-ind { color: #2563eb; }
    /* A fixed layout clips rather than growing, so long unbroken values (a net id, a citation path)
       wrap inside their column instead of overflowing it. */
    /* Wrap first, scroll second, bleed never. overflow-wrap breaks a long unbroken value (a net id,
       a citation path); overflow-x catches whatever still cannot fit, so a cell scrolls within its
       own column instead of drawing across its neighbours. Measured in Chromium: a td honours
       overflow-x directly, no inner wrapper needed. */
    .query-table td { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; overflow-x: auto; }
    .query-table th { position: relative; }
    .query-th-label { overflow-wrap: anywhere; }
    /* The grip sits on the column's trailing edge, a few px wide, and only shows itself on hover so
       the header stays a header. It must swallow the click, or resizing also re-sorts. */
    .query-col-grip { position: absolute; top: 0; right: 0; width: 7px; height: 100%; cursor: col-resize; touch-action: none; }
    .query-table th:hover .query-col-grip { background: linear-gradient(to right, transparent, #d3d6db); }
    /* A locatable cell wraps like any other, so it has no rule of its own any more. It used to be
       white-space: nowrap, which kept a subject and its one sheet badge on a line and, on a 21-sheet
       design, turned the badge strip into a single unbreakable line that painted over the two
       columns to its right. The table is fixed-layout, so the column never widened to fit it. */
    .query-locate { font: inherit; padding: 0; border: 0; background: none; color: #2563eb; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
    .query-locate:hover { color: #1d4ed8; }
    .query-cite-col { width: 18px; padding-left: 2px; padding-right: 2px; }
    .query-cite-toggle { border: 0; background: none; color: #999; font: inherit; font-size: 11px; padding: 0; cursor: pointer; }
    .query-cite-toggle:hover, .query-cite-toggle.open { color: #2563eb; }
    .query-cite-row td { background: #f6f7f9; border-bottom: 1px solid #e3e5e8; }
    .query-cites { list-style: none; margin: 0; padding: 0; }
    .query-cites li { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: #555; }
    .query-count { color: #999; font-size: 11px; margin-top: 6px; }
    /* Slide-in helper drawer (examples + relations + reference). It overlays the panel from the left
       and is translated off-screen when closed; a left-edge handle opens it, clicking the textarea or
       ✕ closes it. It stays mounted while closed so chip clicks work without opening it. */
    .query-drawer-handle { position: absolute; left: 0; top: 50%; transform: translateY(-50%); z-index: 5; border: 1px solid #cdd8ea; border-left: 0; background: #eef3fb; color: #24457e; cursor: pointer; padding: 8px 3px; border-radius: 0 6px 6px 0; box-shadow: 1px 0 3px rgba(0,0,0,0.08); }
    .query-drawer-handle:hover { background: #e0e9f8; }
    .query-drawer-handle.hidden { display: none; }
    .query-drawer-handle-label { writing-mode: vertical-rl; text-orientation: mixed; font-size: 10px; letter-spacing: 0.02em; }
    .query-drawer { position: absolute; left: 0; top: 0; bottom: 0; width: min(320px, 88%); z-index: 6; display: flex; flex-direction: column; background: #fff; border-right: 1px solid #d0d4da; box-shadow: 2px 0 10px rgba(0,0,0,0.12); transform: translateX(-102%); transition: transform 0.18s ease; }
    .query-drawer.open { transform: translateX(0); }
    .query-drawer-head { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; border-bottom: 1px solid #e3e6eb; background: #f7f8fa; }
    .query-drawer-title { font-size: 12px; font-weight: 600; color: #334; }
    .query-drawer-close { border: 0; background: transparent; cursor: pointer; color: #889; font-size: 14px; padding: 0 2px; }
    .query-drawer-close:hover { color: #334; }
    .query-drawer-body { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 8px; }
    /* WS9-041 interface-coverage panel: one block per detected interface, a chip per signal */
    .coverage { padding: 4px; }
    .coverage-empty { color: #999; font-size: 12px; padding: 8px 4px; }
    .coverage-iface { margin-bottom: 10px; }
    .coverage-head { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 6px; border-bottom: 1px solid #eee; }
    .coverage-profile { font-weight: 600; font-size: 13px; }
    .coverage-count { color: #666; font-size: 11px; }
    .coverage-signals { display: flex; flex-wrap: wrap; gap: 5px; padding: 6px; list-style: none; margin: 0; }
    .coverage-signal { display: flex; flex-direction: column; align-items: center; gap: 2px; border: 1px solid #ccc; border-radius: 4px; padding: 4px 9px; font: inherit; font-size: 11px; background: #fff; cursor: pointer; }
    .coverage-signal:hover:not(:disabled) { background: #f4f6f9; }
    .coverage-signal.no-net { cursor: default; }
    .coverage-signal-name { font-weight: 600; }
    .coverage-signal-state { font-size: 10px; }
    .cov-present { border-color: #16a34a; }
    .cov-present .coverage-signal-state { color: #16a34a; }
    .cov-missing { border-color: #dc2626; background: #fef2f2; }
    .cov-missing .coverage-signal-state { color: #dc2626; }
    .cov-dangling, .cov-pullup_missing { border-color: #d97706; background: #fffbeb; }
    .cov-dangling .coverage-signal-state, .cov-pullup_missing .coverage-signal-state { color: #d97706; }

    /* WS9-128 naming-vocabulary bar: which convention the answers on screen were computed under.
       The overridden state is styled, not merely selected, because a request convention REPLACES the
       server's, so rules can stop running and their absence looks like a clean design. */
    .convbar { display: flex; align-items: center; gap: 6px; font-size: 11px; padding: 0 6px; }
    .convbar-label { color: #888; text-transform: uppercase; letter-spacing: 0.04em; font-size: 9px; }
    .convbar-pick { font: inherit; font-size: 11px; padding: 2px 4px; max-width: 170px; }
    .convbar-active { color: #666; }
    .convbar-overridden { background: #fffbeb; border: 1px solid #fde68a; border-radius: 4px; }
    .convbar-overridden .convbar-active { color: #b45309; font-weight: 600; }
    /* The message is the server's own and can run long (a YAML error names a file, a line, and a
       field), so it is bounded and ellipsised here rather than truncated in the code: the title
       carries the full text, and clipping in CSS keeps every character available to a hover while
       the top bar keeps its height. */
    .convbar-error { color: #b91c1c; font-weight: 600; max-width: 52ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* agni issue 175 project bar: whose config produced the answers on screen. The overridden state
       is styled for the same reason the vocabulary bar's is, one level up: with the built-in catalog
       chosen, a project's rules are not running, and rules that do not run leave no trace to notice. */
    .projbar { display: flex; align-items: center; gap: 6px; font-size: 11px; padding: 0 6px; }
    .projbar-label { color: #888; text-transform: uppercase; letter-spacing: 0.04em; font-size: 9px; }
    .projbar-name { color: #444; font-weight: 600; max-width: 24ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .projbar-plain { display: flex; align-items: center; gap: 3px; color: #666; cursor: pointer; }
    .projbar-plain-box { margin: 0; }
    .projbar-overridden { background: #fffbeb; border: 1px solid #fde68a; border-radius: 4px; }
    .projbar-overridden .projbar-name { color: #b45309; }
    /* The companion notice names another file and is the one line here a reader must not miss, so it
       gets the same bounded-and-ellipsised treatment the convention error gets: full text on hover,
       fixed top-bar height regardless of how long a design's entry name runs. */
    .projbar-entry { color: #b45309; max-width: 44ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .projbar-error { color: #b91c1c; font-weight: 600; max-width: 40ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* WS9-052 review panel: the project's checklist verdict over the stored runs (WS9-053). */
    .review { padding: 4px; font-size: 12px; }
    .rv-empty { color: #999; padding: 8px 4px; line-height: 1.5; }
    .rv-empty code { background: #f2f2f2; padding: 1px 4px; border-radius: 3px; }
    .rv-error { color: #b91c1c; background: #fef2f2; border: 1px solid #fecaca; border-radius: 4px; padding: 6px 8px; margin: 4px 0; }
    .rv-controls { display: flex; gap: 6px; align-items: center; padding: 4px 2px; }
    .rv-checklist, .rv-history { flex: 1; min-width: 0; font: inherit; font-size: 11px; padding: 3px; }
    .rv-history { margin: 4px 2px; width: calc(100% - 4px); }
    .rv-run { font: inherit; font-size: 11px; padding: 3px 10px; cursor: pointer; }
    .rv-run:disabled { cursor: default; opacity: 0.55; }
    .rv-summary { font-weight: 600; padding: 6px 4px 2px; }
    .rv-provenance { color: #777; font-size: 11px; padding: 0 4px 6px; }
    .rv-area { margin-bottom: 10px; }
    .rv-area-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 4px 6px; border-bottom: 1px solid #eee; }
    .rv-area-name { font-weight: 600; font-size: 13px; }
    .rv-area-tally { color: #666; font-size: 10px; text-align: right; }
    .rv-items { list-style: none; margin: 0; padding: 0; }
    .rv-item { padding: 5px 6px; border-bottom: 1px solid #f4f4f4; }
    .rv-item-head { display: flex; gap: 6px; align-items: baseline; }
    .rv-item-id { color: #999; font-size: 10px; min-width: 2.2em; }
    .rv-item-title { flex: 1; }
    .rv-item-note { color: #777; font-size: 11px; padding: 2px 0 0 calc(2.2em + 6px); }
    .rv-findings-toggle { background: none; border: none; color: #2563eb; font: inherit; font-size: 11px; cursor: pointer; padding: 2px 0 0 calc(2.2em + 6px); }
    .rv-findings { list-style: none; margin: 2px 0 0; padding: 0 0 0 calc(2.2em + 6px); }
    .rv-finding { display: flex; gap: 6px; width: 100%; text-align: left; background: none; border: none; font: inherit; font-size: 11px; cursor: pointer; padding: 2px 0; }
    .rv-finding:hover { background: #f4f6f9; }
    .rv-finding-subject { font-weight: 600; }
    .rv-finding-message { color: #666; }

    /* The outcome chip. ONLY pass reads as green; every other verdict reads as unfinished, because
       the whole point of the vocabulary is that a question nobody answered must not score as one that
       was. rv-unknown is an outcome this build does not recognise, styled with the unanswered group
       rather than the passing one. */
    .rv-outcome { font-size: 10px; padding: 1px 6px; border-radius: 8px; white-space: nowrap; border: 1px solid transparent; }
    .rv-pass { color: #15803d; background: #f0fdf4; border-color: #bbf7d0; }
    .rv-fail { color: #b91c1c; background: #fef2f2; border-color: #fecaca; }
    .rv-provisional { color: #b45309; background: #fffbeb; border-color: #fde68a; }
    .rv-needs-design-intent, .rv-needs-data { color: #a16207; background: #fefce8; border-color: #fef08a; }
    .rv-inconclusive { color: #7c3aed; background: #faf5ff; border-color: #e9d5ff; }
    .rv-not-applicable, .rv-computed-n-a { color: #6b7280; background: #f9fafb; border-color: #e5e7eb; }
    .rv-not-automated, .rv-unknown { color: #4b5563; background: #f3f4f6; border-color: #d1d5db; border-style: dashed; }
    /* WS9-035 datasheet-params panel: one expandable row per datasheet-backed component */
    .parts { padding: 4px; font-size: 12px; }
    .parts-empty { color: #999; font-size: 12px; padding: 8px 4px; }
    .parts-row { border-bottom: 1px solid #eee; }
    .parts-head { display: flex; align-items: baseline; gap: 6px; padding: 4px 6px; }
    .parts-toggle { border: none; background: none; cursor: pointer; font: inherit; color: #666; padding: 0 2px; }
    .parts-ref { border: none; background: none; cursor: pointer; font: inherit; font-weight: 600; color: #2563eb; padding: 0; }
    .parts-ref:hover { text-decoration: underline; }
    .parts-mpn { color: #333; }
    .parts-count { color: #999; font-size: 11px; margin-left: auto; }
    .parts-params { list-style: none; margin: 0; padding: 2px 6px 6px 22px; }
    .parts-param { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; padding: 2px 0; }
    .parts-pname { font-weight: 600; }
    .parts-pval { color: #111; }
    .parts-limit { font-size: 10px; border-radius: 3px; padding: 0 4px; border: 1px solid #ccc; }
    .parts-limit.lk-1 { border-color: #dc2626; color: #dc2626; }
    .parts-limit.lk-2 { border-color: #16a34a; color: #16a34a; }
    .parts-limit.lk-3 { border-color: #2563eb; color: #2563eb; }
    .parts-pin { font-size: 10px; border-radius: 3px; padding: 0 4px; border: 1px solid #7c3aed; color: #7c3aed; }
    .parts-pin.parts-pin-wide { border-color: #bbb; color: #888; }
    .parts-cond { color: #666; font-size: 11px; }
    .parts-cite { color: #999; font-size: 11px; margin-left: auto; }
  </style>
  {{ block "HeadExtra" . }}{{ end }}
</head>
<body>
  {{ block "Body" . }}{{ end }}
  {{ block "AppScript" . }}{{ end }}
</body>
</html>
{{ end }}
