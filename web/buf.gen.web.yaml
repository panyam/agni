version: v2
# TS codegen for the browser renderer. Separate from the Go buf.gen.yaml (protoc-gen-go):
# this template only emits the geom protos as TypeScript into web/src/gen/ using the
# @bufbuild/protoc-gen-es v2 plugin (matching @bufbuild/protobuf v2 at runtime).
clean: true
plugins:
  - local: node_modules/.bin/protoc-gen-es
    out: src/gen
    opt:
      - target=ts
