syntax = "proto3";

package agni.v1.webapi;

option go_package = "github.com/panyam/agni/gen/go/agni/v1/webapi";

import "agni/v1/webapi/checks.proto";
import "agni/v1/webapi/diff.proto";
import "agni/v1/webapi/query.proto";
import "agni/v1/webapi/review.proto";

// This file defines TableService, the one projection of an answer into rows (agni issue 862).
//
// An answer is a wire message, such as a check run, a query answer, a diff or a review. Turning one
// into rows decides which fields a reader needs, how an entity is spelled and how rows sort. The
// engine makes that call, once. Writing rows as csv, xlsx, markdown or html is an encoding, and
// whoever writes the bytes does it. So this service projects the rows of every table agni emits,
// from `check --format csv` to a workbook a client builds, and no client derives its own. A caller
// with no encoder of its own, such as the viewer, asks Encode for the same csv that the CLI writes
// (agni issue 956). The formula guard then has one implementation rather than one per language.

// TableService projects an answer into tables. The caller already holds the answer and sends it in
// the request. The service reads no design and keeps no state.
service TableService {
  // Tabulate returns the answer's tables. A check run gives its findings. When the response includes
  // verdicts, it also gives the verdicts and a count of them per rule. A diff gives one table, a row
  // per change. A review gives its items and its summary. A query answer gives one table, and a query
  // set gives one per answered query. A set with a failed query is an invalid argument naming that
  // query, since a missing table would read as a question that matched nothing.
  rpc Tabulate(TabulateRequest) returns (TabulateResponse);
  // Encode writes tables as files. It serves a caller that has no encoder of its own and wants the
  // bytes `--format csv` writes, such as the viewer saving a table (agni issue 956). The CLI uses the
  // same encoder, so a cell that a spreadsheet would read as a formula is guarded the same way
  // everywhere. Encode writes the tables as sent, in their order, and reads no design.
  rpc Encode(EncodeTablesRequest) returns (EncodeTablesResponse);
}

// TableEncoding names a file format Encode writes.
enum TableEncoding {
  // Unspecified is refused, so a caller always says which file it wants.
  TABLE_ENCODING_UNSPECIFIED = 0;
  // CSV is RFC 4180 with the header row first and nothing before it. Each cell is guarded against
  // spreadsheet formula execution, as `agni check --format csv` guards it.
  TABLE_ENCODING_CSV = 1;
}

message EncodeTablesRequest {
  repeated Table tables = 1;
  TableEncoding encoding = 2;
  // stem prefixes each file's name, as `<stem>.<table name>.csv`, so a saved file says which design
  // it came from. Empty gives `<table name>.csv`.
  string stem = 3;
}

// EncodedTable is one table written as a file.
message EncodedTable {
  // name is the table's own name, so a caller can match a file to the table it encoded.
  string name = 1;
  string filename = 2;
  string content_type = 3;
  bytes content = 4;
}

message EncodeTablesResponse {
  // files align with the request's tables, one per table.
  repeated EncodedTable files = 1;
}

// ColumnType says how a column's cells compare when rows are ordered by it. Cells are always strings
// on the wire; the type decides the ordering and nothing else.
enum ColumnType {
  // Unspecified orders as text.
  COLUMN_TYPE_UNSPECIFIED = 0;
  // Text compares as plain strings.
  COLUMN_TYPE_TEXT = 1;
  // Name compares with its digit runs read as numbers, so R2 sorts before R10 and U10.3 before U10.12.
  // A column naming a design entity (a net, a part, a pin) is one.
  COLUMN_TYPE_NAME = 2;
  // Number compares numerically. A cell that does not parse as a number sorts after every one that
  // does.
  COLUMN_TYPE_NUMBER = 3;
}

message TableColumn {
  string name = 1;
  ColumnType type = 2;
  // kind is the entity kind that every cell of the column names, such as "net" or "component". It is
  // empty when the column names no entity or names different kinds on different rows.
  string kind = 3;
}

message TableRow {
  repeated string cells = 1;
  // cell_why aligns with cells. For an empty cell it says why the value is absent, such as a sum over
  // numbers in different units. Every other cell gets "". cell_why is empty when no cell in the row
  // has a reason. The cell itself is still empty, so a csv encoder writes it raw.
  repeated string cell_why = 2;
  // cell_kinds aligns with cells. Some columns name different kinds on different rows. A diff's
  // subject is one, since it is a part on one row and a net on the next (agni issue 898). For a cell
  // in such a column, cell_kinds names the cell's entity kind ("net", "component"). It is "" for a
  // cell whose column's kind already types it, or a cell that names no entity. cell_kinds is empty
  // when no cell in the row needs one. A viewer locates a cell by it, and an encoder ignores it.
  repeated string cell_kinds = 3;
}

// Table is one projected table. Cells are raw, so an encoder applies its own escaping (a csv writer
// guards against spreadsheet formulas; markdown escapes pipes).
message Table {
  // name is the table's role in the answer ("findings", "verdicts", a query set entry's name).
  string name = 1;
  repeated TableColumn columns = 2;
  repeated TableRow rows = 3;
}

message TabulateRequest {
  // answer is what to project. The caller sends back the message an analysis rpc returned.
  oneof answer {
    // check gives the "findings" table. When verdicts are present it also gives the "verdicts" table
    // and "verdicts_by_rule", a count of each outcome per rule. When verdicts are present and the run
    // includes an IO map, it gives "pin_map" too, with one row per declared pin joined to its IO-map
    // verdicts (agni issue 1188). It always gives "skipped", the rules the run did not evaluate.
    CheckDesignResponse check = 1;
    RunQueryResponse query = 2;
    RunQueriesResponse query_set = 3;
    // diff gives the "diff" table, one row per change, and change_class names the change's kind.
    // Components come first, then nets by kind and name, then the unchanged nets when the diff asked
    // for them.
    DiffDesignsResponse diff = 6;
    // review gives the "review" table, one row per checklist item in the checklist's order, and the
    // one-row "review_summary".
    Review review = 7;
  }
  // order_by sorts each table by these columns, in priority order. A plain name sorts ascending, and
  // a name with a leading "-" sorts descending, as in ["rule", "-outcome", "subjects"]. The sort is
  // stable and empty cells sort last. A table lacking a named column ignores that entry. A name that
  // no table has is an invalid argument. Empty keeps the answer's own order.
  repeated string order_by = 4;
  // column_types overrides how a named column orders. It is for a column that the projection could
  // not type, such as a query's count.
  map<string, ColumnType> column_types = 5;
}

message TabulateResponse {
  repeated Table tables = 1;
}
