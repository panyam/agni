<svg viewBox="0 0 640 300" role="img" aria-labelledby="mount-topology-title" style="width:100%;height:auto;font-family:inherit">
  <title id="mount-topology-title">Three panels side by side. Host folders on the left are bind-mounted to subdirectories of /workspace in the middle, and the server exposes each of those as a mount named after the folder. The path within the folder is unchanged at every step, so the browser addresses a file by a mount name plus that path and never by a host path.</title>
  <defs>
    <marker id="mount-topology-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor" opacity="0.5"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.35">
    <rect x="8" y="52" width="146" height="196" rx="3"/>
    <rect x="214" y="52" width="210" height="196" rx="3"/>
    <rect x="484" y="52" width="148" height="196" rx="3"/>
  </g>
  <g fill="currentColor" font-size="11.5" font-weight="600" opacity="0.75">
    <text x="8" y="44">your machine</text>
    <text x="214" y="44">container</text>
    <text x="484" y="44">the server</text>
  </g>
  <g fill="currentColor" font-size="11.5" opacity="0.85">
    <text x="20" y="96">~/boards</text>
    <text x="20" y="156">~/datasheets</text>
    <text x="20" y="206">agni-reviews</text>
    <text x="226" y="96">/workspace/boards</text>
    <text x="226" y="156">/workspace/datasheets</text>
    <text x="226" y="206">/var/lib/agni/reviews</text>
    <text x="496" y="96">boards</text>
    <text x="496" y="156">datasheets</text>
    <text x="496" y="206">review store</text>
  </g>
  <g fill="var(--accent-color)" font-size="10">
    <text x="20" y="112">rev3/board.kicad_pro</text>
    <text x="226" y="112">rev3/board.kicad_pro</text>
    <text x="496" y="112">rev3/board.kicad_pro</text>
  </g>
  <g fill="currentColor" font-size="10" opacity="0.55">
    <text x="20" y="222">named volume</text>
    <text x="496" y="222">not a design mount</text>
  </g>
  <g stroke="currentColor" stroke-width="1.2" opacity="0.5" marker-end="url(#mount-topology-arrow)">
    <line x1="158" y1="92" x2="208" y2="92"/>
    <line x1="158" y1="152" x2="208" y2="152"/>
    <line x1="428" y1="92" x2="478" y2="92"/>
    <line x1="428" y1="152" x2="478" y2="152"/>
  </g>
  <g stroke="currentColor" stroke-width="1.2" opacity="0.5" stroke-dasharray="4 3" marker-end="url(#mount-topology-arrow)">
    <line x1="158" y1="202" x2="208" y2="202"/>
    <line x1="428" y1="202" x2="478" y2="202"/>
  </g>
  <g fill="currentColor" font-size="10" text-anchor="middle" opacity="0.55">
    <text x="183" y="84">-v</text>
    <text x="183" y="144">-v</text>
    <text x="183" y="194">-v</text>
  </g>
  <g fill="var(--accent-color)" font-size="11.5" font-weight="600" text-anchor="middle">
    <text x="216" y="268">--mount-root /workspace makes every subdirectory a mount</text>
    <text x="558" y="268">--review-store</text>
  </g>
  <text x="320" y="288" text-anchor="middle" fill="currentColor" font-size="11.5" opacity="0.6">only the mount-relative tail crosses to the browser, never a host path</text>
</svg>
