# Rung 9: a rule's passes with the evidence each rests on. The fails print first, so the block shows
# the rule's tally and its first passes.
fixture: examples/jetson-project
fetched: tools/samples/boards/jetson-agx-thor-baseboard
fetched_into: designs/jetson
show: |
  agni check --verdicts --rule i2c-pull-up designs/jetson
script: |
  agni check --verdicts --rule i2c-pull-up designs/jetson 2>/dev/null | head -1
  agni check --verdicts --rule i2c-pull-up designs/jetson 2>/dev/null | grep -A1 '^    pass ' | head -8
