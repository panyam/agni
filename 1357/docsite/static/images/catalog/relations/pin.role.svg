<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" width="680" height="260" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="pin.role relation: a diode's A and K pins resolve to anode and cathode roles; a resistor's passive pins yield no role row">
  <rect x="1" y="1" width="678" height="258" rx="10" fill="#f8f9fb" stroke="#e3e6eb"/>
  <line x1="340" y1="24" x2="340" y2="236" stroke="#e3e6eb" stroke-dasharray="4 4"/>

  <!-- LEFT: role derived -->
  <text x="30" y="42" font-size="15" font-weight="600" fill="#2f8a4c">Role derived (a row emitted)</text>

  <!-- diode: anode wire, triangle, cathode bar, cathode wire -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="60" y1="120" x2="104" y2="120"/>
    <polygon points="104,104 104,136 136,120" fill="#394049" stroke="none"/>
    <line x1="136" y1="104" x2="136" y2="136"/>
    <line x1="136" y1="120" x2="180" y2="120"/>
  </g>
  <text x="60" y="112" font-size="11" fill="#6b7280" font-family="ui-monospace, Menlo, Consolas, monospace">A</text>
  <text x="172" y="112" font-size="11" fill="#6b7280" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">K</text>

  <text x="40" y="176" font-size="13" fill="#2f8a4c">pin A → anode</text>
  <text x="40" y="196" font-size="13" fill="#2f8a4c">pin K → cathode</text>
  <text x="40" y="222" font-size="12" fill="#6b7280">diode-family names resolve to a role</text>

  <!-- RIGHT: no role -->
  <text x="370" y="42" font-size="15" font-weight="600" fill="#6b7280">No recognizable role (omitted)</text>

  <!-- resistor: pin, body rect, pin -->
  <g stroke="#394049" stroke-width="2" fill="none">
    <line x1="400" y1="120" x2="428" y2="120"/>
    <rect x="428" y="108" width="64" height="24" rx="2" fill="#ffffff"/>
    <line x1="492" y1="120" x2="520" y2="120"/>
  </g>
  <text x="400" y="100" font-size="11" fill="#6b7280" font-family="ui-monospace, Menlo, Consolas, monospace">1</text>
  <text x="520" y="100" font-size="11" fill="#6b7280" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">2</text>

  <text x="380" y="176" font-size="13" fill="#6b7280">pin 1 → (no role)</text>
  <text x="380" y="196" font-size="13" fill="#6b7280">pin 2 → (no role)</text>
  <text x="380" y="222" font-size="12" fill="#6b7280">passive pins yield no pin.role row</text>
</svg>
