<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" width="680" height="260" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="bus-not-modeled rule: a bus whose members are unresolved is flagged; a bus whose members each resolve to a net is silent">
  <rect x="1" y="1" width="678" height="258" rx="10" fill="#f8f9fb" stroke="#e3e6eb"/>
  <line x1="340" y1="24" x2="340" y2="236" stroke="#e3e6eb" stroke-dasharray="4 4"/>

  <!-- ============ LEFT: today (bus not modeled) ============ -->
  <text x="30" y="42" font-size="15" font-weight="600" fill="#d64545">Unresolved: members not nets</text>
  <rect x="40" y="104" width="50" height="52" rx="3" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="65" y="135" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">U1</text>
  <!-- thick bus line with a bus-width tick -->
  <line x1="90" y1="130" x2="250" y2="130" stroke="#394049" stroke-width="6"/>
  <line x1="164" y1="138" x2="176" y2="122" stroke="#394049" stroke-width="2"/>
  <text x="182" y="120" font-size="11" fill="#6b7280" font-family="ui-monospace, Menlo, Consolas, monospace">8</text>
  <text x="150" y="110" font-size="12" fill="#d64545" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">DATA[7:0]</text>
  <rect x="250" y="104" width="50" height="52" rx="3" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="275" y="135" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">J1</text>
  <text x="170" y="204" font-size="13" fill="#d64545" text-anchor="middle">members not resolved to nets &#8594; flagged</text>

  <!-- ============ RIGHT: phase 2 (members expanded) ============ -->
  <text x="370" y="42" font-size="15" font-weight="600" fill="#2f9e57">Resolved: each member a net</text>
  <rect x="390" y="86" width="50" height="88" rx="3" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="415" y="134" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">U1</text>
  <rect x="590" y="86" width="50" height="88" rx="3" fill="#ffffff" stroke="#394049" stroke-width="2"/>
  <text x="615" y="134" font-size="13" font-weight="600" fill="#394049" text-anchor="middle">J1</text>
  <!-- distinct member nets -->
  <g stroke="#394049" stroke-width="2">
    <line x1="440" y1="100" x2="590" y2="100"/>
    <line x1="440" y1="120" x2="590" y2="120"/>
    <line x1="440" y1="140" x2="590" y2="140"/>
    <line x1="440" y1="160" x2="590" y2="160"/>
  </g>
  <text x="515" y="96" font-size="10" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">DATA7</text>
  <text x="515" y="116" font-size="10" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">DATA6</text>
  <text x="515" y="136" font-size="10" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">DATA5</text>
  <text x="515" y="156" font-size="10" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">DATA4 ... DATA0</text>
  <text x="515" y="204" font-size="13" fill="#2f9e57" text-anchor="middle">members form nets via tap labels &#8594; silent</text>
</svg>
