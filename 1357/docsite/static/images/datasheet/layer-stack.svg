<svg xmlns="http://www.w3.org/2000/svg" width="660" height="250" font-family="system-ui,sans-serif" font-size="12">
  <text x="330" y="16" text-anchor="middle" fill="#808080">three contracts, two processes over them</text>

  <rect x="16" y="60" width="92" height="56" rx="6" fill="none" stroke="#808080" stroke-dasharray="5 3"/>
  <text x="62" y="84" text-anchor="middle" fill="#808080">PDF</text>
  <text x="62" y="100" text-anchor="middle" fill="#808080" font-size="9">vendor bytes</text>

  <line x1="108" y1="88" x2="146" y2="88" stroke="#808080" marker-end="url(#a)"/>
  <text x="127" y="79" text-anchor="middle" fill="#808080" font-size="9">parse</text>

  <rect x="146" y="60" width="104" height="56" rx="6" fill="none" stroke="#4a90d9"/>
  <text x="198" y="84" text-anchor="middle" fill="#4a90d9">doc-IR</text>
  <text x="198" y="100" text-anchor="middle" fill="#808080" font-size="9">faithful, no claims</text>

  <line x1="250" y1="88" x2="292" y2="88" stroke="#808080" marker-end="url(#a)"/>
  <text x="271" y="79" text-anchor="middle" fill="#808080" font-size="9">derive</text>

  <rect x="292" y="60" width="112" height="56" rx="6" fill="none" stroke="#5aa06a"/>
  <text x="348" y="84" text-anchor="middle" fill="#5aa06a">PartSpec</text>
  <text x="348" y="100" text-anchor="middle" fill="#808080" font-size="9">parameter-IR</text>

  <line x1="404" y1="88" x2="446" y2="88" stroke="#808080" marker-end="url(#a)"/>
  <text x="425" y="79" text-anchor="middle" fill="#808080" font-size="9">join</text>

  <rect x="446" y="60" width="104" height="56" rx="6" fill="none" stroke="#808080"/>
  <text x="498" y="84" text-anchor="middle" fill="#808080">rules</text>
  <text x="498" y="100" text-anchor="middle" fill="#808080" font-size="9">on mpn + mfr</text>

  <rect x="560" y="60" width="86" height="56" rx="6" fill="none" stroke="#808080" stroke-dasharray="5 3"/>
  <text x="603" y="84" text-anchor="middle" fill="#808080" font-size="11">design IR</text>
  <text x="603" y="100" text-anchor="middle" fill="#808080" font-size="9">never imports</text>
  <line x1="560" y1="88" x2="552" y2="88" stroke="#808080" marker-end="url(#a)"/>

  <line x1="271" y1="132" x2="271" y2="52" stroke="#d98a4a" stroke-dasharray="3 3"/>
  <text x="271" y="148" text-anchor="middle" fill="#d98a4a" font-size="10">the eager / lazy seam</text>
  <text x="150" y="168" text-anchor="middle" fill="#808080" font-size="9">eager: once per document, offline</text>
  <text x="420" y="168" text-anchor="middle" fill="#808080" font-size="9">lazy: only what a rule asks for</text>

  <text x="330" y="205" text-anchor="middle" fill="#808080" font-size="10">every value carries provenance (doc, page, table, method, confidence)</text>
  <text x="330" y="223" text-anchor="middle" fill="#808080" font-size="10">and, if a person checked it, the revision they checked</text>

  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8" fill="none" stroke="#808080"/></marker></defs>
</svg>
