<svg xmlns="http://www.w3.org/2000/svg" width="620" height="230" font-family="system-ui,sans-serif" font-size="12">
  <text x="310" y="18" text-anchor="middle" fill="#808080">a reused sheet is the real hardware "template": one source, N instantiations</text>
  <!-- source file -->
  <rect x="30" y="70" width="150" height="80" rx="6" fill="none" stroke="#4a90d9"/>
  <text x="105" y="95" text-anchor="middle" fill="#4a90d9">amp.kicad_sch</text>
  <text x="105" y="113" text-anchor="middle" fill="#808080" font-size="10">local label: IN</text>
  <text x="105" y="128" text-anchor="middle" fill="#808080" font-size="10">(one source file)</text>
  <!-- arrows -->
  <line x1="180" y1="90" x2="300" y2="65" stroke="#808080" marker-end="url(#h)"/>
  <line x1="180" y1="130" x2="300" y2="160" stroke="#808080" marker-end="url(#h)"/>
  <defs><marker id="h" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8" fill="none" stroke="#808080"/></marker></defs>
  <!-- root sheet with two instances -->
  <rect x="310" y="30" width="290" height="180" rx="8" fill="none" stroke="#808080"/>
  <text x="455" y="46" text-anchor="middle" fill="#808080" font-size="11">root sheet</text>
  <rect x="335" y="55" width="240" height="55" rx="4" fill="none" stroke="#5aa06a"/>
  <text x="455" y="75" text-anchor="middle" fill="#5aa06a" font-size="11">sheet "amp1"</text>
  <text x="455" y="95" text-anchor="middle" fill="#808080" font-size="10">nets: /amp1/IN   (name mangling)</text>
  <rect x="335" y="130" width="240" height="55" rx="4" fill="none" stroke="#5aa06a"/>
  <text x="455" y="150" text-anchor="middle" fill="#5aa06a" font-size="11">sheet "amp2"</text>
  <text x="455" y="170" text-anchor="middle" fill="#808080" font-size="10">nets: /amp2/IN   (distinct copies of everything)</text>
</svg>
