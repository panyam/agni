<svg xmlns="http://www.w3.org/2000/svg" width="640" height="210" font-family="system-ui,sans-serif" font-size="12">
  <text x="320" y="18" text-anchor="middle" fill="#808080">the geometry sidecar is a source map: meaning and drawing, joined by keys</text>
  <!-- logical -->
  <rect x="30" y="40" width="250" height="140" rx="8" fill="none" stroke="#4a90d9"/>
  <text x="155" y="60" text-anchor="middle" fill="#4a90d9">core IR (what it means)</text>
  <text x="155" y="85" text-anchor="middle" fill="#808080" font-size="10">R1 --(+5V)-- U1.VDD</text>
  <text x="155" y="103" text-anchor="middle" fill="#808080" font-size="10">nets, pins, directions</text>
  <text x="155" y="121" text-anchor="middle" fill="#808080" font-size="10">what diff/check/sim consume</text>
  <!-- drawn -->
  <rect x="360" y="40" width="250" height="140" rx="8" fill="none" stroke="#5aa06a"/>
  <text x="485" y="60" text-anchor="middle" fill="#5aa06a">geom sidecar (where it is drawn)</text>
  <line x1="395" y1="95" x2="430" y2="95" stroke="#808080"/>
  <rect x="430" y="87" width="40" height="16" fill="none" stroke="#808080"/>
  <line x1="470" y1="95" x2="530" y2="95" stroke="#808080"/>
  <rect x="530" y="80" width="45" height="30" fill="none" stroke="#808080"/>
  <text x="485" y="130" text-anchor="middle" fill="#808080" font-size="10">coordinates, wires, artwork</text>
  <text x="485" y="148" text-anchor="middle" fill="#808080" font-size="10">what the renderer consumes</text>
  <!-- join -->
  <line x1="280" y1="110" x2="360" y2="110" stroke="#d98a4a" stroke-dasharray="4 3"/>
  <text x="320" y="100" text-anchor="middle" fill="#d98a4a" font-size="10">joined by keys</text>
  <text x="320" y="200" text-anchor="middle" fill="#808080" font-size="10">(ref_des, net name, provenance ids) — never mixed into one schema</text>
</svg>
