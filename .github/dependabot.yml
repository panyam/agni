# Dependabot for the Go modules, the workflows' actions and the Dockerfiles' base images.
#
# This repo is MANY Go modules: the root, datasheet/, docsite/, and one per example (C10 keeps each
# example's dependencies out of the engine's go.mod). Every nested module reaches the root through a
# `replace ../` and so inherits the root's requirements, which it must record in its own go.mod and
# go.sum. With no config, a security update touched the root alone, and `make tidyall-check` then failed
# on every other module (PR 782: a grpc bump left 36 manifests stale). Listing every module directory
# and grouping the updates makes one bump arrive as one PR that touches them all.
#
# `allow: all` because the nested modules carry most of these dependencies only as `// indirect`, and
# Dependabot leaves indirect dependencies alone by default, which is exactly the half that went stale.
#
# Version updates are OFF (open-pull-requests-limit: 0): only security updates open PRs, and they still
# read this file's directories, allow and groups. Raise the limit to also receive routine upgrades.
#
# The examples are matched by glob so a new example module is covered with no edit here, the same
# reason hack/tidy_check.sh finds modules rather than listing them.
version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - "/"
      - "/datasheet"
      - "/docsite"
      - "/examples/*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    allow:
      - dependency-type: all
    groups:
      go-security:
        applies-to: security-updates
        patterns:
          - "*"

  # The workflows' actions get VERSION updates, unlike the modules above, because an action goes stale
  # by its runtime being retired rather than by an advisory. Node 20 was retired in 2026 with every
  # workflow still on actions that targeted it. Each action is pinned to a commit SHA with its tag in
  # a trailing comment (C37), and Dependabot moves both. One grouped PR a month.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"

  # The Dockerfiles pin each base image as tag@sha256:<digest> (C37). A digest never moves, so without
  # this entry the images would stop getting the base's security fixes. Dependabot refreshes the digest
  # behind the same tag. Major and minor bumps are ignored, because the Go image follows go.mod and the
  # Node and Python versions are a choice, not drift. One grouped PR a month.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      base-images:
        patterns:
          - "*"
