# Publishes the two container images to GHCR when a release tag is pushed: ghcr.io/panyam/agni (the
# engine and viewer, Dockerfile) and ghcr.io/panyam/agnids (the datasheet service, Dockerfile.agnids,
# agni issue 744). Both carry the tag's version, from one build-arg.
#
# The tag is the single source of the version. `make tag-push V=v0.1.0` publishes the tag, which is
# the Go module release, and this workflow then builds the image from that same tag and stamps the
# same string into the binary. Before this existed the two were kept in step by hand (`make tag-push
# V=...` then `make image IMAGE_TAG=...`), which could ship an image tagged one version whose binary
# reported another, exactly the confusion the version stamp exists to remove.
#
# Cost note: this repo is public, so GitHub-hosted standard runners and GHCR storage/bandwidth for
# public packages are both free. Keep to standard runners; larger runners are billed even here.
#
# Package visibility needs NO manual step here, which is worth stating because the widely repeated
# advice says otherwise. A GHCR package pushed by a workflow living in the repository it belongs to
# is linked to that repository and takes its visibility, so publishing from this public repo yields a
# publicly pullable image with nothing to configure. Measured on the first real run (v0.1.1): an
# anonymous registry token fetched the manifest, and `docker pull` succeeded from a logged-out
# client. The private-by-default warning applies to a package with no repository link, which is not
# the case here.
#
# agnids is a SECOND package pushed from this repository. The same linking applies to it, and the
# image also carries an org.opencontainers.image.source label naming this repository, which is the
# documented way to link a package to a repo. Its first release is the run to confirm with an
# anonymous pull, since the measurement above was of the agni package.
#
# The distinction matters for the verify step below: it authenticates as the workflow, so it proves
# the image runs and reports its tag, but it can say NOTHING about whether a stranger can pull it. If
# that ever needs checking again, the only reliable test is an anonymous pull from a logged-out client.
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # Manual re-run, e.g. to republish after a registry problem. Takes the tag to build so a dispatch
  # can never accidentally publish an image built from an untagged main.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  # The tag is resolved once and handed to every job, so the per-platform builds and the job that joins
  # them cannot disagree about what they publish.
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.rel.outputs.tag }}
    steps:
      # The tag reaches the shell through the ENVIRONMENT, never through ${{ }} interpolation into
      # the script body. A workflow_dispatch input is free text and a tag name can carry shell
      # metacharacters, so interpolating either one directly would splice attacker-chosen text into
      # the command before any validation could run. Validation has to happen after the value is
      # safely in a variable, which is only possible via env.
      - name: Resolve the tag being released
        id: rel
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$REF_NAME}"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::refusing to publish from '$tag': not v-prefixed semver"; exit 1 ;;
          esac
          # Belt and braces: reject anything outside the character set a semver tag can contain, so
          # a value that satisfies the glob but smuggles other characters still cannot get through.
          case "$tag" in
            *[!v0-9.-]*) echo "::error::tag '$tag' has characters a release tag may not contain"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"

  # agni builds both platforms in one job on an x86 runner with no emulation: every stage that
  # compiles or installs runs on $BUILDPLATFORM (see the Dockerfile), since the bundle is JavaScript,
  # the symbol libraries are text and the binary is CGO-free.
  #
  # agnids builds each platform on a runner of that architecture. Its runtime stage installs torch's
  # architecture-specific wheels, and under QEMU on an x86 runner the arm64 half took most of a
  # 16-minute release (v0.3.6). Standard arm64 runners are free for a public repository, like the x86
  # ones. Each half is pushed by digest, smoke-tested on its own architecture, and joined under the
  # version and `latest` by agnids-manifest below.
  image:
    needs: tag
    runs-on: ${{ matrix.runner }}
    strategy:
      # One image failing must not cancel the other mid-push; each is published or not on its own.
      fail-fast: false
      matrix:
        include:
          - kind: agni
            file: Dockerfile
            runner: ubuntu-latest
            platforms: linux/amd64,linux/arm64
            arch: multi
          - kind: agnids
            file: Dockerfile.agnids
            runner: ubuntu-latest
            platforms: linux/amd64
            arch: amd64
          - kind: agnids
            file: Dockerfile.agnids
            runner: ubuntu-24.04-arm
            platforms: linux/arm64
            arch: arm64
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Build the tag, never whatever main happens to be. A workflow_dispatch defaults to a
          # branch, so without this an image labelled v0.1.0 could contain unreleased commits.
          ref: ${{ needs.tag.outputs.tag }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: matrix.kind == 'agni'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          push: true
          # VERSION is what the binary reports. It comes from the tag, which is the whole point of
          # this workflow: the image tag and `agni version` cannot disagree.
          build-args: |
            VERSION=${{ needs.tag.outputs.tag }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.kind }}:${{ needs.tag.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.kind }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.kind }}
          cache-to: type=gha,mode=max,scope=${{ matrix.kind }}

      # One platform, pushed with no tag, so the version tag only ever names a manifest holding both.
      # The amd64 cache keeps the `agnids` scope the images workflow writes on a PR.
      - name: Build and push by digest
        id: digest
        if: matrix.kind == 'agnids'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          build-args: |
            VERSION=${{ needs.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.kind }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch == 'amd64' && 'agnids' || 'agnids-arm64' }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch == 'amd64' && 'agnids' || 'agnids-arm64' }}

      # Proves the published image runs and agrees with its own tag, on the runner's architecture, so
      # agnids' arm64 half is now run before it is published under the tag rather than never.
      # A published image that reports the wrong version is the specific failure this workflow was
      # built to prevent, so it is worth one pull to confirm rather than assume. hack/image_smoke.sh
      # is the same check the `images` workflow runs on a PR, so the two cannot drift.
      - name: Verify the image reports the tag and works
        env:
          # Via env for the same reason as the tag. This value is validated, but keeping one rule
          # ("untrusted-ish values reach the shell through env") is easier to hold than a per-site
          # judgement about which interpolations happen to be safe.
          OWNER: ${{ github.repository_owner }}
          KIND: ${{ matrix.kind }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          if [ -n "$DIGEST" ]; then img="ghcr.io/${OWNER}/${KIND}@${DIGEST}"; else img="ghcr.io/${OWNER}/${KIND}:${TAG}"; fi
          docker pull "$img"
          hack/image_smoke.sh "$KIND" "$img" "$TAG"

      # The compose bundle attached to the release, brought up over the published engine image, so
      # the file a customer downloads has run once (agni issue 1057).
      - name: Verify the compose bundle runs on the published image
        if: matrix.kind == 'agni'
        env:
          OWNER: ${{ github.repository_owner }}
        run: hack/compose_smoke.sh "ghcr.io/${OWNER}/agni" "$TAG"

      - name: Record the digest
        if: matrix.kind == 'agnids'
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"

      - name: Hand the digest to the manifest job
        if: matrix.kind == 'agnids'
        uses: actions/upload-artifact@v7
        with:
          name: digest-agnids-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  # Joins agnids' two platform images under the version tag and `latest`, then pulls the tag back and
  # runs it, which on this x86 runner resolves the manifest to its amd64 half.
  agnids-manifest:
    needs: [tag, image]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.tag.outputs.tag }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - uses: actions/download-artifact@v8
        with:
          path: digests
          pattern: digest-agnids-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag both platforms as one image
        working-directory: digests
        run: |
          [ "$(ls | wc -l)" -eq 2 ] || { echo "::error::expected two agnids digests, found $(ls | wc -l)"; exit 1; }
          docker buildx imagetools create \
            -t "ghcr.io/${OWNER}/agnids:${TAG}" \
            -t "ghcr.io/${OWNER}/agnids:latest" \
            $(printf "ghcr.io/${OWNER}/agnids@sha256:%s " *)
          docker buildx imagetools inspect "ghcr.io/${OWNER}/agnids:${TAG}"

      - name: Verify the published tag reports the version and works
        run: |
          img="ghcr.io/${OWNER}/agnids:${TAG}"
          docker pull "$img"
          hack/image_smoke.sh agnids "$img" "$TAG"
