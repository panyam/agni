# The repo gate: `make testall`, run as parallel jobs. `make testall-test` builds and tests the engine,
# the examples, the web bundle, the Python client and the store backends, as four jobs: testall-go,
# testall-web, testall-dist and testall-stores. `make testall-scan` runs the static scanners. `make
# testall-docs` regenerates the docsite's captures and images. `make browser-test` is the browser
# layout suite, split into ten shards. Together they are exactly `make testall`. Keep this in lockstep with the Makefile; a step
# added to one of those targets runs here for free. The split is only about wall time, since the gate
# takes as long as its slowest job (agni issue 1147).
name: ci

# A change to the files under paths-ignore alone skips the gate. No test reads them, and a README or
# release-notes commit took a full gate run. GitHub compares a pull request's whole diff with main, so
# a pull request that touches anything else still runs everything. CLAUDE.md, CONSTRAINTS.md,
# CONTRIBUTING.md and RELEASING.md are not listed, since tests or scripts read them, and neither is
# docsite/**, since its tests read every page.
on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - CHANGELOG.md
      - NEXTSTEPS.md
      - CODE_OF_CONDUCT.md
      - SECURITY.md
      - RELEASES/**
  pull_request:
    paths-ignore:
      - README.md
      - CHANGELOG.md
      - NEXTSTEPS.md
      - CODE_OF_CONDUCT.md
      - SECURITY.md
      - RELEASES/**

# A PR pushed again cancels the run for the push before it, which no one reads once a newer one is
# queued. Runs on main are never cancelled, so every merge keeps its own record.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The Go engine and the generated-tree checks.
  testall-go:
    runs-on: ubuntu-latest
    steps:
      # The whole history, tags included, since proto-check compares the protos with the latest
      # release's (buf breaking, agni issue 1629).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # buf drives `make proto-check`, the generated-code freshness gate inside testall-go. Only buf
      # itself is installed here: both protoc plugins are pinned as `tool` directives in go.mod and
      # run via `go tool`, so they come from the module graph rather than a separate install whose
      # version could drift from the one that produced the committed output.
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          setup_only: true
          version: 1.61.0
          github_token: ${{ github.token }}

      # The remote boards come from their publishers' repos, so they are cached on the samples pin
      # rather than downloaded every run (agni issue 1446).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/agni/samples
          key: remote-boards-${{ hashFiles('hack/samples.pin') }}

      - name: make testall-go
        run: make testall-go

  # The wasm engine and the web packages' unit suites.
  testall-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/agni/samples
          key: remote-boards-${{ hashFiles('hack/samples.pin') }}

      - name: make testall-web
        run: make testall-web

  # The examples, the Python client and the release archives.
  testall-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      # `make python-test` builds its own small venv (protobuf, openpyxl, pytest) from
      # clients/python/pyproject.toml. Pinned here so the runner's default python cannot move under it.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/agni/samples
          key: remote-boards-${{ hashFiles('hack/samples.pin') }}

      - name: make testall-dist
        run: make testall-dist

  # The store tests on sqlite, postgres and Datastore (agni issue 1733). The script starts postgres and
  # the Datastore emulator in Docker, each pinned by digest, so the job needs nothing but the runner's
  # Docker.
  testall-stores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/agni/samples
          key: remote-boards-${{ hashFiles('hack/samples.pin') }}

      - name: make testall-stores
        run: make testall-stores

  # The scanners read source alone, so this job needs Go and nothing the other jobs build.
  scan:
    runs-on: ubuntu-latest
    steps:
      # The whole history, since make secrets scans every commit, as it does on a laptop. A shallow
      # checkout let a token that history still held pass here and fail locally (agni issue 1846).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: make testall-scan
        run: make testall-scan

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/agni/samples
          key: remote-boards-${{ hashFiles('hack/samples.pin') }}

      - name: make testall-docs
        run: make testall-docs

  # Windows (agni issue 1595). It is no part of `make testall`, which runs on Linux and macOS. It runs
  # the Go tests on a Windows runner, so a path or line-ending assumption shows on the PR, then smoke
  # tests a built agni.exe in a browser. Git is told to keep line endings as committed, since a
  # parser's fixtures are byte-exact. A test that cannot pass on Windows skips there and says why.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/agni/samples
          key: remote-boards-${{ hashFiles('hack/samples.pin') }}

      - name: Fetch the samples the tests read
        run: ./hack/fetch_samples.sh tutorial-board oracle-corpus odb-altium allegro cadence-exports altium remote-boards

      - name: Build the viewer bundle the server tests serve
        run: cd web && pnpm build

      # It lists every skipped test with its reason, so a test that quietly stops running on Windows
      # shows in the log.
      - name: go test
        run: |
          go test -v ./... > go-test.log 2>&1 || true
          echo "Skipped on Windows:"; grep -E -B2 "^\s*--- SKIP" go-test.log || echo "  none"
          grep -E "^(--- FAIL|FAIL|panic)" go-test.log > failures.log || true
          # A failure's messages come just before its --- FAIL line.
          grep -E -B30 "^\s*--- FAIL" go-test.log || true
          cat failures.log; test ! -s failures.log

      - name: Smoke test agni.exe in a browser, on a drive-letter mount
        run: |
          go build -tags embedweb -o agni.exe ./cmd/agni
          cd web && pnpm exec playwright-core install chromium
          node browser/smoke.mjs ../agni.exe "$(cygpath -w "$GITHUB_WORKSPACE/examples/tutorial-project")" boards/gateway

  # The browser suite runs its spec files one at a time, so one runner took about eight minutes and set
  # the gate's wall time. Five shards run on five runners. Each shard starts its own server and
  # Chromium, so the specs inside it still run serially, as vitest.browser.config.ts requires. Each
  # shard also pays its own setup and builds, which is why there are five rather than ten.

  browser-test:
    name: browser-test (${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      # Go's build cache from the newest main run of this job, so the wasm build and the agni
      # binary compile only the packages that changed. setup-go's own cache is keyed on go.sum and
      # holds whatever the first job to save built, which never includes the GOOS=js build. The
      # wasm build took 22 to 37 s a shard without it and 1 to 6 s with it. Main saves; a pull
      # request only restores.
      - uses: panyam/ci-actions/go-build-cache@06676ee1a59ebad76f679e595168fc74f4626281 # v0.1.5
        with:
          key: browser

      # A browser for `make browser-test`. The suite drives playwright-core directly, and
      # playwright-core ships no browser of its own. The runner image has Google Chrome, so the action
      # points CHROME_PATH at it and the job downloads nothing and runs no apt (agni issue 1780).
      # `playwright-core install --with-deps` took 15 seconds to 5 minutes a job, since apt stalled on
      # font packages. On a runner without Chrome the action installs Playwright's Chromium instead.
      - uses: panyam/ci-actions/setup-browser@06676ee1a59ebad76f679e595168fc74f4626281 # v0.1.5
        with:
          working-directory: web

      # The samples the specs read, including the 233 files remote pins fetch from their publishers,
      # cached on the samples pin as every other job caches them. Without it each of the shards
      # downloaded every remote file on every run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/agni/samples
          key: remote-boards-${{ hashFiles('hack/samples.pin') }}

      - name: make browser-test SHARD=${{ matrix.shard }}/5
        run: make browser-test SHARD=${{ matrix.shard }}/5

  # The TypeScript client (agni issue 1630, mission #1625). It is no part of `make testall`, like the
  # Windows job. It builds agni, starts `agni serve`, and replays the wire fixtures through the client
  # over Connect and gRPC.
  ts-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: make ts-client-test
        run: make ts-client-test

  # The Rust client (agni issue 1631). Its tests replay clients/wirefixtures/fixtures.json against an
  # agni serve built here. proto-check in testall-go holds its generated code fresh. The job runs
  # beside `make testall` rather than inside it, so the gate on a machine without Rust is unchanged.
  client-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # The action takes its toolchain from the ref name, so a commit pin names it here instead.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: clients/rust

      - name: Build agni
        run: go build -o "$RUNNER_TEMP/agni" ./cmd/agni

      - name: Lint the Rust client
        working-directory: clients/rust
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test the Rust client
        working-directory: clients/rust
        run: cargo test --workspace --locked
        env:
          AGNI_BIN: ${{ runner.temp }}/agni

  # The C++ client (agni issue 1638), outside `make testall`. The client generates its protobuf and
  # gRPC code at build time, so make proto-check covers no C++, and this job's replay of the wire
  # fixtures holds it to the server. Ubuntu's packages are protobuf 3.21 and gRPC 1.51, older than a
  # developer's Homebrew or vcpkg install. A proto feature those releases lack fails here first.
  client-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # packages.microsoft.com answered 403 for a while one evening, failing apt-get update over a
      # repository nothing here uses. Dropping it first leaves the Ubuntu archive.
      - name: Install protobuf and gRPC for C++
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgrpc++-dev libprotobuf-dev protobuf-compiler protobuf-compiler-grpc

      - name: Build agni
        run: go build -o "$RUNNER_TEMP/agni" ./cmd/agni

      - name: Build the client and replay the wire fixtures
        run: |
          cmake -S clients/cpp -B clients/cpp/build -DAGNI_BINARY="$RUNNER_TEMP/agni"
          cmake --build clients/cpp/build -j "$(nproc)"
          ctest --test-dir clients/cpp/build --output-on-failure

  # The Java client (agni issue 1632). It is no part of `make testall`. It builds agni, then runs the
  # client's Gradle build, whose test replays clients/wirefixtures/fixtures.json through the client
  # against a real agni serve. proto-check in testall-go holds the client's generated code fresh.
  java-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # The wrapper jar is the one binary the repo commits, so its checksum is checked against
      # Gradle's published ones before it runs.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build agni
        run: go build -o "$RUNNER_TEMP/agni" ./cmd/agni

      - name: gradle build
        working-directory: clients/java
        env:
          AGNI_BIN: ${{ runner.temp }}/agni
        run: ./gradlew build

  # The enterprise mission's exercise (agni issues 1799, 1800). It runs agni serve with TLS, tokens
  # and sign-in through a GitHub App against a fake GitHub Enterprise Server, so it needs no network.
  # A step that waits on an open ticket doesn't fail the job, and any other failing step does.
  exercise-enterprise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: make exercise-enterprise
        env:
          EXERCISE_ALLOW_WAITS: "1"
          EXERCISE_OUT: ${{ runner.temp }}/exercise
        run: make exercise-enterprise

      - name: Keep the run's logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exercise-enterprise
          path: ${{ runner.temp }}/exercise/enterprise/*.log
