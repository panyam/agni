# The repo gate: exactly `make testall` (vet + engine tests + example modules + bundle build
# + web typecheck/vitest + the browser layout suite). Keep this in lockstep with the Makefile; if a
# step is added there, it runs here for free via testall.
#
# The one thing testall needs that is not a Go or Node dependency is a Chromium, installed below.
# That is the cost of having `make browser-test` inside the gate rather than beside it.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # buf drives `make proto-check`, the generated-code freshness gate inside testall. Only buf
      # itself is installed here: both protoc plugins are pinned as `tool` directives in go.mod and
      # run via `go tool`, so they come from the module graph rather than a separate install whose
      # version could drift from the one that produced the committed output.
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.61.0
          github_token: ${{ github.token }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      # Chromium for `make browser-test`, which is part of testall. The suite drives playwright-core
      # directly rather than @vitest/browser, and playwright-core ships no browser of its own, so
      # without this step every layout spec fails with "install one with ..." rather than an
      # assertion. --with-deps pulls the shared libraries a headless Chromium needs on a bare runner.
      #
      # Cached on the playwright-core version from the lockfile: a browser build is ~150MB and does
      # not change between PRs, so keying on anything finer would re-download it for no reason. A
      # cache miss still installs and still fails loudly.
      - name: Cache the Chromium build
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('web/pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm exec playwright-core install --with-deps chromium
        working-directory: web

      # The board corpus `make samples` fetches, keyed on the pin file rather than on anything about
      # this repo. agni gets far more PRs than agni-samples gets releases, so keying on the pin means
      # a download happens once per corpus bump instead of once per CI run. A miss still fetches and
      # still fails loudly, so this changes how often the network is touched and not what happens when
      # it is unreachable.
      - uses: actions/cache@v4
        with:
          path: tools/samples
          key: samples-${{ hashFiles('hack/samples.pin') }}

      - name: make testall
        run: make testall
