# The repo gate: exactly `make testall` (vet + engine tests + example modules + bundle build
# + web typecheck/vitest). Keep this in lockstep with the Makefile; if a step is added there,
# it runs here for free via testall.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # buf drives `make proto-check`, the generated-code freshness gate inside testall. Only buf
      # itself is installed here: both protoc plugins are pinned as `tool` directives in go.mod and
      # run via `go tool`, so they come from the module graph rather than a separate install whose
      # version could drift from the one that produced the committed output.
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.61.0
          github_token: ${{ github.token }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: make testall
        run: make testall
