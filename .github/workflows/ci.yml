# The repo gate: exactly `make testall` (vet + engine tests + example modules + bundle build
# + web typecheck/vitest). Keep this in lockstep with the Makefile; if a step is added there,
# it runs here for free via testall.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: make testall
        run: make testall
