# Builds the agni container image on a change that could break it, and smoke-tests it, the compose
# bundles and the Helm chart, without pushing anything.
#
# Before this, an image was first built by `release`, after a tag was already public, so a broken
# Dockerfile surfaced as a failed release. It runs only when a file the image is made from changes.
# agni builds linux/amd64 alone, since its arm64 half is the same build cross-compiled. The agnids
# image installs torch and docling and takes minutes, so it builds in images-agnids.yml, on main
# rather than on every PR (agni issue 1741).
name: images

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - hack/image_smoke.sh
      - hack/compose_smoke.sh
      # The enterprise exercise runs against the enterprise bundle (agni issue 1802) and the Helm
      # chart (agni issue 1803) here.
      - hack/exercise_enterprise.sh
      - hack/exercise-enterprise.compose.yaml
      - hack/kind_up.sh
      # The exercise builds goapplib's fake GHES at the version go.mod names (agni issue 1841).
      - go.mod
      # The smoke scripts speak the wire, so a change to a request they send runs them (agni 1068).
      - protos/agni/v1/webapi/**
      - deploy/**
      - .github/workflows/images.yml
      - .github/workflows/release.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - hack/image_smoke.sh
      - hack/compose_smoke.sh
      # The enterprise exercise runs against the enterprise bundle (agni issue 1802) and the Helm
      # chart (agni issue 1803) here.
      - hack/exercise_enterprise.sh
      - hack/exercise-enterprise.compose.yaml
      - hack/kind_up.sh
      # The exercise builds goapplib's fake GHES at the version go.mod names (agni issue 1841).
      - go.mod
      # The smoke scripts speak the wire, so a change to a request they send runs them (agni 1068).
      - protos/agni/v1/webapi/**
      - deploy/**
      - .github/workflows/images.yml
      - .github/workflows/release.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: agni
            file: Dockerfile
            runner: ubuntu-latest
            platform: linux/amd64
            scope: agni
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # load: true puts the image in the runner's daemon so the smoke test can run it. The cache is
      # scoped per image, so this build and agnids' do not evict each other's layers.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          build-args: |
            VERSION=v0.0.0-ci
          tags: agni-ci/${{ matrix.kind }}:ci
          cache-from: type=gha,scope=${{ matrix.scope }}
          # mode=min caches the final image's layers alone. mode=max cached every build stage too, and
          # those layers held 6 GB of the repo's 10 GB Actions cache, so GitHub evicted the gate's entries
          # (agni issue 1789).
          cache-to: type=gha,mode=min,scope=${{ matrix.scope }}

      - name: Smoke test
        env:
          KIND: ${{ matrix.kind }}
        run: |
          hack/image_smoke.sh "$KIND" "agni-ci/$KIND:ci" v0.0.0-ci
          docker image ls "agni-ci/$KIND:ci" --format '{{.Repository}}:{{.Tag}} {{.Size}}'

      # The compose bundle a customer runs (agni issue 1057), brought up over the tutorial project.
      - name: Compose smoke test
        run: hack/compose_smoke.sh agni-ci/agni ci

      # The enterprise mission's exercise against the enterprise bundle over this image (agni issue
      # 1802): TLS, tokens, sign-in through a GitHub App, sealed connections and webhooks, against a
      # fake GitHub Enterprise Server on this runner, with a trap proxy for any other host.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Enterprise exercise against the bundle
        env:
          EXERCISE_OUT: ${{ runner.temp }}/exercise
        run: make exercise-enterprise-bundle IMAGE_NAME=agni-ci/agni IMAGE_TAG=ci

      - name: Keep the bundle run's logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exercise-enterprise-bundle
          path: ${{ runner.temp }}/exercise/enterprise/*.log

      # The same exercise against the Helm chart on a kind cluster, behind ingress-nginx, which ends
      # TLS in front of agni (agni issue 1803). The fake and the trap listen on the kind network's
      # gateway, which the pods reach.
      - name: A kind cluster with ingress-nginx and this image
        id: kind
        uses: panyam/ci-actions/kind-ingress@06676ee1a59ebad76f679e595168fc74f4626281 # v0.1.5
        with:
          images: agni-ci/agni:ci

      - name: Enterprise exercise against the Helm chart
        env:
          EXERCISE_OUT: ${{ runner.temp }}/exercise-helm
          EXERCISE_HOST: ${{ steps.kind.outputs.gateway }}
        run: make exercise-enterprise-helm IMAGE_NAME=agni-ci/agni IMAGE_TAG=ci

      - name: Keep the chart run's logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exercise-enterprise-helm
          path: ${{ runner.temp }}/exercise-helm/enterprise/*.log

      # The release's own lint and package of the chart, with nothing pushed.
      - name: Lint and package the chart
        uses: panyam/ci-actions/helm-oci-publish@06676ee1a59ebad76f679e595168fc74f4626281 # v0.1.5
        with:
          chart: deploy/helm/agni
          values: deploy/helm/ci-values.yaml
          version: v0.0.0-ci
          push: "false"
