# Builds the agnids container image (the datasheet service, Dockerfile.agnids) and smoke-tests it,
# without pushing anything.
#
# It installs torch and docling and takes minutes, so it runs on a push to main that changes what the
# image is made from, and by hand, rather than on every PR (agni issue 1741). A break then shows up
# within one merge and before any release, where `release` builds the same image again from the tag.
# Its cache lives on main, which a release run can read. It builds both platforms, each on a runner
# of its own architecture, because its arm64 half installs different torch wheels and release builds
# it natively the same way.
name: images-agnids

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.agnids
      - .dockerignore
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - datasheet/**
      # agnids builds on the root module's store, mount and auth packages (agni issue 1847).
      - internal/**
      - mountset/**
      - service/**
      - web-shared/**
      - go.mod
      - go.sum
      - hack/image_smoke.sh
      - .github/workflows/images-agnids.yml
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            scope: agnids
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            scope: agnids-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # load: true puts the image in the runner's daemon so the smoke test can run it. The cache is
      # scoped per image, so this build and agni's do not evict each other's layers.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.agnids
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          build-args: |
            VERSION=v0.0.0-ci
          tags: agni-ci/agnids:ci
          cache-from: type=gha,scope=${{ matrix.scope }}
          # mode=min caches the final image's layers alone. mode=max cached every build stage too, and
          # those layers held 6 GB of the repo's 10 GB Actions cache, so GitHub evicted the gate's entries
          # (agni issue 1789).
          cache-to: type=gha,mode=min,scope=${{ matrix.scope }}

      - name: Smoke test
        run: |
          hack/image_smoke.sh agnids agni-ci/agnids:ci v0.0.0-ci
          docker image ls agni-ci/agnids:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}'
