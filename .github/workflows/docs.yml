name: docs

# Build the s3gen documentation site from docsite/ and publish it to GitHub Pages.
# Requires Pages to be enabled for the repo with the source set to "GitHub Actions"
# (Settings -> Pages -> Build and deployment -> Source: GitHub Actions).

on:
  push:
    branches: [main]
    paths:
      - docsite/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docsite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build the site
        run: AGNI_DOCS_ENV=production go run . -build
      - name: Copy static assets into the build
        run: |
          cp -r static dist/static
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docsite/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
