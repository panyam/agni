# The setup every gate job shares (ci.yml): Go, the pnpm workspace, and the board corpus. Each job adds
# only what its part of the gate needs, such as buf for testall-go, Python for testall-dist and
# Chromium for browser-test.
name: setup
description: Go, the pnpm workspace and the samples corpus, for a job of the gate
runs:
  using: composite
  steps:
    # Go from go.mod, then pnpm, Node with a pnpm cache, and one install for the whole workspace from
    # its one lockfile at the root. pnpm's version is the project's, not this workflow's: it comes
    # from `packageManager` in the root package.json, the pnpm workspace's (web/, web-shared/,
    # datasheet/web/; agni issue 744), so a developer's pnpm and CI's cannot drift apart silently.
    - uses: panyam/ci-actions/setup-go-pnpm@ecf33181dffa847874b7797b0593badea92cd2a4 # v0.1.1

    # The board corpus `make samples` fetches, keyed on the pin file rather than on anything about
    # this repo. agni gets far more PRs than agni-samples gets releases, so keying on the pin means
    # a download happens once per corpus bump instead of once per CI run. A miss still fetches and
    # still fails loudly, so this changes how often the network is touched and not what happens when
    # it is unreachable.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: tools/samples
        key: samples-${{ hashFiles('hack/samples.pin') }}
