# Chapter 2's headline. Two schematics identical but for one junction dot, and the netlist differs.
# The reader compares the two net counts, so the pair is two steps of one spec rather than two specs:
# adjacent blocks, and neither can be regenerated without the other.
fixture: readers/kicad/testdata
from_root: true
steps:
  - show: agni stats readers/kicad/testdata/tjunc.kicad_sch
    script: agni stats readers/kicad/testdata/tjunc.kicad_sch | grep -E 'components|nets'
  - show: agni stats readers/kicad/testdata/tjunc_dotted.kicad_sch
    script: agni stats readers/kicad/testdata/tjunc_dotted.kicad_sch | grep -E 'components|nets'
