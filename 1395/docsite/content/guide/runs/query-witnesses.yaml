# How a row was derived (agni issue 794). The project library's two members are the rows' reason, and
# --witnesses prints each with its rule and body facts, the `not` that held as an absence.
fixture: examples/tutorial-project
script: |
  agni query designs/gateway/gateway.edn 'house.pmic_rail(?n), not house.pmic_probe_point(?n) => ?n' --witnesses
