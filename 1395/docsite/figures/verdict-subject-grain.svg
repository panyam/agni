<svg viewBox="0 0 640 330" role="img" aria-labelledby="verdict-subject-grain-title" style="width:100%;height:auto;font-family:inherit">
  <title id="verdict-subject-grain-title">One rule about a relation, producing three different shapes from one judgement. The verdict's subject is a tuple naming every entity in the relation, because that tuple is the verdict's identity. The finding's subject is singular and names the one entity a reader has to change. Everything else the sentence mentions travels in the finding's context, as clickable chips. The same judgement, at three grains, for three different questions.</title>
  <defs>
    <marker id="vsg-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor" opacity="0.5"/>
    </marker>
  </defs>
  <rect x="150" y="16" width="340" height="46" rx="3" fill="none" stroke="var(--accent-color)" stroke-width="1.4"/>
  <text x="320" y="36" text-anchor="middle" fill="var(--accent-color)" font-size="12" font-weight="600">one judgement about a relation</text>
  <text x="320" y="52" text-anchor="middle" fill="currentColor" font-size="9.5" opacity="0.6">a regulator over-driving a part it feeds, across a rail</text>
  <g stroke="currentColor" stroke-width="1.2" opacity="0.5" marker-end="url(#vsg-arrow)">
  <line x1="260" y1="62" x2="150" y2="92"/>
  <line x1="380" y1="62" x2="490" y2="92"/></g>
  <rect x="16" y="96" width="288" height="106" rx="3" fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.5"/>
  <text x="30" y="118" fill="currentColor" font-size="11.5" font-weight="600">Verdict.Subjects</text>
  <text x="30" y="134" fill="currentColor" font-size="9.5" opacity="0.6">a TUPLE, in the rule's own order</text>
  <g fill="none" stroke="var(--accent-color)" stroke-width="1.3">
  <rect x="30" y="146" width="70" height="24" rx="3"/>
  <rect x="108" y="146" width="70" height="24" rx="3"/>
  <rect x="186" y="146" width="70" height="24" rx="3"/></g>
  <g fill="var(--accent-color)" font-size="10.5" text-anchor="middle" font-weight="600">
  <text x="65" y="162">U1</text>
  <text x="143" y="162">+3V3</text>
  <text x="221" y="162">U7</text></g>
  <text x="30" y="190" fill="currentColor" font-size="9.5" opacity="0.6">name fewer and two answers share one id</text>
  <rect x="336" y="96" width="288" height="106" rx="3" fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.5"/>
  <text x="350" y="118" fill="currentColor" font-size="11.5" font-weight="600">Finding.Subject</text>
  <text x="350" y="134" fill="currentColor" font-size="9.5" opacity="0.6">SINGULAR, and only for a failure</text>
  <rect x="350" y="146" width="70" height="24" rx="3" fill="none" stroke="var(--accent-color)" stroke-width="1.5"/>
  <text x="385" y="162" text-anchor="middle" fill="var(--accent-color)" font-size="10.5" font-weight="600">U7</text>
  <text x="350" y="190" fill="currentColor" font-size="9.5" opacity="0.6">the one entity a reader has to CHANGE</text>
  <line x1="480" y1="202" x2="480" y2="228" stroke="currentColor" stroke-width="1.2" opacity="0.5" marker-end="url(#vsg-arrow)"/>
  <rect x="336" y="232" width="288" height="66" rx="3" fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.35" stroke-dasharray="4 3"/>
  <text x="350" y="252" fill="currentColor" font-size="11.5" font-weight="600" opacity="0.85">Finding.Context</text>
  <g fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.6">
  <rect x="350" y="262" width="76" height="22" rx="11"/>
  <rect x="434" y="262" width="76" height="22" rx="11"/></g>
  <g fill="currentColor" font-size="10" text-anchor="middle" opacity="0.8">
  <text x="388" y="277">U1 · source</text>
  <text x="472" y="277">+3V3 · rail</text></g>
  <text x="520" y="277" fill="currentColor" font-size="9" opacity="0.55">clickable chips</text>
  <text x="320" y="322" text-anchor="middle" fill="currentColor" font-size="11" opacity="0.65">one judgement at three grains, because identity, the edit, and the sentence are three questions</text>
</svg>
