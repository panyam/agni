<svg viewBox="0 0 680 290" role="img" aria-labelledby="decap-title" style="width:100%;height:auto;font-family:inherit">
  <title id="decap-title">A regulator feeding a chip through a long inductive trace, with a 100nF capacitor from the rail to ground right at the chip's supply pin</title>
  <g fill="currentColor" font-size="11.5" text-anchor="middle" opacity="0.72">
  <text x="85" y="44">supplies the average</text>
  <text x="290" y="62">about 50 nH of trace inductance</text></g>
  <g fill="none" stroke="currentColor" stroke-width="1.6" opacity="0.85">
  <rect x="30" y="60" width="110" height="48"/>
  <rect x="520" y="56" width="130" height="76"/></g>
  <g fill="currentColor" text-anchor="middle">
  <text x="85" y="90" font-size="13.5">regulator</text>
  <text x="585" y="86" font-size="14">chip</text></g>
  <g fill="currentColor" font-size="11" text-anchor="middle" opacity="0.7">
  <text x="585" y="106">outputs switching</text></g>
  <g fill="none" stroke="currentColor" stroke-width="2">
  <path d="M140 84 H250"/>
  <path d="M250 84 L258 74 L274 94 L290 74 L306 94 L322 74 L330 84"/>
  <path d="M330 84 H520"/>
  <path d="M478 84 V150 M478 160 V250"/>
  <path d="M458 150 H498 M458 160 H498"/>
  <path d="M585 132 V250 M85 108 V250"/>
  <path d="M40 250 H620"/></g>
  <g fill="currentColor">
  <circle cx="478" cy="84" r="3.2"/>
  <circle cx="478" cy="250" r="3.2"/>
  <circle cx="585" cy="250" r="3.2"/>
  <circle cx="85" cy="250" r="3.2"/></g>
  <g fill="currentColor" font-size="10.5" text-anchor="end" opacity="0.7">
  <text x="514" y="76">supply pin</text></g>
  <g text-anchor="end">
  <text x="450" y="164" font-size="11.5" font-weight="600" fill="var(--accent-color)">100 nF at the pin</text>
  <text x="450" y="206" font-size="11.5" fill="currentColor" opacity="0.72">supplies the fast gulp</text></g>
  <g fill="currentColor" font-size="11" text-anchor="middle" opacity="0.6">
  <text x="330" y="270">ground</text></g>
</svg>
