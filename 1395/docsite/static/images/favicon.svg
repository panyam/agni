<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="flame" x1="32" y1="7" x2="32" y2="57" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.45" stop-color="#f97316"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="64" height="64" rx="13" fill="#0b1220"/>

  <!-- flame body -->
  <path d="M32 7
           C 40 18, 48 24, 46 37
           C 44.5 47, 38 57, 32 57
           C 26 57, 19.5 51, 18 40
           C 17 33, 20 27, 24 30
           C 26 24, 29 15, 32 7 Z"
        fill="url(#flame)"/>

  <!-- circuit etched into the flame (uses the dark background color) -->
  <g stroke="#0b1220" stroke-width="2.4" stroke-linecap="round" fill="none">
    <path d="M32 51 L32 37"/>
    <path d="M32 41 L25 31"/>
    <path d="M32 41 L39 34"/>
    <path d="M32 51 L32 55"/>
  </g>
  <g fill="#0b1220">
    <circle cx="32" cy="51" r="3.4"/>
    <circle cx="32" cy="41" r="2.2"/>
    <circle cx="25" cy="31" r="3"/>
    <circle cx="39" cy="34" r="3"/>
  </g>
  <g fill="#ffd27a">
    <circle cx="32" cy="51" r="1.3"/>
    <circle cx="25" cy="31" r="1.2"/>
    <circle cx="39" cy="34" r="1.2"/>
  </g>
</svg>
